  ask-gate:
    section: "0i"
    title: "ask gate — every intake-window ask carries one done-predicate, or gets split"
    gate: LIMEN_ASK_GATE
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/ask-gate.py --audit --since 7 --top 8"
        severity: silent
        escalation: "ask-gate report failed — non-fatal"

  omega:
    section: "0i2"
    title: "omega — the autonomic fixed point (conjunction of every gate's --check)"
    gate: LIMEN_OMEGA
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "bash scripts/omega.sh --offline --quiet"
        severity: advisory
        escalation: "OMEGA not holding above — a gate rung failed; the system is off its fixed point (see logs/omega.json)"

  usage-telemetry:
    section: "0k"
    title: "refresh usage telemetry / lane health"
    gate: null                          # ungated — always runs
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/usage-telemetry.py"
        severity: silent
        escalation: "usage telemetry skipped"

  link-health:
    section: "0l"
    title: "link health — dead links on public surfaces (+ throttled auto-heal)"
    gate: LIMEN_LINK_HEALTH
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/link-health.py --verify --throttle 21600"
        severity: advisory
        escalation: "DEAD link(s) on a public surface above — fix at the source or add a remap in link-surfaces.json"
      - command: "python3 scripts/link-health.py --heal --apply --throttle 21600"
        when_env: LIMEN_LINK_HEAL
        when_default: "1"
        severity: silent
        escalation: "link-health heal skipped/failed — non-fatal"

  codex-skill-slim:
    section: "0m"
    title: "codex skill distillation — flagged noise thinned, not disabled"
    gate: LIMEN_CODEX_SLIM
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/codex-skill-slim.py --apply --quiet"
        severity: silent
        escalation: "codex-skill-slim skipped — no codex config/cache"

  routine-freshness:
    section: "0n"
    title: "routine freshness — detect cloud routines that fire but stop delivering"
    gate: LIMEN_ROUTINE_FRESHNESS
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/routine-freshness-audit.py --throttle 21600"
        severity: silent
        escalation: "routine freshness skipped"

  session-walk:
    section: "0j"
    title: "session walk — full-horizon census of BOTH vendor session estates"
    gate: LIMEN_SESSION_WALK
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: 'python3 scripts/session-walk-census.py --walk "${LIMEN_SESSION_WALK_CAP:-2}"'
        severity: silent
        escalation: "session walk skipped"

  mail-answered:
    section: "0m2"
    title: "mail answered — the obligations ledger is fresh AND every reply-owed obligation has a draft (the C_MAIL effector is alive)"
    gate: LIMEN_MAIL_ANSWERED_CHECK
    default: "1"
    source: [metabolize]
    owner: mail
    steps:
      - command: "python3 scripts/check-mail-answered.py"
        severity: advisory
        escalation: "mail unanswered — stale ledger or a reply-owed obligation without a draft; the C_MAIL draft effector may be dark (the 2026-06 silent-freeze failure mode this sensor exists to catch)"

  correspondence-terminal:
    section: "0m3"
    title: "correspondence walked to terminal — every reply-owed obligation has a terminal disposition and the walk is at a fixed point (the AUTONOMY_PAUSED release predicate, mechanized)"
    gate: LIMEN_CORRESPONDENCE_TERMINAL_CHECK
    default: "1"
    source: [metabolize]
    owner: mail
    steps:
      - command: "python3 scripts/check-correspondence-terminal.py"
        severity: advisory
        escalation: "correspondence not walked to terminal — stale ledger, an un-walked reply-owed row, or a HOLD row lacking a composed draft; the correspondence-walk effector (mail-beat.sh 2d) may be dark"

  correspondence-drain-trend:
    section: "0m4"
    title: "correspondence drain-trend — reply_owed is DRAINING across beats, not stalled at a high plateau (the loop-closure the fixed-point snapshot can't see)"
    gate: LIMEN_CORRESPONDENCE_DRAIN_TREND
    default: "1"
    source: [metabolize]
    owner: mail
    steps:
      - command: "python3 scripts/check-correspondence-drain-trend.py --check"
        severity: advisory
        escalation: "correspondence NOT draining — reply_owed or needs_human is rising across a day-plus window, or a HOLD draft is persistently missing; the ledger is re-owing faster than the walk clears it"

  host-pressure-stale:
    section: "0o"
    title: "host-pressure gauge is alive — the VITALS throttle/shed valve is not flying blind"
    gate: LIMEN_HOST_PRESSURE_STALE
    default: "1"
    source: [metabolize]
    owner: vitals
    steps:
      - command: "python3 scripts/host-pressure-stale.py"
        severity: advisory
        escalation: "VITALS gauge silent past VITALS_STALE_BEATS worst-case beats — the throttle/shed valve may be flying blind; check `python3 -m limen.vigilia beat` and the heartbeat LaunchAgent (2026-07-15 host-thrash incident: exogenous load stacked while nothing watched the watcher)"

  runtime-lag:
    section: "0o3"
    title: "the scheduled runtime carries merged main — a fix is deployed when the thing that RUNS it is rebuilt"
    gate: LIMEN_RUNTIME_LAG
    default: "1"
    source: [metabolize]
    owner: substrate
    # The canary (0g5) proves a scheduled lane is ALIVE. It cannot see that a live lane is
    # running WEEK-OLD CODE: a stale runtime install stamps its voice files on time, passes
    # its canary, and reports green the whole while. Different axis, invisible from inside
    # the first — which is why this is a second sensor and not a widened canary.
    #
    # Found one level below, from the notify arc: _notify.py's in-tree gate only reached
    # copies that had rebased, because osascript is a host singleton and the guard is
    # tree-local. The INSTALL is how merged main reaches this host at all, and nothing
    # measured it. First measurement: 88 commits / 5.6 days behind — the notify gate had
    # been merged, shipped, and was running nowhere. Every host-global fix inherits this
    # latency, so the sensor measures the general condition rather than re-checking notify.
    #
    # Sensing only. The rotator is domus-owned and repoints a symlink under a daemon that
    # executes from it every 300s; limen's authority ends at naming the owner and the exact
    # command. Silent (exit 0) wherever no runtime install exists — CI, containers, any
    # machine that schedules nothing.
    steps:
      - command: "python3 scripts/check-runtime-lag.py"
        severity: advisory
        escalation: "the scheduled limen runtime is further behind the default branch than LIMEN_RUNTIME_LAG_MAX_COMMITS — merged fixes are live on the remote and running nowhere on this host. Rotate with the `domus-limen-runtime install --sha <head>` line the predicate prints (domus owns the rotator); an UNVERIFIED line means the install SHA is unfetched here, not that the runtime is current"

  backblaze-exclusions:
    section: "0p"
    title: "backblaze exclusions live — regenerable fleet state is out of the crawl set (organ-owned since 2026-07-16; lever L-BACKBLAZE-EXCLUDE retired)"
    gate: LIMEN_BACKBLAZE_EXCLUSIONS
    default: "1"
    source: [metabolize]
    owner: substrate
    cadence:
      env: LIMEN_BEAT_BACKBLAZE
      default: 24
    steps:
      - command: "python3 scripts/backblaze-exclusions.py --check"
        args_when:
          - env: LIMEN_BACKBLAZE_APPLY
            default: "1"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: safety
        severity: advisory
        escalation: "Backblaze is still crawling regenerable fleet trees and the self-heal could not land — run `python3 scripts/backblaze-exclusions.py --apply` (bzinfo.xml is user-owned, 2026-07-16 ground truth); if the file went root-owned again, the fallback is the Backblaze pane → Settings → Exclusions (2026-07-15/16 host-thrash incidents, IF-HOST-PRESSURE form 3)"

  host-relief:
    section: "0q"
    title: "host-relief — SHED has hands: bloated com.limen agents restarted, root hogs escalated with the exact command (IF-HOST-PRESSURE form 4)"
    gate: LIMEN_HOST_RELIEF
    default: "1"
    source: [metabolize]
    owner: substrate
    cadence:
      env: LIMEN_BEAT_HOST_RELIEF
      default: 1
    timeout:
      env: LIMEN_HOST_RELIEF_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/host-relief.py --check"
        args_when:
          - env: LIMEN_HOST_RELIEF_APPLY
            default: "1"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: safety
        severity: advisory
        escalation: "host-relief could not land a kickstart — read the report above and logs/vigilia/relief-state.json; if a root-owned hog is named, run the printed sudo one-liner (2026-07-16 thrash: bztransmit held 8.6 GiB; IF-HOST-PRESSURE form 4)"

  cloud-storage-doctor:
    section: "heartbeat"
    title: "HORREVM — every storage rail matches its declared role (iCloud caught-up; Dropbox/Drive/OneDrive quiet; Archive4T mounted; Backblaze observed read-only)"
    gate: LIMEN_CLOUD_STORAGE
    default: "1"
    source: [heartbeat]
    owner: horrevm
    # Pure sensor, no effector by design — its escalation path IS the pairing: advisory severity
    # surfaces drift in the beat log; the mutations (adoption, baseline edits) are operator decisions
    # recorded in institutio/governance/storage-roles.yaml, never doctor actions.
    cadence:
      env: LIMEN_BEAT_CLOUD_STORAGE
      default: 24
    timeout:
      env: LIMEN_CLOUD_STORAGE_TIMEOUT
      default: 180
    steps:
      - command: "python3 scripts/cloud-storage-doctor.py --check"
        severity: advisory
        escalation: "storage rail drifted from its declared role (logs/cloud-storage-health.json) — see docs/storage-endgame.md; NEVER terminal-delete under ~/Library/CloudStorage or ~/Library/Mobile Documents"
    omega_eligible:
      - label: "storage-roles registry parity"
        rung_id: sensor.storage.parity
        tier: det
        command: "python3 scripts/cloud-storage-doctor.py --doctor"
        semantic_inputs:
          - {path: scripts/cloud-storage-doctor.py, normalization: raw}
      - label: "storage rails posture"
        rung_id: sensor.storage.posture
        tier: live
        command: "python3 scripts/cloud-storage-doctor.py --check --strict"
        semantic_inputs:
          - {path: scripts/cloud-storage-doctor.py, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.storage.posture.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  horrevm-custody:
    section: "heartbeat"
    title: "HORREVM custody — arca-sealed ciphertext shipped to Drive/Dropbox and proven restorable (dark until L-CLOUD-EGRESS-CONSENT)"
    gate: LIMEN_HORREVM
    default: "1"
    source: [heartbeat]
    owner: horrevm
    # Seal-then-ship rides the heartbeat (arca seals every metabolize beat; custody self-throttles
    # to >=20h between pushes, so <=1-beat vault staleness is accepted by design). Dry-run until the
    # operator arms LIMEN_HORREVM_APPLY=1 via the lever — the ONLY egress consent switch. A 240s
    # bound may truncate the FIRST bulk push; rclone copy is incremental per file, so successive
    # beats converge — fail-open, never wedged.
    cadence:
      env: LIMEN_BEAT_HORREVM
      default: 4
    timeout:
      env: LIMEN_HORREVM_TIMEOUT
      default: 240
    steps:
      - command: "python3 scripts/horrevm-custody.py --push"
        args_when:
          - env: LIMEN_HORREVM_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: safety
        severity: silent
        escalation: "HORREVM custody push skipped or exceeded its bound"
      - command: "python3 scripts/horrevm-custody.py --status"
        severity: advisory
        escalation: "custody rail unproven or stale (logs/horrevm.json) — pull L-CLOUD-EGRESS-CONSENT (issue #1109) to consent + arm, or re-consent a dead token via the same lever; NEVER install a File Provider desktop app"
    omega_eligible:
      - label: "custody config parity"
        rung_id: sensor.custody.parity
        tier: det
        command: "python3 scripts/horrevm-custody.py --doctor"
        semantic_inputs:
          - {path: scripts/horrevm-custody.py, normalization: raw}
      - label: "custody freshness"
        rung_id: sensor.custody.freshness
        tier: live
        command: "python3 scripts/horrevm-custody.py --status --strict"
        semantic_inputs:
          - {path: scripts/horrevm-custody.py, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.custody.freshness.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  relationship-review-delta:
    section: heartbeat
    title: "relationship review-due detector — surface (PII-clean count) when a person's new inbound volume since their last review warrants a delta dice-up"
    gate: LIMEN_RELATIONSHIP_REVIEW
    default: "1"
    source: [heartbeat]
    owner: tabularius
    cadence:
      env: LIMEN_BEAT_RELATIONSHIP_REVIEW
      # daily-active (was 168 ≈ weekly, effectively dormant): this is a read-only,
      # side-effect-free detector (surfaces a PII-clean review-due COUNT — no send, no
      # draft, no outreach), so it can fire often at zero account-safety cost. At the
      # slowest quiet tempo (~30min/beat) 24 beats ≈ 12h → the warm-network re-engagement
      # signal surfaces at least twice a day instead of ~weekly. Half as frequent as the
      # time-critical opportunity sensors (cadence 12), which is the right priority tier.
      default: 24
    timeout:
      env: LIMEN_RELATIONSHIP_REVIEW_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/relationship-review-delta.py"
        args_when:
          - env: LIMEN_RELATIONSHIP_REVIEW_NOTIFY
            default: "1"
            equals: "1"
            args: ["--notify"]
            armed_valve_type: safety
        severity: silent
        escalation: "relationship review-due detector skipped or exceeded its bound (read-only chat.db count; fails open)"

  opportunity-pipeline:
    section: heartbeat
    title: "inbound-opportunity review-due detector — surface (PII-clean count) when an inbound lead (hire/deploy/linkedin) owes a human move: ball on us >24h, a stalled interview/offer, a LinkedIn row with no reply path, or a portal/ATS form demanded"
    gate: LIMEN_OPPORTUNITY_PIPELINE
    default: "1"
    source: [heartbeat]
    owner: mail
    cadence:
      env: LIMEN_BEAT_OPPORTUNITY_PIPELINE
      default: 12
    timeout:
      env: LIMEN_OPPORTUNITY_PIPELINE_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/opportunity-review-delta.py"
        args_when:
          - env: LIMEN_OPPORTUNITY_NOTIFY
            default: "1"
            equals: "1"
            args: ["--notify"]
            armed_valve_type: safety
        severity: silent
        escalation: "opportunity sync skipped or exceeded its bound (reads obligations-ledger.json; fails open)"

  daily-execution:
    section: heartbeat
    title: "the daily professional communications/application loop — ingest, reconcile, derive obligations, source/rank live roles, run voice/factual checks, and settle only provider-receipted applications and follow-ups in one persisted run"
    gate: LIMEN_DAILY_EXECUTION
    default: "1"
    source: [heartbeat]
    owner: mail
    cadence:
      env: LIMEN_BEAT_DAILY_EXECUTION
      default: 48
    timeout:
      env: LIMEN_DAILY_EXECUTION_TIMEOUT
      default: 1800
    steps:
      - command: 'python3 -m limen.daily_execution --json --timeout "${LIMEN_DAILY_EXECUTION_TIMEOUT:-1800}"'
        args_when:
          - env: LIMEN_DAILY_EXECUTION_FIRE
            default: "0"
            equals: "1"
            args: ["--fire"]
            armed_valve_type: safety
        severity: silent
        escalation: "daily execution skipped or exceeded its 1,800-second bound; its persisted redacted receipt names the exact owner stage and provider blocker"

  conversion-funnel:
    section: heartbeat
    title: "name the single public-face bottleneck (DISCOVERY|FACE|CLOSE) — the constraint that routes Aug-1 ($10k/wk) effort, kept live on the beat instead of dark/manual"
    gate: LIMEN_CONVERSION_FUNNEL
    default: "1"
    source: [heartbeat]
    owner: mail
    cadence:
      env: LIMEN_BEAT_CONVERSION_FUNNEL
      default: 48
    timeout:
      env: LIMEN_CONVERSION_FUNNEL_TIMEOUT
      default: 300
    # Two ORDERED steps: traffic-collect (gh /traffic per value-repo -> traffic.jsonl, the "seen"
    # signal) must refresh BEFORE conversion-funnel fuses seen->inbound->revenue and writes the
    # bottleneck to logs/profile-conversion-funnel-latest.json (which the daily brief then surfaces).
    # Both read-only + fail-open (a 403 on a repo without push access is recorded, never fatal); both
    # silent so a network hiccup can't red the beat. Dark until this rung — the bottleneck (currently
    # DISCOVERY: repos provable but unseen) only refreshed when a human ran it by hand.
    steps:
      - command: "python3 scripts/traffic-collect.py"
        severity: silent
        escalation: "traffic-collect skipped/failed — the 'seen' signal may be stale (gh /traffic; 403 without push access is recorded, non-fatal)"
      - command: "python3 scripts/conversion-funnel.py"
        severity: silent
        escalation: "conversion-funnel skipped/failed — the public-face bottleneck (DISCOVERY|FACE|CLOSE) may be stale in logs/profile-conversion-funnel-latest.json (reads traffic.jsonl + opportunity-status.json; fails open)"

  opportunity-brief:
    section: heartbeat
    title: "the engine's daily VOICE — once per day compose a plain-text opportunity brief (inbound leads, what you owe, LinkedIn mirror status, correspondence, engine freshness) and EMAIL it to the operator's own inbox so the continuous engine is felt, not buried in a log"
    gate: LIMEN_OPPORTUNITY_BRIEF
    default: "1"
    source: [heartbeat]
    owner: mail
    cadence:
      env: LIMEN_BEAT_OPPORTUNITY_BRIEF
      default: 12
    timeout:
      env: LIMEN_OPPORTUNITY_BRIEF_TIMEOUT
      default: 180
    steps:
      - command: "python3 scripts/opportunity-brief.py"
        severity: silent
        escalation: "daily brief skipped or send failed (reads status/ledger, emails self via mail-send; idempotent once/day; fails open)"

  opportunity-status-stale:
    section: "0o2"
    title: "opportunity engine is alive — the inbound-lead monitor's status file is still being refreshed, not silently frozen"
    gate: LIMEN_OPPORTUNITY_STALE
    default: "1"
    source: [metabolize]
    owner: mail
    # The 2026-07-21 sibling of host-pressure-stale: the beat ticked but opportunity-review-delta
    # stopped rewriting logs/opportunity-status.json for ~18h, so the daily brief + every downstream
    # reader reported all-clear while the engine was blind. This rung watches the WRITER, not the
    # leads: opportunity-pipeline fires every 12 beats (~6h worst-case tempo), so 13h = ~2 windows
    # is stale without false-positiving a slow beat. Reuses the generic scripts/state-freshness.py
    # (fails toward stale: absent/unparseable/old file all exit 1). Read-only; advisory; onset-deduped.
    steps:
      - command: 'python3 scripts/state-freshness.py --file logs/opportunity-status.json --field generated_at --max-age-seconds 46800 --key opportunity-status-stale --label "opportunity engine"'
        severity: advisory
        escalation: "opportunity-status.json has stopped refreshing — the inbound-lead monitor (opportunity-review-delta) is frozen and the daily brief is reporting stale state; check `python3 scripts/opportunity-review-delta.py` and the heartbeat (2026-07-21 18h-blind incident, WS0)"

  closeout-reconcile:
    section: "0z"
    title: "closeout reconciliation — every claimed-done outcome carries a verified receipt"
    gate: LIMEN_SESSION_CLOSEOUT
    default: "0"
    source: [metabolize]
    owner: censor
    # verify-dispatch babysits status=dispatched; this babysits the COMPLEMENT — status=done CLOSEOUT
    # claims. Reuses verify-dispatch.gh_pr_state to probe each cited PR; a done-claim citing an unmerged
    # PR is DONE_UNVERIFIED (the #1203 "solved at root" false-closeout). Ships DARK (default 0); arming is
    # a separate lever. Findings route via insight-route.py (org/repo -> board task, censor -> residual).
    steps:
      - command: "python3 scripts/reconcile-closeouts.py --check"
        severity: advisory
        escalation: "closeout reconciliation found unverified done-claim(s) — see logs/closeout-reconcile.json"
    omega_eligible:
      - label: "closeout classifier self-test (verdicts correct)"
        rung_id: sensor.closeout.self-test
        tier: det
        command: "python3 scripts/reconcile-closeouts.py --doctor"
        semantic_inputs:
          - {path: scripts/reconcile-closeouts.py, normalization: raw}
      - label: "closeout operational posture"
        rung_id: sensor.closeout.posture
        tier: live
        command: "python3 scripts/reconcile-closeouts.py --check"
        semantic_inputs:
          - {path: scripts/reconcile-closeouts.py, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.closeout.posture.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  insight-cross-vendor:
    section: "0z0"
    title: "cross-vendor friction ingest — per-vendor /insights-class packets (claude/codex/opencode/antigravity/cline/copilot/jules) refresh on the beat and feed the censor cascade"
    gate: LIMEN_CROSS_VENDOR_INGEST
    default: "1"
    source: [metabolize]
    owner: censor
    # Arms the estate-wide-friction-beat-sensor proposal (censor/whole-estate-insights-proposals.json,
    # whole-estate-2026-07-16; enacted on the operator's 2026-07-24 "implement all of it"): the
    # 7-adapter engine (scripts/insight-cross-vendor-ingest.py, PR #1124 + the copilot adapter #1343)
    # ran only by hand, so per-vendor packets went stale (last manual run 2026-07-22) and
    # insight-cadence's cross-vendor source read cold data. Read-only over vendor stores; packets
    # carry counts/patterns only (PII firewall upstream in the ingest itself).
    cadence:
      env: LIMEN_BEAT_CROSS_VENDOR
      default: 24
    timeout:
      env: LIMEN_CROSS_VENDOR_TIMEOUT
      default: 900
    # Three ordered steps (conversion-funnel precedent): ingest refreshes the packets,
    # index --all refreshes every vendor-insights lane (NOTE: this widens the standing
    # local PII footprint — session metadata + cwd paths under gitignored
    # logs/vendor-insights/ — disarm via LIMEN_CROSS_VENDOR_INGEST=0), and --health
    # watches the pipeline itself (packet staleness, store resets, retention pruning,
    # capsule churn, narrative lag) writing ONE aggregate censor-owned warning packet.
    steps:
      - command: "python3 scripts/insight-cross-vendor-ingest.py --window-days 30"
        severity: advisory
        escalation: "cross-vendor friction ingest failed — per-vendor packets in logs/insight-cross-vendor/ go stale and insight-cadence reads cold data until it lands"
      - command: "python3 scripts/vendor-insights.py index --all"
        severity: advisory
        escalation: "vendor-insights index refresh failed — per-lane indexes go stale and the health checks (capsule churn, narrative lag) read cold data until it lands"
      - command: "python3 scripts/insight-cross-vendor-ingest.py --health"
        severity: advisory
        escalation: "cross-vendor health evaluation failed — packet staleness, store resets, and retention pruning go unwatched until it lands"

  jules-quota:
    section: "0z1"
    title: "Jules daily quota — used-vs-target gauge, orphaned completions, recovery states"
    gate: LIMEN_JULES_QUOTA
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The 183-day silent lane (2026-01-21 -> 2026-07-23: zero landed Jules output while the
    # 100/day vendor quota expired unused) had no gauge: drain landed only receipt-mapped
    # sessions and dropped orphans silently, and nothing measured used-vs-target. This sensor
    # is the missing gauge; the EFFECTORS stay the existing rungs (drain.sh -> jules-land for
    # landing, metabolize 4b dispatch for filling). Target derives from
    # capacity.DEFAULT_DAILY_TASK_TARGETS / LIMEN_JULES_DAILY_TASKS — never pinned here.
    # Read-only; advisory; fail-open when the jules CLI is unavailable (probe_unavailable noted).
    steps:
      - command: "python3 scripts/jules-quota.py"
        severity: advisory
        escalation: "Jules quota under target late-day, or orphan/recovery sessions pending — drain (jules-land) + dispatch (metabolize 4b) own the effectors; orphan list via `python3 scripts/jules-land.py`"

  jules-supply:
    section: "0z2"
    title: "Jules packet supply — dispatchable-supply-vs-floor gauge with armed template minting"
    gate: LIMEN_JULES_SUPPLY
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The quota sensor (jules-quota) measures used-vs-target; hitting 100/day also needs
    # ~100 loan-complete open packets to dispatch. This organ measures supply-vs-floor and,
    # when the LIMEN_JULES_SUPPLY_APPLY valve is armed, mints the deficit from the declared
    # renewable series in docs/jules-supply-templates.yaml as TABVLARIVS upsert tickets —
    # adding supply = adding one registry entry, never a hand-minting session. Floor derives
    # from the jules capacity target — never pinned here. Dry-run (gauge-only) by default.
    steps:
      - command: "python3 scripts/jules-supply.py"
        args_when:
          # Armed by default (operator mandate 2026-07-23: the 100/day quota is consumed
          # autonomously — "we shouldn't even have to think about it"). Disarm with
          # LIMEN_JULES_SUPPLY_APPLY=0 for a gauge-only dry run.
          - env: LIMEN_JULES_SUPPLY_APPLY
            default: "1"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: deliverable
        severity: advisory
        escalation: "Dispatchable Jules supply is below floor and minting is unarmed — arm LIMEN_JULES_SUPPLY_APPLY=1 or extend docs/jules-supply-templates.yaml"

  lane-throughput:
    section: "0z4"
    title: "throughput governor gauge — each lane's dispatch cap vs its landed evidence"
    gate: LIMEN_LANE_THROUGHPUT
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The June-July jules era proved raw dispatch volume compounds debt: 90-190 launches/day
    # at ~15% completion left 308 blocked owner_route PRs (23.8% of estate PR debt). The
    # governor (capacity.lane_throughput_cap, enforced in dispatch._remaining_budget) makes
    # the full daily target EARNED: bootstrap 25/day from cold start, full target only while
    # landed/dispatched holds LIMEN_THROUGHPUT_FLOOR_RATE. This sensor is the gauge — cap
    # table per run, JSONL history, advisory-red on a clamp sustained across 2+ days (the
    # fix then belongs to the LANDING organs, never to more dispatch).
    steps:
      - command: "python3 scripts/lane-throughput.py"
        severity: advisory
        escalation: "a lane has been throughput-clamped 2+ days — landing is the bottleneck: run drain.sh rungs (jules-land, owner-route-drain, merge-drain) and read logs/throughput-governor.jsonl for the binding evidence"

  jules-dispatch:
    section: "0z5"
    title: "jules dispatch valve rung — the beat's governed path to the serial engine"
    gate: LIMEN_JULES_DISPATCH
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The 2026-07-19 -> 08-06 starvation's wiring cut: the only `limen dispatch --live` call
    # sites (metabolize.sh 4b, saturate.sh) had no scheduler, so zero autonomous dispatch
    # existed. This rung is the declared caller: dispatch-beat.py gates SOLELY on
    # `autonomy-governor.py dispatch-ok` (logs/autonomy-policy.json is the single valve —
    # LIMEN_DISPATCH stays the his-hand lever for MANUAL metabolize/saturate runs), throttles
    # itself to one pass per LIMEN_DISPATCH_BEAT_MIN_SECS, and runs the serial engine for
    # jules only (remote lane, no local load on the 16GB host). Volume is bounded three
    # deep: per-pass limit, per_agent.jules=100 board cap, and the throughput governor's
    # landed-evidence clamp. Cite: docs/plans/2026-08-06-jules-flywheel.md (issue #1874).
    timeout:
      env: LIMEN_DISPATCH_BEAT_TIMEOUT
      default: 900
    steps:
      - command: "python3 scripts/dispatch-beat.py"
        severity: advisory
        armed_valve_type: deliverable
        escalation: "the jules dispatch rung failed — read its tail in the beat log; the valve is logs/autonomy-policy.json via autonomy-governor.py dispatch-ok, the engine is `python3 -m limen dispatch --agent jules --live`"

  capacity-fill-refresh:
    section: "0z6"
    title: "capacity-fill receipt refresh — the down-lane gate reads live data, not fossils"
    gate: LIMEN_CAPACITY_FILL_REFRESH
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # docs/capacity-fill.md sat frozen at its 2026-07-10 generation ("jules exhausted
    # 109/100") for 27 days because nothing regenerated it — and stale depletion receipts
    # are what the down-lane gating reads. Regenerate on the metabolize pass.
    cadence:
      env: LIMEN_BEAT_CAPACITY_FILL
      default: 4
    timeout:
      env: LIMEN_CAPACITY_FILL_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/capacity-fill-ledger.py --write"
        severity: silent
        escalation: "capacity-fill ledger refresh failed — docs/capacity-fill.md goes stale and lane gating reads fossil depletion data"

  dispatch-health-refresh:
    section: "0z7"
    title: "dispatch-health receipt refresh — the health receipt tracks the live loop"
    gate: LIMEN_DISPATCH_HEALTH_REFRESH
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # Sibling of capacity-fill-refresh: docs/dispatch-health.md froze 2026-07-10 with
    # "jules in async skipped down lanes" and was never regenerated.
    cadence:
      env: LIMEN_BEAT_DISPATCH_HEALTH
      default: 8
    timeout:
      env: LIMEN_DISPATCH_HEALTH_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/dispatch-health.py --write"
        severity: silent
        escalation: "dispatch-health receipt refresh failed — docs/dispatch-health.md goes stale"

  funnel-integrity:
    section: 0z3
    title: "application funnel honesty — the funnel claims nothing it cannot evidence"
    gate: LIMEN_FUNNEL_INTEGRITY
    default: "1"
    source: [metabolize]
    owner: mail
    # On 2026-08-04/05 the funnel recorded SIMULATED job applications as provider-CONFIRMED ones
    # against six real employers, and separately drove an agent through a 27h32m retry loop whose
    # exit condition was unreachable by construction. NEITHER announced itself: every stage exited
    # 0, and the fabricated receipts were schema-valid DeliveryReceiptV1 rows — the only tell was
    # that the "evidence" was the entry's own id and the provider response said "simulated".
    #
    # A defect that survives schema validation and exits 0 is not caught by the next reader being
    # careful. The predicate asserts it every beat instead. Read-only and idempotent; the root
    # cause it watches hardest is a live application-pipeline checkout parked behind main, which is
    # where every fabricated record in that incident came from.
    # Full record: docs/plans/2026-08-05-application-funnel-healing.md
    steps:
      - command: "bash scripts/funnel-integrity.sh"
        severity: advisory
        escalation: "Application funnel integrity FAILED — a confirmation without provider evidence, corrupt funnel state, or an application-pipeline checkout parked off main (the 2026-08-05 fabrication cause). Run `bash scripts/funnel-integrity.sh` bare for the failing invariant"

  decorum:
    section: "heartbeat"
    title: "professionalization keeper — no public surface is currently egg-faced"
    gate: LIMEN_DECORUM
    default: "1"
    source: [heartbeat]
    owner: decorum
    cadence:
      env: LIMEN_BEAT_DECORUM
      default: 6
    timeout:
      env: LIMEN_DECORUM_TIMEOUT
      default: 120
    # DECORVM federates the estate's six quality organs (experience/visual/seo/countenance/links/moat)
    # into ONE verdict at logs/decorum.json + logs/decorum.html. Departments + the severity floor are
    # declared data in institutio/governance/decorum-surfaces.yaml (derive-never-pin); an unmeasured
    # department is skipped fail-open, never failed. Ships default-on but READ-ONLY — the effector that
    # files tasks/issues from findings is a separate gate (LIMEN_DECORUM_APPLY), dry-run until armed.
    steps:
      - command: "python3 scripts/decorum-keeper.py --sweep"
        args_when:
          - env: LIMEN_DECORUM_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: deliverable
        severity: advisory
        escalation: "DECORVM found a public egg-face — see logs/decorum.json (blocking finding at/above floor 'high')"
    omega_eligible:
      - label: "keeper wiring self-test (registry + schema valid)"
        rung_id: sensor.decorum.self-test
        tier: det
        command: "python3 scripts/decorum-keeper.py --doctor"
        semantic_inputs:
          - {path: scripts/decorum-keeper.py, normalization: raw}

  ideal-forms-distance:
    section: "heartbeat"
    title: "ideal-forms distance — every named ideal's distance is re-derived, not remembered"
    gate: LIMEN_IDEAL_FORMS
    default: "1"
    source: [heartbeat]
    owner: governance
    cadence:
      env: LIMEN_BEAT_IDEAL_FORMS
      default: 12
    timeout:
      env: LIMEN_IDEAL_FORMS_TIMEOUT
      default: 300
    # The heartbeat half of IF-LEDGER-OF-IDEALS. pr-gate already runs check-ideal-forms on any
    # PR that touches the registry or the ledger — but the distances measure the SYSTEM, not the
    # diff, so they rot without anyone editing either file. That is precisely how the ledger sat
    # 34 days with its own entry reading "not yet wired into a verification/heartbeat lane" while
    # IF-LIVE-TREE-COHERENCE drifted 5x underneath it.
    #
    # --measure (not the bare gate) is deliberate: it additionally runs the `host` and `network`
    # probes that pr-gate cannot, which is the entire reason a beat rung exists. The live-checkout
    # probe is one of them, so the beat is where a frozen fleet checkout finally becomes audible —
    # the six-day freeze of 2026-07-23 was invisible because sync-release.sh fails OPEN into a log
    # nothing reads.
    #
    # Advisory, never fatal: a distance that remains is the normal state of an ideal (that is what
    # makes the ledger liquid rather than a checkbox). Only registry INCOHERENCE is drift, and
    # pr-gate already fails on that.
    steps:
      - command: "python3 scripts/check-ideal-forms.py --measure"
        severity: advisory
        escalation: "an ideal-form distance changed or a probe went unmeasurable (above) — re-derive with `python3 scripts/check-ideal-forms.py --measure`; do NOT hand-edit a Distance: line in docs/IDEAL-FORMS-LEDGER.md"

  hot-cache:
    section: "heartbeat"
    title: "hot flash cache — the machine is disposable (every byte re-summonable from upstream)"
    gate: LIMEN_HOTCACHE_CHECK
    default: "1"
    source: [heartbeat]
    owner: continuity
    cadence:
      env: LIMEN_BEAT_HOTCACHE
      default: 24
    timeout:
      env: LIMEN_HOTCACHE_TIMEOUT
      default: 300
    # The Meeseeks law's court (plan 2026-07-30): summoned surfaces must return their result to
    # source and self-erase, so the local floor is only ever a hot flash cache. The predicate walks
    # five rungs — spine (cartridge-connected), capture (chezmoi-drift), creds validity, toolchain
    # summonability (mise.toml), and every-clone-pushed — and lists each un-summonable state with
    # its owner. Advisory, never fatal: a red names debt (e.g. domus-genoma#359), it does not
    # break the beat. Daily cadence — disposability moves at human speed, not per-beat.
    steps:
      - command: "bash scripts/verify-hot-cache.sh"
        severity: advisory
        escalation: "machine is NOT disposable — un-summonable state above (each red names its owner/fix); run bash scripts/verify-hot-cache.sh"

  residue-census:
    section: "heartbeat"
    title: "residue census — what this machine holds that it should be able to re-summon"
    gate: LIMEN_RESIDUE_CENSUS
    default: "1"
    source: [heartbeat]
    owner: continuity
    cadence:
      env: LIMEN_BEAT_RESIDUE_CENSUS
      default: 24
    timeout:
      env: LIMEN_RESIDUE_CENSUS_TIMEOUT
      default: 180
    # The other half of the Meeseeks law. The hot-cache court (above) is honest about its own blind
    # spot — its R5 excludes worktrees and quarantines "by marker … never silent", because those
    # have their own reap organs — which left nothing measuring whether those organs KEEP UP. They
    # did not: 10 GiB of .agent-runtime whose reaper is written and wired to nothing, a 571 MiB
    # append-only ledger snapshot with no reaper at all, 1,616 remote branches behind an acceptance
    # ledger never once written to. This counts the pressure and names the owner of each class.
    # READ-ONLY: it deletes nothing and arms nothing. Deleting is the reapers' job (human-gated
    # where destructive); knowing was nobody's, which is why none of it was known.
    steps:
      - command: "python3 scripts/residue-census.py"
        severity: advisory
        escalation: "residue caps breached — this machine is holding state it should be able to re-summon; each breach names its owner (run python3 scripts/residue-census.py)"

  collaboration-hub-sync:
    section: "0g9c"
    title: "collaboration hub — refresh the registered denominator, encrypt new originals, reconcile immutable remote events, and verify custody"
    gate: LIMEN_COLLABORATION_HUB_SYNC
    default: "1"
    source: [heartbeat]
    owner: continuity
    cadence:
      env: LIMEN_BEAT_COLLABORATION_HUB_SYNC
      default: 48
    timeout:
      env: LIMEN_COLLABORATION_HUB_SYNC_TIMEOUT
      default: 900
    steps:
      - command: "bash scripts/collaboration-hub-sync.sh"
        severity: advisory
        escalation: "the owner-only collaboration vault did not reach its bounded discover → migrate → encrypted sync → verify fixed point; inspect its private receipt and credential wall without placing paths, keys, or client data in the board"

  diurnal:
    section: "0h"
    title: "diurnal — morning dashboard / midday check-in / evening close; the evening scores the morning's claims and cuts the sections that never earned their place"
    gate: LIMEN_DIURNAL
    default: "1"
    source: [metabolize, heartbeat]
    owner: diurnal
    # Cadence is beat-modulo ONLY. True time-of-day gating is wall-clock inside the script
    # (logs/diurnal/state.json, one emission per phase per calendar day) — the
    # scripts/insight-cadence.py precedent. Visiting often is cheap: a phase that is not yet
    # due exits before doing any work.
    cadence:
      env: LIMEN_BEAT_DIURNAL
      default: 2
    timeout:
      env: LIMEN_DIURNAL_TIMEOUT
      default: 240
    steps:
      - command: "python3 scripts/diurnal.py --phase auto"
        severity: advisory
        escalation: "diurnal emission failed — the day has no briefing; check that LIMEN_ROOT resolves to the LIVE organism (a worktree's logs/ is empty and the organ refuses to emit a false 'all quiet') and inspect logs/diurnal/state.json"

  notify-gate:
    section: "0h1"
    title: "notify gate — every copy of the notifier on this host gates osascript on the liveness predicate, not just the one in main"
    gate: LIMEN_NOTIFY_GATE
    default: "1"
    source: [heartbeat]
    owner: diurnal
    # The cross-tree half of the guard diurnal already carries in-tree. Measured 2026-08-05:
    # the effector gate shipped at 19:20 and four more "LIMEN · morning — ABSENT" pops landed
    # after it, because a fix in a versioned file cannot reach the OTHER copies of the notifier
    # on this host — 13 worktrees plus 7 rotated runtime install trees. A tree-local guard
    # cannot protect a host-global effector.
    #
    # It does not merely count them. The copies split by HOW THEY GET RUN, and that is the
    # whole finding: `~/.local/share/limen/current` is executed unattended by launchd every
    # 300s and was itself ungated with a 5-day-stale symlink, while the rest are inert unless
    # a test runs inside them. A scheduled executor gets its own stanza and the exact rotation
    # command; dormant copies ratchet against notify-ungated-baseline.txt so the count can only
    # shrink. Cheap: it parses ~23 small files.
    cadence:
      env: LIMEN_BEAT_NOTIFY_GATE
      default: 8
    timeout:
      env: LIMEN_NOTIFY_GATE_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/check-notify-gate.py"
        severity: advisory
        escalation: "a notifier copy reaches osascript ungated in a way the baseline does not already own — either the launchd-run install (~/.local/share/limen/current, which speaks on a timer and is cleared by `domus-limen-runtime install --sha <merged-main-sha>`) or a NEW copy that is not in institutio/governance/notify-ungated-baseline.txt. For a new one: rebase it onto origin/main so it inherits the gate, or reap it via python3 scripts/reclaim-worktrees.py; if it is legitimately known, record it with check-notify-gate.py --update. Gate-run tests cannot reach osascript regardless — run-pytest-hermetic.sh exports LIMEN_NOTIFY=0, which every copy on this host honors"
