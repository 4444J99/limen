      env: LIMEN_BEAT_TCC_TRACK_C
      default: 8
    timeout:
      env: LIMEN_TCC_TRACK_C_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/tcc-track-c-closeout.py --beat --json"
        severity: advisory
        escalation: "Track C closeout blocked (inventory regression or host failure) — read logs/tcc-track-c-status.json; never pin/suppress the Claude updater or discharge L-DOMUS-AGENT-HOST-TCC on a no-op update"
    omega_eligible:
      - label: "Track C vendor-update wait-or-met"
        rung_id: sensor.tcc.track-c
        tier: live
        command: "python3 scripts/tcc-track-c-closeout.py --probe --json"
        semantic_inputs:
          - {path: scripts/tcc-track-c-closeout.py, normalization: raw}
          - {path: logs/tcc-track-c-status.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 86400}

  claude-identity-bundle:
    section: "0g8d"
    title: "Claude Code's disclaimed TCC identity rests on the stable ClaudeCode.app bundle, never a versioned path"
    # Claude Code re-execs itself with macDisclaimResponsibility:true at startup, so NO
    # supervising host — DomusAgentHost included — can carry an identity into it. Which
    # identity it lands on is one `??` in the vendor's code: `await _jb() ?? process.execPath`.
    # _jb() materializes <store>/ClaudeCode.app (CFBundleIdentifier com.anthropic.claude-code,
    # stable across versions); it returns null on ANY exception inside one bare catch, and the
    # fallback identity is the versioned binary — the same inode, but with no enclosing bundle
    # for TCC to resolve, so it is named by its own filename.
    # SCOPE (verified 2026-08-05 with this sensor already at-ideal): keeping the bundle does NOT
    # stop per-version consent dialogs. The daemon runs its pty host from the bundle but hands
    # the session process its versions/<version> path as argv, and that session is what disclaims
    # into its own TCC identity. Vendor-internal; a green reading here is not "prompts fixed".
    # _jb() takes an early return when the hardlink already carries the running binary's inode,
    # skipping the unlink/link pair that concurrent session starts can race into EEXIST. Keeping
    # the bundle inode-correct keeps every start on that early return. Idempotent; writes exactly
    # the vendor's own bytes; never signs, never deletes a version, never edits TCC.
    gate: LIMEN_CLAUDE_IDENTITY_BUNDLE
    default: "1"
    source: [metabolize]
    owner: tabularius
    timeout:
      env: LIMEN_CLAUDE_IDENTITY_BUNDLE_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/claude-identity-bundle.py --repair"
        severity: advisory
        escalation: "Claude Code identity bundle could not be kept — the stable com.anthropic.claude-code identity is unavailable to anything that does exec through it; check that ~/.local/bin/claude still resolves under the store's versions/ tree. Does not by itself govern per-version consent prompts (see the scope note above)."
    omega_eligible:
      - label: "Claude Code stable identity bundle"
        rung_id: sensor.claude.identity-bundle
        tier: live
        command: "python3 scripts/claude-identity-bundle.py --json"
        semantic_inputs:
          - {path: scripts/claude-identity-bundle.py, normalization: raw}
          - {path: logs/claude-identity-bundle-status.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 86400}

  dialogs-silenced:
    section: "0g8b"
    title: "dialogs silenced — stable TCC identity + the agent-curable macOS dialog estate hold while managed tools auto-update"
    # Replaces the three hand-wired hygiene hooks in heartbeat-loop.sh with ONE registry-derived sensor:
    # each armed LIMEN_*_HEAL effector runs on the hygiene cadence, then --agent-curable-only verifies
    # the beat-healable estate is silent. The human-gated classes (settings.json self-mod, firewall)
    # stay levers (L-DIALOGS-HEAL cites the three deliverable valves so an unarmed host reads PARKED,
    # not SILENT-OFF). See docs plan + [[macos-tcc-gatekeeper-dialogs-solved]].
    gate: LIMEN_DIALOGS_SILENCED
    default: "1"
    source: [heartbeat]
    owner: tabularius
    cadence:
      env: LIMEN_BEAT_DIALOGS
      default: 8                # the hygiene cadence (C_HYGIENE) the three effectors rode as hand-wired hooks
    timeout:
      env: LIMEN_DIALOGS_TIMEOUT
      default: 120
    steps:
      - command: "bash scripts/heal-hook-drift.sh"
        args_when:
          - env: LIMEN_HOOK_DRIFT_HEAL
            default: "0"
            equals: "1"
            args: ["--apply"]   # armed → inject --apply (the healer also honors LIMEN_HOOK_DRIFT_HEAL); registers the deliverable valve
            armed_valve_type: deliverable
        severity: advisory
        escalation: "PreToolUse trust hook drifted (class 1b) — arm LIMEN_HOOK_DRIFT_HEAL=1 so the beat reinstalls the canonical hook, else the compound-cd guard re-prompts every fleet job"
      - command: "bash scripts/heal-claude-cask.sh"
        args_when:
          - env: LIMEN_CASK_DUPLICATE_HEAL
            default: "0"
            equals: "1"
            args: ["--apply"]   # armed → inject --apply (the healer also honors LIMEN_CASK_DUPLICATE_HEAL); registers the deliverable valve
            armed_valve_type: deliverable
        severity: advisory
        escalation: "duplicate Homebrew claude-code cask (class 4) — arm LIMEN_CASK_DUPLICATE_HEAL=1 so the beat uninstalls it, else brew re-quarantines it every upgrade"
      - command: "bash scripts/heal-claude-lsregister.sh"
        args_when:
          - env: LIMEN_CLAUDE_LSREGISTER_HEAL
            default: "0"
            equals: "1"
            args: ["--apply"]   # armed → inject --apply (the healer also honors LIMEN_CLAUDE_LSREGISTER_HEAL); registers the deliverable valve
            armed_valve_type: deliverable
        severity: advisory
        escalation: "unassessable ClaudeCode.app registered with LaunchServices (class 4b) — arm LIMEN_CLAUDE_LSREGISTER_HEAL=1 so the beat UNREGISTERS it (never removes it: the bundle is vendor-materialized every start and deleting it destroys the stable TCC identity sensor 0g8d keeps). Ideal form IF-GATEKEEPER-INERT; corrected root in docs/architecture/macos-tcc-gatekeeper-dialogs-solved.md"
      - command: "python3 scripts/claude-bundle-identity-heal.py"
        args_when:
          - env: LIMEN_CLAUDE_BUNDLE_IDENTITY_HEAL
            default: "0"
            equals: "1"
            args: ["--apply"]   # armed → inject --apply (the healer also honors LIMEN_CLAUDE_BUNDLE_IDENTITY_HEAL); registers the deliverable valve
            armed_valve_type: deliverable
        severity: advisory
        escalation: "the live versions/<v> is still a hardlink, so every vendor update mints a fresh per-version TCC client and re-asks the whole grant set (#1703) — arm LIMEN_CLAUDE_BUNDLE_IDENTITY_HEAL=1 so the beat routes it onto the stable com.anthropic.claude-code bundle path. Never writes a TCC db; touches only an inode the bundle already holds. Upstream fix: anthropics/claude-code#86706"
      - command: "bash scripts/dialogs-silenced.sh --agent-curable-only"
        severity: advisory
        escalation: "stable-host/TCC identity or an agent-curable dialog class is red after the heal pass — repair the named host route or arm the matching LIMEN_*_HEAL valve; never disable an updater"
      # The attribution ratchet. Both local cures for the rotating per-version TCC identity
      # (#1703) were measured on 2026-08-15: ENCLOSURE is refuted, SYMLINK is UNRESOLVED with
      # code identity resolving the target. The probe's own rationale is that an unrun result
      # decays into folklore and gets re-derived at full cost — which is exactly what happens
      # if it is never wired to a cadence, so it rides the same hygiene beat as the estate it
      # describes. Exit 1 means macOS behavior CHANGED and the receipt is now wrong in one
      # direction or the other; advisory because a changed verdict is a re-measure prompt, not
      # a broken host. Receipts: docs/receipts/tcc-track-c-1703/README.md.
      - command: "python3 scripts/tcc-identity-attribution-probe.py"
        severity: advisory
        escalation: "macOS changed how it attributes exec identity — the #1703 cure verdicts (enclosure REFUTED / symlink UNRESOLVED) no longer hold. Re-measure and amend docs/receipts/tcc-track-c-1703/README.md before anyone re-proposes or re-buries a local cure"
    omega_eligible:
      - label: "dialogs silenced (agent-curable)"
        rung_id: sensor.dialogs.agent-curable
        tier: live
        command: "bash scripts/dialogs-silenced.sh --agent-curable-only"
        semantic_inputs:
          - {path: scripts/dialogs-silenced.sh, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.dialogs.agent-curable.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  foreign-litter:
    section: "0g9"
    title: "foreign-agent litter — no other vendor's session state squats untracked in the live checkout"
    gate: LIMEN_FOREIGN_LITTER
    default: "1"
    source: [metabolize]
    owner: tabularius
    # The 2026-07-24 mess audit: Antigravity's teamwork-preview run planted ~35 untracked .agents/
    # orchestration dirs + a stray root-level SQLite (`1`) in the live checkout and died mid-flight;
    # nothing watched either class. Detection every beat; the reap valve (SAFE-OFF, orphan-watcher
    # precedent: detection earns trust first) quarantines by MOVE, never delete — excavation of
    # handoffs owed to another repo happens before arming, not after losing them.
    steps:
      - command: "python3 scripts/check-foreign-litter.py"
        args_when:
          - env: LIMEN_FOREIGN_LITTER_REAP
            default: "0"
            equals: "1"
            args: ["--reap"]
            armed_valve_type: safety
        severity: advisory
        escalation: "foreign-agent session litter in the live checkout above — excavate any handoffs owed to another repo, then reap (arm LIMEN_FOREIGN_LITTER_REAP=1 or run scripts/check-foreign-litter.py --reap once)"

  branch-reap:
    section: "0g9b"
    title: "spent branches — no provably-landed local branch lingers after its work merged"
    gate: LIMEN_BRANCH_REAP_CHECK
    default: "1"
    source: [metabolize]
    owner: tabularius
    # NO cadence — deliberately every metabolize pass, and the reason is a coupling, not a taste.
    # reap-branches --check only calls a landed branch "lingering" once it is older than
    # LIMEN_BRANCH_REAP_GRACE_MIN (60 min); younger ones read as "digesting". That grace exists so a
    # continuously-merging fleet does not redden every closeout (reap-branches.py:634). It therefore
    # only works if the REAPER visits at least as often as the grace lapses. Shipped at cadence 4,
    # this sensor visited roughly every fourth pass — several times slower than the grace — so every
    # branch that landed had a guaranteed window of being past-grace with no reaper due, and
    # no-tasks-on-me.sh went red in it. Measured immediately: the pass cleared 15 lingering branches,
    # and by the next predicate run worktree-hospes-full-done-plan had landed, aged out, and reddened
    # it again. A closeout gate that is red on a timer is the same unreadable gate as one that is
    # always red. Cadence and grace are one parameter pair — raising this cadence without raising
    # LIMEN_BRANCH_REAP_GRACE_MIN to match reopens the window.
    timeout:
      env: LIMEN_BRANCH_REAP_TIMEOUT
      default: 120
    # Spent branches accumulated unreaped — 87 reapable, 15 of them provably landed — and the cost
    # was paid by scripts/no-tasks-on-me.sh, a CLOSEOUT gate, which went exit 0 -> exit 1 inside
    # forty minutes on 2026-08-14 with no work done in between, because branches landed underneath
    # the session. That is the one thing a closeout gate must never do: it made "I left something
    # hanging" and "the fleet's backlog grew while I worked" indistinguishable, destroying the only
    # distinction the gate exists to draw.
    #
    # The reap was NOT unowned (see the starvation note below); it was owned and never running, which
    # looks identical from the outside and is why the first diagnosis here was wrong. Detection lives
    # on the metabolize pass — ungated by vitals — so the finding surfaces every cadence window even
    # when the repair path is shedding.
    #
    # The valve is a SEPARATE STEP, not the foreign-litter/orphan-watcher `args_when` idiom: --check
    # returns early (reap-branches.py:637, above the apply path at :690), so `--check --apply` would
    # take the check branch and never apply. Arming it through args_when would leave an env var that
    # reads as armed, an armed-valve-audit.py entry that looks declared, and nothing ever deleted.
    # Hence a bare --apply on its own step, ordered AFTER the check so one pass reports then repairs.
    #
    # It reuses the EXISTING LIMEN_BRANCH_REAP_APPLY (already declared, already default 1, already
    # consumed by clone-maintenance.sh:145) rather than minting a second arming knob, so one switch
    # disarms both paths.
    #
    # WHY A SECOND PATH AT ALL — the reap was never unowned, and the first version of this comment
    # said it was. clone-maintenance.sh:145 runs `reap-branches.py --apply` armed, and
    # heartbeat-loop.sh:829 calls clone-maintenance on the hygiene cadence. The owner exists. It is
    # STARVED: hygiene is gated on VITALS_PRESSURE != 1, and on this 16GB jetsam-prone host vitals
    # shed continuously. Measured in logs/heartbeat.out.log: "deferred — vitals shedding" 10x,
    # "clone-maintenance: disk" (the ran-for-real banner) ZERO times. The beat log even names the
    # owner as "beat-wired via clone-maintenance.sh, armed" while it never once executes.
    #
    # The defect is the BUNDLING. That gate exists to keep a git storm — gc/prune across every repo
    # plus reap-clones — off a memory-critical host. Deleting a handful of local refs is not a storm
    # (network-bound, ~25 s, negligible RSS), but it inherited the storm's gate by sharing a script.
    # So the cheap operation starves whenever the expensive one must. This step runs it from the
    # metabolize sensor pass, which is not vitals-gated, leaving the actual storm exactly as gated as
    # before. Do not "simplify" this by moving it back into clone-maintenance.sh — that is the bug.
    steps:
      - command: "python3 scripts/reap-branches.py --check"
        severity: advisory
        escalation: "spent branch(es) above are provably landed and still lingering — the branch-reap-apply step below repairs it on this same pass (arm/disarm with LIMEN_BRANCH_REAP_APPLY)"
      - command: "python3 scripts/reap-branches.py --apply"
        when_env: LIMEN_BRANCH_REAP_APPLY
        when_default: "1"
        armed_valve_type: safety
        severity: advisory
        escalation: "the branch reap could not complete — spent branches remain; run scripts/reap-branches.py --apply, or set LIMEN_BRANCH_REAP_APPLY=0 to disarm and reap by hand"

  dispatch-continuity:
