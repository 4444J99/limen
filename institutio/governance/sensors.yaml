  opportunity-status-stale:
    section: "0o2"
    title: "opportunity engine is alive — the inbound-lead monitor's status file is still being refreshed, not silently frozen"
    gate: LIMEN_OPPORTUNITY_STALE
    default: "1"
    source: [metabolize]
    owner: mail
    # The 2026-07-21 sibling of host-pressure-stale: the beat ticked but opportunity-review-delta
    # stopped rewriting logs/opportunity-status.json for ~18h, so the daily brief + every downstream
    # reader reported all-clear while the engine was blind. This rung watches the WRITER, not the
    # leads: opportunity-pipeline fires every 12 beats (~6h worst-case tempo), so 13h = ~2 windows
    # is stale without false-positiving a slow beat. Reuses the generic scripts/state-freshness.py
    # (fails toward stale: absent/unparseable/old file all exit 1). Read-only; advisory; onset-deduped.
    steps:
      - command: 'python3 scripts/state-freshness.py --file logs/opportunity-status.json --field generated_at --max-age-seconds 46800 --key opportunity-status-stale --label "opportunity engine"'
        severity: advisory
        escalation: "opportunity-status.json has stopped refreshing — the inbound-lead monitor (opportunity-review-delta) is frozen and the daily brief is reporting stale state; check `python3 scripts/opportunity-review-delta.py` and the heartbeat (2026-07-21 18h-blind incident, WS0)"

  self-heal-stale:
    section: "0o4"
    title: "self-heal repair factory is alive — the last successful cloud maintenance receipt is fresh"
    gate: LIMEN_SELF_HEAL_STALE
    default: "1"
    source: [metabolize]
    owner: heal
    # Freshness belongs to the bounded, operator-dispatched cloud workflow. Local log mtime can be
    # refreshed without a successful remote pass and therefore is not custody evidence. This probe
    # reads only the latest successful workflow_dispatch receipt and fails closed when it is absent,
    # stale, or cannot be queried. Read-only; advisory; onset-deduped.
    steps:
      - command: 'python3 scripts/cloud-maintenance-freshness.py --repo organvm/limen --max-age-seconds 21600'
        severity: advisory
        escalation: "No fresh successful cloud-maintenance receipt exists — dispatch `.github/workflows/cloud-maintenance.yml` at the exact current main SHA and inspect its counts-only receipt"

  closeout-reconcile:
    section: "0z"
    title: "closeout reconciliation — every claimed-done outcome carries a verified receipt"
    gate: LIMEN_SESSION_CLOSEOUT
    default: "0"
    source: [metabolize]
    owner: censor
    # verify-dispatch babysits status=dispatched; this babysits the COMPLEMENT — status=done CLOSEOUT
    # claims. Reuses verify-dispatch.gh_pr_state to probe each cited PR; a done-claim citing an unmerged
    # PR is DONE_UNVERIFIED (the #1203 "solved at root" false-closeout). Ships DARK (default 0); arming is
    # a separate lever. --apply HOMES each HARD finding as a board task via insight-route (org/repo lane);
    # the mutation rides insight-route's OWN LIMEN_INSIGHT_ROUTE_APPLY arm (dry-run plan until armed), so
    # this step introduces no new silent-off valve (PREC-2026-07-08) and writes no derived file (-07-10).
    steps:
      - command: "python3 scripts/reconcile-closeouts.py --apply"
        severity: advisory
        escalation: "closeout reconciliation found unverified done-claim(s) — homed via insight-route; see logs/closeout-reconcile.json"
    omega_eligible:
      - label: "closeout classifier self-test (verdicts correct)"
        rung_id: sensor.closeout.self-test
        tier: det
        command: "python3 scripts/reconcile-closeouts.py --doctor"
        semantic_inputs:
          - {path: scripts/reconcile-closeouts.py, normalization: raw}
      - label: "closeout operational posture"
        rung_id: sensor.closeout.posture
        tier: live
        command: "python3 scripts/reconcile-closeouts.py --check"
        semantic_inputs:
          - {path: scripts/reconcile-closeouts.py, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.closeout.posture.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  insight-cross-vendor:
    section: "0z0"
    title: "cross-vendor friction ingest — per-vendor /insights-class packets (claude/codex/opencode/antigravity/cline/copilot/jules) refresh on the beat and feed the censor cascade"
    gate: LIMEN_CROSS_VENDOR_INGEST
    default: "1"
    source: [metabolize]
    owner: censor
    # Arms the estate-wide-friction-beat-sensor proposal (censor/whole-estate-insights-proposals.json,
    # whole-estate-2026-07-16; enacted on the operator's 2026-07-24 "implement all of it"): the
    # 7-adapter engine (scripts/insight-cross-vendor-ingest.py, PR #1124 + the copilot adapter #1343)
    # ran only by hand, so per-vendor packets went stale (last manual run 2026-07-22) and
    # insight-cadence's cross-vendor source read cold data. Read-only over vendor stores; packets
    # carry counts/patterns only (PII firewall upstream in the ingest itself).
    cadence:
      env: LIMEN_BEAT_CROSS_VENDOR
      default: 24
    timeout:
      env: LIMEN_CROSS_VENDOR_TIMEOUT
      default: 900
    # Three ordered steps (conversion-funnel precedent): ingest refreshes the packets,
    # index --all refreshes every vendor-insights lane (NOTE: this widens the standing
    # local PII footprint — session metadata + cwd paths under gitignored
    # logs/vendor-insights/ — disarm via LIMEN_CROSS_VENDOR_INGEST=0), and --health
    # watches the pipeline itself (packet staleness, store resets, retention pruning,
    # capsule churn, narrative lag) writing ONE aggregate censor-owned warning packet.
    steps:
      - command: "python3 scripts/insight-cross-vendor-ingest.py --window-days 30"
        severity: advisory
        escalation: "cross-vendor friction ingest failed — per-vendor packets in logs/insight-cross-vendor/ go stale and insight-cadence reads cold data until it lands"
      - command: "python3 scripts/vendor-insights.py index --all"
        severity: advisory
        escalation: "vendor-insights index refresh failed — per-lane indexes go stale and the health checks (capsule churn, narrative lag) read cold data until it lands"
      - command: "python3 scripts/insight-cross-vendor-ingest.py --health"
        severity: advisory
        escalation: "cross-vendor health evaluation failed — packet staleness, store resets, and retention pruning go unwatched until it lands"

  reserved-tier-audit:
    section: "0z0"
    title: "reserved-tier accounting across EVERY lane — a Fable run with no acceptance receipt, in any vendor"
    gate: LIMEN_RESERVED_TIER
    default: "1"
    source: [metabolize]
    owner: censor
    # docs/fable-allotment.md declares Fable reserved estate-wide; the enforcement was
    # Claude-lane-only on BOTH axes (measured 2026-08-15): fable-allotment.py sums spend
    # from Claude transcripts alone, and claude-workflow-guard.py cannot resolve a
    # non-Claude transcript path at all. The same sweep found copilot on claude-fable-5 in
    # 3 of 5 substantive sessions, contributing 0 to spent_pct and tripping nothing.
    # This reads only the vendor-insights indexes the sensor above already refreshes — no
    # vendor store is opened here (insight-cross-vendor-ingest.VENDOR_REGISTRY owns paths).
    # ADVISORY by construction: it opens with a real 24-session backlog, and the estate's
    # observe-before-enforce doctrine (closeout-reconcile, plan D6) says a new predicate
    # surfaces its backlog before it blocks anything.
    cadence:
      env: LIMEN_BEAT_RESERVED_TIER
      default: 24
    timeout:
      env: LIMEN_RESERVED_TIER_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/check-reserved-tier.py"
        severity: advisory
        escalation: "a reserved tier ran with no covering acceptance receipt, or a lane went blind to model identity — accept it (scripts/fable-allotment.py accept …), drop off the tier (docs/fable-allotment.md), or teach the ingest adapter to read models"

  lesson-harvest-backlog:
    section: "0z0a"
    title: "lesson-harvest backlog — how many chat sessions have never been processed into durable lessons (censor/lesson-harvest.jsonl is the cursor; the /lesson-harvest skill is the drain)"
    gate: LIMEN_LESSON_HARVEST_BACKLOG
    default: "1"
    source: [metabolize]
    owner: censor
    # The operator's law (memory feedback-codify-every-session-lesson, made mechanical
    # 2026-08-14 on his correction "why would i waste time having these discussions if we
    # arent going to process them?"): every discussion carries lessons; a discussion not
    # processed into a durable owner was wasted. Before this sensor the backlog lived in
    # nobody's view — 97 claude sessions had never been walked. Count-only output (session
    # ids + totals, PII-clean); the reasoning drain is the /lesson-harvest skill, which
    # routes lessons ONLY to existing termini (precedents/levers/memory/board). Exit 1 =
    # backlog remains (advisory pressure, not failure); exit 2 = store unreachable.
    cadence:
      env: LIMEN_BEAT_LESSON_HARVEST
      default: 24
    timeout:
      env: LIMEN_LESSON_HARVEST_TIMEOUT
      default: 120
    steps:
      - command: "python3 scripts/lesson-harvest.py --check"
        severity: advisory
        escalation: "unprocessed chat sessions are accumulating (or the session store became unreachable) — run the /lesson-harvest skill to drain a tranche; the cursor is censor/lesson-harvest.jsonl"

  jules-quota:
    section: "0z1"
    title: "Jules daily quota — used-vs-target gauge, orphaned completions, recovery states"
    gate: LIMEN_JULES_QUOTA
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The 183-day silent lane (2026-01-21 -> 2026-07-23: zero landed Jules output while the
    # 100/day vendor quota expired unused) had no gauge: drain landed only receipt-mapped
    # sessions and dropped orphans silently, and nothing measured used-vs-target. This sensor
    # is the missing gauge; the EFFECTORS stay the existing rungs (drain.sh -> jules-land for
    # landing, metabolize 4b dispatch for filling). Target derives from
    # capacity.DEFAULT_DAILY_TASK_TARGETS / LIMEN_JULES_DAILY_TASKS — never pinned here.
    # Read-only; advisory; fail-open when the jules CLI is unavailable (probe_unavailable noted).
    steps:
      - command: "python3 scripts/jules-quota.py"
        severity: advisory
        escalation: "Jules quota under target late-day, or orphan/recovery sessions pending — drain (jules-land) + dispatch (metabolize 4b) own the effectors; orphan list via `python3 scripts/jules-land.py`"

  jules-supply:
    section: "0z2"
    title: "Jules packet supply — dispatchable-supply-vs-floor gauge with armed template minting"
    gate: LIMEN_JULES_SUPPLY
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The quota sensor (jules-quota) measures used-vs-target; hitting 100/day also needs
    # ~100 loan-complete open packets to dispatch. This organ measures supply-vs-floor and,
    # when the LIMEN_JULES_SUPPLY_APPLY valve is armed, mints the deficit from the declared
    # renewable series in docs/jules-supply-templates.yaml as TABVLARIVS upsert tickets —
    # adding supply = adding one registry entry, never a hand-minting session. Floor derives
    # from the jules capacity target — never pinned here. Dry-run (gauge-only) by default.
    steps:
      - command: "python3 scripts/jules-supply.py"
        args_when:
          # Armed by default (operator mandate 2026-07-23: the 100/day quota is consumed
          # autonomously — "we shouldn't even have to think about it"). Disarm with
          # LIMEN_JULES_SUPPLY_APPLY=0 for a gauge-only dry run.
          - env: LIMEN_JULES_SUPPLY_APPLY
            default: "1"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: deliverable
        severity: advisory
        escalation: "Dispatchable Jules supply is below floor and minting is unarmed — arm LIMEN_JULES_SUPPLY_APPLY=1 or extend docs/jules-supply-templates.yaml"

  lane-throughput:
    section: "0z4"
    title: "throughput governor gauge — each lane's dispatch cap vs its landed evidence"
    gate: LIMEN_LANE_THROUGHPUT
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The June-July jules era proved raw dispatch volume compounds debt: 90-190 launches/day
    # at ~15% completion left 308 blocked owner_route PRs (23.8% of estate PR debt). The
    # governor (capacity.lane_throughput_cap, enforced in dispatch._remaining_budget) makes
    # the full daily target EARNED: bootstrap 25/day from cold start, full target only while
    # landed/dispatched holds LIMEN_THROUGHPUT_FLOOR_RATE. This sensor is the gauge — cap
    # table per run, JSONL history, advisory-red on a clamp sustained across 2+ days (the
    # fix then belongs to the LANDING organs, never to more dispatch).
    steps:
      - command: "python3 scripts/lane-throughput.py"
        severity: advisory
        escalation: "a lane has been throughput-clamped 2+ days — landing is the bottleneck: run drain.sh rungs (jules-land, owner-route-drain, merge-drain) and read logs/throughput-governor.jsonl for the binding evidence"

  beat-freshness:
    section: "0z4a"
    title: "beat freshness — containment or the reviewed one-shot scheduler must match its pinned immutable runtime"
    gate: LIMEN_BEAT_FRESHNESS
    default: "1"
    source: [metabolize, heartbeat]
    owner: substrate
    # The legacy KeepAlive loop could execute stale code indefinitely. Its successor is loaded
    # but not resident: launchd invokes one immutable merged runtime, one due read-only probe
    # runs inside hard resource ceilings, and the process exits. The predicate also accepts the
    # zero-runtime containment state while a reviewed exact head is not yet activated.
    cadence:
      env: LIMEN_BEAT_FRESHNESS_CADENCE
      default: 4
    timeout:
      env: LIMEN_BEAT_FRESHNESS_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/check-beat-freshness.py"
        severity: advisory
        escalation: "run `domus-limen-runtime verify-heartbeat`; if the contract or runtime digest is not exact, use `retire-heartbeat` and reactivate only from a reviewed plan hash"

  live-checkout-currency:
    section: "0z4b"
    title: "live-checkout currency — the tree the beat executes must be origin/main, and the answer must persist"
    gate: LIMEN_LIVE_CHECKOUT_CURRENCY
    default: "1"
    source: [metabolize, heartbeat]
    owner: substrate
    # beat-freshness's sibling one layer out: that one asks "is the running DAEMON newer than its
    # loop body", this one asks "is the CODE ON DISK what origin/main holds". Both are staleness;
    # only together do they mean the fleet runs what was merged.
    #
    # check-live-checkout.py existed since 2026-07-29 and was reachable ONLY from the ideal-forms
    # probe — answering when run, needing a network ls-remote, leaving no artifact. So between runs
    # the answer existed nowhere, and no point-of-use consumer could afford to ask. That gap is the
    # 2026-08-07 incident in one line: the live checkout sat 36 commits behind, its copy of
    # fable-allotment.py predated the heal that gave the weekly Fable meter sight, and it therefore
    # rewrote logs/fable-allotment.json to `spent_pct 0.0 / over_cap false` EVERY BEAT while the
    # true figure was 75.47% / over_cap true. Both Fable brakes released; ~50% of the weekly
    # allotment burned in two days with no downgrade and no warning.
    #
    # The load-bearing correction: the meter file was FRESH and WRONG. Any age bound on it passes
    # on this incident, because the stale party was the writer's code, not the artifact. So the
    # cure is not another freshness alarm — it is that the run now writes an OFFLINE receipt
    # (logs/live-checkout-currency.json) which guards read with no network and no git, so
    # "was the deployed tree current when this artifact was written?" becomes answerable at the
    # point of use. Advisory by severity, load-bearing by consumption.
    cadence:
      env: LIMEN_LIVE_CHECKOUT_CADENCE
      default: 4
    timeout:
      env: LIMEN_LIVE_CHECKOUT_TIMEOUT
      default: 90
    steps:
      - command: "python3 scripts/check-live-checkout.py"
        severity: advisory
        escalation: "the live checkout is not origin/main — the fleet is executing stale code and every beat-written artifact it produces is suspect; owner is scripts/sync-release.sh (the beat's unpark rung), never a hand fast-forward of a daemon-contended tree"

  session-opening-floor:
    section: "0e3"
    title: "session-opening floors — every interactive lane opens at or below its declared cadence ceiling"
    gate: LIMEN_SESSION_OPENING_FLOOR
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The operator's own framing: "all providers, not just Claude." Every vendor with an
    # interactive surface has an opening default pinned in its own file, and until 2026-08-07
    # nothing in the estate could say what any of them were — the Claude cadence had three
    # enforcement layers while codex sat at `ultra` effort and gemini declared no model at all,
    # both facts reachable only by hand.
    #
    # Rows derive from census.OPENING_FLOORS and are completeness-checked against census.VENDORS,
    # so a new lane lands as a RED UNDECLARED row rather than inheriting "no cadence applies".
    # Dispatch is on OpeningFloor.kind, never on a vendor name.
    #
    # Advisory because the remedy is operator-owned config in his home directory (lever
    # L-LANE-OPENING-FLOOR, issue #2000) — an agent reports these, never writes them, the same
    # boundary that keeps L-FABLE-GUARD-ARM a human lever. --check treats a cited breach as PARKED
    # and fails only on an uncited one or an undeclared vendor.
    cadence:
      env: LIMEN_SESSION_OPENING_FLOOR_CADENCE
      default: 12
    timeout:
      env: LIMEN_SESSION_OPENING_FLOOR_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/session-opening-floor.py --check"
        severity: advisory
        escalation: "a lane opens above its declared cadence ceiling with no lever citing it, or a vendor has no OPENING_FLOORS row — lower the pin, raise the declared ceiling, or file it (his-hand-levers.json L-LANE-OPENING-FLOOR)"

  estate-repos:
    section: "0z10"
    title: "estate repos — remote-first enumeration of every owned repo, projected into the hot cache"
    gate: LIMEN_ESTATE_REPOS
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # GitHub is the durable authority on what the estate owns (300+ repos across the owner
    # accounts); the local cache (logs/estate-repos.json, limen.estate_repos.v1) is a
    # skeleton-thin TTL'd projection of that answer, and the work-loan backfill's membership
    # bar derives from it — never from a hand-maintained repo list. The refresher is its own
    # cheap due-check: inside the TTL (LIMEN_ESTATE_CACHE_TTL_HOURS, 24h) it prints `fresh`
    # and exits 0, so the hourly metabolize pass costs two gh calls at most once a day.
    # Fail-closed on partial truth: any owner listing failure leaves the old cache untouched
    # (a half-estate would silently refuse every repo under the missing owner).
    steps:
      - command: "python3 scripts/estate-repos-refresh.py"
        severity: advisory
        escalation: "estate enumeration failed — gh cannot list an owner account, so supply underwriting is narrowed to the value-tier registry until the cache refreshes (check gh auth status)"

  work-loan-backfill:
    section: "0z8"
    title: "work-loan backfill — loan-less open tasks become dispatchable packets, refusals counted"
    gate: LIMEN_WORK_LOAN_BACKFILL
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The candidate-starvation cut of the 07-19 starvation: 738/829 open tasks (89%) fail
    # WorkLoanV1 readiness, so an open valve found ~8 jules candidates. This organ derives
    # the missing loan fields mechanically under a remote-first membership bar: the estate
    # itself (the estate-repos hot cache) admits any live owned repo, and
    # docs/repo-predicates.yaml carries only per-repo overrides + value-tier standing.
    # (Registry-only first census: 168 mintable, 520 refused — most on the hand-list
    # membership clause the estate derivation dissolves.) Enrichments land as
    # preconditioned TABVLARIVS tickets — never a direct board write. Batch-capped 25/run
    # through the single-writer queue. Gauge-only until the apply valve arms: review one
    # dry-run census first.
    steps:
      - command: "python3 scripts/work-loan-backfill.py"
        args_when:
          # DISARMED by default (unlike jules-supply): enrichment rewrites 700+ real rows'
          # loan fields, so the first armed run follows a reviewed dry-run census, then
          # LIMEN_WORK_LOAN_BACKFILL_APPLY=1 makes it autonomous.
          - env: LIMEN_WORK_LOAN_BACKFILL_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: deliverable
        severity: advisory
        escalation: "loan-less board tasks exist and minting is unarmed or refused — review the census in logs/work-loan-backfill.jsonl; the estate hot cache is the membership bar and docs/repo-predicates.yaml holds the overrides"

  jules-dispatch:
    section: "0z5"
    title: "jules dispatch valve rung — the beat's governed path to the serial engine"
    gate: LIMEN_JULES_DISPATCH
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # The 2026-07-19 -> 08-06 starvation's wiring cut: the only `limen dispatch --live` call
    # sites (metabolize.sh 4b, saturate.sh) had no scheduler, so zero autonomous dispatch
    # existed. This rung is the declared caller: dispatch-beat.py gates SOLELY on
    # `autonomy-governor.py dispatch-ok` (logs/autonomy-policy.json is the single valve —
    # LIMEN_DISPATCH stays the his-hand lever for MANUAL metabolize/saturate runs), throttles
    # itself to one pass per LIMEN_DISPATCH_BEAT_MIN_SECS, and runs the serial engine for
    # jules only (remote lane, no local load on the 16GB host). Volume is bounded three
    # deep: per-pass limit, per_agent.jules=100 board cap, and the throughput governor's
    # landed-evidence clamp. Cite: docs/plans/2026-08-06-jules-flywheel.md (issue #1874).
    timeout:
      env: LIMEN_DISPATCH_BEAT_TIMEOUT
      default: 900
    steps:
      - command: "python3 scripts/dispatch-beat.py"
        severity: advisory
        armed_valve_type: deliverable
        escalation: "the jules dispatch rung failed — read its tail in the beat log; the valve is logs/autonomy-policy.json via autonomy-governor.py dispatch-ok, the engine is `python3 -m limen dispatch --agent jules --live`"

  capacity-fill-refresh:
    section: "0z6"
    title: "capacity-fill receipt refresh — the down-lane gate reads live data, not fossils"
    gate: LIMEN_CAPACITY_FILL_REFRESH
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # docs/capacity-fill.md sat frozen at its 2026-07-10 generation ("jules exhausted
    # 109/100") for 27 days because nothing regenerated it — and stale depletion receipts
    # are what the down-lane gating reads. Regenerate on the metabolize pass.
    cadence:
      env: LIMEN_BEAT_CAPACITY_FILL
      default: 4
    timeout:
      env: LIMEN_CAPACITY_FILL_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/capacity-fill-ledger.py --write"
        severity: silent
        escalation: "capacity-fill ledger refresh failed — docs/capacity-fill.md goes stale and lane gating reads fossil depletion data"

  dispatch-health-refresh:
    section: "0z7"
    title: "dispatch-health receipt refresh — the health receipt tracks the live loop"
    gate: LIMEN_DISPATCH_HEALTH_REFRESH
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # Sibling of capacity-fill-refresh: docs/dispatch-health.md froze 2026-07-10 with
    # "jules in async skipped down lanes" and was never regenerated.
    cadence:
      env: LIMEN_BEAT_DISPATCH_HEALTH
      default: 8
    timeout:
      env: LIMEN_DISPATCH_HEALTH_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/dispatch-health.py --write"
        severity: silent
        escalation: "dispatch-health receipt refresh failed — docs/dispatch-health.md goes stale"
  jules-flywheel:
    section: "0z9"
    title: "the flywheel predicate — exit 0 ⟺ quota consumed AND landing holds AND debt non-increasing"
    gate: LIMEN_JULES_FLYWHEEL
    default: "1"
    source: [metabolize]
    owner: arms-agents
    # THE acceptance predicate of the jules-flywheel program (issue #1874, plan
    # docs/plans/2026-08-06-jules-flywheel.md): one exit code answering "is the compound
    # loop turning?". Three clauses, each red naming its owning effector: quota
    # (dispatched_today vs 0.8 x target, judged after the alarm hour), landing
    # (landed/dispatched over the throughput window vs LIMEN_FLYWHEEL_LAND_FLOOR, skipped
    # below the governor's bootstrap_min — never alarm on the permitted ramp), debt
    # (jules open-PR count non-increasing vs logs/jules-pr-debt-snapshot.json; fail-open
    # when gh is unavailable). Read-only except its own snapshot.
    timeout:
      env: LIMEN_JULES_FLYWHEEL_TIMEOUT
      default: 120
    steps:
      - command: "python3 scripts/jules-flywheel.py"
        severity: advisory
        escalation: "the flywheel is not turning — the failing clause names its owner in the output: quota -> supply/valve organs, landing -> jules-land/owner-route-drain/merge-drain, debt -> owner-route-drain"

  funnel-integrity:
    section: 0z3
    title: "application funnel honesty — the funnel claims nothing it cannot evidence"
    gate: LIMEN_FUNNEL_INTEGRITY
    default: "1"
    source: [metabolize]
    owner: mail
    # On 2026-08-04/05 the funnel recorded SIMULATED job applications as provider-CONFIRMED ones
    # against six real employers, and separately drove an agent through a 27h32m retry loop whose
    # exit condition was unreachable by construction. NEITHER announced itself: every stage exited
    # 0, and the fabricated receipts were schema-valid DeliveryReceiptV1 rows — the only tell was
    # that the "evidence" was the entry's own id and the provider response said "simulated".
    #
    # A defect that survives schema validation and exits 0 is not caught by the next reader being
    # careful. The predicate asserts it every beat instead. Read-only and idempotent; the root
    # cause it watches hardest is a live application-pipeline checkout parked behind main, which is
    # where every fabricated record in that incident came from.
    # Full record: docs/plans/2026-08-05-application-funnel-healing.md
    steps:
      - command: "bash scripts/funnel-integrity.sh"
        severity: advisory
        escalation: "Application funnel integrity FAILED — a confirmation without provider evidence, corrupt funnel state, or an application-pipeline checkout parked off main (the 2026-08-05 fabrication cause). Run `bash scripts/funnel-integrity.sh` bare for the failing invariant"

  decorum:
    section: "heartbeat"
    title: "professionalization keeper — no public surface is currently egg-faced"
    gate: LIMEN_DECORUM
    default: "1"
    source: [heartbeat]
    owner: decorum
    cadence:
      env: LIMEN_BEAT_DECORUM
      default: 6
    timeout:
      env: LIMEN_DECORUM_TIMEOUT
      default: 120
    # DECORVM federates the estate's six quality organs (experience/visual/seo/countenance/links/moat)
    # into ONE verdict at logs/decorum.json + logs/decorum.html. Departments + the severity floor are
    # declared data in institutio/governance/decorum-surfaces.yaml (derive-never-pin); an unmeasured
    # department is skipped fail-open, never failed. Ships default-on but READ-ONLY — the effector that
    # files tasks/issues from findings is a separate gate (LIMEN_DECORUM_APPLY), dry-run until armed.
    steps:
      - command: "python3 scripts/decorum-keeper.py --sweep"
        args_when:
          - env: LIMEN_DECORUM_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: deliverable
        severity: advisory
        escalation: "DECORVM found a public egg-face — see logs/decorum.json (blocking finding at/above floor 'high')"
    omega_eligible:
      - label: "keeper wiring self-test (registry + schema valid)"
        rung_id: sensor.decorum.self-test
        tier: det
        command: "python3 scripts/decorum-keeper.py --doctor"
        semantic_inputs:
          - {path: scripts/decorum-keeper.py, normalization: raw}

  ideal-forms-distance:
    section: "heartbeat"
    title: "ideal-forms distance — every named ideal's distance is re-derived, not remembered"
    gate: LIMEN_IDEAL_FORMS
    default: "1"
    source: [heartbeat]
    owner: governance
    cadence:
      env: LIMEN_BEAT_IDEAL_FORMS
      default: 12
    timeout:
      env: LIMEN_IDEAL_FORMS_TIMEOUT
      default: 300
    # The heartbeat half of IF-LEDGER-OF-IDEALS. pr-gate already runs check-ideal-forms on any
    # PR that touches the registry or the ledger — but the distances measure the SYSTEM, not the
    # diff, so they rot without anyone editing either file. That is precisely how the ledger sat
    # 34 days with its own entry reading "not yet wired into a verification/heartbeat lane" while
    # IF-LIVE-TREE-COHERENCE drifted 5x underneath it.
    #
    # --measure (not the bare gate) is deliberate: it additionally runs the `host` and `network`
    # probes that pr-gate cannot, which is the entire reason a beat rung exists. The live-checkout
    # probe is one of them, so the beat is where a frozen fleet checkout finally becomes audible —
    # the six-day freeze of 2026-07-23 was invisible because sync-release.sh fails OPEN into a log
    # nothing reads.
    #
    # Advisory, never fatal: a distance that remains is the normal state of an ideal (that is what
    # makes the ledger liquid rather than a checkbox). Only registry INCOHERENCE is drift, and
    # pr-gate already fails on that.
    steps:
      - command: "python3 scripts/check-ideal-forms.py --measure"
        severity: advisory
        escalation: "an ideal-form distance changed or a probe went unmeasurable (above) — re-derive with `python3 scripts/check-ideal-forms.py --measure`; do NOT hand-edit a Distance: line in docs/IDEAL-FORMS-LEDGER.md"

  hot-cache:
    section: "heartbeat"
    title: "hot flash cache — the machine is disposable (every byte re-summonable from upstream)"
    gate: LIMEN_HOTCACHE_CHECK
    default: "1"
    source: [heartbeat]
    owner: continuity
    cadence:
      env: LIMEN_BEAT_HOTCACHE
      default: 24
    timeout:
      env: LIMEN_HOTCACHE_TIMEOUT
      default: 300
    # The Meeseeks law's court (plan 2026-07-30): summoned surfaces must return their result to
    # source and self-erase, so the local floor is only ever a hot flash cache. The predicate walks
    # five rungs — spine (cartridge-connected), capture (chezmoi-drift), creds validity, toolchain
    # summonability (mise.toml), and every-clone-pushed — and lists each un-summonable state with
    # its owner. Advisory, never fatal: a red names debt (e.g. domus-genoma#359), it does not
    # break the beat. Daily cadence — disposability moves at human speed, not per-beat.
    steps:
      - command: "bash scripts/verify-hot-cache.sh"
        severity: advisory
        escalation: "machine is NOT disposable — un-summonable state above (each red names its owner/fix); run bash scripts/verify-hot-cache.sh"

  residue-census:
    section: "heartbeat"
    title: "residue census — what this machine holds that it should be able to re-summon"
    gate: LIMEN_RESIDUE_CENSUS
    default: "1"
    source: [heartbeat]
    owner: continuity
    cadence:
      env: LIMEN_BEAT_RESIDUE_CENSUS
      default: 24
    timeout:
      env: LIMEN_RESIDUE_CENSUS_TIMEOUT
      default: 180
    # The other half of the Meeseeks law. The hot-cache court (above) is honest about its own blind
    # spot — its R5 excludes worktrees and quarantines "by marker … never silent", because those
    # have their own reap organs — which left nothing measuring whether those organs KEEP UP. They
    # did not: 10 GiB of .agent-runtime whose reaper is written and wired to nothing, a 571 MiB
    # append-only ledger snapshot with no reaper at all, 1,616 remote branches behind an acceptance
    # ledger never once written to. This counts the pressure and names the owner of each class.
    # READ-ONLY: it deletes nothing and arms nothing. Deleting is the reapers' job (human-gated
    # where destructive); knowing was nobody's, which is why none of it was known.
    steps:
      - command: "python3 scripts/residue-census.py"
        severity: advisory
        escalation: "residue caps breached — this machine is holding state it should be able to re-summon; each breach names its owner (run python3 scripts/residue-census.py)"

  collaboration-hub-sync:
    section: "0g9c"
    title: "collaboration hub — refresh the registered denominator, encrypt new originals, reconcile immutable remote events, and verify custody"
    gate: LIMEN_COLLABORATION_HUB_SYNC
    default: "1"
    source: [heartbeat]
    owner: continuity
    cadence:
      env: LIMEN_BEAT_COLLABORATION_HUB_SYNC
      default: 48
    timeout:
      env: LIMEN_COLLABORATION_HUB_SYNC_TIMEOUT
      default: 900
    steps:
      - command: "bash scripts/collaboration-hub-sync.sh"
        severity: advisory
        escalation: "the owner-only collaboration vault did not reach its bounded discover → migrate → encrypted sync → verify fixed point; inspect its private receipt and credential wall without placing paths, keys, or client data in the board"

  arca-freshness:
    section: "5c1"
    title: "ARCA freshness — every private store's ciphertext actually EXISTS off-machine, not merely that the vault repo moved"
    gate: LIMEN_ARCA_FRESHNESS
    default: "1"
    source: [metabolize, heartbeat]
    owner: continuity
    # The observability sibling of the 5c backup rung, and the reason it exists: metabolize.sh runs
    # `arca.sh backup || echo "  (arca skipped …)"`. That `|| echo` is correct — the beat is fail-open
    # and a locked Keychain must not red it — but it makes a PERMANENTLY dead vault indistinguishable
    # from a momentarily locked one. Measured 2026-08-07: no backup since 2026-07-30, eight days of
    # skip lines, nothing red; the vault repo had outgrown its own `git clone` (>19 GB expanded).
    # This asserts the OUTCOME (ciphertext for each store exists off-machine) rather than the
    # mechanism, so it survives any later reshaping of the vault — new generation, remote, chunking.
    # "Cannot determine" is a FINDING, not a pass: undetermined is exactly the state that hid this.
    # RECENCY IS NOT COVERAGE (#2354, PREC-2026-08-12-custody-recency-is-not-coverage): the first cut
    # asked only "did the vault repo push recently?" and answered OK on beat 72 while
    # _collaboration-operations-private — 4.9 GB, over ARCA_MAX_MB, skipped every beat — had never
    # been sealed at all. A source-side "did it move?" is a different question from "does the target
    # hold what the source has NOW", and only the second one is custody. The sensor now joins each
    # store's store_hash against the manifest and graces from the SEAL, not from the change: these
    # stores take writes constantly, so a naive content-differs check would red permanently.
    # `never_sealed` gets no grace — there is nothing to be recently-fresh ABOUT.
    # POTESTAS 0.3 (#2089): the vault rotates across generations (organvm/arca → organvm/arca-g2 → …),
    # and the local manifest owns which is CURRENT. The sensor resolves the repo under test in order
    # --repo → $ARCA_REPO → manifest `_generation.repo` → organvm/arca, so it follows every rotation
    # with zero reconfiguration and escalates on the LIVE generation only.
    cadence:
      env: LIMEN_BEAT_ARCA_FRESHNESS
      default: 6
    timeout:
      env: LIMEN_ARCA_FRESHNESS_TIMEOUT
      default: 90
    steps:
      - command: "python3 scripts/arca-freshness.py"
        severity: advisory
        escalation: "a private store's current contents have no off-machine copy — the named store exists on ONE machine, and a store that was NEVER sealed has no off-machine copy at all (a vault repo pushing on schedule proves nothing about it: recency is not coverage); owner organvm/limen#2072 (vault shape), #719 L-ARCA-KEY-ESCROW (key escrow, still open, so a botched vault repair is unrecoverable)"

  diurnal:
    section: "0h"
    title: "diurnal — morning dashboard / midday check-in / evening close; the evening scores the morning's claims and cuts the sections that never earned their place"
    gate: LIMEN_DIURNAL
    default: "1"
    source: [fast-wave]
    owner: diurnal
    # The heartbeat's independent fast wave visits every declared sample cadence. True
    # time-of-day gating remains wall-clock inside the script (logs/diurnal/state.json,
    # one emission per phase per local calendar day), so visits before a phase is due are
    # cheap no-ops and a multi-hour slow main rung cannot delay the phase notification.
    cadence:
      env: LIMEN_BEAT_DIURNAL
      default: 1
    timeout:
      env: LIMEN_DIURNAL_TIMEOUT
      default: 240
    steps:
      - command: "python3 scripts/diurnal.py --phase auto"
        severity: advisory
        escalation: "diurnal emission failed — the day has no briefing; check that LIMEN_ROOT resolves to the LIVE organism (a worktree's logs/ is empty and the organ refuses to emit a false 'all quiet') and inspect logs/diurnal/state.json"

  notify-gate:
    section: "0h1"
    title: "notify gate — every copy of the notifier on this host gates osascript on the liveness predicate, not just the one in main"
    gate: LIMEN_NOTIFY_GATE
    default: "1"
    source: [heartbeat]
    owner: diurnal
    # The cross-tree half of the guard diurnal already carries in-tree. Measured 2026-08-05:
    # the effector gate shipped at 19:20 and four more "LIMEN · morning — ABSENT" pops landed
    # after it, because a fix in a versioned file cannot reach the OTHER copies of the notifier
    # on this host — 13 worktrees plus 7 rotated runtime install trees. A tree-local guard
    # cannot protect a host-global effector.
    #
    # It does not merely count them. The copies split by HOW THEY GET RUN, and that is the
    # whole finding: `~/.local/share/limen/current` is executed unattended by launchd every
    # 300s and was itself ungated with a 5-day-stale symlink, while the rest are inert unless
    # a test runs inside them. A scheduled executor gets its own stanza and the exact rotation
    # command; dormant copies ratchet against notify-ungated-baseline.txt so the count can only
    # shrink. Cheap: it parses ~23 small files.
    cadence:
      env: LIMEN_BEAT_NOTIFY_GATE
      default: 8
    timeout:
      env: LIMEN_NOTIFY_GATE_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/check-notify-gate.py"
        severity: advisory
        escalation: "a notifier copy reaches osascript ungated in a way the baseline does not already own — either the launchd-run install (~/.local/share/limen/current, which speaks on a timer and is cleared by `domus-limen-runtime install --sha <merged-main-sha>`) or a NEW copy that is not in institutio/governance/notify-ungated-baseline.txt. For a new one: rebase it onto origin/main so it inherits the gate, or reap it via python3 scripts/reclaim-worktrees.py; if it is legitimately known, record it with check-notify-gate.py --update. Gate-run tests cannot reach osascript regardless — run-pytest-hermetic.sh exports LIMEN_NOTIFY=0, which every copy on this host honors"

  exchange-guard:
    section: "heartbeat"
    title: "exchange detector — flags money moved inside a connected call window"
    gate: LIMEN_EXCHANGE_GUARD
    default: "1"
    source: [heartbeat]
    owner: governance
    cadence:
      env: LIMEN_BEAT_EXCHANGE_GUARD
      default: 24
    timeout:
      env: LIMEN_EXCHANGE_GUARD_TIMEOUT
      default: 300
    # DECISION: Ban `--detail` from the beat. The beat log is public, so amounts and timestamps
    # must not be emitted. A single pass/attention token (counts only) is the safe public signal.
    steps:
      - command: "python3 scripts/exchange-guard.py"
        severity: advisory
        escalation: "exchange detector found payments within connected call windows — run `python3 scripts/exchange-guard.py --detail` locally to review amounts and times safely"
  lever-classify:
    section: heartbeat
    title: "the lever-sovereignty sensor — verifies that every open lever in his-hand-levers.json is irreducible sovereignty, not automatable design debt parked on him"
    gate: LIMEN_LEVER_CLASSIFY
    default: "1"
    source: [heartbeat]
    owner: vigilia
    cadence:
      env: LIMEN_BEAT_LEVER_CLASSIFY
      default: 1
    timeout:
      env: LIMEN_LEVER_CLASSIFY_TIMEOUT
      default: 30
    steps:
      - name: check
        command: "python3 scripts/lever-classify.py --check"
        severity: advisory
        timeout: 30
        on_fail: escalate
        escalation: "unclassified open levers in his-hand-levers.json (see scripts/lever-classify.py --list)"

  covenant-attribution:
    section: "0r"
    title: "covenant — memory writes are keeper-attributed (no session leak)"
    gate: LIMEN_COVENANT_CHECK
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/covenant-attribution.py --check"
        severity: advisory
        escalation: "a memory atom/MEMORY.md changed with NO keeper receipt — a session wrote memory directly; route captures through the memoria lane (memory-ticket.py)"
