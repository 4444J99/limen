# SENSORS registry — the beat's continuous-runtime invariants, as declared data.
#
# The third axis of the VIGILIA spine: pre-merge is GATES (gates.yaml), configuration is PARAMETERS
# (parameters.yaml), and continuous-runtime is SENSORS (here). Before this file the beat sensors were
# 20 hand-wired `── 0x ──` shell blocks in metabolize.sh — check-params.py and armed-valve-audit.py had
# to GREP the shell to find their gates. Now they are one entry each: adding a sensor is one registry
# entry, and a drifted copy is a red check (check-sensors.py), not a memory chore.
# Same parameter-panel pattern as GATES, one domain over.
#
# Each sensor: the beat section it runs as, the gate env that toggles it (declared in parameters.yaml)
# and its default, which beat source(s) run it, an owner, and one or more steps. Scheduled sensors may
# declare cadence/timeout as ``{env, default}``; conditional argv lives in ``args_when``; fixed-point
# checks live in ``omega_eligible``; and a conditional behavior valve carries ``armed_valve_type``.
# These are capabilities, not special sensor names: consumers must work unchanged if an id is renamed.
# Each step is a command plus the exact escalation echoed on non-zero and its severity:
#   advisory  → `  ↑ <escalation>`  (surfaced with the ↑ marker; never breaks the beat)
#   silent    → `  (<escalation>)`  (quiet skip note; never breaks the beat)
#   fatal     → non-zero propagates and breaks the beat  (none today — the beat is fail-open)
# `when_env` on a step runs it only when that env var is truthy (nested conditionals in the shell).
#
# Consumers: metabolize.sh runs `scripts/beat-sensors.py --run --source metabolize` (the whole sensor
# loop derives from here — the hand-wired blocks are gone); check-params.py and armed-valve-audit.py read
# these gates from this registry instead of grepping the shell; omega.sh derives its registry-declared
# fixed-point rungs via `beat-sensors.py --list-omega`/`--run-omega` (the `omega_eligible` capability).
# Drift-check: scripts/check-sensors.py.

schema_version: 0.2

sensors:
  creds-hydrate:
    section: "0a"
    title: "hydrate credentials (1Password → ~/.limen.env → every lane; never re-login)"
    gate: LIMEN_CREDS_HYDRATE
    default: "1"
    source: [metabolize]
    owner: tabularius
    # This sensor WRITES ~/.limen.env (creds-hydrate --apply). reload_env re-sources it into the
    # runner's environment after this sensor's steps so every downstream sensor inherits the fresh
    # keys — the ordering metabolize.sh hard-codes as `set -a; . ~/.limen.env` right after block 0a,
    # now declared data instead of shell tribal knowledge.
    reload_env: "~/.limen.env"
    steps:
      - command: "python3 scripts/creds-hydrate.py --apply"
        severity: silent
        escalation: "creds-hydrate skipped — op locked/absent"
      - command: "python3 scripts/creds-hydrate.py --verify"
        severity: advisory
        escalation: "DEAD credential(s) above — re-mint into the op:// item, then they self-heal next beat"

  creds-provision:
    section: "0a1"
    title: "CLAVIS — every required op-sourced secret is readable by the fleet service account"
    gate: LIMEN_CREDS_PROVISION
    default: "1"
    source: [metabolize]
    owner: tabularius
    # The PROVISIONING predicate, sibling of creds-hydrate's consumption. creds-hydrate --verify
    # catches a DEAD/absent materialized value; this catches the upstream cause — a secret sitting in
    # a vault the service account cannot read, so it never materializes at all. Read-only. Stays red
    # until the one-time `creds-provision bootstrap` homes every required secret in the SA-owned
    # automation vault; then green forever. See institutio/governance/credentials.yaml, Wall #320.
    steps:
      - command: "python3 scripts/creds-provision.py check"
        severity: advisory
        escalation: "a REQUIRED secret is not SA-readable — the estate is not SA-homed; run `creds-provision bootstrap` (one owner-op seed, Wall #320)"

  identity-verify:
    section: "0a2"
    title: "verify personal-fact atoms present (personal-facts registry; sibling of creds — atoms don't rotate)"
    gate: LIMEN_IDENTITY_VERIFY
    default: "1"
    source: [metabolize]
    owner: identity
    steps:
      - command: "python3 scripts/identity.py verify"
        severity: advisory
        escalation: "identity atoms missing/blank above — one-time populate (op hydrate or entry); see lever L-IDENTITY-POPULATE"

  mcp-auth-verify:
    section: "0b"
    title: "verify MCP connector consent (Lane B — surface lapsed claude.ai connectors in the log)"
    gate: LIMEN_MCP_VERIFY
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/mcp-auth-verify.py"
        severity: advisory
        escalation: "REQUIRED MCP connector(s) unauthenticated — pull L-IANVA-CLOUD (#263) to end the class"

  mcp-server-boot:
    section: "0b2"
    title: "verify local MCP servers boot (Lane A — every agent CLI's stdio servers actually start)"
    gate: LIMEN_MCP_BOOT_VERIFY
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/mcp-server-boot.py"
        args_when:
          - env: LIMEN_MCP_BOOT_HEAL
            equals: "1"
            args: ["--apply"]
            armed_valve_type: deliverable
        severity: advisory
        escalation: "configured MCP server failure above — follow its state-specific Cure: auth_needed uses `codex mcp login <name>` for OAuth or populates the named bearer environment through the credential organ; auth_unknown restores `codex mcp list --json` telemetry; only unreachable/boot_failed arms LIMEN_MCP_BOOT_HEAL=1. An empty ianva registry remains a registry decision (`ianva add-upstream`). Ω = scripts/verify-mcp-estate.sh"
    # Fixed-point rung (Phase C, promoted once the estate went green 2026-07-18): the whole-estate
    # predicate — every configured MCP server boots + ianva doorway ≥1 upstream + no placeholder
    # secret. live tier: runs on the host/beat, SKIPs cleanly under omega.sh --offline (CI has no
    # agent configs). No det rung — the predicate has no offline/parity mode; it fail-opens where a
    # component is absent, so a bare CI host is green by construction.
    omega_eligible:
      - label: "MCP estate — servers boot + doorway + ownership"
        rung_id: sensor.mcp.estate
        tier: live
        command: "bash scripts/verify-mcp-estate.sh --strict"
        semantic_inputs:
          - {path: scripts/verify-mcp-estate.sh, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.mcp.estate.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  cartridge-connected:
    section: "0c"
    title: "verify the cartridge is plugged into the real source (host-is-factory invariant)"
    gate: LIMEN_CARTRIDGE_CHECK
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/cartridge-connected.py"
        severity: advisory
        escalation: "cartridge UNPLUGGED (above) — bring domus-genoma current, then re-point chezmoi at it"

  chezmoi-drift:
    section: "0c'"
    title: "verify config hydrates from the CURRENT cartridge (no wedge / no stale / no orphan)"
    gate: LIMEN_CHEZMOI_DRIFT_CHECK
    default: "1"
    source: [metabolize]
    owner: tabularius
    steps:
      - command: "python3 scripts/chezmoi-drift.py"
        severity: advisory
        escalation: "config is NOT hydrating from the current cartridge (above) — nothing is local; reconcile per the hint"

  enactment-audit:
    section: "0d"
    title: "verify enactment — every declared-ON fleet flag is actually LIVE (not just merged)"
    gate: LIMEN_ENACTMENT_CHECK
    default: "1"
    source: [metabolize, heartbeat]
    owner: tabularius
    steps:
      - command: "python3 scripts/enactment-audit.py --check"
        severity: advisory
        escalation: "un-enacted fleet flag above — repair its current on-demand or remote owner, then run `limen observe --once --scope host`; do not route side effects into the read-only scheduled heartbeat"

  github-estate-reconcile:
    section: "heartbeat"
    title: "reconcile the declared GitHub estate resource graph"
    gate: LIMEN_GITVS
    default: "1"
    source: [heartbeat]
    owner: gitvs
    cadence:
      env: LIMEN_BEAT_GITVS
      default: 8
    timeout:
      env: LIMEN_GITVS_TIMEOUT
      default: 120
    steps:
      - command: "python3 scripts/gitvs.py reconcile"
        args_when:
          - env: LIMEN_GITVS_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: safety
        severity: silent
        escalation: "GitHub estate reconciliation skipped or exceeded its bound"
    omega_eligible:
      - label: "GitHub estate parity"
        rung_id: sensor.github.parity
        tier: det
        command: "python3 scripts/gitvs.py doctor --offline --parity-only"
        semantic_inputs:
          - {path: scripts/gitvs.py, normalization: raw}
      - label: "GitHub estate posture"
        rung_id: sensor.github.posture
        tier: live
        command: "python3 scripts/gitvs.py doctor --strict"
        semantic_inputs:
          - {path: scripts/gitvs.py, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.github.posture.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  github-pr-debt:
    section: "heartbeat"
    title: "record the estate's open-PR debt observation (the series IF-AMALGAMATION reads)"
    gate: LIMEN_PR_DEBT_RECORD
    default: "1"
    source: [heartbeat]
    owner: gitvs
    # THE PRODUCER THAT WAS NEVER WIRED. scripts/pr-debt-trend.py --check is IF-AMALGAMATION's probe
    # and it read STALE for eleven days, because the thing that writes its ledger — gitvs pr-debt —
    # was attached to no sensor, no gate and no beat rung. Every observation in the series is a side
    # effect of an unrelated feature PR (#1337, #1503, #1508, #1495, #1541) that happened to
    # regenerate the file; when that work stopped, the series stopped, and a debt trend nobody
    # records reads as a debt trend that improved. This rung is the recorder.
    #
    # Note the cadence is a CHEAP due-check, not the census. The beat is adaptive (120s…1800s), so
    # `cadence: 12` is anywhere from 24 minutes to 6 hours of wall-clock — far too often for a full
    # paginated open-PR sweep of the estate. --record owns its own wall-clock interval
    # (LIMEN_PR_DEBT_RECORD_INTERVAL_HOURS, default 20h, inside the probe's 3-day staleness
    # tolerance with two missed runs of margin) and no-ops until it is due. It also ships nothing
    # when the census is unchanged, so it cannot add to the debt it measures.
    cadence:
      env: LIMEN_BEAT_PR_DEBT
      default: 12
    timeout:
      env: LIMEN_PR_DEBT_RECORD_TIMEOUT
      default: 900
    steps:
      - command: "python3 scripts/pr-debt-trend.py --record"
        severity: advisory
        escalation: "the open-PR debt observation was not recorded — IF-AMALGAMATION's series goes stale at 3d and its probe fails on the silence itself (scripts/pr-debt-trend.py --check)"

  ships-24h-refresh:
    section: "heartbeat"
    title: "record the ground-truth 24h ships count (self-merges + drain-merges, all owners)"
    gate: LIMEN_SHIPS_24H_REFRESH
    default: "1"
    source: [heartbeat]
    owner: money-view
    # money-view.py / omni-view.py used to count "PRs shipped in the last 24h" by grep-parsing
    # logs/merge-drain.log — written ONLY by the batch merge-drain.py daemon's own merges. Sessions
    # that self-merge their own green PRs directly (merge-policy.sh -> await-pr.sh --merge, the
    # documented normal path) never touch that log, so the count structurally missed most of the
    # fleet's real throughput and notify-events.py's ship-milestone push (10/25/50/100 in 24h)
    # could never fire from real activity. Measured 2026-08-15: merge-drain.log read merged=0 on
    # every beat all day while gh showed 63 real merges. This rung queries GitHub directly and
    # caches the answer so the view scripts stay pure local-file readers.
    #
    # Cheap due-check, not the census — same shape as github-pr-debt above. ships-24h-refresh.py
    # owns its own wall-clock interval (LIMEN_SHIPS_24H_REFRESH_INTERVAL_MINUTES, default 20m) and
    # no-ops until due.
    cadence:
      env: LIMEN_BEAT_SHIPS_24H
      default: 4
    timeout:
      env: LIMEN_SHIPS_24H_REFRESH_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/ships-24h-refresh.py"
        severity: advisory
        escalation: "ships-24h cache did not refresh — money-view/omni-view/notify-events fall back to 0 ships"

  github-pr-autotype:
    section: "heartbeat"
    title: "auto-type newly-arrived mechanical PRs lifecycle:blocked (fail-closed) so the estate predicate cannot rebound at arrival rate"
    gate: LIMEN_PR_AUTOTYPE
    default: "1"
    source: [heartbeat]
    owner: gitvs
    # THE LOOP-CLOSER FOR THE ONE-SHOT DRAIN. The estate drain typed 283 PRs to zero and
    # gitvs.py pr-debt --check rebounded 0→2 within the hour, because arrivals (dependabot)
    # had no continuous typing rung. SCOPE IS THE PREDICATE'S SCOPE: the rung derives its
    # owner set from the same estate authority gitvs.py uses (10 governed owners), never the
    # two-owner literal the sibling drains carry — 61% of the open dependabot stream lives in
    # the shelf orgs, so a narrower scope would deliver a fraction of the contract while
    # printing a confident cohort=0. CHEAP by construction — the negated-label search returns
    # only the untyped mechanical residual (normally empty) plus per-item pr views, so the
    # cadence IS the throttle and no script-owned wall-clock interval is needed (contrast
    # github-pr-debt's 20h guard on the fully paginated census). Dry-run until the deliverable
    # valve is armed (lever L-PR-AUTOTYPE-ARM); receipts either way to
    # logs/pr-lifecycle-autotype.jsonl. Human-authored arrivals are counted, never typed.
    # No collision with L-DEPENDABOT-DELIVERY-ARM (#1947): blocked is the same fail-closed
    # default the drain applied; the delivery upgrade stays that separate human lever.
    cadence:
      env: LIMEN_BEAT_PR_AUTOTYPE
      default: 4
    timeout:
      env: LIMEN_PR_AUTOTYPE_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/pr-lifecycle-autotype.py"
        args_when:
          - env: LIMEN_PR_AUTOTYPE_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: deliverable
        severity: advisory
        escalation: "the arrival auto-typing rung did not run — newly-arrived mechanical PRs accumulate untyped and gitvs.py pr-debt --check rebounds red at arrival rate"

  github-estate-census:
    section: "heartbeat"
    title: "record the estate-wide issue/branch/check census (the fleet-debt register's second axis)"
    gate: LIMEN_ESTATE_CENSUS_RECORD
    default: "1"
    source: [heartbeat]
    owner: gitvs
    # THE OTHER HALF OF THE FLEET-DEBT REGISTER. github-pr-debt records the open-PR series;
    # this rung records the open-issue / branch / check census the same script family produces —
    # docs/github-estate-census.json had exactly one observation (2026-07-22) because, like the
    # PR ledger before its recorder, it was attached to no sensor and refreshed only as a side
    # effect of feature work. Same shape as github-pr-debt: the cadence is a CHEAP due-check,
    # --record owns its own wall-clock interval (LIMEN_ESTATE_CENSUS_RECORD_INTERVAL_HOURS,
    # default 24h), ships through ship-docs only when the stable digest moves, and restores the
    # tracked ledger otherwise so the live checkout never carries a clock-only dirty file.
    cadence:
      env: LIMEN_BEAT_ESTATE_CENSUS
      default: 12
    timeout:
      env: LIMEN_ESTATE_CENSUS_RECORD_TIMEOUT
      default: 1800
    steps:
      - command: "python3 scripts/github-estate-census.py --record"
        severity: advisory
        escalation: "the estate census observation was not recorded — docs/github-estate-census.json goes stale and the fleet-debt register loses its issue/branch axis (run python3 scripts/github-estate-census.py --record)"

  session-contention-ship:
    section: "heartbeat"
    title: "promote recorded session-contention incidents into the committed ledger"
    gate: LIMEN_SESSION_CONTENTION_SHIP
    default: "1"
    source: [heartbeat]
    owner: substrate
    # The durability half of IF-SESSION-NON-CONTENTION's receipt. sync-release.sh records an
    # incident LOCALLY the moment it declines to rewrite an occupied tree — that write must be
    # instant and fail-open, because it happens inside the beat and must never be able to stop it.
    # Promotion to the committed ledger is a git operation: slow, fallible, and safely retried.
    # Splitting them is also what keeps the recorder from fighting the daemon for the very tree it
    # is guarding — sync-release.sh's whole job is to keep the live checkout clean, so it cannot be
    # the thing that commits into it.
    #
    # A no-op when nothing was recorded, which is the expected steady state: the ideal is that this
    # rung never has anything to ship.
    cadence:
      env: LIMEN_BEAT_SESSION_CONTENTION
      default: 12
    timeout:
      env: LIMEN_SESSION_CONTENTION_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/session-contention.py ship"
        severity: advisory
        escalation: "a session-contention incident was recorded but could not be promoted to the committed ledger — the fleet rewrote a tree a live session was working in and the evidence is still local-only (logs/session-contention.jsonl); IF-SESSION-NON-CONTENTION counts unshipped incidents, so its probe already reports the distance"

  github-publish-sweep:
    section: "heartbeat"
    title: "keep every publish candidate's pre-publication sweep receipt green and fresh"
    gate: LIMEN_PUBLISH_SWEEP
    default: "1"
    source: [heartbeat]
    owner: gitvs
    # The receipt is the ONLY thing that authorizes a private→public flip, and it expires
    # (LIMEN_SWEEP_FRESH_DAYS, default 7). Until 2026-07-30 nothing re-ran the sweep: receipts were
    # minted by hand, went stale in a week, and apply-visibility then had no verdict for any
    # candidate — a predicate with no organ behind it, which is a permanently-un-adjudicated rung
    # rather than a green one. Bounded per run (LIMEN_SWEEP_MAX), so the candidate set rolls
    # forward across beats instead of cloning the whole estate every cadence.
    cadence:
      env: LIMEN_BEAT_PUBLISH_SWEEP
      default: 24
    timeout:
      env: LIMEN_PUBLISH_SWEEP_TIMEOUT
      default: 900
    steps:
      - command: "python3 scripts/publish-sweep.py --candidates"
        severity: advisory
        escalation: "a publish candidate's sweep is RED or un-run — apply-visibility will hold its flip (and demote it if it is already live public)"

  github-actions-usage:
    section: "heartbeat"
    title: "Actions spend telemetry — projected Actions net within budget plus runner-admission observation"
    gate: LIMEN_GH_USAGE
    default: "1"
    source: [heartbeat]
    owner: gitvs
    cadence:
      env: LIMEN_BEAT_GH_USAGE
      default: 24
    timeout:
      env: LIMEN_GH_USAGE_TIMEOUT
      default: 120
    steps:
      - command: "python3 scripts/gitvs.py usage --check"
        severity: advisory
        escalation: "Actions spend is over budget or GitHub emitted a runner-admission annotation — read docs/github-actions-usage.json; the annotation alone proves neither account cause nor remediation"
    omega_eligible:
      - label: "GitHub Actions budget"
        rung_id: sensor.github.actions-budget
        tier: live
        command: "python3 scripts/gitvs.py usage --check --strict"
        semantic_inputs:
          - {path: scripts/gitvs.py, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.github.actions-budget.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  plans-lifecycle:
    section: "heartbeat"
    title: "plans-lifecycle — the drain docs/plans + per-agent scratch corpora never had: census -> stale report -> bounded archival (dry until armed)"
    gate: LIMEN_PLANS_LIFECYCLE
    default: "1"
    source: [heartbeat]
    owner: lifecycle
    cadence:
      env: LIMEN_BEAT_PLANS_LIFECYCLE
      default: 24
    timeout:
      env: LIMEN_PLANS_LIFECYCLE_TIMEOUT
      default: 60
    steps:
      - command: "python3 scripts/plans-lifecycle-audit.py"
        args_when:
          - env: LIMEN_PLANS_LIFECYCLE_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: safety
        severity: silent
        escalation: "plans-lifecycle audit skipped or exceeded its bound"

  seo-drift:
    section: "heartbeat"
    title: "SEO drift — public-portal surface: audit sweep -> metadata drift check -> bounded task filing (dry until armed)"
    gate: LIMEN_SEO_DRIFT
    default: "1"
    source: [heartbeat]
    owner: gitvs
    cadence:
      env: LIMEN_BEAT_SEO
      default: 24
    timeout:
      env: LIMEN_SEO_TIMEOUT
      default: 300
    steps:
      - command: "python3 scripts/seo-audit.py --sweep"
        quiet_output: true
        severity: silent
        escalation: "seo audit sweep skipped or exceeded its bound"
      - command: "python3 scripts/repo-metadata-sync.py --check"
        severity: advisory
        escalation: "repo metadata drift above — the effector converges it once lever L-SEO-METADATA arms LIMEN_REPO_METADATA_APPLY=1 (rides the github-estate-reconcile beat)"
      - command: "python3 scripts/generate-seo-backlog.py"
        args_when:
          - env: LIMEN_SEO_BACKLOG_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: safety
        severity: silent
        escalation: "seo backlog generation skipped or exceeded its bound"
    omega_eligible:
      - label: "seo registry parity"
        rung_id: sensor.seo.parity
        tier: det
        command: "python3 scripts/seo-audit.py --doctor"
        semantic_inputs:
          - {path: scripts/seo-audit.py, normalization: raw}
      - label: "seo estate posture"
        rung_id: sensor.seo.posture
        tier: live
        command: "python3 scripts/seo-audit.py --check --strict"
        semantic_inputs:
          - {path: scripts/seo-audit.py, normalization: raw}
          - {path: logs/omega-owner-receipts/sensor.seo.posture.json, normalization: json, volatile_fields: [observed_at], role: owner_receipt, max_age_seconds: 3600}

  estate-audit-heal:
    section: "heartbeat"
    title: "estate audit-heal — the OTHER org repos' npm/pnpm audit CI must not sit red (verify-gated overrides fix PRs; dark until armed)"
    gate: LIMEN_ESTATE_AUDIT_HEAL
    default: "1"
    source: [heartbeat]
    owner: gitvs
    cadence:
      env: LIMEN_BEAT_ESTATE_AUDIT
      default: 24
    timeout:
      env: LIMEN_ESTATE_AUDIT_TIMEOUT
      default: 1200
    steps:
      - command: "python3 scripts/estate-audit-heal.py"
        severity: advisory
        escalation: "an org repo's npm/pnpm audit CI is red on a verify-fixable transitive advisory — the estate healer opens a verify-gated overrides fix PR (no auto-merge) once LIMEN_ESTATE_AUDIT_HEAL_APPLY=1 arms it (env lever, read internally; framework-major residue is deferred to Dependabot); until armed it is detection-only. Heavy (clones+installs); slow cadence + repo cap (LIMEN_ESTATE_AUDIT_MAX). See scripts/estate-audit-heal.py"

  estate-audit-posture:
    section: "heartbeat"
    title: "estate audit posture — the single rollup: whole-estate dependency-audit health in one line + one exit code"
    gate: LIMEN_ESTATE_AUDIT_POSTURE
    default: "1"
    source: [heartbeat]
    owner: gitvs
    cadence:
      env: LIMEN_BEAT_ESTATE_AUDIT_POSTURE
      default: 12
    timeout:
      env: LIMEN_ESTATE_AUDIT_POSTURE_TIMEOUT
      default: 480
    steps:
      - command: "python3 scripts/estate-audit-posture.py --check"
        severity: advisory
        escalation: "the estate dependency-audit posture is UNHEALTHY — a Tier-2 owner (Dependabot security-updates) is OFF on an audit-CI repo, so an advisory can rot unowned. dependabot-security-guard heals it once armed. Composes the three ownership organs (npm-audit-autofix + estate-audit-heal Tier-1 leaves as telemetry, dependabot-security-guard Tier-2 as the hard predicate); read-only, no arm. See scripts/estate-audit-posture.py"

  observatory-run:
    section: "heartbeat"
    title: "run the OBSERVATORY legibility-and-traction loop (ships dark; armed by L-OBSERVATORY-ACTIVATE)"
    gate: LIMEN_OBSERVATORY
    default: "0"
    source: [metabolize]
    owner: observatory
    cadence:
      env: LIMEN_BEAT_OBSERVATORY
      default: 24
    timeout:
      env: LIMEN_OBSERVATORY_TIMEOUT
      default: 480
    steps:
      - command: "python3 scripts/observatory-beat.py"
        args_when:
          - env: OBSERVATORY_APPLY
            default: "0"
            equals: "1"
            args: ["--apply"]
            armed_valve_type: safety
        severity: silent
        escalation: "OBSERVATORY loop skipped or exceeded its bound"
