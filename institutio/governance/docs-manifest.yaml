# DOCS-MANIFEST — every tracked top-level entry of docs/, DECLARED.
#
# docs/ is a curated surface, not a landing strip (the parameter-panel pattern, one surface
# below the repo root). scripts/check-root-manifest.py --surface docs holds the tracked docs/
# top level to this registry: an undeclared loose file is a red check, not a memory chore.
# `sanctioned` loose files are pinned by exact-path consumers (scripts/tests/registries/board);
# `grandfathered` rows are ADMITTED FAT carrying their target home — rehoming PRs delete the
# row together with the move (deleting the row IS the receipt) and this block only shrinks.
# Docs belong with their SUBJECT: a target_home may be cross-repo ("<org>/<repo>:<path>/") —
# limen keeps only limen-subject docs + machinery-consumed surfaces; whole-estate governance
# records live in organvm/portvs governance/records/, personal-office material in organvm/domus
# (private). Export receipts: docs/receipts/docs-estate-exports-*.jsonl.
# Founded on the measured defect: 177 loose files at docs/ top level beside 17 proper subdirs,
# accumulated with no predicate watching the surface (operator directive, repeated 3+ sessions).

