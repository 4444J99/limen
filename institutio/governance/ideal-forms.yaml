# IDEAL-FORMS registry — every named ideal form, with the COMMAND that measures its distance.
#
# The seventh axis of the VIGILIA spine: pre-merge is GATES (gates.yaml), configuration is
# PARAMETERS (parameters.yaml), continuous-runtime is SENSORS (sensors.yaml), corpora is
# CORPORA (corpora.yaml), capability-ownership is CONVERGENCE (convergence.yaml), atom
# landing is ATOM-HOMING (atom-homing.yaml) — and the ideals themselves are HERE.
#
# THE MEASURED DEFECT THIS CLOSES. docs/IDEAL-FORMS-LEDGER.md has carried 13 ideal forms
# since 2026-06-25, each with a hand-written "Distance:" paragraph, and its own self-entry
# (IF-LEDGER-OF-IDEALS) recorded the gap: "not yet wired into a verification/heartbeat lane."
# Thirty-four days later that was still true — scripts/metabolize.sh referenced the ledger
# only in a COMMENT. Hand-written distances decay silently, and two had:
#   IF-LIVE-TREE-COHERENCE  wrote "ahead 6 / behind 24"; measured 2026-07-29: ahead 1,
#                           BEHIND 120, frozen since 2026-07-23 — stale by 5x, and the
#                           freeze it describes went six days unseen because nothing looked.
#   IF-SHARED-SUBSTRATE     wrote "12 capabilities (6 converged, 4 lifting, 2 vacuums)";
#                           the registry holds 13 (7 converged, 5 lifting, 1 vacuum).
#
# THE RULE THAT PREVENTS THE RECURRENCE (the session-streams precedent, check-session-streams
# check F): **NO ROW MAY CARRY A DISTANCE OR A STATUS.** There is no field to lie in. A row
# carries the IDEAL and the PROBE; the distance is DERIVED at read time by running the probe,
# and `check-ideal-forms.py --measure` prints the live table. Updating a distance is a
# command, never an act of memory.
#
# PROBE CONTRACT. `probe: null` is legal and honest — but it REQUIRES `probe_absent_reason`,
# and check E counts those rows loudly (Rule #1: a vacuum is never a resting state). A probe
# declares:
#   command      the exact argv, run from the repo root
#   derives      what the number/exit means, in one phrase
#   environment  repo    — runnable anywhere the repo is (pr-gate runs these)
#                host    — needs the operator host (creds, ~/Workspace, live daemons)
#                network — needs GitHub/live services
#                self    — this predicate itself; declared to close the self-loop, NEVER
#                          executed (the cycle guard in check C)
#   and EXACTLY ONE of:
#     at_ideal_when: exit_zero        the probe's exit code IS the verdict
#     extract + ideal_value           a regex whose group 1 is the measurement, and the
#                                     value that measurement reaches at the ideal
#
# DERIVED STATUS (never written here; see check-ideal-forms.py --measure):
#   at-ideal          the probe reached ideal_value / exited 0
#   distance-remains  the probe ran and did not
#   unmeasured        probe: null, or environment unavailable here
#
# Prose lives in docs/IDEAL-FORMS-LEDGER.md, one `### <id>` heading per row (check B holds
# them in exact parity, both directions). Check D is the loop closing: a ledger heading whose
# prose **Status:** contradicts the derived measurement is DRIFT, not a stale note.

schema_version: 0.1

# Prose statuses the ledger is allowed to write. The doc's own field table listed
# OPEN/PARTIAL/BLOCKED(human)/SEEDED/CLOSED while its entries already used DONE and SHIPPED —
# the vocabulary had drifted from its own key. Declared here as the machine form.
prose_status_vocabulary:
  at_ideal: [DONE, SHIPPED, CLOSED]
  distance_remains: [OPEN, PARTIAL, SEEDED, "BLOCKED(human)"]

ideals:

  IF-FIRST-DOLLAR:
    ideal: >
      An executable first-dollar predicate that is green only when a real payment has cleared;
      the Exporter faucet open.
    owner: "Anthony (account mint + KYC) -> Claude (wire)"
    probe: null
    probe_absent_reason: >
      A cleared payment is not a repo fact. The Exporter (a-i-chat--exporter) and the payment
      rails (Ko-fi, Lemon Squeezy) are outside this tree, and no in-repo command can observe a
      settled transaction. MONETA's order ledger is the candidate measurement surface: when it
      records a confirmed on-chain receipt, that becomes this row's probe.

  IF-AMALGAMATION:
    ideal: >
      The fleet amalgamates portals faster than it spawns them; a predicate measures open-PR
      plus unmerged-branch debt and the merge daemon drives it monotonically down.
    owner: "Claude (predicate) + merge daemon"
    # The row carried `probe: null` with an exact reason: a monotonic TREND is not a level, and a
    # level is all one shot can measure — "a real probe needs a committed series." The series was
    # already committed. gitvs.py writes open_pr_count into docs/github-pr-debt-ledger.json and
    # every write is a commit, so five observations sat in `git log` for eleven days, unread.
    # scripts/pr-debt-trend.py reads them; nothing had to be built first.
    #
    # THE READER WAS ONLY HALF OF IT. The probe then read STALE for eleven more days, and the cause
    # was not that anyone stopped caring: there was never a producer. Every observation in the
    # series is a side effect of an unrelated feature PR that happened to regenerate the ledger
    # (#1337, #1503, #1508, #1495, #1541), so the series ended when that work did. `--record`
    # (2026-08-05) is the writer, wired as the `github-pr-debt` heartbeat sensor: it runs the
    # census on its own wall-clock interval, ships an observation through ship-docs.sh only when
    # content_sha256 moves, and therefore cannot add to the debt it measures.
    probe:
      command: "python3 scripts/pr-debt-trend.py --check"
      derives: >
        whether open-PR debt is falling across the committed series in git history of
        docs/github-pr-debt-ledger.json, AND whether anyone is still recording it — a series
        nobody writes is not a trend that improved.
      environment: host
      at_ideal_when: exit_zero

  IF-PUBLICATION-ESTATE:
    ideal: >
      The whole GitHub estate carries its publication policy as declared data — every repo
      classified with a why, visibility drift a red predicate, private->public flips
      history-swept and lever-gated, the public tail converging to an SEO standard. Zero
      unclassified, zero unswept flips, zero hand-maintained lists.
    owner: "GITVS + publication-policy organs; his hand for the three levers"
    probe: null
    probe_absent_reason: >
      The ideal has two halves and no single number spans them. The ENGINE half is already
      green and measurable (`publication-policy.py --census` reports convergence_failures: 0,
      `--verify` reports the matrix and classifier sound). The open half is ENACTMENT — armed
      valves (LIMEN_SEO_BACKLOG_APPLY), human levers (L-SEO-METADATA, L-PORTAL-PUBLISH-WAVE-1)
      and the owed repo splits — which is a state of the world, not a repo fact. A first draft
      of this row probed `--check`; that is a stamp-PRESENCE test which fails on a gitignored
      local artifact, so it reported distance for a reason unrelated to the ideal. Measuring
      the wrong question is worse than declaring the vacuum.

  IF-GUARD-FAIL-TOWARD-WARNING:
    ideal: >
      No safety guard in the estate can degrade toward "everything is fine". Every guard whose
      verdict gates a capability declares its degenerate inputs, and each one is EXECUTED against
      them: an input the guard cannot resolve must come back untrusted, never silently permissive.
      "I could not establish this" and "this is fine" are never the same value.
    owner: "Claude + the cadence guards"
    probe:
      command: "python3 scripts/check-guard-degradation.py"
      derives: "declared guards whose degenerate inputs return TRUSTED (findings), plus the declared population"
      environment: repo
      extract: "findings=([0-9]+)"
      ideal_value: 0
      # NOT `instantaneous`. This is a RATCHET, not a thermometer: the declared population is
      # grow-only (institutio/governance/guard-state-baseline.txt), so a green reading means "every
      # guard the estate has DECLARED degrades correctly", and the honest distance is the guards not
      # yet declared. The number therefore only improves by declaring more, never by measuring again.
      #
      # Provenance: four instances of one defect found in a single stack on 2026-08-07 — three
      # forked `dict | None` meter readers where None meant both "absent" and "distrusted"; a
      # session-model resolver returning "" so an unresolvable model took the cheap branch; an
      # undeployed guard printing superseded advice; an unarmed hook indistinguishable from a
      # silent one. Censor precedent PREC-2026-08-07-guard-degrades-toward-silence.
      #
      # The proofs are EXECUTED, never inspected, and that is the load-bearing choice:
      # verify-fable-gate.sh was green through the entire incident, all five blocks passing,
      # because the question it asked was answered correctly by a meter that was itself lying.

  IF-LIVE-TREE-COHERENCE:
    ideal: >
      The live daemon checkout is always identical to origin/main; capture/sync keeps it
      fast-forwarded; no ahead/behind divergence, no stranded local commits.
    owner: "Claude + the sync organ"
    probe:
      command: "python3 scripts/check-live-checkout.py"
      derives: "commits the live checkout is behind origin/main, plus unpushed and dirty state"
      environment: host
      extract: "drift=([0-9]+)"
      ideal_value: 0
      # A snapshot can prove DISTANCE but never ACHIEVEMENT: the ideal is "never drifts", and
      # one green reading says only "not drifted at this instant". So check D may fire when the
      # prose overstates, never when it lags — until a beat sensor keeps the reading continuous.
      instantaneous: true

  IF-HOT-CACHE:
    ideal: >
      The local floor holds nothing that is not re-summonable from upstream. Every summoned
      surface — worktree, agent runtime, scratch clone, session branch, fan-out agent — is born
      for one purpose, returns its result to source, and self-erases; losing the disk loses zero
      state. Residue is a defect caught by predicates, never a periodic cleanup chore.
    owner: "Claude + the reap organs (reclaim-worktrees / reap-branches / disk-capacity)"
    probe:
      command: "python3 scripts/residue-census.py"
      derives: "residue classes over their declared caps, each naming the organ or lever that relieves it"
      environment: host
      extract: "breaches=([0-9]+)"
      ideal_value: 0
      # Same caveat as IF-LIVE-TREE-COHERENCE, for the same reason: a snapshot proves DISTANCE,
      # never ACHIEVEMENT. "Nothing sprawls" is a claim about every moment; one green reading says
      # only that nothing sprawled at this instant. The daily residue-census sensor keeps the
      # reading current, but the rung stays instantaneous until it is continuous.
      instantaneous: true

  IF-SESSION-NON-CONTENTION:
    ideal: >
      An interactive session's cwd is an isolated, non-recycled worktree; the fleet never
      rebases or cleans the tree a live session is working in.
    owner: "Claude (worktree allocation / harness convention)"
    # The vacuum's reason was right — "contention is an event, not a state ... the measurable form
    # is a recorded incident count, which needs the daemon to emit a receipt when it rewrites an
    # occupied worktree" — and it named its own closure. session-contention.py is that receipt.
    #
    # But building it found the row's STATED distance stale. Of the three paths that can rewrite a
    # tree, two were already guarded: the dispatch allocator preserves an existing worktree and
    # retries under a fresh suffix (so the #276 mechanism this row has cited since 2026 can no
    # longer recur), and reclaim-worktrees.py is liveness-gated on its delete path. Only the LIVE
    # CHECKOUT was exposed, via sync-release.sh. Nobody re-derived the distance, so the row read
    # OPEN long after two thirds of it had closed — which is the argument for probes, made against
    # this ledger by this ledger.
    #
    # Distance sums EXPOSURE (paths that could rewrite unguarded — zero means it cannot happen)
    # and INCIDENTS (contention that did). `host`, not `repo`, because incidents recorded on the
    # operator host but not yet shipped must count: a probe blind to them would announce the ideal
    # achieved at exactly the moment it was being violated.
    probe:
      command: "python3 scripts/check-session-contention.py"
      derives: "unguarded tree-rewriting paths plus recorded contention incidents"
      environment: host
      extract: "contention distance: ([0-9]+)"
      ideal_value: 0

  IF-SENSOR-REGISTRY:
    ideal: >
      The beat's continuous-runtime sensors live in one registry and every consumer derives
      from it; adding a sensor is one registry entry, never a hand-wired shell block.
    owner: "Claude + tabularius"
    probe:
      command: "python3 scripts/check-sensors.py"
      derives: "registry<->beat<->consumer parity across the whole sensor estate"
      environment: repo
      at_ideal_when: exit_zero

  IF-MAIL:
    ideal: >
      Every reply-owed email is driven to answered autonomically — drafted, tiered, and (for
      the narrow SAFE tier, when armed) sent — with the tier decision as declared data. Legal,
      money and personal mail never auto-send.
    owner: "Claude + mail"
    probe:
      command: "python3 scripts/check-mail-answered.py"
      derives: "reply-owed mail still unanswered"
      environment: host
      at_ideal_when: exit_zero
      # Same caveat as IF-LIVE-TREE-COHERENCE and IF-HOT-CACHE, and it fired the same way: on
      # 2026-08-05 this probe read `reply_owed=5 drafted=5 undrafted=0` (exit 0) against a PARTIAL
      # prose status, and check D called the prose stale. It was not. The ideal is "EVERY reply-owed
      # email is driven to answered" — a claim about every moment and about the whole loop — while a
      # green reading says only that the inbox happened to be fully drafted at one instant; the next
      # message reopens the distance. Worse, the probe counts DRAFTS: it is structurally blind to the
      # residual the prose is actually reporting, which is that SAFE-tier sending ships DISARMED
      # (LIMEN_MAIL_SEND=0) and the tier is opt-in and empty. Promoting the prose to DONE here would
      # have claimed achievement from a snapshot and erased a real operator-valve distance — the
      # exact overstatement this flag exists to forbid. Distance may fire; achievement may not.
      instantaneous: true

  IF-CONFIG-OWNERSHIP:
    ideal: >
      A config-ownership constitution declares app/cartridge/SPLIT/operator per host config
      path; every abdication carries a declared owner; a parity predicate holds it in CI. An
      app can never silently destroy an owner atom, and a dead template can never hide behind
      its own ignore line.
    owner: "domus-genoma CI (parity) + lever L-CARTRIDGE-REPOINT (activation) + Claude (proof run)"
    probe: null
    probe_absent_reason: >
      The parity predicate (check-config-ownership.py, predicates A-F) lives in the OWNER repo
      organvm/domus-genoma, not here — correctly, since the constitution it checks lives there
      too. This row is measurable only by a cross-repo call, which is the ecosystem-layer
      promotion already tracked as IF-SENSOR-REGISTRY's follow-up.

  IF-NO-MODAL:
    ideal: >
      No approval question is ever asked for non-destructive work, in any lane, and the
      destructive boundary that remains is DERIVED and MEASURABLE rather than switched off.
      The trust hook is wired from the cartridge source, permissions.ask carries its five-rule
      fail-safe backstop, and permissions.autoMode.allow teaches the classifier the same trust
      boundary the hook enforces — so defaultMode stays "auto" and the gauge stays alive.
      bypassPermissions is explicitly NOT the ideal: it does not close the distance, it deletes
      the instrument (never-hang-permission-spec.md, R1/R4/R5 + Design-consequences-2).
    owner: "Anthony (arm the effector — classifier-gated) + Claude (hook, effector, matrix)"
    probe:
      command: "python3 scripts/heal-hook-wiring.py"
      derives: "the effector in dry-run: exit 0 iff the cartridge source carries hook + ask + autoMode"
      environment: host
      at_ideal_when: exit_zero

  IF-HOST-PRESSURE:
    ideal: >
      Every host-pressure axis — memory, CPU load, the backup crawler, test fan-out — has an
      executable gauge and a mechanical valve; no stack of individually-legitimate loads can
      thrash the host, because each is gated where it starts and the gauges are watched.
    owner: "Claude (all four forms)"
    probe:
      command: "python3 scripts/check-host-pressure-estate.py"
      derives: "declared pressure axes missing a gauge or an armed-by-default valve"
      environment: repo
      extract: "unguarded axes: ([0-9]+)"
      ideal_value: 0
      # The vacuum this replaced was right about live pressure and wrong about the ideal. Its
      # reason — "a one-shot repo probe would report the pressure of whatever machine happened
      # to run pr-gate" — correctly rejects measuring the WEATHER. But the ideal's own sentence
      # is "every axis HAS an executable gauge and a mechanical valve ... and the gauges are
      # watched", which is estate completeness: a repo fact, and stable. So this probe is a
      # RATCHET, not a thermometer, and needs no `instantaneous:` — it is not a snapshot of a
      # condition, it is a structural claim that holds until someone deletes a gauge or
      # disarms a valve. Which is precisely the 2026-07-15 failure it exists to prevent.

  IF-LEDGER-OF-IDEALS:
    ideal: >
      Every Claude-originated ideal is a tracked named param here; the ledger is wired into a
      verification lane so its distances are derived rather than remembered, closing the
      self-loop.
    owner: Claude
    probe:
      command: "python3 scripts/check-ideal-forms.py"
      derives: "this registry's own coherence — the self-loop the entry asked for"
      environment: self
      at_ideal_when: exit_zero

  IF-DECORUM:
    ideal: >
      DECORVM federates the estate's quality organs into one verdict, with departments and the
      severity floor as declared data; fully alive when a sweep is green at a fixed point —
      nothing on any public surface is currently embarrassing.
    owner: "Claude + the decorum organ (beat) + his-hand-levers.json for off-platform capture"
    probe:
      # NOT check-decorum.py — that proves the REGISTRY is coherent, which it is, while the
      # estate it watches is red. Measuring the wrong question would have reported this ideal
      # at its form while 4 broken public frontends stood; check D caught exactly that.
      command: "python3 scripts/decorum-keeper.py --sweep"
      derives: "public surfaces currently failing the severity floor (the sweep IS the ideal)"
      environment: network
      at_ideal_when: exit_zero

  IF-LEARNING-ENGINE:
    ideal: >
      The Adaptive Personal Syllabus is the sole curriculum engine, daily-engine the cadence
      spine, and every new study need is a SUBJECT in the aps schema — never a new engine.
      Pedagogy primitives are load-bearing and preserved.
    owner: "Claude + the Adaptive Personal Syllabus (aps)"
    probe: null
    probe_absent_reason: >
      Owner-uniqueness for these capabilities is already measured by IF-SHARED-SUBSTRATE's
      probe (the same convergence registry holds the learning-engine rows). What is left in
      THIS row is the Phase-2 lift — daily-engine's core extracted into a shared substrate —
      and a lift that has not started has nothing to measure but its own absence.

  IF-SHARED-SUBSTRATE:
    ideal: >
      Every capability in the estate has exactly one owner; everything else is a tenant or
      retired. The convergence registry is the machine form and its predicate makes "never
      build the 7th" a red check instead of a memory.
    owner: "Claude (registry + predicate) + the per-row owner_of_record"
    probe:
      command: "python3 scripts/check-convergence.py"
      derives: "capabilities with NO chosen owner (counted vacuums)"
      environment: repo
      extract: "([0-9]+) unresolved vacuum"
      ideal_value: 0

  IF-ATOM-HOMING:
    ideal: >
      Every harvested semantic atom is either homed in a git-tracked owner or dispositioned
      with a cited reason; residue and deferral both reach their floor; and no atom STATEMENT
      ever crosses into the public tree — homing is distillation, never transfer.
    owner: "Claude (registry + predicate) + the per-kind owner_of_record"
    probe:
      command: "python3 scripts/check-atom-homing.py"
      derives: "atoms still residual — not yet homed and not yet dispositioned"
      environment: repo
      extract: "([0-9]+) of [0-9]+ atoms residual"
      ideal_value: 0

  IF-DOMAIN-STREAMS:
    ideal: >
      "What session streams do I open?" is answered by the operator's LIFE/WORK DOMAINS —
      one family: domain row per workstream channel (correspondence, financial,
      representation, ...), derived from the channel roster and opened by the launcher in
      open_rank order; the collaborator constellation is the consulting domain's interior,
      never a sibling answer, and no session ever re-invents the roster.
    owner: "Claude (generator + checks) + the channel roster (workstream.py / organ-ladder.json)"
    probe:
      command: "python3 institutio/governance/derive-domain-streams.py --check"
      derives: "registry<->roster parity for the domain family (rows + cartridges, both directions)"
      environment: repo
      at_ideal_when: exit_zero

  IF-HARNESS-SENSED:
    ideal: >
      The Claude harness runtime tree — the external substrate the fleet reads its own session
      state from — is declared once (PARAMETERS), resolved in exactly one place
      (limen.harness_paths), and sensed at beat cadence, so relocating it is a red check rather
      than a silent blinding. The fleet senses its work product; it must also sense the worker.
      Extending the same shape to the remaining vendor roots is the NEXT form, not this row.
    owner: "Claude (limen.harness_paths resolver + scripts/harness-root-probe.py + the harness-root-probe sensor)"
    probe:
      command: "python3 scripts/harness-root-probe.py --root-only"
      derives: "the resolved Claude harness root still holds transcripts; empty-while-a-sibling-candidate-is-full is the relocation signature"
      environment: repo
      at_ideal_when: exit_zero
  IF-DIURNAL:
    ideal: "The day is a falsifiable loop, not a report. Morning emits a dashboard PLUS claims of\
      \ the form 'section X's metric falls below N today'; midday re-probes them mid-flight and\
      \ pushes only on drift; evening scores every claim held/missed/noop and CUTS sections that\
      \ scored noop for the threshold in consecutive ENGAGED days. Sections are declared data\
      \ because an auto-cut cannot edit Python source, and cuttable implies a metric because you\
      \ cannot prune what you cannot score. The loop is only real once it has run against the LIVE\
      \ organism for enough days that a cut could fire on evidence rather than on a fixture.\n"
    owner: Claude (scripts/diurnal.py + scripts/check-diurnal.py + institutio/governance/diurnal.yaml)
      · the beat's `diurnal` sensor (execution) · the operator (the `calendar` lever)
    probe:
      command: bash scripts/done-diurnal.sh --quiet
      derives: the organ is reaching the organism and scoring real days — a dated page exists in
        the live root today, the shared root predicate is the only liveness guard, and the cut
        threshold has an actual observation runway behind it
      environment: host
      at_ideal_when: exit_zero
  IF-AGENT-IDENTITY:
    ideal: "The agent's protected-resource identity is a STABLE BUNDLE, never a rotating executable\
      \ path. Every TCC grant the fleet depends on is held by org.organvm.domus.agent-host, whose\
      \ identity survives vendor version rotation, so a Claude Code update mints no new client and\
      \ re-prompts for nothing. The count of rotating-identity paths holding live grants is zero\
      \ ACROSS EVERY SERVICE, not merely across App Management — the dialog the operator is shown\
      \ is a Documents-folder grant, and a lens that judges one service scores the sprawl green.\
      \ And the number is MEASURED: a run that could not read the TCC database reports unmeasured,\
      \ never a clean bill of health and never a defect it did not observe.\n"
    owner: Claude (scripts/tcc-identity-audit.py — the rotating_identity_active_grants predicate)
      · the operator (one grant on the stable host, once, not once per version)
    probe:
      command: python3 scripts/tcc-identity-audit.py --strict
      derives: zero rotating-identity paths hold live TCC grants against a READABLE database —
        unmeasured and blocked both exit nonzero, so a blind read can never register as at-ideal
      environment: host
      at_ideal_when: exit_zero
  IF-GATEKEEPER-INERT:
    ideal: "A .app bundle the fleet does not own — one a vendor materializes around a BARE-signed\
      \ Mach-O — is INERT to Gatekeeper: present and inode-correct where the vendor expects it, and\
      \ carrying zero LaunchServices registrations, so macOS is never asked to assess a bundle that\
      \ provably cannot pass. Neither of the two states this class chased for six weeks is reachable:\
      \ ABSENT is undone by the vendor on every start, and VALID would require re-signing a hardlink\
      \ to the live Developer-ID binary. Present-and-unregistered is the only fixed point, and it is\
      \ compatible with IF-AGENT-IDENTITY rather than opposed to it — exec needs no registration,\
      \ only the dialog does. The count is zero ACROSS EVERY SCANNED DOMAIN, not merely under the\
      \ Claude store. And it is MEASURED: a run that could not ask LaunchServices reports unknown,\
      \ never inert — the absence of a dialog is not evidence that nothing is registered.\n"
    owner: Claude (scripts/claude-identity-bundle.py --strict — the class enumeration; and
      scripts/heal-claude-lsregister.sh — the unregistration effector) · the operator (one vendor
      setting, lever L-CLAUDE-DEEPLINK-REGISTRATION)
    probe:
      command: python3 scripts/claude-identity-bundle.py --strict
      derives: no vendor-materialized bundle is BOTH LaunchServices-registered and
        codesign-unassessable, across every enumerated domain — and the store bundle is present and
        inode-correct, so unregistration never costs the stable identity it protects
      environment: host
      at_ideal_when: exit_zero
  IF-NOTE-HOMED:
    ideal: "Every citation of durable knowledge resolves to a durable home. A `[[wikilink]]` in any\
      \ tracked surface — effector header, sensor registry, lever, ledger, source comment — names a\
      \ file that exists and is COMMITTED, so a claim and its refutation are both retrievable by the\
      \ next session instead of re-derived. The estate cites nothing into a void. What matters here\
      \ is not whether prose is accurate but whether it is REACHABLE: a citation that resolves and\
      \ one that dangles are byte-identical at the call site, so the only thing that can tell them\
      \ apart is a predicate that asks the filesystem — and until one did, nothing ever asked.\n"
    owner: Claude (scripts/check-note-links.py — the predicate;
      institutio/governance/note-link-baseline.txt — the shrink-only work-list)
    probe:
      command: python3 scripts/check-note-links.py --ideal
      derives: zero cited note slugs have no home — the count the baseline records, not merely the
        count the baseline forgives. The bare invocation is the CI RATCHET (exit 0 at the baseline,
        so inherited debt never blocks a PR); `--ideal` is this probe and exits 0 only when the
        baseline is EMPTY, because a baselined dangle is still a dangle to the next session that
        follows it
      environment: repo
      at_ideal_when: exit_zero
