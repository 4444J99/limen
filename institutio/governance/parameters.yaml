  LIMEN_HEAL_SCRIPT_UNDER_TEST:
    default: ""
    env: LIMEN_HEAL_SCRIPT_UNDER_TEST
    self_update: none
    owner: tabularius
    note: "Path to the effector revision scripts/tests/heal-claude-lsregister.test.sh should exercise. Unset in production (the test defaults to the shipped script). Exists so the contracts can be pointed at a PRIOR revision and shown to FAIL there — a contract that passes against the version it was written to reject proves nothing, which is the #1837 vacuous-test lesson made runnable."
  LIMEN_CLAUDE_IDENTITY_BUNDLE_TIMEOUT:
