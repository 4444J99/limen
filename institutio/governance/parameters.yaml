    default: 30
    env: LIMEN_DISK_CAPACITY_TIMEOUT
    self_update: none
    owner: tabularius
    note: "Per-run timeout (seconds) for the disk-capacity sensor. The check is a single df(1) call; 30s is generous headroom for a slow volume or a busy CI runner."

  LIMEN_DISK_CAPACITY_APPLY:
    default: "1"               # ARMED — the effector. Arms removal of gitignored heal-probe artifacts + heartbeat error-log truncation.
    env: LIMEN_DISK_CAPACITY_APPLY
    self_update: none
    owner: tabularius
    note: "Arms the disk-capacity effector (scripts/disk-capacity.py --apply, sensor 0g7 args_when). When 1 (default), the beat removes every git-check-ignored .heal-probe-*.yaml artifact under LIMEN_ROOT (gitignored transient probes; always safe to delete) and truncates logs/heartbeat.err.log when it exceeds LIMEN_DISK_LOG_CAP_MB (default 50 MiB), writing a receipt to logs/disk-capacity-apply.json. Shipped dark; armed 2026-07-16 — /System/Volumes/Data at 87% vs 80% threshold. Set 0 to disarm."

  LIMEN_DISK_LOG_CAP_MB:
    default: 50
    env: LIMEN_DISK_LOG_CAP_MB
    self_update: none
    owner: tabularius
    note: "Size cap in MiB for logs/heartbeat.err.log checked by disk-capacity.py --apply. When the log exceeds this, the effector truncates it to zero. Default 50 MiB; raise if the heartbeat emits legitimate high-volume stderr that should be preserved longer, lower for tighter disk hygiene."

  LIMEN_RELATIONSHIP_REVIEW:
    default: "1"
    env: LIMEN_RELATIONSHIP_REVIEW
    self_update: none
    owner: tabularius
    note: "Gate for the relationship-review-delta beat sensor (weekly review-due detector for the relationship-pipeline slugs). ON by default: it is read-only (a bounded, immutable sqlite count of chat.db) and fails open, so it cannot red the beat or leak. Its only public output is a PII-clean count; per-person detail lands only in the sealed _people-private estate."
  LIMEN_BEAT_RELATIONSHIP_REVIEW:
    default: 24
    env: LIMEN_BEAT_RELATIONSHIP_REVIEW
    self_update: none
    owner: tabularius
    note: "Cadence (every N beats) of the relationship-review-delta sensor. 24 ≈ daily-active — at the slowest quiet tempo (~30min/beat) 24 beats ≈ 12h, so the warm-network re-engagement signal surfaces at least twice a day (was 168 ≈ weekly, effectively dormant). Safe to fire often: the sensor is a read-only, side-effect-free detector (surfaces a PII-clean review-due COUNT — no send, no draft, no outreach). Half as frequent as the time-critical opportunity sensors (cadence 12). Resolved by the generic scheduled runner (beat-sensors.py --run --source heartbeat --scheduled-only); heartbeat-loop.sh carries no sensor-specific cadence constant."
  LIMEN_RELATIONSHIP_REVIEW_TIMEOUT:
    default: 300
    env: LIMEN_RELATIONSHIP_REVIEW_TIMEOUT
    self_update: none
    owner: tabularius
    note: "Per-run timeout (seconds) for the relationship-review-delta sensor. The work is a handful of read-only sqlite COUNT queries; 300s is generous headroom if chat.db is large or the volume is slow."
  LIMEN_RELATIONSHIP_REVIEW_NOTIFY:
    default: "1"
    env: LIMEN_RELATIONSHIP_REVIEW_NOTIFY
    self_update: none
    owner: tabularius
    note: "Safety-valve arg for the relationship-review-delta effector (--notify). When 1, review-due detections append to the sealed private log ~/Workspace/_people-private/review-due.jsonl (ARCA-sealed, never public). ON by default because the write target is private-only; set 0 to run detection without recording."
  LIMEN_RELATIONSHIP_REVIEW_THRESHOLD:
    default: 20
    env: LIMEN_RELATIONSHIP_REVIEW_THRESHOLD
    self_update: none
    owner: tabularius
    note: "How many NEW inbound messages since a person's last review make a delta dice-up worth running (relationship-review-delta.py). Default 20 — a meaningful wave, not a single text. Raise to reduce noise, lower to trigger sooner."
  LIMEN_RELATIONSHIP_PIPELINE_ROOT:
    default: ""
    env: LIMEN_RELATIONSHIP_PIPELINE_ROOT
    self_update: none
    owner: tabularius
    note: "Override for the relationship-pipeline checkout that relationship-review-delta.py reads people.json from. Empty (default) = resolve at run time across known locations (~/Workspace/4444J99/relationship-pipeline, then the ~/Workspace/.limen-worktrees/m1_repos mirror). Exists because the root was HARDCODED to the first path, the repo moved, and the sensor then fail-opened on every beat for weeks — a 27-day review gap went undetected because 'no pipeline' and 'no review owed' printed identically. The canonical handle source is now _people-private/people/roster.json; people.json is a legacy fallback and its absence is reported explicitly rather than silently."

  LIMEN_OPPORTUNITY_PIPELINE:
    default: "1"
    env: LIMEN_OPPORTUNITY_PIPELINE
    self_update: none
    owner: mail
    note: "Gate for the opportunity-pipeline beat sensor (inbound-lead review-due detector for the UMA inbound-lead-hire/deploy/linkedin classes). ON by default: it is read-only over obligations-ledger.json and fails open, so it cannot red the beat or leak. Its only public output is a PII-clean count (logs/opportunity-status.json); per-lead detail lands only in the sealed _people-private/opportunities estate."
  LIMEN_BEAT_OPPORTUNITY_PIPELINE:
    default: 12
    env: LIMEN_BEAT_OPPORTUNITY_PIPELINE
    self_update: none
    owner: mail
    note: "Cadence (every N beats) of the opportunity-pipeline sensor. 12 beats keeps warm inbound leads moving faster than the weekly relationship cadence. Resolved by the generic scheduled runner (beat-sensors.py --run --source heartbeat --scheduled-only); heartbeat-loop.sh carries no sensor-specific cadence constant."
  LIMEN_OPPORTUNITY_PIPELINE_TIMEOUT:
    default: 300
    env: LIMEN_OPPORTUNITY_PIPELINE_TIMEOUT
    self_update: none
    owner: mail
    note: "Per-run timeout (seconds) for the opportunity-pipeline sensor. The work is a ledger read plus (when application-pipeline is present) one bounded opportunity_sync.py subprocess; 300s is generous headroom."
  LIMEN_OPPORTUNITY_NOTIFY:
    default: "1"
    env: LIMEN_OPPORTUNITY_NOTIFY
    self_update: none
    owner: mail
    note: "Safety-valve arg for the opportunity-pipeline effector (--notify). When 1, review-due detections append COUNT-ONLY events to the sealed private log ~/Workspace/_people-private/opportunities/review-due.jsonl (ARCA-sealed, never public) and push a count-only line through the existing notify cascade. ON by default because both write targets are private/count-only; set 0 to run detection without recording."

  LIMEN_DAILY_EXECUTION:
    default: "1"
    env: LIMEN_DAILY_EXECUTION
    self_update: none
    owner: mail
    note: "Gate for the single persisted daily communications/application coordinator. ON by default for read-only reconciliation and staging; outbound authority still requires the invocation-scoped LIMEN_DAILY_EXECUTION_FIRE valve."
  LIMEN_BEAT_DAILY_EXECUTION:
    default: 48
    env: LIMEN_BEAT_DAILY_EXECUTION
    self_update: none
    owner: mail
    note: "Cadence for the generic heartbeat daily-execution sensor. 48 beats is the existing daily-class tempo; the sensor owns the complete bounded run instead of a separately scheduled application-funnel trigger."
  LIMEN_DAILY_EXECUTION_TIMEOUT:
    default: 1800
    env: LIMEN_DAILY_EXECUTION_TIMEOUT
    self_update: none
    owner: mail
    note: "Hard timeout in seconds for one daily coordinator run. The default 1,800-second bound covers the application owner cycle while preventing a detached or wedged provider from holding the heartbeat indefinitely."
  LIMEN_DAILY_EXECUTION_FIRE:
    default: "0"
    env: LIMEN_DAILY_EXECUTION_FIRE
    self_update: none
    owner: mail
    note: "Invocation safety valve for routine professional application submission and professional email/LinkedIn follow-up effectors. SAFE-OFF by default; it is never persisted by the coordinator and never arms ingestion or reconciliation."
  LIMEN_DAILY_EXECUTION_RECEIPT:
    default: ""
    env: LIMEN_DAILY_EXECUTION_RECEIPT
    self_update: none
    owner: mail
    note: "Optional private path for the persisted redacted daily execution receipt. Empty selects the existing private communications report home; raw bodies, browser state, and credentials never enter the receipt."
  LIMEN_DELIVERY_RECEIPTS:
    default: ""
    env: LIMEN_DELIVERY_RECEIPTS
    self_update: none
    owner: mail
    note: "Optional private path to the canonical append-only DeliveryReceiptV1 ledger. Exact provider/account/run/obligation bindings are required for current-day counts; historical rows remain reconciliation-only."
  LIMEN_DAILY_EXECUTION_TIMEZONE:
    default: ""
    env: LIMEN_DAILY_EXECUTION_TIMEZONE
    self_update: none
    owner: mail
    note: "Optional IANA timezone for the daily local-calendar boundary. Empty uses the host timezone; an invalid value fails back to the host without changing provider state."
  LIMEN_DAILY_RUN_ID:
    default: ""
    env: LIMEN_DAILY_RUN_ID
    self_update: none
    owner: mail
    note: "Private run binding passed to owner effectors by the coordinator. It is derived from the local root and calendar date; operators do not set it as a scheduler or persistence knob."
  LIMEN_LINKEDIN_FIRE:
    default: "0"
    env: LIMEN_LINKEDIN_FIRE
    self_update: none
    owner: mail
    note: "Per-owner LinkedIn professional-effector arm. The daily coordinator sets it only for the explicit fire invocation and never passes it to ingestion or reconciliation."

  LIMEN_APPLY_FIRE:
    default: "0"
    env: LIMEN_APPLY_FIRE
    self_update: none
    owner: mail
    note: "THE SUBMIT ARM (lever L-APPLY-FIRE). OFF by default: the funnel stages complete application packages but submits NOTHING. When 1, the application-funnel cycle also runs the `apply` phase — submitting staged applications to ATS portals, capped by the pipeline's own precision limits (<=2/week, 1 per org). Mirrors LIMEN_MAIL_SEND for outbound mail: staging is always reversible, submission fires only when armed. Writing this to ~/.limen.env is the operator's one-time paste (persistence-arming is classifier-gated); also requires the pipeline's .submit-config.yaml (PII for ATS autofill) to be present."
  LIMEN_APPLICATION_CYCLE_MAX_SECONDS:
    default: 1800
    env: LIMEN_APPLICATION_CYCLE_MAX_SECONDS
    self_update: none
    owner: mail
    note: "Lock-staleness bound (seconds) for a detached funnel cycle. If a lock is older than this (or its pid is dead) the next trigger steals it, so a crashed cycle can never wedge the funnel shut. 1800s (30 min) is well above a normal full cycle."
  LIMEN_APPLICATION_PIPELINE_PYTHON:
    default: ""
    env: LIMEN_APPLICATION_PIPELINE_PYTHON
    self_update: none
    owner: mail
    note: "Optional override for the interpreter that runs the application-pipeline orchestrator. Empty by default: the driver auto-detects application-pipeline/.venv/bin/python (the pipeline carries its own deps: ruamel, anthropic, ...). Set only to point at a different environment."
  LIMEN_APPLICATION_STATE_DIR:
    default: ""
    env: LIMEN_APPLICATION_STATE_DIR
    self_update: none
    owner: mail
    note: "Optional override for where the funnel writes its lock / cycle log / last-result JSON. Empty by default: ~/System/Logs. Set to relocate the detached cycle's runtime state."

  # --- consulting: constellation register -------------------------------------
  LIMEN_CONSTELLATION_OVERLAY:
    default: "~/Workspace/_people-private/constellation/registry-private.yaml"
    env: LIMEN_CONSTELLATION_OVERLAY
    self_update: none
    owner: consulting
    note: "Path to the constellation register's ARCA-sealed private overlay (pipeline slugs, protocol state, channel state, boundaries). The public half lives at organs/consulting/constellation/registry.yaml; validate-constellation.py Rule #6 checks parity only when this file is reachable, so CI (store absent) degrades cleanly."
  LIMEN_CONSTELLATION_REGISTRY:
    default: "organs/consulting/constellation/registry.yaml"
    env: LIMEN_CONSTELLATION_REGISTRY
    self_update: none
    owner: consulting
    note: "Path to the constellation register's public half. generate-positioning.py derives the front door's 'Built with partners' showcase from it at render time (public_face_state >= readme AND a repo to link — never a hand-kept list). Overridable for tests; absent file = section suppressed."
  LIMEN_PEOPLE_STORE:
    default: "~/Workspace/_people-private/people"
    env: LIMEN_PEOPLE_STORE
    self_update: none
    owner: consulting
    note: "Root of the private per-person store (open-asks.yaml, protocol artifacts, project dossiers) that constellation check.py predicates and the dossier engine read/write. ARCA-sealed via the _*-private glob; never in any public tree."
  LIMEN_OPPORTUNITY_BRIEF:
    default: "1"
    env: LIMEN_OPPORTUNITY_BRIEF
    self_update: none
    owner: mail
    note: "Gate for the opportunity-brief beat sensor (the engine's daily VOICE). When 1, once per calendar day it composes a plain-text brief from logs/opportunity-status.json + correspondence-dispositions.json + obligations-ledger.json and emails it to the operator's OWN inbox via the headless scripts/mail-send lane. Recipient is hardcoded to self (never a third party); idempotent via a once/day stamp; fails open (a bad send never reds the beat). Set 0 to silence the daily brief."
  LIMEN_BEAT_OPPORTUNITY_BRIEF:
    default: 12
    env: LIMEN_BEAT_OPPORTUNITY_BRIEF
    self_update: none
    owner: mail
    note: "Cadence (every N beats) of the opportunity-brief sensor. 12 beats means it ATTEMPTS several times a day; the script's own once/day stamp dedups so exactly one brief lands. Resolved by the generic scheduled runner (beat-sensors.py --run --source heartbeat --scheduled-only); heartbeat-loop.sh carries no sensor-specific cadence constant."
  LIMEN_CONVERSION_FUNNEL:
    default: "1"
    env: LIMEN_CONVERSION_FUNNEL
    self_update: none
    owner: mail
    note: "Gate for the conversion-funnel beat sensor (institutio/governance/sensors.yaml section heartbeat): two ordered steps — scripts/traffic-collect.py (gh /traffic per value-repo -> logs/observatory/traffic.jsonl) then scripts/conversion-funnel.py (fuses seen->inbound->revenue -> logs/profile-conversion-funnel-latest.json, naming the single bottleneck DISCOVERY|FACE|CLOSE). Read-only; both steps fail-open (a 403 on a repo without push access is recorded, never fatal). The bottleneck is what routes Aug-1 ($10k/wk) effort, and it was dark (manual-only) until this rung; the daily brief surfaces it. 0 disables the pass."
  LIMEN_BEAT_CONVERSION_FUNNEL:
    default: 48
    env: LIMEN_BEAT_CONVERSION_FUNNEL
    self_update: none
    owner: mail
    note: "Cadence (every N beats) of the conversion-funnel sensor. 48 ≈ once-daily at the slowest quiet tempo (~30min/beat -> 24h); leans infrequent because each run makes ~16 repos x 4 gh /traffic calls (network) and the traffic API is a 14-day rolling window that barely moves intra-day. Resolved by the generic scheduled runner (beat-sensors.py --run --source heartbeat --scheduled-only); heartbeat-loop.sh carries no sensor-specific cadence constant."
  LIMEN_CONVERSION_FUNNEL_TIMEOUT:
    default: 300
    env: LIMEN_CONVERSION_FUNNEL_TIMEOUT
    self_update: none
    owner: mail
    note: "Wall-clock bound (seconds) for the conversion-funnel sensor's two steps (traffic-collect + conversion-funnel). 300s covers ~16 repos x 4 gh /traffic calls plus the fuse; exceeding it is silent/non-fatal (the runner records the overrun and the beat continues)."
  LIMEN_OPPORTUNITY_BRIEF_TIMEOUT:
    default: 180
    env: LIMEN_OPPORTUNITY_BRIEF_TIMEOUT
    self_update: none
    owner: mail
    note: "Per-run timeout (seconds) for the opportunity-brief sensor. The work is three JSON reads plus (once/day) one bounded scripts/mail-send subprocess; 180s covers the IMAP Sent-verification the send performs."
  LIMEN_OPERATOR_EMAIL:
    default: "padavano.anthony@gmail.com"
    env: LIMEN_OPERATOR_EMAIL
    self_update: none
    owner: mail
    note: "The operator's own inbox — the single declared recipient for engine-to-operator self-notifications (opportunity-brief.py emails the daily brief here). Hardcoded default so a zero-env beat still reaches him; override only to redirect the brief to a different self address. Never a third party."

  # --- COLLABORATION HUB: one bounded rung on the existing heartbeat ------------
  LIMEN_COLLABORATION_HUB_SYNC:
    default: "1"
    env: LIMEN_COLLABORATION_HUB_SYNC
    self_update: none
    owner: continuity
    note: "Master gate for the owner-only collaboration hub sync sensor. The rung installs no daemon: the existing heartbeat invokes one finite discover → migrate → ciphertext sync → verify pass. Credentials remain in macOS Keychain, client plaintext stays local, and failures are advisory with private receipts."
  LIMEN_BEAT_COLLABORATION_HUB_SYNC:
    default: 48
    env: LIMEN_BEAT_COLLABORATION_HUB_SYNC
    self_update: none
    owner: continuity
    note: "Cadence in heartbeat beats for collaboration reconciliation. 48 is approximately daily at the slow quiet tempo; every run is idempotent and remote reconciliation uploads only missing immutable events."
  LIMEN_COLLABORATION_HUB_SYNC_TIMEOUT:
    default: 900
    env: LIMEN_COLLABORATION_HUB_SYNC_TIMEOUT
    self_update: none
    owner: continuity
    note: "Finite wall-clock bound in seconds for the collaboration hub sensor. It covers source discovery, local hashing/encryption, exact remote-ID reconciliation, and verification without monopolizing the heartbeat."
  LIMEN_COLLABORATION_HUB_ROOT:
    default: "~/Workspace/collaboration-operations-platform"
    env: LIMEN_COLLABORATION_HUB_ROOT
    self_update: none
    owner: continuity
    note: "Owner checkout containing the public-safe application and bounded sync entrypoint. The heartbeat fast-forwards a clean main checkout only; it never merges, rebases, or rewrites a work branch."
  LIMEN_COLLABORATION_HUB_WORKSPACE:
    default: "~/Workspace/_collaboration-operations-private"
    env: LIMEN_COLLABORATION_HUB_WORKSPACE
    self_update: none
    owner: continuity
    note: "Mode-700 private workspace holding the manifest, encrypted vault, and redacted/private operational receipts. The value and its source paths never enter tracked receipts."
  LIMEN_COLLABORATION_HUB_ENDPOINT:
    default: "https://collaboration-operations-hub.ivixivi.workers.dev"
    env: LIMEN_COLLABORATION_HUB_ENDPOINT
    self_update: none
    owner: continuity
    note: "No-cost ciphertext-only Worker endpoint. Changing it never authorizes custom DNS, public sharing, or paid resources."
  LIMEN_COLLABORATION_HUB_REGISTRY:
    default: "~/Workspace/limen/organs/consulting/constellation/registry.yaml"
    env: LIMEN_COLLABORATION_HUB_REGISTRY
    self_update: none
    owner: continuity
    note: "Canonical registered collaboration denominator refreshed before each pass. Private overlays and other registered sources are discovered into the private manifest and never copied into Git."

  # --- DIVRNAL: the three-phase daily organ that cuts itself --------------------
  LIMEN_PR_DEBT_WINDOW_DAYS:
    default: 14
    env: LIMEN_PR_DEBT_WINDOW_DAYS
    self_update: none
    owner: gitvs
    note: "Days of the committed observation series scripts/pr-debt-trend.py compares across. IF-AMALGAMATION's ideal is a monotonic TREND, not a level, so the probe needs a span; the window is a slice of the SERIES rather than of the calendar, because observations are irregular and comparing two arbitrary points is not a trend."
  LIMEN_PR_DEBT_MAX_AGE_DAYS:
    default: 3
    env: LIMEN_PR_DEBT_MAX_AGE_DAYS
    self_update: none
    owner: gitvs
    note: "How stale the newest open-PR observation may be before scripts/pr-debt-trend.py fails on the SILENCE itself. The half a naive trend predicate gets wrong: a debt series nobody records is not a debt trend that improved. Measured 2026-08-02 the newest observation was 8 days old because the producer (`gitvs.py pr-debt`) was wired to nothing — now recorded by the `github-pr-debt` sensor (LIMEN_PR_DEBT_RECORD), which closed owner-of-record GITVS-UNCAPPED-PR-DEBT-0715."
  LIMEN_PR_DEBT_RECORD:
    default: "1"
    env: LIMEN_PR_DEBT_RECORD
    self_update: none
    owner: gitvs
    note: "Master on/off for the `github-pr-debt` recorder sensor declared in sensors.yaml — the producer half of IF-AMALGAMATION. 0 disables recording, which makes the probe fail on staleness within LIMEN_PR_DEBT_MAX_AGE_DAYS rather than silently reading as improvement."
  LIMEN_BEAT_PR_DEBT:
    default: 12
    env: LIMEN_BEAT_PR_DEBT
    self_update: none
    owner: gitvs
    note: "Cadence (every N beats) at which the recorder's CHEAP due-check runs. Not the census cadence: the beat is adaptive (120s…1800s) so N beats is a wide wall-clock range, and the expensive estate sweep is throttled separately by LIMEN_PR_DEBT_RECORD_INTERVAL_HOURS."
  LIMEN_PR_DEBT_RECORD_INTERVAL_HOURS:
    default: 20
    env: LIMEN_PR_DEBT_RECORD_INTERVAL_HOURS
    self_update: none
    owner: gitvs
    note: "Minimum wall-clock hours between full open-PR censuses. Sits inside LIMEN_PR_DEBT_MAX_AGE_DAYS (3d) with two missed runs of margin, so ordinary jitter never makes the probe read STALE. Applied to TWO clocks and due only when both are stale: the mtime of the gitignored logs/gitvs-pr-debt-facts.json receipt (this checkout swept — keeps an unchanged estate from re-running the 169-page sweep every cadence) AND generated_at in the committed ledger (anyone recorded — shared by every checkout). The receipt alone is per-checkout, so the beat and a worktree cannot see each other's clock, and two censuses ran fourteen minutes apart (#1859)."
  LIMEN_PR_DEBT_RECORD_TIMEOUT:
    default: 900
    env: LIMEN_PR_DEBT_RECORD_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Seconds the recorder rung may take. Generous because a due run is a fully paginated open-PR census across every governed owner plus a ship-docs PR; a timeout is advisory and never breaks the fail-open beat."
  LIMEN_SHIPS_24H_REFRESH:
    default: "1"
    env: LIMEN_SHIPS_24H_REFRESH
    self_update: none
    owner: money-view
    note: "Master on/off for the `ships-24h-refresh` recorder sensor declared in sensors.yaml. It writes logs/ships-24h.json — a real gh-backed count of PRs merged in the last 24h across every governed owner, replacing the merge-drain.log grep that only ever saw the batch merge-drain.py daemon's own merges and stayed at 0 while self-merges (most real throughput) went uncounted. 0 disables recording, which leaves money-view.py/omni-view.py/notify-events.py reading a stale-or-absent cache (fails open to 0 ships) rather than silently serving a wrong number."
  LIMEN_BEAT_SHIPS_24H:
    default: 4
    env: LIMEN_BEAT_SHIPS_24H
    self_update: none
    owner: money-view
    note: "Cadence (every N beats) at which the recorder's cheap due-check runs. Not the query cadence: the beat is adaptive (120s…1800s), so the actual `gh search prs --merged` call is throttled separately by LIMEN_SHIPS_24H_REFRESH_INTERVAL_MINUTES, mirroring LIMEN_BEAT_PR_DEBT's two-clock shape."
  LIMEN_SHIPS_24H_REFRESH_TIMEOUT:
    default: 60
    env: LIMEN_SHIPS_24H_REFRESH_TIMEOUT
    self_update: none
    owner: money-view
    note: "Seconds the recorder rung may take. A single `gh search prs --merged` call across a handful of owners; generous but far below LIMEN_PR_DEBT_RECORD_TIMEOUT's full paginated census, since this is one bounded search, not a sweep."
  LIMEN_SHIPS_24H_REFRESH_INTERVAL_MINUTES:
    default: 20
    env: LIMEN_SHIPS_24H_REFRESH_INTERVAL_MINUTES
    self_update: none
    owner: money-view
    note: "Minimum wall-clock minutes between real `gh search prs --merged` calls, read by scripts/ships-24h-refresh.py's own due-check — the LIMEN_PR_DEBT_RECORD_INTERVAL_HOURS pattern scaled down for a cheap single-search query instead of a full paginated census. Keeps the sensor's beat-count cadence (LIMEN_BEAT_SHIPS_24H) from re-querying gh faster than the count could plausibly have changed."
  LIMEN_SHIPS_24H_STALE_MINUTES:
    default: 40
    env: LIMEN_SHIPS_24H_STALE_MINUTES
    self_update: none
    owner: money-view
    note: "How old logs/ships-24h.json may be before scripts/_ships_24h.py's reader treats it as unknown and fails open to (0, {}, []) rather than serving a silently-stale count. Set to 2x LIMEN_SHIPS_24H_REFRESH_INTERVAL_MINUTES's default (20m) so one missed refresh beat still reads fresh and two in a row is what trips it."
  LIMEN_PR_AUTOTYPE:
    default: "1"
    env: LIMEN_PR_AUTOTYPE
    self_update: none
    owner: gitvs
    note: "Master on/off for the `github-pr-autotype` sensor declared in sensors.yaml — the continuous typing rung that keeps newly-arrived mechanical PRs from re-reddening gitvs.py pr-debt --check at arrival rate. On means the DRY-RUN scan runs and receipts accrue (observable before autonomous); the mutation itself is the separate LIMEN_PR_AUTOTYPE_APPLY valve."
  LIMEN_BEAT_PR_AUTOTYPE:
    default: 4
    env: LIMEN_BEAT_PR_AUTOTYPE
    self_update: none
    owner: gitvs
    note: "Cadence (every N beats) for the auto-typing rung. Cheap by construction — the negated-label search returns only the untyped mechanical residual (normally empty) — so unlike LIMEN_BEAT_PR_DEBT no script-owned wall-clock throttle backs it; the cadence IS the throttle."
  LIMEN_PR_AUTOTYPE_TIMEOUT:
    default: 300
    env: LIMEN_PR_AUTOTYPE_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Seconds the auto-typing rung may take (2 gh searches across the estate-derived owner set, plus per-candidate pr view / repo view / edit calls bounded by LIMEN_PR_AUTOTYPE_LIMIT). Advisory; never breaks the fail-open beat. A timeout is NOT silent: gh transport errors are converted to named per-item skips, and a failed arrival search exits non-zero so the sensor's escalation line fires."
  LIMEN_PR_AUTOTYPE_APPLY:
    default: "0"
    env: LIMEN_PR_AUTOTYPE_APPLY
    self_update: none
    owner: gitvs
    note: "SAFE CODE DEFAULT — dry-run; the armed deliverable valve on the auto-typing rung (adds --apply). Arm via lever L-PR-AUTOTYPE-ARM after reviewing dry-run receipts in logs/pr-lifecycle-autotype.jsonl; logs/AUTONOMY_PAUSED forces observation-only even when armed. WHEN ARMING: set 1 in the daemon env AND add fleet_runtime: \"1\" here in the same change, so enactment-audit.py locks it live (the #576 dark-switch lesson)."
  LIMEN_PR_AUTOTYPE_LIMIT:
    default: 20
    env: LIMEN_PR_AUTOTYPE_LIMIT
    self_update: none
    owner: gitvs
    note: "Effects-per-run cap for the auto-typing rung — EFFECTS, not candidates examined: a candidate that can never be typed (archived, closed, human) must not consume the budget a real arrival needs, and because the cohort is sorted it would consume the same leading slot every visit. Arrival rate is a few PRs an hour at worst, so 20 per visit drains any burst within one cadence without a mass-mutation blast radius. Truncation is announced (residual=N), never silent."
  LIMEN_PR_AUTOTYPE_AUTHORS:
    default: "app/dependabot"
    env: LIMEN_PR_AUTOTYPE_AUTHORS
    self_update: none
    owner: gitvs
    note: "Comma-separated bot authors whose untyped arrivals the rung may auto-type (search form app/<name>; the effect-time rail also accepts the bare login gh pr view reports). Humans are never in this list — human-authored untyped arrivals are counted and surfaced, never typed."
  LIMEN_ESTATE_CENSUS_RECORD:
    default: "1"
    env: LIMEN_ESTATE_CENSUS_RECORD
    self_update: none
    owner: gitvs
    note: "Master on/off for the `github-estate-census` recorder sensor declared in sensors.yaml — the issue/branch/check axis of the fleet-debt register, sibling of LIMEN_PR_DEBT_RECORD. 0 disables recording, which leaves docs/github-estate-census.json stale rather than silently current."
  LIMEN_BEAT_ESTATE_CENSUS:
    default: 12
    env: LIMEN_BEAT_ESTATE_CENSUS
    self_update: none
    owner: gitvs
    note: "Cadence (every N beats) at which the estate-census recorder's CHEAP due-check runs. Not the census cadence: the expensive per-repo GraphQL sweep is throttled separately by LIMEN_ESTATE_CENSUS_RECORD_INTERVAL_HOURS (the github-pr-debt two-clock pattern)."
  LIMEN_ESTATE_CENSUS_RECORD_INTERVAL_HOURS:
    default: 24
    env: LIMEN_ESTATE_CENSUS_RECORD_INTERVAL_HOURS
    self_update: none
    owner: gitvs
    note: "Minimum wall-clock hours between full estate censuses (issues/branches/checks across every governed repo). Applied to TWO clocks and due only when both are stale: the mtime of the gitignored logs/github-estate-census-facts.json receipt (this checkout swept) AND source_report.generated_at in the committed ledger (anyone recorded — shared by every checkout). Same two-clock rule LIMEN_PR_DEBT_RECORD_INTERVAL_HOURS documents, inherited from the #1859 duplicate-census incident."
  LIMEN_ESTATE_CENSUS_RECORD_TIMEOUT:
    default: 1800
    env: LIMEN_ESTATE_CENSUS_RECORD_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Seconds the estate-census recorder rung may take. Larger than the PR-debt rung's because a due run paginates issues, branches and check rollups per repository across the whole estate (~313 repos) plus a ship-docs PR; advisory, never breaks the fail-open beat."
  LIMEN_SESSION_CONTENTION_GUARD:
    default: "1"
    env: LIMEN_SESSION_CONTENTION_GUARD
    self_update: none
    owner: substrate
    note: "Master on/off for the occupancy guard in sync-release.sh (IF-SESSION-NON-CONTENTION). 1 means the organ probes for a live interactive session in the live checkout and declines its DESTRUCTIVE valves — unpark, reset --hard, stash push — when one is present, recording an incident. THE FAST-FORWARD IS NOT EXEMPT IN PRACTICE, and this note used to claim it was (\"a clean fast-forward is never blocked either way\"): that holds only for a CLEAN tree, and capture.sh guarantees the live checkout is never clean — it snapshots default-branch dirt to a stable custody side ref and deliberately never commits the working tree. So every ff routes through the stash-push valve, consults the guard, and is declined whenever the probe names anyone. Measured 2026-08-07: 8 consecutive declines, all of them false positives (the probe counted pre-warmed `claude bg-spare` processes and the FleetView viewer as interactive sessions), live checkout 37 commits behind release, the sync organ silently never converging — the exact failure IF-LIVE-TREE-COHERENCE exists to prevent, reached through the guard that was supposed to be exempt from it. 0 restores the pre-guard behaviour exactly, and is the escape hatch when the probe itself misbehaves; it was needed twice that day to break the deadlock, because a checkout cannot apply the fix to a probe that is blocking its own fast-forward."
  LIMEN_SESSION_CONTENTION_SHIP:
    default: "1"
    env: LIMEN_SESSION_CONTENTION_SHIP
    self_update: none
    owner: substrate
    note: "Master on/off for the `session-contention-ship` rung that promotes locally-recorded contention incidents into the committed ledger. 0 leaves incidents in logs/session-contention.jsonl, which IF-SESSION-NON-CONTENTION's probe still counts as distance — so disabling this hides the evidence from git, never from the predicate."
  LIMEN_BEAT_SESSION_CONTENTION:
    default: 12
    env: LIMEN_BEAT_SESSION_CONTENTION
    self_update: none
    owner: substrate
    note: "Cadence (every N beats) at which unshipped contention incidents are promoted. A no-op when nothing was recorded, which is the expected steady state — the ideal is that this rung never has anything to ship."
  LIMEN_SESSION_CONTENTION_TIMEOUT:
    default: 300
    env: LIMEN_SESSION_CONTENTION_TIMEOUT
    self_update: none
    owner: substrate
    note: "Seconds the contention-ship rung may take. Sized for a ship-docs.sh PR (fresh worktree, branch, push, self-merge), not for the local append, which is instant and fail-open by design."
  LIMEN_DIURNAL:
    default: "1"
    env: LIMEN_DIURNAL
    self_update: none
    owner: diurnal
    note: "Master gate for the DIVRNAL sensor (morning/midday/evening emission). 0 = the day gets no briefing. The organ is read-mostly: it renders declared sections from institutio/governance/diurnal.yaml, writes docs/diurnal/<date>.md, and (evening only) may cut one of its OWN noop sections. It never sends, spends, or deletes."
  LIMEN_BEAT_DIURNAL:
    default: 1
    env: LIMEN_BEAT_DIURNAL
    self_update: none
    owner: diurnal
    note: "Cadence (every N fast-wave samples) at which the DIVRNAL sensor is visited. The registry cadence is sample-modulo only; the actual time-of-day gating is wall-clock inside scripts/diurnal.py (logs/diurnal/state.json, one emission per phase per calendar day), following the scripts/insight-cadence.py precedent. Every sample is cheap because a not-yet-due phase exits immediately, and it prevents a slow main rung from delaying a due phase."
  LIMEN_DIURNAL_TIMEOUT:
    default: 240
    env: LIMEN_DIURNAL_TIMEOUT
    self_update: none
    owner: diurnal
    note: "Per-run timeout (seconds) for the DIVRNAL sensor, and for each section `refresh:` command it shells out to. 240s covers the two refreshes that re-derive rather than trust a cache (scripts/organ-health.py, scripts/check-ideal-forms.py --measure)."
  LIMEN_NOTIFY_HELPER:
    default: "<calling checkout>/scripts/_notify.py"
    env: LIMEN_NOTIFY_HELPER
    self_update: none
    owner: diurnal
    note: "Path to the one permitted macOS notification effector. Shell callers such as netmode derive their sibling scripts/_notify.py when unset; tests and relocated runtime trees may override the path without reintroducing a direct osascript call."
  LIMEN_NOTIFY_GATE:
    default: "1"
    env: LIMEN_NOTIFY_GATE
    self_update: none
    owner: diurnal
    note: "Whether the beat surveys every copy of scripts/_notify.py on this host for the osascript effector gate. Measured 2026-08-05: the gate shipped at 19:20 and four more 'LIMEN · morning — ABSENT' pops landed after it, because a fix in a versioned file cannot reach the 21 other notifier copies on the machine — 14 worktrees plus 7 rotated runtime install trees that launchd runs overnight-watch from. A tree-local guard cannot protect a host-global effector. 0 = stop counting them, which does not stop them popping."
  LIMEN_BEAT_NOTIFY_GATE:
    default: 8
    env: LIMEN_BEAT_NOTIFY_GATE
    self_update: none
    owner: diurnal
    note: "Cadence (every N beats) at which the notifier-copy survey runs. 8 is the hygiene cadence: an ungated copy appears only when a worktree is cut or a runtime tree rotates, so this tracks estate churn rather than the minute. The survey parses ~23 small files and touches no network."
  LIMEN_NOTIFY_GATE_TIMEOUT:
    default: 60
    env: LIMEN_NOTIFY_GATE_TIMEOUT
    self_update: none
    owner: diurnal
    note: "Per-run timeout (seconds) for the notifier-copy survey. Generous for an AST parse of ~23 files; the real cost is the `git worktree list` subprocess and an iterdir over the rotated runtime trees, both of which can stall on a detached /Volumes mount."
  LIMEN_DIURNAL_REAP_MAX:
    default: 3
    env: LIMEN_DIURNAL_REAP_MAX
    self_update: none
    owner: diurnal
    note: "How many of the organ's own still-open page PRs it merges per run. ship-docs.sh exits 2 when merge-policy has not cleared within its wait, handing the PR to the beat's merge rung (drain.sh) — which sits below the pause gate in heartbeat-loop.sh and had not run since 2026-07-22, so five CLEARED non-deploy PRs accumulated across three days. The organ now closes its own loop; this caps the work so a backlog cannot stall the beat, and the remainder is retried next phase."
  LIMEN_DIURNAL_REAP_TIMEOUT:
    default: 600
    env: LIMEN_DIURNAL_REAP_TIMEOUT
    self_update: none
    owner: diurnal
    note: "Timeout (seconds) for each scripts/await-pr.sh --merge invocation during the reap. Separate from LIMEN_DIURNAL_TIMEOUT because a merge-queue round-trip is minutes, not seconds, while an emission is seconds. await-pr.sh is the one sanctioned waiter and carries its own hard deadline; this bounds the subprocess around it. Past the deadline the PR simply stays open and is retried."
  LIMEN_DIURNAL_SHIP:
    default: "1"
    env: LIMEN_DIURNAL_SHIP
    self_update: none
    owner: diurnal
    note: "Whether the organ lands its own emission on main via scripts/ship-docs.sh. 0 = pages stay on disk. docs/diurnal/ is a tracked directory but the emission arrives untracked, and capture.sh — the beat's only committing rung — refuses in-place commits on the live default branch and diverts to a side ref, so without this the organ's whole output is local-only (Rule #2) and re-lost daily. ship-docs refuses deploy-trigger paths, so a page can never blind-deploy the site; publication is additionally held whenever logs/AUTONOMY_PAUSED prohibits merge, the same marker await-pr.sh reads."
  LIMEN_DIURNAL_MORNING_HOUR:
    default: 6
    env: LIMEN_DIURNAL_MORNING_HOUR
    self_update: none
    owner: diurnal
    note: "Local hour (0-23) at or after which the morning emission becomes due. Morning is the FULL dashboard and emits the day's falsifiable claims, which the evening scores."
  LIMEN_DIURNAL_MIDDAY_HOUR:
    default: 12
    env: LIMEN_DIURNAL_MIDDAY_HOUR
    self_update: none
    owner: diurnal
    note: "Local hour (0-23) at or after which the midday check-in becomes due. Midday re-probes the morning's claims mid-flight and pushes ONLY when something drifted — a silent noon means the morning still holds."
  LIMEN_DIURNAL_EVENING_HOUR:
    default: 21
    env: LIMEN_DIURNAL_EVENING_HOUR
    self_update: none
    owner: diurnal
    note: "Local hour (0-23) at or after which the evening close becomes due. Evening scores every claim held/missed/noop, writes the carry for tomorrow, and is the ONLY phase with cut authority."
  LIMEN_DIURNAL_CLAIM_RENDER_MAX:
    default: 5
    env: LIMEN_DIURNAL_CLAIM_RENDER_MAX
    self_update: none
    owner: diurnal
    note: "Maximum claims the PAGE lists; the organ scores every eligible section regardless, and an elision always says how many it hid. Replaces the retired CLAIM_MAX parameter, which capped build_claims() itself — and because the claim list is also the score list, that display bound was silently bounding governance: diurnal.yaml declared cuttable on 11 sections while section-scores.json held 4, so the other 7 could never accrue a noop streak and could never be cut. Rendering is a rendering concern; a parameter that shortens a briefing must not decide what the organ is allowed to measure."
  LIMEN_DIURNAL_BLIND_THRESHOLD:
    default: 5
    env: LIMEN_DIURNAL_BLIND_THRESHOLD
    self_update: none
    owner: diurnal
    note: "Consecutive ENGAGED days a cuttable section may render STALE before the evening proposes it. Sibling of LIMEN_DIURNAL_DORMANT_THRESHOLD — same question (how long may a section tell you nothing?), different cause, kept separate so neither counter's name drifts from what it counts. A stale section is skipped by build_claims(), so it never scores and its noop_streak never moves — staleness was a shield that made the sections most worth examining the only ones the cut could not reach. This counter is the missing measurement, and it PROPOSES rather than cuts: 'the producer is dead' and 'the section is worthless' are different findings, and cutting would silence the only evidence the producer died."
  LIMEN_ROOT_VOICE_FLOOR:
    default: 5
    env: LIMEN_ROOT_VOICE_FLOOR
    self_update: none
    owner: tabularius
    note: "Voice stamps a PRIMARY checkout must carry before scripts/_root.py calls it the live organism. Defence in depth behind the exact test (a linked worktree's .git is a gitdir-pointer FILE, a checkout's is a DIRECTORY), covering the root that is a real checkout but not the body: a second clone, a fresh CI checkout, a restored backup. Measured 2026-07-31 — the live body carries 61 stamps, a worktree touched by one scheduled sensor carries 1 — so this sits deliberately nowhere near either edge. Raising it cannot make a worktree pass; only the .git test decides that."
  LIMEN_DIURNAL_DORMANT_THRESHOLD:
    default: 5
    env: LIMEN_DIURNAL_DORMANT_THRESHOLD
    self_update: none
    owner: diurnal
    note: "Consecutive ENGAGED days a cuttable section may sit at its metric floor — fresh source, but nothing falsifiable to claim, so it is neither scored nor blind — before the evening proposes it. Found by driving the blind-streak fix rather than by reading it: such a section carried a record with zero counters and read as reachable while remaining uncuttable forever. It PROPOSES rather than cuts because a zero can mean the section is dead OR that its subject is healthy (mail.owed == 0 is good news), and a cut section auto-restores only on an exception, never on a value change — so cutting a healthy zero would hide the row the day it finally matters."
  LIMEN_DIURNAL_PROPOSAL_MAX_AGE_DAYS:
    default: 14
    env: LIMEN_DIURNAL_PROPOSAL_MAX_AGE_DAYS
    self_update: none
    owner: diurnal
    note: "Days a proposal the evening raised may sit in logs/diurnal/proposals.json with a null `disposition` before done-diurnal.sh goes red. Bounds the gap this window was measured at on 2026-08-02: the organ had printed the same three retire-or-repair proposals on every evening page since 2026-07-31 while their sources aged to 10, 22 and 36 days — narration, not a loop, because nothing read the list back. The clock does NOT grant deletion authority; the retire-PR stays the hand step organs.yaml declares. It only makes the judgment owed on a date. A proposal that stops recurring auto-resolves, so this can never stay red on a condition already fixed."
  LIMEN_DIURNAL_CUT_THRESHOLD:
    default: 5
    env: LIMEN_DIURNAL_CUT_THRESHOLD
    self_update: none
    owner: diurnal
    note: "Consecutive ENGAGED days a cuttable section must score noop before the evening may cut it. Days with no commits are UNSCORED, not noop, so a week away cannot prune the dashboard. This threshold is also the organ's built-in observation runway: no cut can physically fire in its first 5 engaged days."
  LIMEN_DIURNAL_CUT_MAX_PER_DAY:
    default: 1
    env: LIMEN_DIURNAL_CUT_MAX_PER_DAY
    self_update: none
    owner: diurnal
    note: "Maximum auto-cuts per evening. Bounds a cascade: a quiet stretch cannot silently strip the whole briefing in one night. Cut sections keep probing and auto-restore if they raise an exception, so cutting is demotion, never blindness."
  LIMEN_DIURNAL_PUSH:
    default: "1"
    env: LIMEN_DIURNAL_PUSH
    self_update: none
    owner: diurnal
    note: "Whether morning/midday emit a push notification (scripts/_notify.py, onset-deduped on a date-keyed condition so each day fires once). 0 = the dated page is written but nothing reaches the phone. The evening never pushes — it persists."
  LIMEN_LEVER_CLASSIFY:
    default: "1"
    env: LIMEN_LEVER_CLASSIFY
    self_update: none
    owner: vigilia
    note: "Master on/off for the lever-sovereignty classifier (his-hand-levers.json -> sovereignty / design_debt / unclassified). 0 skips the pass. When 1, every open lever must be tagged sovereignty{reason} or design_debt{organ,dissolves_when}; unclassified open levers red the check."
  LIMEN_BEAT_LEVER_CLASSIFY:
    default: 1
    env: LIMEN_BEAT_LEVER_CLASSIFY
    self_update: none
    owner: vigilia
    note: "Cadence (every N beats) of the lever classifier. Fast (1) because classification is purely local and instant."
  LIMEN_GITHUB_UNIVERSE:
    default: "0"
    env: LIMEN_GITHUB_UNIVERSE
    self_update: none
    owner: gitvs
    note: "Master gate for the github-universe sweep. 0 keeps it dormant."
  LIMEN_GITHUB_UNIVERSE_MAX:
    default: 50
    env: LIMEN_GITHUB_UNIVERSE_MAX
    self_update: none
    owner: gitvs
    note: "Max repos to sweep per run."

  LIMEN_COVENANT_CHECK:
    default: "1"
    env: LIMEN_COVENANT_CHECK
    self_update: none
    owner: tabularius
    note: "Beat gate for the covenant attribution sensor (scripts/covenant-attribution.py --check) run each beat by metabolize.sh via the derive runner (section 0r). Proves every MEMORY.md change since the prior beat has a covering keeper receipt in <memdir>/.covenant-receipts.jsonl. Advisory severity; fail-open when memdir, receipts, or the state file (logs/covenant-attribution-state.json) are absent. Part of the Record-Keeper Covenant: the lane (memoria.py) ships in a sibling PR; this sensor surfaces the live leak as evidence before the wall (PR 6) arms. Set 0 to silence."
