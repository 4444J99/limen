    note: "Cadence (every N beats) of the launch-agent liveness sensor (sensors.yaml 0g4) in the heartbeat's scheduled derive lane. 4 follows the prompt-corpus-control precedent for a cheap check — this one guards the first-dollar revenue rail (mint + tunnel + credential organ), so it runs tight. The generic scheduled runner resolves this override; heartbeat-loop.sh contains no sensor-specific cadence constant."

