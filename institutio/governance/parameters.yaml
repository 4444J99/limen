    env: LIMEN_OPENCODE_DB_ARCHIVE_ROOT
    self_update: none
    owner: continuity
    note: "External archive destination for verified OpenCode DB backups written by opencode-db-corpus-intake.py before any local retention decision."
  LIMEN_INGRESS_ROOT:
