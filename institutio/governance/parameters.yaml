  LIMEN_PRIVATE_TASKS:
    default: ""
    env: LIMEN_PRIVATE_TASKS
    self_update: none
    owner: vigilia
    note: "Explicit off-disk full-board custody path used by local dispatch after public tasks.yaml is reduced to aggregate counts. Empty no longer means 'read the public file unconditionally': limen.private_board.operational_board_path() DERIVES custody from the public projection's shape, so an aggregate public board resolves to $LIMEN_PRIVATE_ROOT/board/canonical.yaml (and raises PrivateCustodyUnavailable when that has never been hydrated). This variable is the explicit override that outranks the derivation; never point it at public tasks.yaml."
  LIMEN_BOARD_PRIVATE_HYDRATE:
    default: "1"
    env: LIMEN_BOARD_PRIVATE_HYDRATE
    self_update: none
    owner: vigilia
    note: "Gate for the beat's hydrate-private-board rung (scripts/hydrate-private-board.sh), which refreshes off-repo private board custody from the authenticated keeper BEFORE any board reader runs. Self-arming: pre-cutover, while public tasks.yaml is still the full board, the rung exits 0 after one cheap shape probe (no network, no writes); it starts hydrating on the beat the partition cutover lands. Ordering matters — stale custody produces stale CAS preconditions and the keeper answers those with 'exact revision moved' (the 2026-08-15 release-stale wedge). Fail-open on keeper outages when custody already exists, fail-loud when the public board is an aggregate and custody has never been hydrated. 0 disables the rung."
  LIMEN_ISOLATION_PROMPT_GUARD:
    default: "1"
    env: LIMEN_ISOLATION_PROMPT_GUARD
    self_update: none
    owner: arms-agents
    note: "Prompt-level guard for isolated async/local worker packets. 1=explicitly forbid live-root and tasks.yaml mutation inside isolated worktrees; 0=omit the extra prompt block for tests or emergency rollback."
  # --- the non-bypassable Claude model chokepoint (scripts/shims/claude) ----------
  LIMEN_CLAUDE_SHIM_FLOOR:
    default: "haiku"           # the cheapest rung — the SAME tier the per-task ladder assigns to unclassed work
    env: LIMEN_CLAUDE_SHIM_FLOOR
    self_update: none
    owner: arms-agents
    note: "Floor the non-bypassable `claude` shim injects when a fleet spawn carries no --model. Spawns that earned more declare --model and pass through untouched; subagents inherit it. Capped by LIMEN_CLAUDE_MAX_INHERITED_TIER so this cannot silently become an Opus/Fable/1M default. See fleet-model-floor-bleed."
  LIMEN_CLAUDE_MAX_INHERITED_TIER:
    default: "sonnet"
    env: LIMEN_CLAUDE_MAX_INHERITED_TIER
    self_update: none
    owner: arms-agents
    note: "Maximum tier allowed for inherited/default Claude choices such as shim floors and global LIMEN_CLAUDE_MODEL pins. Default Sonnet keeps routine fan-out cheap; task-specific declaration sites may still earn Opus/Fable through the ladder and acceptance gates."
  LIMEN_CLAUDE_FABLE_FALLBACK_TIER:
    default: "sonnet"
    env: LIMEN_CLAUDE_FABLE_FALLBACK_TIER
    self_update: none
    owner: arms-agents
    note: "Fallback tier when a Fable-class task or Fable model pin lacks a current LIMEN_FABLE_ACCEPTANCE receipt. Default Sonnet prevents unaccepted Fable requests from becoming default Opus spend; set to opus only for an explicit emergency policy change."
  LIMEN_ALLOW_EXPENSIVE_CLAUDE_MODEL_PIN:
    default: "0"
    env: LIMEN_ALLOW_EXPENSIVE_CLAUDE_MODEL_PIN
    self_update: none
    owner: arms-agents
    note: "Emergency override allowing a global LIMEN_CLAUDE_MODEL pin to route inherited/default fleet spawns to Opus or explicit large-context models. Default 0 forces expensive defaults back under LIMEN_CLAUDE_MAX_INHERITED_TIER."
  LIMEN_ALLOW_CLAUDE_1M_CONTEXT:
    default: "0"
    env: LIMEN_ALLOW_CLAUDE_1M_CONTEXT
    self_update: none
    owner: arms-agents
    note: "Emergency override allowing explicit 1M/large-context Claude model pins. Default 0 strips large-context pins from tier resolution unless a current Fable acceptance receipt is present."
  LIMEN_CLAUDE_FABLE_CLASSES:
    default: "fable,long-horizon,huge-context,ambiguous-root-cause,final-canonical-decision"
    env: LIMEN_CLAUDE_FABLE_CLASSES
    self_update: none
    owner: arms-agents
    note: "Comma-separated task classes that may select the reserved Fable rung. Class membership is not enough by itself: LIMEN_FABLE_ACCEPTANCE must point at a written scripts/fable-allotment.py receipt before dispatch may return fable instead of falling back to LIMEN_CLAUDE_FABLE_FALLBACK_TIER."
  LIMEN_FABLE_ACCEPTANCE:
    default: ""
    env: LIMEN_FABLE_ACCEPTANCE
    self_update: none
    owner: arms-agents
    note: "Path to the current-week written Fable acceptance receipt emitted by scripts/fable-allotment.py accept. Empty, stale, malformed, or arbitrary paths make Fable selections fall back to Opus; value `1` is accepted only under pytest."
  LIMEN_CLAUDE_RETRY_BUMP_TO_FABLE:
    default: "0"
    env: LIMEN_CLAUDE_RETRY_BUMP_TO_FABLE
    self_update: none
    owner: arms-agents
    note: "Opt-in gate for tried:claude retry escalation from Opus to Fable. Requires LIMEN_FABLE_ACCEPTANCE as well; default caps retry bumping at Opus so Fable is never reached by inherited escalation."
  LIMEN_ALLOW_FABLE_FANOUT:
    default: "0"
    env: LIMEN_ALLOW_FABLE_FANOUT
    self_update: none
    owner: arms-agents
    note: "Emergency override for claude-workflow-guard's Fable fan-out check. Default 0 enforces one bounded accepted Fable objective instead of broad Fable worker pools."
  LIMEN_CLAUDE_BUILD_MAX_TIER:
    default: "sonnet"
    env: LIMEN_CLAUDE_BUILD_MAX_TIER
    self_update: none
    owner: arms-agents
    note: "Ceiling for mode:build-from-plan tier derivation (docs/fable-allotment.md: Fable plans, cheaper tiers build). Default Sonnet caps residual reserved classes on builder tasks; the value itself is hard-capped at Opus in model_selection._build_max_tier, so no setting can grant Fable for build work. Derived tiers only — a manual per-task claude_tier pin stays sovereign."
  LIMEN_ALLOW_FABLE_BUILD:
    default: "0"
    env: LIMEN_ALLOW_FABLE_BUILD
    self_update: none
    owner: arms-agents
    note: "Emergency override for claude-workflow-guard's building-on-Fable check (mutation tool calls on a Fable-model turn). Default 0 enforces the plan-only Fable doctrine; evidence is still reported when waived."
  LIMEN_ALLOW_EXPENSIVE_BUILD:
    default: "0"
    env: LIMEN_ALLOW_EXPENSIVE_BUILD
    self_update: none
    owner: arms-agents
    note: "Emergency override for claude-workflow-guard's workflow-lane check that mode:build-from-plan work ran on an Opus/Fable model. Default 0 keeps plan fulfillment on the capped cheap tiers (LIMEN_CLAUDE_BUILD_MAX_TIER)."
  LIMEN_MAX_FABLE_SESSION_TOKENS:
    default: "1000000"
    env: LIMEN_MAX_FABLE_SESSION_TOKENS
    self_update: none
    owner: arms-agents
    note: "Maximum billable-ish Fable transcript tokens allowed by claude-workflow-guard before it flags the session. Counts input + output + cache creation, excluding cache reads."
  LIMEN_ALLOW_FABLE_SESSION_BURN:
    default: "0"
    env: LIMEN_ALLOW_FABLE_SESSION_BURN
    self_update: none
    owner: arms-agents
    note: "Emergency override for claude-workflow-guard's Fable session token cap. Default 0 keeps accepted Fable runs bounded even when they do not fan out."
  LIMEN_ALLOW_UNACCEPTED_FABLE:
    default: "0"
    env: LIMEN_ALLOW_UNACCEPTED_FABLE
    self_update: none
    owner: arms-agents
    note: "Emergency override for claude-workflow-guard's written-acceptance check when transcript evidence is incomplete. Default 0 blocks Fable runs that lack a visible acceptance command or receipt reference."
  LIMEN_FABLE_WEEKLY_TOKENS:
    default: "64000000"
    env: LIMEN_FABLE_WEEKLY_TOKENS
    self_update: none
    owner: arms-agents
    note: "Weekly Fable BILLABLE-token budget (input+output+cache-creation; cache reads excluded) the balance meter (scripts/fable-allotment.py balance) divides the 7-day transcript sum by when Anthropic's weekly ratelimit-header percent is not captured. Calibrated 2026-08-06 against the live meter: 33.9M billable ↔ 53% weekly → ~64M ceiling. The prior 1B default under-read ~16x. Used only for the transcript-token-sum fallback source; re-calibrate if plan tier changes."
  LIMEN_FABLE_BALANCE:
    default: "1"
    env: LIMEN_FABLE_BALANCE
    self_update: none
    owner: arms-agents
    note: "Beat toggle for metabolize.sh step 0e: refresh logs/fable-allotment.json and surface an over-cap/unaccepted interactive Fable run in the beat log. Default 1; set 0 to skip the meter refresh."
  LIMEN_FABLE_BALANCE_PATH:
    default: ""
    env: LIMEN_FABLE_BALANCE_PATH
    self_update: none
    owner: arms-agents
    note: "Override path to the live weekly Fable balance file (default $LIMEN_ROOT/logs/fable-allotment.json). ONE reader since 2026-08-07 — model_selection.balance_verdict(); the session guard and the vendor advisor importlib-load it by file path instead of carrying the forked copies this note used to describe. Setting it names a CALLER-SUPPLIED file (a test fixture or a deliberate pin), which is not the beat's artifact, so the deployment-provenance dimension does not apply to it. Empty means the default location."
  LIMEN_FABLE_BALANCE_MAX_AGE_S:
    default: 21600
    env: LIMEN_FABLE_BALANCE_MAX_AGE_S
    self_update: none
    owner: arms-agents
    guard_state:
      reader: "limen.model_selection:balance_verdict"
      degenerate:
        - name: "meter absent"
          env: {LIMEN_FABLE_BALANCE_PATH: "@missing"}
        - name: "meter unreadable"
          env: {LIMEN_FABLE_BALANCE_PATH: "@garbage"}
        - name: "meter is not an object"
          env: {LIMEN_FABLE_BALANCE_PATH: "@notdict"}
        - name: "meter is a prior week"
          env: {LIMEN_FABLE_BALANCE_PATH: "@staleweek"}
        - name: "meter frozen (writer stopped)"
          env: {LIMEN_FABLE_BALANCE_PATH: "@frozen"}
    note: "Freshness budget (seconds, default 6h) for the weekly Fable meter, measured from the file's MTIME — the body carries no wall-clock field by design, because compute_balance() derives every value from data so two consecutive runs are byte-identical (verify-fable-gate.sh block 5 asserts exactly that). logs/ is gitignored runtime state with one writer, so the mtime IS the writer's heartbeat. THE DECLARED HATCH: a value <= 0 disables both the freshness and the deployment-provenance dimensions, restoring the pre-2026-08-07 fail-open behaviour for a host that genuinely runs no beat. The hatch is POLICY, not truth: balance_verdict() still reports the real state (an absent meter still reads `absent`), and only the consumer's decision to withhold a tier is switched off. Do not add a second, broader quiet switch — that re-creates the defect as a supported feature."
  LIMEN_SESSION_OPENING_FLOOR:
    default: "1"
    env: LIMEN_SESSION_OPENING_FLOOR
    self_update: none
    owner: arms-agents
    note: "Beat gate for the session-opening-floor sensor (sensors.yaml session-opening-floor): the per-lane cadence census, answering 'all providers, not just Claude'. Rows derive from census.OPENING_FLOORS and are completeness-checked against census.VENDORS, so a new vendor lands RED as UNDECLARED rather than inheriting 'no cadence applies'. Read-only — the remedies are operator-owned home-directory configs (lever L-LANE-OPENING-FLOOR, issue #2000)."
  LIMEN_SESSION_OPENING_FLOOR_CADENCE:
    default: 12
    env: LIMEN_SESSION_OPENING_FLOOR_CADENCE
    self_update: none
    owner: arms-agents
    note: "Run the per-lane opening-floor census every Nth sensor pass. Config pins change on human timescales, so this needs no per-beat cadence."
  LIMEN_SESSION_OPENING_FLOOR_TIMEOUT:
    default: 60
    env: LIMEN_SESSION_OPENING_FLOOR_TIMEOUT
    self_update: none
    owner: arms-agents
    note: "Timeout for one session-opening-floor run (a handful of local config reads; no network)."
  LIMEN_CLAUDE_SESSION_OPEN_MAX_TIER:
    default: "sonnet"
    env: LIMEN_CLAUDE_SESSION_OPEN_MAX_TIER
    self_update: none
    owner: arms-agents
    guard_state:
      reader: "limen.model_selection:opening_verdict"
      degenerate:
        - name: "pin matches no rung of the ladder"
          args: ["some-other-vendor-model-9"]
        - name: "pin above the declared ceiling"
          args: ["claude-opus-5"]
        - name: "empty pin"
          args: [""]
        # THE OTHER INPUT. opening_verdict(pin, ceiling) takes two declarations and the three cases
        # above all pass only args[0] — so the ratchet proved everything it was told about while the
        # ceiling axis stayed invisible through the whole 2026-08-07 arc. The pin is deliberately the
        # CHEAPEST rung: an unresolvable ceiling collapsed to `haiku`, and a haiku pin measured
        # against it came back state='ok', trusted=True. Every dearer pin returned above-ceiling, so
        # this returned TRUSTED for exactly one pin and produced no incident to force it up.
        - name: "ceiling flag names no rung"
          args: ["claude-haiku-4-5", "banana"]
        - name: "ceiling env names no rung"
          args: ["claude-haiku-4-5"]
          env:
            LIMEN_CLAUDE_SESSION_OPEN_MAX_TIER: "banana"
    note: "The cadence CEILING for an interactive session's OPENING model (CLAUDE.md Session Phase Entry: open cheap on sonnet, escalate deliberately). Read by model_selection.session_open_max_tier() and enforced by fable-session-guard.py's exit 4. Hard-capped at opus by the same accessor the --ceiling flag uses — the cap belongs to the VALUE, not to one entry point, so nothing can declare Fable an acceptable opening default. Before 2026-08-07 the guard asked `\"fable\" in model`, one rung of a four-rung ladder: every tier between the floor and Fable was unguarded, so a saved Opus default (~15x sonnet) opened every session while the guard reported a clean no-op. Raise this to `opus` if opening on Opus is the deliberate house cadence — that is the tuning knob, and it is a one-token registry change. Do NOT answer warning-fatigue with a quiet switch instead; that re-creates the defect as a supported feature."
  LIMEN_CLAUDE_FABLE_CAP_TIER:
    default: "opus"
    env: LIMEN_CLAUDE_FABLE_CAP_TIER
    self_update: none
    owner: arms-agents
    note: "Tier an OVER-CAP but acceptance-valid Fable selection lands on (the live weekly-cap downgrade in model_selection). Default Opus (the nearest tier below Fable for legitimately high-value work), capped to the ladder; distinct from the acceptance-absent LIMEN_CLAUDE_FABLE_FALLBACK_TIER."
  LIMEN_LATEST_SESSION_JSONL:
    default: ""
    env: LIMEN_LATEST_SESSION_JSONL
    self_update: none
    owner: arms-agents
    note: "Optional path to the latest interactive session transcript for metabolize.sh step 0e's per-beat Fable audit (claude-workflow-guard audit-transcript). Empty or absent means the per-beat transcript audit is skipped; the balance meter still refreshes."
  LIMEN_SESSION_MODEL:
    default: ""
    env: LIMEN_SESSION_MODEL
    self_update: none
    owner: arms-agents
    note: "Fallback source for the interactive session model in scripts/fable-session-guard.py when the SessionStart hook payload and ANTHROPIC_MODEL/CLAUDE_MODEL are absent. Empty means the guard resolves the model only from the payload/other env; a `fable`-bearing value triggers the interactive Fable guard."
  LIMEN_VENDOR_IDLE_HEADROOM_PCT:
    default: "90"
    env: LIMEN_VENDOR_IDLE_HEADROOM_PCT
    self_update: none
    owner: arms-agents
    note: "Headroom percent at/above which a metered vendor with no rate-limit health is judged persistently idle (CANCEL-CANDIDATE) by scripts/vendor-cancel-advisor.py. Default 90 is conservative: only a nearly-untouched pool is ever a cancel candidate; a pool that hits its caps is always KEEP."
  LIMEN_REAL_CLAUDE:
    default: null              # DERIVED: heartbeat-loop.sh captures `command -v claude` BEFORE prepending the shim dir
    env: LIMEN_REAL_CLAUDE
    self_update: "derived each beat by heartbeat-loop.sh"
    owner: arms-agents
    note: "Absolute path to the REAL claude binary so scripts/shims/claude can exec it without recursing into itself. Never pinned — captured at fleet start; shim also falls back to a PATH scan that skips its own dir."
  LIMEN_USE_1PASSWORD_SSH:
    default: "0"               # OFF — never route SSH through 1Password by default
    env: LIMEN_USE_1PASSWORD_SSH
    self_update: none
    owner: limen-daemon
    note: "Opt-in (=1) to route SSH_AUTH_SOCK through the 1Password agent (domus-genoma 02-1password.zsh). OFF by default: the app's BiometricsOnly/never-cache policy turns every agent hit into a Touch-ID prompt, and git here is HTTPS with no keys in the agent — so routing buys nothing and only risks the prompt storm. See macos-tcc-gatekeeper-dialogs-solved."

  # --- FULL-SWEEP credential catch-all (scripts/creds-hydrate.py --sweep-all) ---
  CREDS_SWEEP_VAULTS:
    default: ""                # empty ⇒ derive from the vaults DEFAULT_MAP already draws from
    env: LIMEN_CREDS_SWEEP_VAULTS
    self_update: none
    owner: limen-daemon
    note: "Comma-separated 1Password vaults --sweep-all enumerates for the catch-all credential materialization. Empty (default) DERIVES the list from the op:// vaults the curated DEFAULT_MAP already uses (never a hardcoded vault). Promptless-only — the sweep refuses to run unless a service-account token makes op silent. See wrangler-login-and-op-ping-disease."
  CREDS_SWEEP_LOGINS:
    default: "0"               # OFF — LOGIN items are personal web logins, not fleet automation creds
    env: LIMEN_CREDS_SWEEP_LOGINS
    self_update: none
    owner: limen-daemon
    note: "Whether --sweep-all includes 1Password LOGIN-category items. OFF by default: those are personal web logins and a plaintext ~/.limen.env is the wrong home for them; the sweep targets API-credential/password/secret items. Set =1 only to deliberately include logins."
  CREDS_BATCH:
    default: "1"               # ON — all op:// lanes read in ONE `op inject` pass (one biometric touch)
    env: LIMEN_CREDS_BATCH
    self_update: none
    owner: limen-daemon
    note: "Whether creds-hydrate --apply reads its op:// lanes through a single `op inject` batch (op_read_batch) — one 1Password authorization total instead of one Touch-ID prompt per lane (BiometricsOnly/never-cache re-prompts on every op process). =0 restores the sequential per-entry `op read` path (the escape hatch if a template render ever misbehaves). Batch failure already degrades to sequential automatically — per-entry fail-open is preserved either way. See macos-tcc-gatekeeper-dialogs-solved."

  # --- credential Wall (scripts/credential-wall.py): the pinned secret/credential index ---
  LIMEN_CRED_WALL_ISSUE:
    default: 320               # the pinned GitHub issue regenerated as the canonical secret index
    env: LIMEN_CRED_WALL_ISSUE
    self_update: none
    owner: limen-daemon
    note: "Which pinned issue scripts/credential-wall.py --sync rewrites as the secret/credential Wall. Identity, not a knob — override only if the Wall issue is ever renumbered."

  # --- MCP-CONNECTOR CONSENT — Lane B (scripts/mcp-auth-verify.py): the claude.ai OAuth connectors ---
  LIMEN_MCP_VERIFY:
    default: "1"               # ON — surface lapsed connectors in the beat log, never in chat
    env: LIMEN_MCP_VERIFY
    self_update: none
    owner: limen-daemon
    note: "Gate for the metabolize 0b step that probes claude.ai MCP-connector consent (the Lane-B sibling of creds-hydrate --verify). =0 skips it. Non-fatal + fail-open offline; a lapsed connector surfaces with its cure L-IANVA-CLOUD. See ianva-mcp-doorway."
  LIMEN_MCP_REQUIRED:
    default: ""                # empty ⇒ no connector is hard-required; every lapse is informational
    env: LIMEN_MCP_REQUIRED
    self_update: none
    owner: limen-daemon
    note: "Comma list of MCP connectors (substring match) that MUST be authenticated; mcp-auth-verify exits 1 if any lapses, else 0. Empty (default) DERIVES nothing as required — the hosted connectors are optional conveniences, so a lapse is logged, not fatal."

  # --- MCP-SERVER BOOT — Lane A (scripts/mcp-server-boot.py): the local/stdio servers every agent spawns ---
  LIMEN_MCP_BOOT_VERIFY:
    default: "1"               # ON — surface configured-but-dead local MCP servers in the beat log
    env: LIMEN_MCP_BOOT_VERIFY
    self_update: none
    owner: limen-daemon
    note: "Gate for the metabolize 0b2 step that spawn-pings every local/stdio MCP server across every agent CLI config (copilot, codex, gemini, agy, claude, cline, opencode) and confirms it boots/reaches — the Lane-A sibling of mcp-auth-verify (Lane B, hosted claude.ai connectors). Two of Copilot's four servers sat red for weeks (docker-on-a-docker-less-host, corrupt npx cache) with no sensor to see it; this closes that blind spot. =0 skips it. Non-fatal + fail-open (no agent configs => exit 0, so CI never false-reds). Ω predicate: scripts/verify-mcp-estate.sh. See mcp-estate-health-ownership-organ."
  LIMEN_MCP_BOOT_HEAL:
    default: "0"               # OFF — the effector. Arm once to auto-heal MCP-server boot failures.
    env: LIMEN_MCP_BOOT_HEAL
    self_update: none
    owner: limen-daemon
    note: "The effector for the local-MCP-boot invariant (scripts/mcp-server-boot.py --apply, sensor section 0b2, gated by args_when). Dry-run by default (reports the cure, mutates nothing). When 1, the beat heals via ianva's EXISTING verbs — `ianva install-configs --apply` re-lands a dropped agent entry (the opencode gap) and an npx-cache clear cures the corrupt-cache crash class — then re-probes once. It never guesses ianva UPSTREAMS (that set is a registry decision, not a probe result — deploy ianva/upstreams.example.json or `ianva add-upstream`). OFF by default because auto-writing agent configs is an authorization, not a default (mirrors LIMEN_LAUNCHAGENT_HEAL). Owner arms it in the daemon env (~/.limen.env) or as a his-hand lever. Set 0 to silence."
  LIMEN_MCP_NEEDS_AUTH_CACHE:
    default: "~/.claude/mcp-needs-auth-cache.json"
    env: LIMEN_MCP_NEEDS_AUTH_CACHE
    self_update: none
    owner: limen-daemon
    note: "Path to the daemon's needs-auth marker cache that mcp-auth-verify reads offline (connector names + internal ids only — no token material). Identity, not a knob — override only if Claude Code relocates the cache."

  # --- HOST-IS-FACTORY / CARTRIDGE INTEGRITY (scripts/cartridge-connected.py): is chezmoi plugged into the real cartridge ---
  LIMEN_CARTRIDGE_CHECK:
    default: "1"               # ON — surface an unplugged cartridge in the beat log (0c), never in chat
    env: LIMEN_CARTRIDGE_CHECK
    self_update: none
    owner: limen-daemon
    note: "Gate for the metabolize 0c step that asserts chezmoi's source IS the real cartridge (organvm/domus-genoma), not a scratch/dummy source. =0 skips it. Non-fatal + fail-open when chezmoi is absent; nothing else checks source IDENTITY (chezmoi verify/status/health only validate whatever source is wired), so a disconnected cartridge would otherwise return a meaningless green. See host-is-factory-system-is-cartridge."
  LIMEN_CARTRIDGE_REPO:
    default: "organvm/domus-genoma"
    env: LIMEN_CARTRIDGE_REPO
    self_update: none
    owner: limen-daemon
    note: "The expected cartridge repo (owner/repo) whose remote chezmoi's source must match for cartridge-connected to pass. DERIVED default, not pinned per host — another person's prosthesis overrides this to their own fork; a same-repo-name fork under a different owner still validates. See derive-never-pin-hardcodes."
  LIMEN_CHEZMOI_DRIFT_CHECK:
    default: "1"               # ON — surface a wedged pipeline / stale cartridge / .claude orphan in the beat log (0c'), never in chat
    env: LIMEN_CHEZMOI_DRIFT_CHECK
    self_update: none
    owner: limen-daemon
    note: "Gate for the metabolize 0c' step (scripts/chezmoi-drift.py). cartridge-connected proves the right REMOTE is wired but reads green through three states that silently disable config hydration: a strict-missingkey template error that aborts the whole `chezmoi status`/apply run; the source checkout parked on a stale branch serving old config; a managed target edited on disk but never re-added (the auto-capture hook only fires on the Edit tool). Any lets a local orphan look durable — the failure that made a subagent's ~/.claude statusline write survive as a local file (2026-07-09). =0 skips it. Fail-open only when chezmoi is absent; wedge/stale/.claude-orphan is the actionable non-zero. See host-is-factory-system-is-cartridge."

  # --- WORKTREE LIFECYCLE / parallel CELLS (scripts/cells.sh + scripts/reclaim-worktrees.py) ---
  LIMEN_RECLAIM_LEGACY_DISPATCH_WT:
    default: "auto"
    env: LIMEN_RECLAIM_LEGACY_DISPATCH_WT
    self_update: none
    owner: limen-daemon
    note: "Whether reclaim/debt discovery scans historical dispatch worktree roots after the active Scratch migration. Auto means enabled in live sessions and disabled when a test/probe supplies an explicit LIMEN_WORKTREE_ROOT."
  LIMEN_RECLAIM_LEGACY_DISPATCH_AGE_H:
    default: "$LIMEN_RECLAIM_MIN_AGE_H"
    env: LIMEN_RECLAIM_LEGACY_DISPATCH_AGE_H
    self_update: none
    owner: limen-daemon
    note: "Min idle hours before a legacy dispatch-root child can be reclaimed. Defaults to the dispatch reclaim age so old roots follow the same loss-free lifecycle gates."
  LIMEN_RECLAIM_LEGACY_WORKTREE_ROOTS:
    default: "$HOME/Workspace/.limen-worktrees"
    env: LIMEN_RECLAIM_LEGACY_WORKTREE_ROOTS
    self_update: none
    owner: limen-daemon
    note: "Colon-separated historical dispatch worktree roots scanned for cleanup after migration to LIMEN_WORKTREE_ROOT; the active dispatch root is skipped if listed here."
  LIMEN_RECLAIM_CLAUDE_WT:
    default: "1"               # ON — sweep .claude/worktrees too (the historical ~50GB blind spot)
    env: LIMEN_RECLAIM_CLAUDE_WT
    self_update: none
    owner: limen-daemon
    note: "Whether reclaim-worktrees.py ALSO sweeps LIMEN_ROOT/.claude/worktrees (EnterWorktree/bg/interactive cells), not just the dispatch root. Set 0 to disable. Same loss-free gates (clean+content-preserved+idle) + a longer idle age + a self/live-checkout guard. See worktree-lifecycle-blind-spot."
  LIMEN_RECLAIM_CLAUDE_AGE_H:
    default: 24                # interactive sessions can sit idle-but-alive; 24h clean+content-preserved ⇒ provably dead
    env: LIMEN_RECLAIM_CLAUDE_AGE_H
    self_update: none
    owner: limen-daemon
    note: "Min idle hours before a .claude/worktrees cell is eligible for reclaim. Longer than the dispatch root's 6h because an interactive/bg session can legitimately sit idle between beats."
  LIMEN_RECLAIM_AGY_SCRATCH:
    default: "auto"
    env: LIMEN_RECLAIM_AGY_SCRATCH
    self_update: none
    owner: limen-daemon
    note: "Whether reclaim/debt discovery includes children of LIMEN_AGY_SCRATCH_ROOT. Auto means enabled in live sessions and disabled when a test/probe supplies an explicit LIMEN_WORKTREE_ROOT. Physical scratch-root deletion remains governed by antigravity-scratch-bridge acceptance; generated-only cleanup may remove ignored cache/build payloads after the idle gate."
  LIMEN_RECLAIM_REPO_LOCAL_WT:
    default: "auto"
    env: LIMEN_RECLAIM_REPO_LOCAL_WT
    self_update: none
    owner: limen-daemon
    note: "Whether reclaim/debt discovery includes repo-local .worktrees roots, such as Portvs triptych worktrees. Auto means enabled in live sessions and disabled when a test/probe supplies an explicit LIMEN_WORKTREE_ROOT."
  LIMEN_RECLAIM_REPO_LOCAL_AGE_H:
    default: 24
    env: LIMEN_RECLAIM_REPO_LOCAL_AGE_H
    self_update: none
    owner: limen-daemon
    note: "Min idle hours before a repo-local .worktrees child can be reclaimed. Same loss-free gates as other worktrees."
  LIMEN_RECLAIM_REPO_LOCAL_ROOTS:
    default: ""
    env: LIMEN_RECLAIM_REPO_LOCAL_ROOTS
    self_update: none
    owner: limen-daemon
    note: "Optional colon-separated direct list of repo-local .worktrees roots. Empty means discover under LIMEN_RECLAIM_WORKSPACE_ROOTS."
  LIMEN_RECLAIM_PROTECTED_EXCLUSIONS:
    default: "<runtime-source>/institutio/governance/reconciliation-protected-exclusions.json"
    env: LIMEN_RECLAIM_PROTECTED_EXCLUSIONS
    self_update: none
    owner: limen-daemon
    note: "Tracked repo-relative hard-exclusion registry loaded from the exact runtime source by default. Missing or invalid input blocks the entire reclaim pass. An override is an explicit owner-supplied registry path, never an implicit fallback."
  LIMEN_RECLAIM_REGISTERED_WT:
    default: "auto"
    env: LIMEN_RECLAIM_REGISTERED_WT
    self_update: none
    owner: limen-daemon
    note: "Whether reclaim/debt discovery includes registered sibling git worktrees from LIMEN_RECLAIM_MAIN_REPOS. Auto means enabled in live sessions and disabled when a test/probe supplies an explicit LIMEN_WORKTREE_ROOT."
  LIMEN_RECLAIM_REGISTERED_AGE_H:
    default: 24
    env: LIMEN_RECLAIM_REGISTERED_AGE_H
    self_update: none
    owner: limen-daemon
    note: "Min idle hours before a registered sibling worktree can be reclaimed. Covers sibling Limen branches such as limen-main-trench-* that are not inside the central worktree roots."
  LIMEN_RECLAIM_WORKSPACE_CHECKOUTS:
    default: "0"
    env: LIMEN_RECLAIM_WORKSPACE_CHECKOUTS
    self_update: none
    owner: limen-daemon
    note: "Explicit bounded switch for lifecycle discovery to include Git checkout roots themselves under LIMEN_RECLAIM_WORKSPACE_ROOTS. Clean exact-HEAD remote-preserved clones may then be purged locally; dirty, unpushed, active, locked, and non-Git roots remain excluded."
  LIMEN_RECLAIM_WORKSPACE_CHECKOUT_AGE_H:
    default: 24
    env: LIMEN_RECLAIM_WORKSPACE_CHECKOUT_AGE_H
    self_update: none
    owner: limen-daemon
    note: "Min idle hours for a workspace checkout root when LIMEN_RECLAIM_WORKSPACE_CHECKOUTS=1."
  LIMEN_RECLAIM_MAIN_REPOS:
    default: "$LIMEN_ROOT:$HOME/Workspace/4444J99/portvs"
    env: LIMEN_RECLAIM_MAIN_REPOS
    self_update: none
    owner: limen-daemon
    note: "Colon-separated main repos whose git worktree lists define registered sibling worktrees for lifecycle pressure and reclaim discovery."
  LIMEN_RECLAIM_WORKSPACE_ROOTS:
    default: "$HOME/Workspace"
    env: LIMEN_RECLAIM_WORKSPACE_ROOTS
    self_update: none
    owner: limen-daemon
    note: "Colon-separated workspace roots searched for repo-local .worktrees directories, with cache/vendor folders pruned; when LIMEN_RECLAIM_WORKSPACE_CHECKOUTS=1, the same bounded discovery also includes Git checkout roots themselves."
  LIMEN_RECLAIM_WORKSPACE_MAX_DEPTH:
    default: 5
    env: LIMEN_RECLAIM_WORKSPACE_MAX_DEPTH
    self_update: none
    owner: limen-daemon
    note: "Maximum directory depth for repo-local .worktrees discovery under LIMEN_RECLAIM_WORKSPACE_ROOTS."
  LIMEN_RECLAIM_SIZE_TIMEOUT_SEC:
    default: 10
    env: LIMEN_RECLAIM_SIZE_TIMEOUT_SEC
    self_update: none
    owner: limen-daemon
    note: "Per-root du timeout for non-destructive worktree reclaim candidate size measurement."
  LIMEN_RECLAIM_SIZE_BUDGET_SEC:
    default: 60
    env: LIMEN_RECLAIM_SIZE_BUDGET_SEC
    self_update: none
    owner: limen-daemon
    note: "Total best-effort time budget for worktree reclaim candidate size measurement."
  LIMEN_DISK_PRESSURE_ESCALATE:
    default: "1"
    env: LIMEN_DISK_PRESSURE_ESCALATE
    self_update: none
    owner: limen-daemon
    note: "ON — when absolute free space is at/below the live resource-envelope requirement the heartbeat drops hygiene cadence to every beat until it drains. Set 0 to retain fixed hygiene cadence."
  LIMEN_CLONE_REAP_APPLY:
    default: "1"
    env: LIMEN_CLONE_REAP_APPLY
    self_update: none
    owner: limen-daemon
    note: "ON — clone-maintenance reaps pure pushed-mirror clones for real (the last step of clone→work→push→DELETE). Loss-free by construction (re-cloneable from origin; unpushed/untracked/dirty/active/core all skipped), so it is reversible and ungated. Set 0 for dry-run (report reapable clones without removing)."
  LIMEN_REAP_IDLE_DAYS:
    default: 2
    env: LIMEN_REAP_IDLE_DAYS
    self_update: none
    owner: limen-daemon
    note: "Min idle days before a pure pushed-mirror clone is reaped by reap-clones.py — WAIVED under disk pressure (a pushed mirror is loss-free at any age; when full we reclaim now)."
  LIMEN_REAP_MAX:
    default: 50
    env: LIMEN_REAP_MAX
    self_update: none
    owner: limen-daemon
    note: "Max clones reap-clones.py removes per run; the remainder is logged (never silently dropped) and reaped on the next beat."
  LIMEN_REAP_MAXDEPTH:
    default: 3
    env: LIMEN_REAP_MAXDEPTH
    self_update: none
    owner: limen-daemon
    note: "find -maxdepth for reap-clones.py clone discovery under LIMEN_WORKSPACE (repos nest one level under org dirs like organvm/*)."
  LIMEN_BRANCH_REAP_APPLY:
    default: "1"
    env: LIMEN_BRANCH_REAP_APPLY
    self_update: none
    owner: limen-daemon
    note: "ON — clone-maintenance reaps provably-landed LOCAL branch refs for real (the ref sibling of clone/worktree reaping). Loss-free by construction (tip is an ancestor of main, or the PR is MERGED with an un-advanced tip; reflog-recoverable), so reversible and ungated. Set 0 for dry-run (report reapable branches without deleting)."
  LIMEN_BRANCH_REAP_REPO_ROOT:
    default: "$LIMEN_ROOT"
    env: LIMEN_BRANCH_REAP_REPO_ROOT
    self_update: none
    owner: limen-daemon
    note: "Repository whose local branch refs reap-branches.py classifies and reaps. Defaults to Limen; cross-owner closeout may target another exact local checkout while acceptance and receipts remain rooted in LIMEN_ROOT."
  LIMEN_BRANCH_REAP_MAX:
    default: 100
    env: LIMEN_BRANCH_REAP_MAX
    self_update: none
    owner: limen-daemon
    note: "Max branches reap-branches.py deletes per run; the remainder is logged (never silently dropped) and reaped on the next hygiene beat."
  LIMEN_BRANCH_REAP_CHECK:
    default: '1'
    env: LIMEN_BRANCH_REAP_CHECK
    self_update: none
    owner: tabularius
    note: "Beat gate for the branch-reap sensor (scripts/reap-branches.py --check, sensors.yaml 0g9b). Spent branches accumulated unreaped (87 reapable, 15 provably landed) and the cost was paid by scripts/no-tasks-on-me.sh, a CLOSEOUT gate, which flipped exit 0 -> exit 1 inside forty minutes on 2026-08-14 because branches landed mid-session: a session could no longer tell 'I left something hanging' from 'the fleet's backlog grew'. The reap was owned all along (clone-maintenance.sh:145, armed) but never ran — hygiene is gated on VITALS_PRESSURE and this host sheds continuously, so the ran-for-real banner appears ZERO times in the beat log against 10 deferrals. Detection runs on the metabolize pass, which is not vitals-gated, so the finding surfaces even while the repair path is starved. Read-only; set 0 to silence."
  LIMEN_BRANCH_REAP_TIMEOUT:
    default: 120
    env: LIMEN_BRANCH_REAP_TIMEOUT
    self_update: none
    owner: tabularius
    note: "Per-run timeout (seconds) for the branch-reap sensor pass. Measured 25 s wall-clock against 623 refs with live PR lookups; 120 leaves headroom for a slow GitHub without letting a hung pass stall the beat."
  LIMEN_BRANCH_REAP_EVERY_MIN:
    default: 30
    env: LIMEN_BRANCH_REAP_EVERY_MIN
    self_update: none
    owner: limen-daemon
    note: "Self-throttle for a real --apply beat of reap-branches.py — it deletes at most once per this many minutes (a --check gate always runs). Mirrors the reclaim-worktrees throttle."
  LIMEN_BRANCH_REAP_GRACE_MIN:
    default: 60
    env: LIMEN_BRANCH_REAP_GRACE_MIN
    self_update: none
    owner: limen-daemon
    note: "--check only: a landed branch younger than this many minutes is the beat mid-digestion, not lingering — keeps the closeout gate satisfiable beside a continuously-merging fleet. --apply eligibility is ungraced."
  LIMEN_BRANCH_REAP_PROTECT:
    default: ""
    env: LIMEN_BRANCH_REAP_PROTECT
    self_update: none
    owner: limen-daemon
    note: "Extra branch names (space-separated) reap-branches.py NEVER deletes, on top of the built-in trunks (main/master/develop/trunk) and the default branch. Empty by default."
  LIMEN_BRANCH_REAP_PR_LIMIT:
    default: 3000
    env: LIMEN_BRANCH_REAP_PR_LIMIT
    self_update: none
    owner: limen-daemon
    note: "How many RECENT PRs reap-branches.py reads for proofs 2 (merged) and 3 (closed-unmerged). `gh pr list` returns the N most recent, so a limit below the repo's PR count silently blinds every proof for older heads — and an unseen PR is indistinguishable from no PR, i.e. it reads as live-work. Measured 2026-08-07 at the former hard-coded 800 against organvm/limen's 1724 PRs: of 241 local branches that HAD a PR, 132 were invisible (64 CLOSED, 50 OPEN, 18 MERGED) — the 50 OPEN being the sharp edge, since those heads were not protected as in-flight at all. Hitting this ceiling WARNs rather than truncating silently."
  LIMEN_REMOTE_REAP_APPLY:
    default: 0
    env: LIMEN_REMOTE_REAP_APPLY
    self_update: none
    owner: gitvs
    note: "DOUBLE-DARK arming for scripts/reap-remote-branches.py: even with --apply, a remote branch is deleted only when this is 1. Defaults 0 (unlike the local reaper's LIMEN_BRANCH_REAP_APPLY=1) because a remote delete is NOT reflog-recoverable — arm it deliberately."
  LIMEN_REMOTE_REAP_REPO_ROOT:
    default: "$LIMEN_ROOT"
    env: LIMEN_REMOTE_REAP_REPO_ROOT
    self_update: none
    owner: gitvs
    note: "Repository whose origin refs reap-remote-branches.py classifies and reaps. Defaults to Limen; cross-owner closeout may target another exact local checkout while acceptance and receipts remain rooted in LIMEN_ROOT."
  LIMEN_REMOTE_REAP_MAX:
    default: 100
    env: LIMEN_REMOTE_REAP_MAX
    self_update: none
    owner: gitvs
    note: "Max remote branches reap-remote-branches.py deletes per run; the remainder is logged and taken next run. Bounds the blast radius of the irreversible remote delete."
  LIMEN_REMOTE_REAP_EVERY_MIN:
    default: 30
    env: LIMEN_REMOTE_REAP_EVERY_MIN
    self_update: none
    owner: gitvs
    note: "Self-throttle: reap-remote-branches.py --apply skips if it ran within this many minutes (--force overrides). Keeps the estate-wide remote sweep off the tight beat."
  LIMEN_REMOTE_REAP_GRACE_MIN:
    default: 1440
    env: LIMEN_REMOTE_REAP_GRACE_MIN
    self_update: none
    owner: gitvs
    note: "--check only: a landed remote branch younger than this many minutes is digesting, not lingering. Default 1440 (24h), WIDER than the local reaper's 60m — a remote delete is not reflog-recoverable and other clones/CI may still hold the ref."
  LIMEN_REMOTE_REAP_PROTECT:
    default: ""
    env: LIMEN_REMOTE_REAP_PROTECT
    self_update: none
    owner: gitvs
    note: "Extra branch names (space-separated) reap-remote-branches.py NEVER deletes, on top of the built-in trunks (main/master/develop/trunk) and the default branch. Empty by default."
  LIMEN_REAP_CORE:
    default: "limen session-meta sovereign-systems--elevate-align portfolio portvs universal-mail--automation"
    env: LIMEN_REAP_CORE
    self_update: none
    owner: limen-daemon
    note: "Space-separated CORE repos reap-clones.py never removes even when they are a clean pushed mirror (the operator lives in them / the conductor needs them local)."
  LIMEN_RUNS_ON:
    default: ""
    env: LIMEN_RUNS_ON
    self_update: none
    owner: gitvs
    note: "GitHub Actions org/repo VARIABLE (vars context, not a shell env) that routes fleet workflows' runs-on. Unset/empty ⇒ 'ubuntu-latest' (hosted). 'self-hosted' flips ci.yml/limen-agent/limen-warp-oz/auto-scale/conductor-report to the $0 Mac runner lane (scripts/runner-install.sh) — PRIVATE repos only; pr-gate deliberately stays hosted (merge-critical). Declared here so the flip is registry-visible, though GitHub resolves it, not the shell."
  LIMEN_RUNNER_ORG:
    default: "organvm"
    env: LIMEN_RUNNER_ORG
    self_update: none
    owner: gitvs
    note: "Org whose runner estate scripts/runner-install.sh administers (registration token, default runner-group hardening: allows_public_repositories=false — the fork-PR code-exec invariant)."
  LIMEN_RUNNER_DIR:
    default: "~/Workspace/_actions-runner"
    env: LIMEN_RUNNER_DIR
    self_update: none
    owner: gitvs
    note: "Install directory for the self-hosted Actions runner (outside every repo/worktree so reclaim sweeps never touch it)."
  LIMEN_RUNNER_NAME:
    default: "limen-mac"
