    owner: gitvs
    note: "Star floor for the classify rule R7: a public repo with at least this many stars is proposed into the portal_public SEO lure tier even when it is not value-tier/seeded (traction is a discovered signal, never assumed)."
  LIMEN_COLLAB_APPLY:
