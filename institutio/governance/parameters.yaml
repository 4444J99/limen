  # --- Claude Code stable-identity bundle keeper (0g8d): keep the disclaimed identity off versioned paths ---
  LIMEN_CLAUDE_IDENTITY_BUNDLE:
    default: "1"
    env: LIMEN_CLAUDE_IDENTITY_BUNDLE
    self_update: none
    owner: tabularius
    note: "Gate for the claude-identity-bundle sensor (sensors.yaml 0g8d). Claude Code re-execs itself with macDisclaimResponsibility:true, so no supervising host can carry a TCC identity into it; the identity it adopts is `await _jb() ?? process.execPath`. When 1, each beat runs scripts/claude-identity-bundle.py --repair, keeping <store>/ClaudeCode.app present with a hardlink whose inode matches the running binary — the condition for _jb()'s early return, which skips the unlink/link pair that concurrent session starts can race into EEXIST and thereby demote a session to a versioned identity (a new consent client per update). Idempotent; writes exactly the vendor's own bytes; never signs, never deletes a version, never edits TCC. Set 0 to silence."
  LIMEN_CLAUDE_STORE:
    default: "~/.local/share/claude"
    env: LIMEN_CLAUDE_STORE
    self_update: none
    owner: tabularius
    note: "Override for the Claude Code data store (the directory holding versions/ and ClaudeCode.app) read by scripts/claude-identity-bundle.py. Unset in production — it exists so the keeper's contracts in cli/tests/test_claude_identity_bundle.py can build a miniature store under tmp_path instead of mutating the real one."
  LIMEN_CLAUDE_LAUNCHER:
    default: "~/.local/bin/claude"
    env: LIMEN_CLAUDE_LAUNCHER
    self_update: none
    owner: tabularius
    note: "Override for the launcher symlink whose target names the running Claude Code binary, read by scripts/claude-identity-bundle.py. Unset in production; test-injection sibling of LIMEN_CLAUDE_STORE."
  LIMEN_CLAUDE_APPLICATIONS_DIR:
    default: "~/Applications"
    env: LIMEN_CLAUDE_APPLICATIONS_DIR
    self_update: none
    owner: tabularius
    note: "Override for the directory holding the vendor's deep-link handler bundle ('Claude Code URL Handler.app'), read by scripts/claude-identity-bundle.py when it enumerates the vendor-bundle class for IF-GATEKEEPER-INERT. Unset in production; test-injection sibling of LIMEN_CLAUDE_STORE."
  LIMEN_CLAUDE_LSREGISTER_DUMP:
    default: ""
    env: LIMEN_CLAUDE_LSREGISTER_DUMP
    self_update: none
    owner: tabularius
    note: "Path to a canned `lsregister -dump` capture, read by scripts/claude-identity-bundle.py instead of shelling out. Unset in production; exists so the keeper's contracts can assert registration state without a live LaunchServices. Sibling of LIMEN_TCC_LSREGISTER_DUMP."
  LIMEN_CLAUDE_LSREGISTER_BIN:
