    owner: tabularius
    note: "Override for the active LaunchAgents directory used by scripts/launch-agent-liveness.py. Empty (the default) uses ~/Library/LaunchAgents. Set to a temp dir in tests so restore never touches the host's real launchd config; never set on the live host."

