    owner: tabularius
    note: "Override for the quarantine directory (where a quiesce moves disabled plists) scanned by scripts/launch-agent-liveness.py to recover a critical agent. Empty (the default) uses ~/Library/LaunchAgents.disabled. Set to a temp dir in tests; never set on the live host."

  LIMEN_LAUNCHCTL_UID:
