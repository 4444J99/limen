  # --- SELF-HEAL: the PR-repair FACTORY — turn REFUSED PRs (CI-red / conflicting) into fixable tasks ---
  LIMEN_SELF_HEAL:
    default: 1                  # default-ON: emit HEAL-cifix / HEAL-rebase tasks each HEAL beat
    env: LIMEN_SELF_HEAL
    self_update: none
    owner: heal
    note: "Toggle for the self-heal PR-repair factory (scripts/self-heal.py) wired into the HEAL beat. 1=on. Classifies the fleet's refused PRs and emits bounded HEAL-cifix/HEAL-rebase tasks so the router+dispatcher fix them and merge-drain lands them — merge-drain is the bouncer, this is the factory. Self-acquires the queue-lock (skips cleanly when the daemon holds it), already-queued-deduped, fail-open. 0=off."
  LIMEN_SELF_HEAL_TIMEOUT:
    default: 300                # seconds: cap the network-touching classify+emit run inside the beat
    env: LIMEN_SELF_HEAL_TIMEOUT
    self_update: none
    owner: heal
    note: "Hard timeout (s) for the self-heal factory inside the HEAL beat so a slow gh enumeration never wedges the heartbeat. Raised 150->300 on 2026-08-15: the full-fleet search enumeration alone can take ~2 min at the estate's current open-PR count (see LIMEN_PR_SCAN_TIMEOUT), and the old cap left no room for the classify window."
  LIMEN_PR_SCAN_TIMEOUT:
    default: 120                # seconds: gh timeout for the ONE full-fleet `gh search prs` enumeration call
    env: LIMEN_PR_SCAN_TIMEOUT
    self_update: none
    owner: heal
    note: "Per-call gh timeout for the shared open-PR enumeration (scripts/_pr_scan.py callers: self-heal.py, merge-drain.py). The search pages ~10 requests near GitHub's 1000-result ceiling and outgrew the organs' generic 60s gh timeout (self-heal-scan failed 37 consecutive beats to 2026-08-15). A timeout now surfaces as a loud failed enumeration, never a traceback."
  LIMEN_SELF_HEAL_SCAN:
    default: 30                 # rotating window: PRs classified per beat (self-heal.py --scan)
    env: LIMEN_SELF_HEAL_SCAN
    self_update: none
    owner: heal
    note: "How many PRs the factory classifies per beat (a rotating window over the full fleet), so each beat does a bounded slice rather than the whole backlog at once."
  LIMEN_SELF_HEAL_STALE:
    default: "1"
    env: LIMEN_SELF_HEAL_STALE
    self_update: none
    owner: heal
    note: "Gate for the self-heal-stale beat sensor (institutio/governance/sensors.yaml section 0o4): scripts/cloud-maintenance-freshness.py fails advisory when the latest successful workflow_dispatch receipt for cloud-maintenance.yml is absent or older than 6h. A local log mtime is not success custody. The sensor is read-only and emits no corpus content. Read by the beat-sensors runner via the SENSORS registry. 0 disables the pass."
  LIMEN_HEAL_RECONCILE_SCAN_MAX:
    default: 1000               # ceiling on self-heal.py's full-fleet enumeration (--reconcile-scan-max)
    env: LIMEN_HEAL_RECONCILE_SCAN_MAX
    self_update: none
    owner: heal
    note: "Cap on the single `gh search prs` enumeration self-heal.py draws its rotating window from. Named RECONCILE, not SCAN, because the reconcile pass is what constrains it — four sibling organs (merge-drain, pr-lifecycle-autotype, owner-route-drain) cap the same enumeration under the plain name `--scan-max`/LIMEN_MERGE_SCAN_MAX and those really are cost knobs, since none of them reads absence from the list. Transferring that meaning here is the specific mistake this rename exists to prevent. It has a SECOND consumer with the opposite requirement, and that is what makes the number load-bearing rather than a cost knob: the reconcile pass retires any active HEAL task whose PR is absent from this list, so a cap below the live open-PR count turns a prefix into a false closure proof. self-heal.py refuses to retire from a truncated set, which is safe but silent — measured 2026-08-09, the shipped default of 500 against 818-822 live open PRs meant the beat printed `retirement SKIPPED ... would-retire=0` every beat while the same run at 900 reported `would-retire=257`; the retirement valve was wired, scheduled, and had never fired. 1000 is GitHub's search-result ceiling, not a preference — `gh search --limit N` above it returns an EMPTY list rather than an error (_pr_scan.SEARCH_RESULT_CEILING clamps it), so raising this further disables the organ instead of widening it. Once the estate exceeds 1000 open PRs, search cannot answer completely at all and retirement must move to a paginated REST enumeration like scripts/check-heal-retirement.py's."
  LIMEN_HEAL_RETIREMENT_MAX_PAGES:
    default: 20                 # runaway guard on REST pagination in check-heal-retirement.py
    env: LIMEN_HEAL_RETIREMENT_MAX_PAGES
    self_update: none
    owner: heal
    note: "Runaway bound on the paginated REST open-PR enumeration behind scripts/check-heal-retirement.py — NOT a coverage cap. REST pagination proves its own completeness by ending on a short page, so this only stops a pathological loop; hitting it reports TRUNCATED (exit 2, flags nothing) because a prefix must never pass as the whole set. That distinction is load-bearing: absence from the enumerated set is what marks a HEAL task retirable, so an incomplete list makes open PRs read as closed. The predicate uses REST rather than `gh search` for exactly this reason, plus pool isolation — measured 2026-08-09 with two lanes sweeping PRs, `graphql` sat at 0/5000 (gh search runs on it, returning an EMPTY list) while `core` held 4887/5000, and the search-based gate on main reported '51 active HEAL tasks name closed/merged PRs' when the true count was 15."
  LIMEN_HEAL_DISPATCH:
    default: 1                  # default-ON: apply verify-dispatch.py's findings each HEAL beat
    env: LIMEN_HEAL_DISPATCH
    self_update: none
    owner: heal
    note: "Toggle for scripts/heal-dispatch.py --apply wired into the HEAL beat. 1=on. Applies verify-dispatch.py's own findings (PR_MERGED/PR_CLOSED/DISPATCHED_NO_PR status repair, CHRONIC reopened-tasks→parked, chronic needs_human→failed_blocked re-homing) — the owner conductor-report.yml's dry-run-only preview step never had, so its reported drift was never actually applied by anything. Self-acquires the queue-lock (skips cleanly when the daemon holds it), only flips status + a heal log entry, never deletes/pushes/merges/dispatches. 0=off."
  # --- LANE FITNESS (dispatch proactive reroute): per-(agent, class) conversion evidence ---
