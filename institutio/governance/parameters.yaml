    owner: integrity
    note: "Test-only LaunchServices inventory fixture. Production leaves it empty and performs the bounded read-only lsregister probe."

  # --- EVOCATOR: the summoner (keep canonical truths present in every channel) ---
  LIMEN_EVOCATOR:
    default: "1"               # ON — a portal that doesn't run isn't a portal
    env: LIMEN_EVOCATOR
    self_update: none
    owner: evocator
