  # --- Pre-publication sweep (scripts/publish-sweep.py, sensors.yaml github-publish-sweep) ---
  LIMEN_PUBLISH_SWEEP:
    default: 1
    env: LIMEN_PUBLISH_SWEEP
    self_update: none
    owner: gitvs
    note: "Master on/off for the publish-candidate sweep sensor. A sweep receipt is the only thing that authorizes a private→public flip, and it expires (LIMEN_SWEEP_FRESH_DAYS) — so without this sensor the receipts rot and apply-visibility has no verdict for any candidate. Read-only: it clones and scans, never flips. Visibility mutation stays behind LIMEN_VISIBILITY_APPLY."
  LIMEN_BEAT_PUBLISH_SWEEP:
    default: 24
    env: LIMEN_BEAT_PUBLISH_SWEEP
    self_update: none
    owner: gitvs
    note: "Cadence (beats) for the publish-candidate sweep. Defaults slower than most sensors because each candidate is a full-history clone; LIMEN_SWEEP_MAX bounds how many run per pass, so the candidate set rolls forward across beats rather than re-cloning the whole estate each cadence."
  LIMEN_PUBLISH_SWEEP_TIMEOUT:
    default: 900
    env: LIMEN_PUBLISH_SWEEP_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Per-run timeout (seconds) for the publish-candidate sweep. Generous relative to other sensors: the unit of work is a full-history clone plus a blob scan per candidate. The runner kills the command group on overrun and the beat continues fail-open — a timed-out sweep leaves the prior receipt in place, which correctly ages into staleness rather than faking a green."
  # --- IDEAL-FORMS distance (scripts/check-ideal-forms.py, sensors.yaml ideal-forms-distance) ---
  LIMEN_IDEAL_FORMS:
    default: 1
    env: LIMEN_IDEAL_FORMS
    self_update: none
    owner: governance
    note: "Master on/off for the ideal-forms distance sensor. 1 (default) re-derives every named ideal's distance from its declared probe on its cadence; 0 disables it. This is the HEARTBEAT half of IF-LEDGER-OF-IDEALS — pr-gate already runs the predicate on any PR touching the registry or the ledger, but distances measure the SYSTEM, not the diff, so they rot with neither file edited. That is exactly how the ledger sat 34 days with its own entry reading 'not yet wired into a verification/heartbeat lane' while IF-LIVE-TREE-COHERENCE drifted 5x underneath it. Advisory only: a remaining distance is an ideal's normal state, not a build break."
  LIMEN_BEAT_IDEAL_FORMS:
    default: 12
    env: LIMEN_BEAT_IDEAL_FORMS
    self_update: none
    owner: governance
    note: "Cadence (every N beats) of the ideal-forms distance sensor declared in sensors.yaml. Slower than most rungs by design — an ideal form moves on the scale of a workstream, not a beat, and the probes it runs include live host/network measurements. The generic scheduled runner resolves this override; no cadence constant lives in the shell."
  LIMEN_IDEAL_FORMS_TIMEOUT:
    default: 300
    env: LIMEN_IDEAL_FORMS_TIMEOUT
    self_update: none
    owner: governance
    note: "Per-run timeout (seconds) for the ideal-forms distance sweep. Generous because --measure runs every declared probe including the network ones (the estate sweep, the decorum sweep) that pr-gate deliberately skips. The runner kills the group on overrun and the beat continues fail-open."

  LIMEN_DECORUM:
    default: 1
    env: LIMEN_DECORUM
    self_update: none
    owner: decorum
    note: "Master on/off for the DECORVM professionalization keeper sensor (scripts/decorum-keeper.py, sensors.yaml decorum). 1 (default) federates the estate's six quality organs into one verdict at logs/decorum.json on its declared cadence and reports any public egg-face; 0 disables it. READ-ONLY — the effector that files tasks/issues from findings is a separate gate (LIMEN_DECORUM_APPLY)."
  LIMEN_BEAT_DECORUM:
    default: 6
    env: LIMEN_BEAT_DECORUM
    self_update: none
    owner: decorum
    note: "Cadence (every N beats) of the DECORVM keeper sensor declared in sensors.yaml. The generic scheduled runner resolves this environment override; heartbeat-loop.sh contains no sensor-specific cadence constant."
  LIMEN_DECORUM_TIMEOUT:
    default: 120
    env: LIMEN_DECORUM_TIMEOUT
    self_update: none
    owner: decorum
    note: "Per-run timeout (seconds) resolved by the generic sensor runner for the DECORVM keeper sweep (which spawns the moat-audit subprocess). The runner kills the full command group on overrun and the beat continues fail-open."
  LIMEN_DECORUM_APPLY:
    default: 0
    env: LIMEN_DECORUM_APPLY
    self_update: none
    owner: decorum
    note: "Arms the DECORVM effector (the mentor): 0 (default) plans one bounded ticket per (lane, surface) finding and files nothing; 1 submits each through the tabularius broker as an idempotent create-only upsert (id DECORUM-<lane>-<surface>, so a re-run never re-files), capped by LIMEN_DECORUM_MAX (default 8). Never sends and never wipes — filing a ticket is the only mutation. Ships DARK; observe the DRY plan in the beat log first, and add fleet_runtime: \"1\" here when arming so enactment-audit locks it live."
  LIMEN_DECORUM_MAX:
    default: 8
    env: LIMEN_DECORUM_MAX
    self_update: none
    owner: decorum
    note: "Cap on the number of NEW professionalization tickets the DECORVM effector files per run (idempotent by id, so already-filed findings never re-file). Bounds the board churn while the estate's findings drain over successive beats."
  LIMEN_DECORUM_ISSUES_APPLY:
    default: 0
    env: LIMEN_DECORUM_ISSUES_APPLY
    self_update: none
    owner: decorum
    note: "Arms the DECORVM issue mirror (the SELF-CLOSING sink, github-native process organ): 0 (default) plans the mirror and touches nothing; 1 opens one `decorum`-labelled GitHub issue per open finding at/above effector.issue_floor (identity by a <!-- decorum:<id> --> body marker, capped by LIMEN_DECORUM_MAX) and AUTO-CLOSES any decorum issue whose finding has cleared. A human close while the finding still stands is a veto — never reopened. Never sends, never deletes. Separate from LIMEN_DECORUM_APPLY because opening public issues is a bigger step than filing a board task; ships DARK, observe the DRY plan first."
  LIMEN_DECORUM_SURFACES:
    default: "$LIMEN_ROOT/institutio/governance/decorum-surfaces.yaml"
    env: LIMEN_DECORUM_SURFACES
    self_update: none
    owner: decorum
    note: "Path override for the DECORVM sources/threshold registry (declared departments + severity floor + polish/off-platform config; never a surface list — those derive from the department artifacts). Defaults to the in-repo institutio/governance/decorum-surfaces.yaml."
  LIMEN_GITVS_PORTAL_STARS:
