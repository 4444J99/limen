    env: LIMEN_OPENCODE_DB
    self_update: none
    owner: continuity
    note: "OpenCode SQLite history database used by opencode-db-corpus-intake.py for private prompt-corpus preservation receipts. Protected agent state; never deleted by the intake tool."
  LIMEN_OPENCODE_DB_ARCHIVE_ROOT:
