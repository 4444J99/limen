  LIMEN_BEAT_GH_USAGE:
    default: 24
    env: LIMEN_BEAT_GH_USAGE
    self_update: none
    owner: gitvs
    note: "Cadence (every N beats) of the github-actions-usage sensor. Spend moves daily, not per-beat — a slow cadence is honest; the omega rung re-runs it live on demand."
