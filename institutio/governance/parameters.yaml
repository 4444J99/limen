    owner: gitvs
    note: "Double-dark gate on collab-sync.py --apply, which removes UNDECLARED collaborator access only (the exposure-reducing direction of the repo_collaborators resource). Invites and role PUTs are never machine-run regardless of this flag — outbound is his hand on L-PARTNER-GRANTS; gitvs reconcile additionally skips the delegate via its approval lever."
  LIMEN_VISIBILITY_APPLY:
    default: 0
