  LIMEN_RESIDUE_REMOTE_BRANCHES:
    default: 100
    env: LIMEN_RESIDUE_REMOTE_BRANCHES
    self_update: none
    owner: continuity
    note: "Cap on remote-tracking branch refs. REPORT-ONLY in the census: relief is scripts/reap-remote-branches.py, double-dark behind a filed lever whose acceptance ledger has never been written to. Counting it is useful; calling it a breach every run would make the census permanently red on something it may not act on."
  LIMEN_RESIDUE_AGENT_RUNTIME_MIB:
    default: 2048
    env: LIMEN_RESIDUE_AGENT_RUNTIME_MIB
    self_update: none
    owner: continuity
    note: "Cap on .agent-runtime (harness state: opencode/codex/claude/gemini). Relief is scripts/agent-state-metabolism.py, which is WRITTEN AND WIRED TO NOTHING — and cannot simply be beat-wired: it needs the Archive4T vault mounted, dual-restoration verification and private receipts, and carries its own RETIREMENT_AUTHORIZATION_REQUIRED gate. Retiring it is the human-gated archive-then-delete step, so the census measures and names it rather than arming it."
  LIMEN_RESIDUE_LOGS_MIB:
    default: 256
    env: LIMEN_RESIDUE_LOGS_MIB
    self_update: none
    owner: continuity
    note: "Cap on logs/ (gitignored receipt tree). scripts/disk-capacity.py is beat-wired and armed but only reaps gitignored probes and truncates one error log; the rest has no rotation."
  LIMEN_RESIDUE_ATOM_LEDGER_MIB:
    default: 128
    env: LIMEN_RESIDUE_ATOM_LEDGER_MIB
    self_update: none
    owner: continuity
    note: "Cap on docs/prompt-atom-ledger.json — the largest single residue on the machine and the only class with NO reaper at all. It is a regenerable snapshot of the private corpus (cli/src/limen/prompt_corpus.py writes both halves), i.e. precisely what the Meeseeks law calls a hot cache: re-summonable, therefore not owed a permanent home on disk."
  LIMEN_GH_USAGE_TIMEOUT:
    default: 120
    env: LIMEN_GH_USAGE_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Per-run timeout (seconds) for the github-actions-usage sensor, resolved by the generic scheduled runner; overrun kills the command group and the beat continues fail-open."
  LIMEN_ACTIONS_BUDGET:
    default: 25
    env: LIMEN_ACTIONS_BUDGET
    self_update: none
    owner: gitvs
    note: "Monthly NET Actions spend ceiling (USD) for gitvs.py usage --check. Empty/unset ⇒ derived from estate.yaml budgets.actions_spend.monthly_net_usd_max (the registry owns the default; this env is the operator override). Mirrors orgs.canonical.actions_spending_limit_usd — the GitHub-side spending limit is his-hand (the runbook step 2)."
  LIMEN_RUNNER_ADMISSION_PROBE_REPO:
    default: "organvm/limen"
    env: LIMEN_RUNNER_ADMISSION_PROBE_REPO
    self_update: none
    owner: gitvs
    note: "Repository whose newest completed Actions run is inspected for GitHub's billing-related runner-admission annotation. Presence records provider text only; it does not establish account state, causal ownership, or remediation."
  LIMEN_REVIEW_GATE:
    default: 0
    env: LIMEN_REVIEW_GATE
    self_update: none
    owner: gitvs
    note: "Merge half of the multi-agent review engine: 1 makes merge-policy.sh HOLD on unresolved review threads (fail-open on GraphQL errors). Ships DARK — flip conductor-first only after self-heal's REVIEW-FEEDBACK heal tasks demonstrably drain threads; estate-wide bot threads nobody resolves would otherwise jam every merge."
  LIMEN_OBSERVATORY:
    default: 0
    env: LIMEN_OBSERVATORY
    self_update: none
    owner: observatory
    note: "Master on/off for the registry-declared OBSERVATORY legibility-and-traction sensor (observatory-run in sensors.yaml). Ships DARK (0): the organ is registered but idle until armed by lever L-OBSERVATORY-ACTIVATE. 1 runs the whole loop (collect→analyze→reconcile→brief) DRY on its declared cadence. Proposal writes remain a separate armed valve (OBSERVATORY_APPLY)."
  LIMEN_OBSERVE_RECEIPT:
    default: "logs/observe-once.json"
    env: LIMEN_OBSERVE_RECEIPT
    self_update: none
    owner: observatory
    note: "Optional private destination for the counts-only `limen observe --once` receipt. The default is the gitignored runtime log seat; probe output and private facts are never persisted in this receipt."
  LIMEN_BEAT_OBSERVATORY:
    default: 24
    env: LIMEN_BEAT_OBSERVATORY
    self_update: none
    owner: observatory
    note: "Cadence (every N beats) of the OBSERVATORY loop declared in sensors.yaml. The generic scheduled runner resolves this override; metabolize.sh contains no sensor-specific cadence constant."
  LIMEN_OBSERVATORY_TIMEOUT:
    default: 480
    env: LIMEN_OBSERVATORY_TIMEOUT
    self_update: none
    owner: observatory
    note: "Per-run timeout (seconds) resolved by the generic sensor runner for the OBSERVATORY loop. The runner kills the command group on overrun and the beat continues fail-open. 480 covers the full-field pass (~50 light snapshots + 17 estate surfaces on top of the deep winners; the 3-winner loop measured 106s)."
  LIMEN_OBSERVATION_FEED:
    default: 1
    env: LIMEN_OBSERVATION_FEED
    self_update: none
    owner: observatory
    note: "Master on/off for the observation-feed heartbeat sensor (scripts/observation-feed.py). Emits unified observation telemetry (vitals + bifrons + observatory) to logs/observation/feed.jsonl and feed-latest.json."
  LIMEN_BEAT_OBSERVATION_FEED:
    default: 12
    env: LIMEN_BEAT_OBSERVATION_FEED
    self_update: none
    owner: observatory
    note: "Cadence (every N beats) of the observation-feed sensor in sensors.yaml. Emits system telemetry snapshot on the beat."
  LIMEN_OBSERVATION_FEED_TIMEOUT:
    default: 60
    env: LIMEN_OBSERVATION_FEED_TIMEOUT
    self_update: none
    owner: observatory
    note: "Per-run timeout (seconds) for the observation-feed telemetry collector."
  LIMEN_DEPENDABOT_GUARD:
    default: "1"               # ON — detect drift in the Tier-2 deferral owner (Dependabot security-updates)
    env: LIMEN_DEPENDABOT_GUARD
    self_update: none
    owner: gitvs
    note: "Beat gate for the dependabot-security-guard sensor (scripts/dependabot-security-guard.py). estate-audit-heal defers framework-major (Tier-2) audit advisories to Dependabot; this guards that the deferral's owner stays enabled — the org's npm/pnpm audit-CI repos must keep Dependabot security-updates + alerts ON. On drift (a posture OFF) the sensor exits non-zero. Read-only (API reads). Set 0 to silence."
  LIMEN_DEPENDABOT_GUARD_APPLY:
    default: "0"               # OFF (DARK) — detection-only until armed; then re-enables drifted repos
    env: LIMEN_DEPENDABOT_GUARD_APPLY
    self_update: none
    owner: gitvs
    note: "Effector arm for dependabot-security-guard (observable-before-autonomous, the LIMEN_MAIN_GREEN_APPLY pattern, read internally). When 0 (default) drift is only detected + printed. When 1, the guard re-ENABLES (ON only, never disables — a benign reversible safety setting) each drifted repo's Dependabot security-updates (`gh repo edit --enable-automated-security-fixes`) + vulnerability-alerts (PUT), capped by LIMEN_DEPENDABOT_GUARD_MAX. Arm after watching the detection log prove out."
  LIMEN_BEAT_DEPENDABOT_GUARD:
    default: 24
    env: LIMEN_BEAT_DEPENDABOT_GUARD
    self_update: none
    owner: gitvs
    note: "Cadence (every N heartbeat beats) of the dependabot-security-guard sensor. Security-update posture is low-churn (rarely toggles), so a daily-class cadence is honest; the check is a handful of read-only API calls."
  LIMEN_DEPENDABOT_GUARD_TIMEOUT:
    default: 300
    env: LIMEN_DEPENDABOT_GUARD_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Per-run timeout (seconds) for the dependabot-security-guard sensor; a handful of gh API reads/enables. The runner kills the group on overrun and the beat continues fail-open."
  LIMEN_DEPENDABOT_GUARD_MAX:
    default: 10
    env: LIMEN_DEPENDABOT_GUARD_MAX
    self_update: none
    owner: gitvs
    note: "Per-run cap on how many drifted repos the guard re-enables in one armed pass — a first arming can't fan out uncontrolled. The audit-CI scope is small (~8), so 10 covers it; remaining drift heals next beat."
  LIMEN_DEPENDABOT_GUARD_OWNER:
    default: "organvm"
    env: LIMEN_DEPENDABOT_GUARD_OWNER
    self_update: none
    owner: gitvs
    note: "GitHub owner/org whose audit-CI repos the guard enumerates via `gh search code`. Default organvm."
  LIMEN_DEPENDABOT_GUARD_REPOS:
    default: ""
    env: LIMEN_DEPENDABOT_GUARD_REPOS
    self_update: none
    owner: gitvs
    note: "Test/override hook for dependabot-security-guard: colon-separated full repo names (owner/repo) instead of the derived `gh search code` discovery. Empty (default) → discover. Used by the hermetic test and bounded armed rehearsals; never set in production."
  OBSERVATORY_FIELD_LIMIT:
    default: 50
    env: OBSERVATORY_FIELD_LIMIT
    self_update: none
    owner: observatory
    note: "The whole day's trending FIELD studied per beat (one bounded search; GitHub caps a page at 100). The top OBSERVATORY_WINNERS_LIMIT of the field get the deep treatment (full snapshot + matched controls); the tail gets light snapshots (meta+README, 2 calls each) for prevalence and inward-facing evidence. Never below the winners limit; the collect report records field_total/field_studied/field_dropped — no silent caps. Degrades to the winners limit when gh rate headroom < 20% (recorded as degraded: true)."
  LIMEN_EXPERIENCE_AUDIT:
    default: "1"
    env: LIMEN_EXPERIENCE_AUDIT
    self_update: none
    owner: observatory
    note: "Master on/off for the experience-drift beat sensor (visitor-experience audit sweep -> posture check -> bounded backlog filing). All three steps are read-only/dry until the backlog valve arms; 0 disables the pass. The sweep is fail-open: with playwright/chromium present it runs the full browser tier, otherwise it degrades to the http tier and never breaks the beat."
  LIMEN_BEAT_EXPERIENCE:
    default: 24
    env: LIMEN_BEAT_EXPERIENCE
    self_update: none
    owner: observatory
    note: "Cadence (every N beats) of the experience-drift sensor. Deployed surfaces move on human timescales; a slow cadence is honest and keeps the browser probe off the hot path."
  LIMEN_EXPERIENCE_TIMEOUT:
    default: 900
    env: LIMEN_EXPERIENCE_TIMEOUT
    self_update: none
    owner: observatory
    note: "Per-run timeout (seconds) for the experience-drift sensor steps; also the sweep's own budget (scripts/experience-audit.py reads it to cap the browser pass). The runner kills the command group on overrun and the beat continues fail-open. 900 covers a ~20-surface browser sweep with a 25s nav cap each."
  LIMEN_EXPERIENCE_BACKLOG_APPLY:
    default: "0"
    env: LIMEN_EXPERIENCE_BACKLOG_APPLY
    self_update: none
    owner: observatory
    note: "Armed valve for generate-experience-backlog.py task filing on the beat: 0 (default) prints the plan; 1 appends bounded EXP-* tasks to the board (floor/cap/dedup guarded). The effector also requires the literal --apply flag, so both the flag AND this env must be set to write."
  LIMEN_EXPERIENCE_SURFACES:
    default: "$LIMEN_ROOT/experience-surfaces.json"
    env: LIMEN_EXPERIENCE_SURFACES
    self_update: none
    owner: observatory
    note: "Path override for the experience-audit overlay (budgets/skips/expected-title only; never URLs — the surface set derives from the corpus links registry). Defaults to the repo-root experience-surfaces.json, the sibling of link-surfaces.json."
  LIMEN_EXPERIENCE_FLOOR:
    default: 6
    env: LIMEN_EXPERIENCE_FLOOR
    self_update: none
    owner: observatory
    note: "Keep at least this many open experience-class tasks on the board; generate-experience-backlog.py tops up to it."
  LIMEN_EXPERIENCE_MAX:
    default: 6
    env: LIMEN_EXPERIENCE_MAX
    self_update: none
    owner: observatory
    note: "Hard cap on experience tasks generated per run (anti-flood)."
  LIMEN_BIFRONS:
    default: 1
    env: LIMEN_BIFRONS
    self_update: none
    owner: bifrons
    note: "Master on/off for the registry-declared BIFRONS star<->contribution portal sensor (bifrons-portal in sensors.yaml). Ships LIVE (1): the metabolize beat is read-only absorb + internal prepare — no send, no spend — so it runs unbidden per the aliveness law. 0 gates it dormant. The one external write (an upstream PR) rides the existing outbound-send valve, never a BIFRONS lever."
  LIMEN_BEAT_BIFRONS:
    default: 24
    env: LIMEN_BEAT_BIFRONS
    self_update: none
    owner: bifrons
    note: "Cadence (every N beats) of the BIFRONS portal beat declared in sensors.yaml. The generic scheduled runner resolves this override; metabolize.sh contains no sensor-specific cadence constant."
  LIMEN_BIFRONS_TIMEOUT:
    default: 180
    env: LIMEN_BIFRONS_TIMEOUT
    self_update: none
    owner: bifrons
    note: "Per-run timeout (seconds) resolved by the generic sensor runner for the BIFRONS portal beat. The runner kills the command group on overrun and the beat continues fail-open."
  LIMEN_BIFRONS_BUDGET:
    default: 3
    env: LIMEN_BIFRONS_BUDGET
    self_update: none
    owner: bifrons
    note: "Max new stars/exchanges the BIFRONS beat absorbs + prepares per cycle (bounds gh-API usage; the effector is `organvm portal metabolize --budget N`). Small by design — the beat converges over many cycles rather than one heavy sweep."
  OBSERVATORY_APPLY:
    default: 0
    env: OBSERVATORY_APPLY
    self_update: none
    owner: observatory
    note: "Arms the OBSERVATORY human-gated proposal write: 0 (default) records the daily experiment only in the organ-owned logs/observatory/proposals.jsonl; 1 additionally homes the lever in his-hand-levers.json (idempotent by id). Never auto-applies a public surface change."
  OBSERVATORY_CAPTURE:
    default: 0
    env: OBSERVATORY_CAPTURE
    self_update: none
    owner: observatory
    note: "Arms P3-CAPTURE — the live-homepage fetch (surface.capture_site, stdlib urllib, no new dep). 0 (default) = README-only surface features, byte-identical. 1 = for a winner/control with a declared homepage, fetch it and merge site_* first-impression features (demo above fold, visible CTA, outcome-in-headline) into the snapshot. Read-only against public web surfaces; fail-open on unreachable/blocked/JS-only sites."
  OBSERVATORY_LLM:
    default: 0
    env: OBSERVATORY_LLM
    self_update: none
    owner: observatory
    note: "Arms P2-LLM — the optional evidence-constrained interpretation of the daily brief (observatory/interpret.py). 0 (default) = fully deterministic brief, byte-identical. 1 = ask a synthesis-class model (Opus via model_selection) to explain, in the evidence's own terms, why the top mechanisms win and how to transfer them; attaches a bounded 'interpretation' string to the brief. Reached via a bounded `claude -p` subprocess (opt-in, consumes budget), fail-open on missing binary / timeout / non-zero exit / empty output — the deterministic core is never mutated."
  OBSERVATORY_SYNTH_ENABLED:
    default: 0
    env: OBSERVATORY_SYNTH_ENABLED
    self_update: none
    owner: observatory
    note: "Arms P2-SYNTH — the weekly KEEP/TEST/REJECT synthesis (observatory/synthesis.py), the 5th executive pipeline stage. 0 (default) = inert (status 'off', writes nothing). 1 = at most once per ISO week (a state-file gate), fold mechanisms.jsonl history into standing priors: KEEP (recurs with transferable priority), TEST (too new to judge), REJECT (recurs but never pays off). Writes recommendations to synthesis-weekly-latest.json only — never edits the human-curated mechanisms.yaml. Fail-open."
  LIMEN_MARKETPLACE_APPLY:
    default: 0
    env: LIMEN_MARKETPLACE_APPLY
    self_update: none
    owner: gitvs
    note: "DOUBLE-DARK arming for scripts/sync-marketplace-config.py: even with --apply, it opens a cross-repo config PR only when this is 1. Defaults 0 — a config PR touches OTHER repos (the fan-out), so arm it deliberately. The conductor's own configs live in-repo and need no push."
  LIMEN_MARKETPLACE_MAX:
    default: 20
    env: LIMEN_MARKETPLACE_MAX
    self_update: none
    owner: gitvs
    note: "Max repos scripts/sync-marketplace-config.py pushes a config PR to per run; the rest are taken next run (a bounded rotating fan-out, not a 301-repo stampede)."
  LIMEN_REAP_VERIFY_REMOTE:
    default: "1"
    env: LIMEN_REAP_VERIFY_REMOTE
    self_update: none
    owner: limen-daemon
    note: "ON — before deleting a reap candidate, git ls-remote confirms origin STILL holds HEAD (guards the deleted/renamed-origin case where the local clone is the only copy). Fail-safe: unreachable/offline → skip, never reap. Set 0 to trust local remote-tracking refs without the network round-trip."
  LIMEN_RECLAIM_APPLY:
    default: "1"               # ON — default beat removes only clean+content-preserved+idle roots
    env: LIMEN_RECLAIM_APPLY
    self_update: none
    owner: limen-daemon
    note: "When 1, scripts/drain.sh passes --apply to reclaim-worktrees.py. The reaper still refuses dirty, unique-unpushed, unmerged, active, or live/self roots. Set 0 for preview-only operation."
  LIMEN_WORKTREE_DEBT_GATE:
    default: "1"               # ON — per-candidate worktree custody admission active
    env: LIMEN_WORKTREE_DEBT_GATE
    self_update: none
    owner: limen-daemon
    note: "Master switch for per-candidate marginal worktree admission (limen.worktree_debt.take_admission_snapshot). When ON, a NEW LOCAL worktree is admitted only when free disk satisfies the telemetry-backed resource envelope, VITALS is not shedding, and any lifecycle targets have a fresh reaper receipt. Remote lanes are never gated. There is NO tolerated debt count; completion is debt == 0."
  LIMEN_RECLAIM_EVERY_MIN:
    default: 30                # reclaim-worktrees self-throttle; input to scheduler-derived freshness
    env: LIMEN_RECLAIM_EVERY_MIN
    self_update: none
    owner: limen-daemon
    note: "Minutes between real reclaim-worktrees.py --apply passes (self-throttle so it is cheap to call every beat). Worktree admission derives freshness as max(2 * this cadence, LIMEN_BEAT_DRAIN * LIMEN_LOOP_MAX / 60 + LIMEN_RECLAIM_TIMEOUT / 60); a stale or incoherent applied receipt blocks new local worktree creation until the reaper drains."
  LIMEN_WORKTREE_REAPABLE_MAX:
    default: 0
    env: LIMEN_WORKTREE_REAPABLE_MAX
    self_update: none
    owner: limen-daemon
    note: "Maximum clean remote-preserved local worktree roots allowed to linger after the reaper should be able to remove them. Default 0 makes clean+merged+idle and clean+pushed+idle residue fail focused lifecycle gates until reclaim applies or an owner blocker is recorded. The remote branch or PR remains the durable lifecycle owner after its disposable checkout is removed."
  LIMEN_LIFECYCLE_PRESSURE_THROTTLE:
    default: 1800             # 30 min — skip the session-lifecycle-pressure census if the snapshot is younger
    env: LIMEN_LIFECYCLE_PRESSURE_THROTTLE
    self_update: none
    owner: limen-daemon
    note: "Throttle window (seconds) for scripts/session-lifecycle-pressure.py. The SessionEnd hook runs it every session, and its census shells out to several git commands PER worktree — on a large estate (hundreds of debt roots) that grinds the CPU for a minute+ each session-end (the machine 'crawls'). The pressure snapshot changes slowly, so the census is skipped when logs/session-lifecycle-pressure.json is younger than this. 0 = always run (old behavior); --throttle overrides per-call. Reversible: set 0 to restore per-event census."
  LIMEN_BRANCH_PREFIX:
    default: null              # DERIVED per scope — cells.sh sets cell-<slug>- for a cell's own conductor
    env: LIMEN_BRANCH_PREFIX
    self_update: "set per-cell by cells.sh conduct (cell-<slug>-) to namespace a scoped conductor's branches"
    owner: limen-daemon
    note: "Branch-name namespace a scoped conductor uses so parallel cells never collide on branch names or fight over main. Unset ⇒ the daemon's default cadence; cells.sh sets it per cell."
  LIMEN_WORKSTREAM:
    default: null              # DERIVED per scope — cells.sh sets it when `cell conduct --workstream <handle>` pins a cell to ONE channel
    env: LIMEN_WORKSTREAM
    self_update: "set per-cell by cells.sh conduct (--workstream <handle>) to pin a scoped conductor to a single workstream channel"
    owner: limen-daemon
    note: "The purpose channel a scoped conductor is pinned to (the one-worker-one-workstream invariant). cells.sh filters the cell board to this channel via `limen channels --emit`, so the conductor structurally sees only its lane. Unset ⇒ the cell sees the full board. See docs/lanes/ and limen.workstream."
  LIMEN_WORKSTREAM_RUNWAY:
    default: "1d"
    env: LIMEN_WORKSTREAM_RUNWAY
    self_update: none
    owner: continuity
    note: "Finite requested duration used when a new workstream is configured without an inherited admitted contract. The validated range is 15m through 30d; an admitted capsule never rereads this value to reset its deadline."
  LIMEN_WORKSTREAM_REQUESTED:
    default: null
    env: LIMEN_WORKSTREAM_REQUESTED
    self_update: "exported from the validated admitted workstream contract by kickstart.sh"
    owner: continuity
    note: "Normalized duration text inherited by successor sessions and packet fanout. Unset outside an admitted capsule."
  LIMEN_WORKSTREAM_RUNWAY_SECONDS:
    default: null
    env: LIMEN_WORKSTREAM_RUNWAY_SECONDS
    self_update: "exported from the validated admitted workstream contract by kickstart.sh"
    owner: continuity
    note: "Validated total workstream duration in seconds. This is contract state, not a mutable provider timeout."
  LIMEN_WORKSTREAM_STARTED_EPOCH:
    default: null
    env: LIMEN_WORKSTREAM_STARTED_EPOCH
    self_update: "set once by the first serialized capsule admission and inherited thereafter"
    owner: continuity
    note: "UTC epoch of first workstream admission. Missing or contradictory timing state invalidates an existing capsule."
  LIMEN_WORKSTREAM_DEADLINE_EPOCH:
    default: null
    env: LIMEN_WORKSTREAM_DEADLINE_EPOCH
    self_update: "derived once as started epoch plus validated runway and inherited thereafter"
    owner: continuity
    note: "Immutable UTC deadline rechecked at packet and provider-spawn boundaries. Reaching zero blocks new launches without preempting an already-running provider."
  LIMEN_WORKSTREAM_REMAINING_SECONDS:
    default: null
    env: LIMEN_WORKSTREAM_REMAINING_SECONDS
    self_update: "refreshed from the immutable deadline at each capsule launch boundary"
    owner: continuity
    note: "Read-only remaining-runway observation exported to the current successor session."
  LIMEN_WORKSTREAM_ALREADY_RUNNING:
    default: null
    env: LIMEN_WORKSTREAM_ALREADY_RUNNING
    self_update: "set transiently by conducted capsule registration when the same human-protected session is already live"
    owner: continuity
    note: "Internal one-launch sentinel. A value of 1 makes an idempotent kickstart return without spawning a duplicate provider; it is unset before each registration attempt and outside that narrow boundary."
  LIMEN_WORKSTREAM_PROVIDER_ACTIVE:
    default: null
    env: LIMEN_WORKSTREAM_PROVIDER_ACTIVE
    self_update: "set to 1 only in the admitted provider process environment"
    owner: continuity
    note: "Provider-side recursion sentinel. Generated kickstart scripts honor it only when the capsule, worktree, and session bindings below all match their exact identity; a host shell leaves it unset."
  LIMEN_WORKSTREAM_PROVIDER_CAPSULE_ID:
    default: null
    env: LIMEN_WORKSTREAM_PROVIDER_CAPSULE_ID
    self_update: "bound from LIMEN_CAPSULE_ID immediately before native provider launch"
    owner: continuity
    note: "Exact capsule identity paired with LIMEN_WORKSTREAM_PROVIDER_ACTIVE. A mismatch cannot suppress a host bootstrap or a different capsule."
  LIMEN_WORKSTREAM_PROVIDER_WORKTREE:
    default: null
    env: LIMEN_WORKSTREAM_PROVIDER_WORKTREE
    self_update: "bound from the admitted absolute LIMEN_WORKTREE immediately before native provider launch"
    owner: continuity
    note: "Exact linked-worktree binding paired with the provider recursion sentinel. It does not grant the provider access to the shared common Git directory."
  LIMEN_WORKSTREAM_PROVIDER_SESSION_ID:
    default: null
    env: LIMEN_WORKSTREAM_PROVIDER_SESSION_ID
    self_update: "bound from LIMEN_SESSION_ID immediately before native provider launch"
    owner: continuity
    note: "Exact admitted-session binding paired with the provider recursion sentinel. It prevents a stale or inherited marker from suppressing a later host launch."
  LIMEN_WORKSTREAM_PREFLIGHT_TIMEOUT_SECONDS:
    default: 120
    env: LIMEN_WORKSTREAM_PREFLIGHT_TIMEOUT_SECONDS
    self_update: none
    owner: continuity
    note: "Finite 1..300 second ceiling for capsule git fetch and status preflights before the final deadline recheck."

  # --- BOARD INTEGRITY — the SSOT can never collapse, and self-heals if it somehow does ---
  # (limen.io.save_limen_file collapse-guard + scripts/heal-board.py). Root-caused 2026-06-26:
  # a writer atomically replaced the live 1449-task queue with one freshly-built task (missing
  # `created`), so every beat's load threw and the whole institution idled for hours.
  LIMEN_BOARD_GUARD:
    default: "1"               # ON — refuse any save that catastrophically shrinks the board
    env: LIMEN_BOARD_GUARD
    self_update: none
    owner: limen-daemon
    note: "Whether save_limen_file refuses a catastrophic board shrink (a clobber). The board only ever grows/holds steady — all callers load→mutate→save — so a collapse toward zero is always a bug. Set 0 to disable; pass allow_shrink=True in code for an intentional bulk archive. See io.py BoardCollapseError."
  LIMEN_BOARD_PARTITION_BASELINE:
    default: "institutio/governance/board-partition-baseline.txt"   # the tracked, shrink-only pinned leak
    env: LIMEN_BOARD_PARTITION_BASELINE
    self_update: none
    owner: tabularius
    note: "Where scripts/check-board-partition.py reads and re-pins its baseline. Redirectable INDEPENDENTLY of LIMEN_ROOT, which is the point rather than a convenience: --update is that predicate's only write, and overriding LIMEN_ROOT to redirect it also relocates the partner-lane registries, so findings() raises PartitionRegistryError before any baseline logic runs. The one surface that could violate the shrink-only ratchet was therefore the one surface no test could reach — and the ratchet went unenforced through three separate written statements of it (module docstring, baseline header, and a test named test_the_baseline_only_shrinks that actually exercises --check, where nothing is written). Set only by that suite; a production run must leave it unset so the tracked file is the target."
  LIMEN_BOARD_SHRINK_FLOOR:
    default: 5                 # never guard tiny boards (tests, fresh bootstrap); only substantial queues
    env: LIMEN_BOARD_SHRINK_FLOOR
    self_update: none
    owner: limen-daemon
    note: "The guard fires only when the prior on-disk board has MORE than this many tasks (so small/test/bootstrap boards are never blocked), and the refusal threshold is max(floor, fraction×prior). Also the collapse floor heal-board.py treats as a dead queue."
  LIMEN_BOARD_SHRINK_FRACTION:
    default: 0.10              # a new board < 10% of the prior count is a collapse, not an edit
    env: LIMEN_BOARD_SHRINK_FRACTION
    self_update: none
    owner: limen-daemon
    note: "Refuse a save whose new task count is below max(LIMEN_BOARD_SHRINK_FLOOR, this×prior). 0.10 catches 1449→1 (a clobber) while passing every legitimate append/status-update and even a heavy archive that keeps the active set."
  LIMEN_BOARD_HEAL:
    default: "1"               # ON — auto-restore a collapsed/unloadable board from the last good snapshot
    env: LIMEN_BOARD_HEAL
    self_update: none
    owner: limen-daemon
    note: "Whether scripts/heal-board.py (heartbeat preflight) auto-restores the live board from `git show HEAD:tasks.yaml` when it is unloadable or collapsed (≤ LIMEN_BOARD_SHRINK_FLOOR tasks). Idempotent: a healthy board is a no-op. The recovery net behind the save-time guard. Set 0 to disable."
  LIMEN_BOARD_PUBLISH_PR:
    default: "1"               # ON — keep a publication PR open whenever the keeper is ahead of main
    env: LIMEN_BOARD_PUBLISH_PR
    self_update: none
    owner: tabularius
    note: "Whether the beat runs scripts/publish-board-pr.sh, which opens the PR that carries the keeper's published projection into main. The PR-opening half of preserve_board_projection was retired along with the local publication writer and never replaced — BOARD_PUBLICATION_TITLE has been a dead constant since — so the keeper published to tabularius/board-projection and nothing carried it to main. Last publication merged 2026-07-26 (#1569), exactly the track.date the board sat frozen at for 12 days while the local tasks.yaml was byte-identical to origin/main (a current checkout with a dead rung, not a sync failure). The frozen copy is what dispatch SELECTS from, what every receipt's compare-and-swap precondition is computed from, and what lane_throughput_window counts 0 dispatches in — pinning the jules lane in bootstrap at 25/day and putting the requested 100/day out of reach (#1995). Opens or reports only: never merges, never pushes; merge-policy.sh decides and the beat's merge rung owns it. Idempotent — an already-open PR and a projection with no tasks.yaml change are both no-ops. Set 0 to disable."
  LIMEN_BOARD_PUBLICATION_BRANCH:
    default: "tabularius/board-projection"   # the keeper's only sanctioned publication ref
    env: LIMEN_BOARD_PUBLICATION_BRANCH
    self_update: none
    owner: tabularius
    note: "Head branch scripts/publish-board-pr.sh opens its PR from. Mirrors BOARD_PUBLICATION_BRANCH in cli/src/limen/tabularius.py; the keeper publishes only through this ref, and its exact head enters the normal merge queue."
  LIMEN_BOARD_PUBLICATION_BASE:
    default: "main"            # trunk and live deploy source; the board fast lane targets it
    env: LIMEN_BOARD_PUBLICATION_BASE
    self_update: none
    owner: tabularius
    note: "Base branch scripts/publish-board-pr.sh targets. Per ci.yml's board fast lane a board-projection PR implicates no code, so the matrix runs post-merge for check-main-green's exact-head evidence rather than on the PR's critical path."
  LIMEN_BOARD_CANONICAL_HEAL:
    default: "1"               # ON — reconcile the KEEPER's published projection, not just the local mirror
    env: LIMEN_BOARD_CANONICAL_HEAL
    self_update: none
    owner: limen-daemon
    note: "Whether the beat runs `scripts/heal-board.py --canonical`, applying the same lifecycle repairs to the keeper's PUBLISHED projection instead of the local mirror. Every other self-heal rung reads tasks.yaml, which mirrors the keeper only after a board-publication PR merges to main — so when that merge stalls, canonical drift lands where no rung can see it and each reports a healthy board while looking at a stale copy. Measured 2026-08-07: twelve needs-human-labelled ASK-quicken-* tasks (login/credential/delete/send) sat at `open` on the keeper while main had them at needs_human, so heal-board found nothing wrong while the canonical board offered human-gated levers to the fleet — and that same drift held main red on validate-task-board.py (needs-human-in-open), blocking the very publication merge that would have refreshed the mirror. Submits through the authenticated relay with the published board as the explicit compare-and-swap base; never writes locally. Set 0 to disable."
  LIMEN_BOARD_CANONICAL_REF:
    default: "origin/tabularius/board-projection"   # the keeper's publication ref IS the projection contract
    env: LIMEN_BOARD_CANONICAL_REF
    self_update: none
    owner: tabularius
    note: "Which ref `heal-board.py --canonical` reads the keeper's published board from. Read from the publication ref rather than over HTTP because that ref is the projection contract (the keeper publishes only through it) and a several-MB fetch has no place on a beat rung. An unreadable ref (shallow clone, unfetched remote) makes the rung a no-op rather than a guess; a keeper that has published past this head simply fails the compare-and-swap and the next pass re-derives."
  LIMEN_RUNG_FAIL_LINES:
    default: "15"              # how much of a FAILING rung's real output the beat log keeps
    env: LIMEN_RUNG_FAIL_LINES
    self_update: none
    owner: limen-daemon
    note: "Lines of a failed rung's captured output that heartbeat-loop.sh's beat_run helper prints under its `── RUNG FAIL [label] ──` banner. Replaces the estate's old `2>&1 | tail -1` idiom, which discarded the exit status (heartbeat-loop.sh sets `pipefail`, so the pipeline did carry the organ's status — measured 2026-08-07: rc=9 with pipefail, rc=0 without — and the trailing `|| true` then dropped it at the call site, uncaptured, so nothing could tell a failure from a clean run; this corrects an earlier note claiming tail destroyed it), destroyed the diagnostic (tail -1 of a Python traceback is the last line of the exception's own repr; for an HTTP error carrying a JSON body that is a bare `}`), and recorded nothing. Measured 2026-08-07: the canonical-heal rung failed on EVERY beat with `conduct broker rejected request (500): Exceeded allowed rows written in Durable Objects free tier`, emitting 61 lines; the beat log received `}` and the string appeared in NO log file estate-wide. 15 is enough to carry a traceback's frames plus the exception body while keeping a noisy organ from flooding the log. The happy path is unchanged at one line. Gate: check-beat-diagnostics."
  LIMEN_BEAT_RUNG_LOG:
    default: "$LIMEN_ROOT/logs/beat-rungs.jsonl"   # the per-rung outcome ledger
    env: LIMEN_BEAT_RUNG_LOG
    self_update: none
    owner: limen-daemon
    note: "Where beat_run appends one `{ts,rung,exit}` record per rung per beat. This is the READER the old idiom lacked: scripts/enactment-audit.py folds the tail of this file into per-rung consecutive-failure streaks, so 'this rung has failed N beats running' becomes a RED rung instead of a silence. Labels are stable per rung (script basename plus a disambiguating flag, e.g. heal-board vs heal-board-canonical) because they are the streak buckets. Append-only and bounded — see LIMEN_BEAT_RUNG_LOG_MAX."
  LIMEN_RUNG_FAIL_STREAK_RED:
    default: "3"               # consecutive failing beats before a rung is called INEFFECTIVE
    env: LIMEN_RUNG_FAIL_STREAK_RED
    self_update: none
    owner: enactment
    note: "How many CONSECUTIVE failing beats make scripts/enactment-audit.py's efficacy rung go RED for a rung. The third audit axis: wiring proves a flag is set, liveness proves the daemon is not older than its wiring, and NEITHER can see a rung that is wired, live, and fails every beat. Measured 2026-08-07: heal-board.py --canonical failed on EVERY beat with 'Exceeded allowed rows written in Durable Objects free tier' while the audit printed '3 rung(s) green/skip' and twelve regressed needs-human atoms stayed regressed — the gap was not a flag missing from a list (that flag was declared AND on), it was a missing axis. 3 filters a single bad beat (a timeout, a transient network fault) as noise while catching anything persistent within ~6 minutes at the 120s floor. Streaks are TRAILING, so a recovered rung is healthy. Exit 75 (EX_TEMPFAIL) is reported but never RED: it means 'blocked on a condition already filed with a human owner', and a permanently-red gate is an ignored gate."
  LIMEN_VALVE_EFFECT_LOG:
    default: "$LIMEN_ROOT/logs/valve-effects.jsonl"   # the per-run destructive-valve effect ledger
    env: LIMEN_VALVE_EFFECT_LOG
    self_update: none
    owner: enactment
    note: "Where scripts/_valve_effects.record appends one `{ts,valve,authorized,candidates,effects,dry_run,detail}` row per destructive-valve run, and where enactment-audit.py's POTENCY rung reads them from. Resolved against the root the DAEMON runs from, never the invoking worktree — #2053 fixed that same asymmetry for the liveness rung, and splitting the writer and reader across two logs/ directories would read as 'no data' rather than as a misconfiguration. The `candidates` field is the load-bearing one: it is the denominator that separates a valve with nothing to do from a valve that cannot act, which is the distinction the shipped-and-dead retirement pass had no way to express (see LIMEN_VALVE_IDLE_STREAK_RED). Overridable so tests and replays can drive the rung against a fixture ledger. Append-only and bounded at _valve_effects.MAX_ROWS."
  LIMEN_VALVE_IDLE_STREAK_RED:
    default: "3"               # consecutive no-effect runs before a destructive valve is called INERT
    env: LIMEN_VALVE_IDLE_STREAK_RED
    self_update: none
    owner: enactment
    note: "How many CONSECUTIVE no-effect runs make scripts/enactment-audit.py's POTENCY rung go RED for a destructive valve. The FOURTH audit axis, and it exists because the third is blind to a specific shape: wiring proves a flag is set, liveness proves the daemon post-dates its wiring, efficacy proves the rung is not exiting non-zero — and a valve that succeeds at doing NOTHING passes all three. Measured 2026-08-09 (#2150): self-heal.py's retirement pass was wired, live, and exited 0 on every beat for a day while retiring nothing, because its enumeration was capped below the live open-PR count and the truncation guard correctly, silently refused to retire from a prefix; the same run at a sufficient cap found 257 retirable tasks. armed-valve-audit.py could not see it either — that organ classifies ARMING, and this valve was ARMED. The rung reads logs/valve-effects.jsonl, where _valve_effects.record requires every valve to report the CANDIDATES it evaluated alongside the effects it produced, computed independently of whether it was authorized to act. That denominator is the whole mechanism: an alarm on 'effects == 0' alone would fire forever on a healthy valve with a drained backlog, get muted, and take the real signal with it — '0 of 0' is idle, '0 of 257' is dead. Dry runs are recorded but never counted (a dry run does not act by design). Streaks are TRAILING, so a valve that fires again is healthy. 3 matches LIMEN_RUNG_FAIL_STREAK_RED: one quiet run is noise, three is a pattern."
  LIMEN_BEAT_RUNG_LOG_MAX:
    default: "20000"           # trim threshold in records (~5 beats' worth of headroom over KEEP)
    env: LIMEN_BEAT_RUNG_LOG_MAX
    self_update: none
    owner: limen-daemon
    note: "Record count above which heartbeat-loop.sh's trim_beat_rung_log() truncates the outcome ledger to LIMEN_BEAT_RUNG_LOG_KEEP. ~65 rungs fire per full beat, so 20000 is a few hundred beats — far more history than the audit's streak window reads, and the trim is one `wc -l` per beat."
  LIMEN_BEAT_RUNG_LOG_KEEP:
    default: "4000"            # records retained after a trim
    env: LIMEN_BEAT_RUNG_LOG_KEEP
    self_update: none
    owner: limen-daemon
    note: "Records kept when the outcome ledger is trimmed. Must stay comfortably above the audit's streak window (a streak is at most a few beats × ~65 rungs), so a trim can never manufacture a fake 'no failures' history by discarding the evidence of an ongoing one."
  LIMEN_TABVLARIVS:
    default: "1"               # ON — the record-keeper drains the ticket inbox onto the board each beat
    env: LIMEN_TABVLARIVS
    self_update: none
    owner: tabularius
    note: "Master gate for TABVLARIVS (scripts/tabularius-organ.py), the single-writer record-keeper. Each beat it drains logs/tickets/inbox, folds each worker's ticket onto the healed board under the queue lock, and seals via the collapse-guarded atomic write. Idempotent: an empty inbox is an instant no-op, so it is safe every beat while no producers exist. Set 0 to silence the rung. The single-writer principle that dissolves the ~32-writer torn-write class — sibling of LIMEN_BOARD_HEAL."
  LIMEN_MEMORIA:
    default: "0"               # DARK — merged off; the operator flips it after the lane is proven (lane before wall)
    env: LIMEN_MEMORIA
    self_update: none
    owner: tabularius
    note: "memory record-keeper drain gate (MEMORIA lane); merged dark, human-flipped after the lane is proven — lane before wall. When 1, scripts/tabularius-organ.py additionally drains the memory ticket inbox (<memdir>/.covenant-inbox) into MEMORY.md + its atoms, as the single writer of the memory dir. Off = the memory drain is skipped entirely (silent). The single-writer principle applied to memory, sibling of LIMEN_TABVLARIVS."
  LIMEN_ALLOW_COVENANT_WRITE:
    default: "0"               # break-glass off by default; the covenant write guard (PR 6) honors 1
    env: LIMEN_ALLOW_COVENANT_WRITE
    self_update: none
    owner: tabularius
    note: "break-glass escape hatch for the covenant write guard (PR 6); declared ahead of arming. When 1, a session may write the memory dir directly, bypassing the single-writer covenant. No-op in this PR (limen.memoria reads it but has no guard to bypass yet); PR 6's write-guard hook honors it."
  LIMEN_TICKETS_PRODUCE:
    default: "0"               # SAFE CODE DEFAULT — a bare manual script run stays legacy (no surprise); the FLEET opts in (see below)
    env: LIMEN_TICKETS_PRODUCE
    fleet_runtime: "1"         # ENACTMENT CONTRACT — the LIVE fleet MUST resolve this to 1 (heartbeat-loop.sh wires it). scripts/enactment-audit.py fails if the running beat diverges. This is the field #576 lacked: the note *claimed* the fleet enabled it, but nothing machine-checked that the wiring did — so the switch shipped dark and green.
    self_update: none
    owner: tabularius
    note: "Cutover flag for the TABVLARIVS single-writer transition (Step 2). When 1, converted task-CREATION writers (mine-backlog, ingest-backlog, generate-backlog, generate-revenue-backlog, generate-organ-backlog, discover-value) STOP writing tasks.yaml directly and instead submit an upsert ticket per new task via limen.tabularius.submit_task_upsert; the keeper folds them next beat. This default 0 is the SAFE CODE FALLBACK (an ad-hoc manual run stays legacy), but the LIVE FLEET DELIBERATELY ENABLES IT: scripts/heartbeat-loop.sh sets LIMEN_TICKETS_PRODUCE=1 (overridable to 0 in ~/.limen.env to revert instantly) — the cutover, taken after the keeper was watched draining a real batch. Coverage = the task-creation tier; the status-mutator tier (route/dispatch-async/heal-dispatch/rebalance/recover/quicken) stays direct until Step 2.2 (those need INTENT_STATUS tickets, not upsert). Mixed-mode (some producers, some direct writers) is strictly safer than all-direct, so the tiers flip incrementally."
  LIMEN_ENACTMENT_CHECK:
    default: "1"               # ON — surface un-enacted fleet flags (declared ON but dark/stale in the running beat) in the beat log
    env: LIMEN_ENACTMENT_CHECK
    self_update: none
    owner: tabularius
    note: "Master gate for the enactment advisory (scripts/enactment-audit.py --check) run each beat by metabolize.sh section 0d. It proves every parameters.yaml flag declaring a fleet_runtime intent is actually LIVE: the WIRING rung checks the beat resolves the flag to the declared value (catches the #576 dark-switch — declared ON, wired nowhere), the LIVENESS rung checks the running daemon started AFTER its last wiring change (catches wired-but-not-kickstarted, since a `while true` loop never re-sources itself). verify-whole.sh enforces the wiring rung as a HARD gate so 'done' can never again go green on a dark switch; this beat advisory surfaces live-host liveness in the log (never chat), like creds-hydrate --verify. Set 0 to silence."

  LIMEN_VALVE_AUDIT:
    default: "1"               # ON — separate PARKED levers from SILENTLY-OFF deliverable valves each beat
    env: LIMEN_VALVE_AUDIT
    self_update: none
    owner: tabularius
    note: "Beat gate for the armed-valve audit (scripts/armed-valve-audit.py --check) run each beat by metabolize.sh section 0e (RETRO-0708-ARMED-VALVE-AUDIT; PREC-2026-07-08-armed-valve-outcome). It derives every boolean ${LIMEN_*:-0|1} gate from the beat sources and classifies via spec/armed-valves.json: ARMED / PARKED (a his-hand lever cites it — owned, never nagged) / SILENT-OFF (a deliverable-IS-the-behavior valve disarmed with NO lever — the retro finding-8 failure class: the censor mirror's permanent dry-run, MONETA's dark URL) / UNCLASSIFIED (registry lags the code — self-surfacing). verify-whole.sh enforces the repo-deterministic --contract rung (no UNCLASSIFIED); the env/url liveness rungs stay beat-side so CI never flaps on host env. Set 0 to silence."

  LIMEN_SHIP_GATE:
    default: "1"               # ON — probe product artifacts + product-facing done-claims each beat
    env: LIMEN_SHIP_GATE
    self_update: none
    owner: tabularius
    note: "Beat gate for the ship gate (scripts/ship-gate.py --check) run each beat by metabolize.sh section 0f (RETRO-0708-SHIP-GATE; retro findings 4 + gap-model). Product-facing done requires a REACHABLE external artifact — a deployed URL returning 200, a served artifact still carrying its rail — never a merged PR, a receipt, or a filed lever. Probes every entry in spec/ship-surfaces.json plus every done/archived task labelled product-facing (urls or last dispatch_log must contain a live artifact; PR urls never count). verify-whole.sh runs the deterministic fixture test; the live probes stay beat-side. Set 0 to silence."

  LIMEN_HEAL_CONVERGENCE:
    default: "1"               # ON — trip on chronic heal non-convergence (>=3 open heal PRs failing the same check >48h)
    env: LIMEN_HEAL_CONVERGENCE
    self_update: none
    owner: tabularius
    note: "Beat gate for the heal-convergence report (scripts/heal-convergence.py --check) run each beat by metabolize.sh section 0g (RETRO-0708-HEAL-RECEIPT-OUTCOME; retro findings 1-2). CHRONIC rung: open heal PRs (title-prefixed '[limen HEAL-') grouped by (repo, failing check); >=3 PRs older than 48h on the SAME check = the healer is re-spending capacity on a wall (growth-auditor #16-#22 / theoria #492-#500 class) -> exit 1. COVERAGE rung: archived heal receipts must carry the {outcome: already_green|fixed|gave_up, failing_checks} field derived MECHANICALLY post-run by async-run-one.py (gh pr view of the target PR - never agent prose), reported as a ratio so the 855-emitted-vs-384-receipts gap class is a number. verify-whole runs the fixture test (fixture PRs + fixture clock - deterministic); live counts stay beat-side. Set 0 to silence."

  LIMEN_CHRONIC_RECEIPTS:
    default: "scripts/heal-chronic-receipts.json"  # git-tracked exemption registry for externally blocked heal groups
    env: LIMEN_CHRONIC_RECEIPTS
    self_update: none
    owner: tabularius
    note: "Path to the chronic-receipt registry (scripts/heal-chronic-receipts.json) read by scripts/heal-convergence.py. Each entry exempts a (repo, check) chronic group from the exit-1 gate only when a current external blocker has an active owner and evidence. Terminal historical levers are invalid owners. Entries must carry repo, check, lever, issue, and reason. Set to an alternate path to override."

  LIMEN_FORK_SAFETY_CHECK:
    default: "1"               # ON — prove the macOS 26.6 atfork/os_log crash stays fixed each beat
    env: LIMEN_FORK_SAFETY_CHECK
    self_update: none
    owner: tabularius
    note: "Beat gate for the fork-safety predicate (scripts/check-fork-safety.py --check) run each beat by metabolize.sh section 0g2. The macOS 26.6 crash ('python keeps crashing') is Apple's Network.framework pthread_atfork child handler segfaulting in os_log on the child side of fork()+exec(); the OS_ACTIVITY_MODE=disable mitigation (#831/#229) fixes the os_log layer. Because the crash is a timing RACE, 'no recurrence' was a hope, not a predicate. This asserts every beat that the mitigation is still present in the beat scripts AND that no .ips crash report (scans ~/Library/Logs/DiagnosticReports/ + Retired/) matching the atfork/os_log signature is newer than the mitigation boundary (git author-date of the OS_ACTIVITY_MODE commit — derived, never hardcoded). A recurrence exits non-zero (the effector) and is the documented trigger to arm LIMEN_FORK_SAFE. macOS-only signal; fail-open on non-darwin / no git. Set 0 to silence."

  LIMEN_FORK_SAFE:
    default: "0"               # OFF (DARK) — posix_spawn escalation, armed only if the fork-safety predicate fires
    env: LIMEN_FORK_SAFE
    self_update: none
    owner: tabularius
    note: "Dark escalation for the macOS 26.6 fork/os_log crash (see LIMEN_FORK_SAFETY_CHECK). When 1, a cli/src/sitecustomize.py shim rewrites qualifying subprocess.Popen calls to a /bin/sh -c 'cd; exec' wrapper with cwd=None AND close_fds=False so CPython takes the posix_spawn path (which runs no atfork handlers). This is INVASIVE and PARTIAL — it cannot cover start_new_session group-kill callers (dispatch.py:_run_capture), and on macOS close_fds=True (the default) forks near-universally, so the OS_ACTIVITY_MODE mitigation is strictly more complete. Off-by-default is the design: arm ONLY if the beat predicate ever reports a post-mitigation recurrence. Not built until then."

  LIMEN_CRASH_REPORTS_DIR:
    default: ""                # empty = OS default (~/Library/Logs/DiagnosticReports); set only for tests
    env: LIMEN_CRASH_REPORTS_DIR
    self_update: none
    owner: tabularius
    note: "Override for the crash-report scan root used by scripts/check-fork-safety.py (also settable via its --reports-dir flag). Empty (the default) scans the macOS default ~/Library/Logs/DiagnosticReports/ plus its Retired/ rotation subdir. Set to a temp directory in tests to inject fabricated .ips reports deterministically; never set on the live host."

  LIMEN_LAUNCHAGENT_LIVENESS_CHECK:
    default: "1"               # ON — assert critical launchd organs stay alive each beat
    env: LIMEN_LAUNCHAGENT_LIVENESS_CHECK
    self_update: none
    owner: tabularius
    note: "Beat gate for the launch-agent liveness predicate (scripts/launch-agent-liveness.py --check), sensor section 0g4 in sensors.yaml — run on its declared cadence in BOTH beat lanes (metabolize + the heartbeat scheduled derive lane, live-wired 2026-07-13). The invariant spec/critical-launch-agents.json names the launchd organs that MUST stay alive (the MONETA mint + its Cloudflare tunnel = the first-dollar revenue rail; creds-hydrate = the credential organ; ianva gateway = L-IANVA-LOCAL). A 2026-07-09 mass launchd-quiesce (fork-crash mitigation) disabled 11 agents and restored only the heartbeat, leaving the mint dark for days while armed-valve-audit saw it down every beat with no effector (the sensor-without-effector defect this closes). Read-only --check surfaces any down critical organ; the armed LIMEN_LAUNCHAGENT_HEAL effector restores it. macOS-only signal; fails OPEN off-darwin. Set 0 to silence."

  LIMEN_BACKGROUND_ITEMS_CHECK:
    default: "1"               # ON — classify every LaunchAgent/BTM row against the declared estate each cadence
    env: LIMEN_BACKGROUND_ITEMS_CHECK
    self_update: none
    owner: tabularius
    note: "Beat gate for the background-items census (scripts/background-items-census.py --check), sensor section 0g4b in sensors.yaml. The declared registry spec/background-items.json owns which background items are expected (estate agents + Rule-55a third-party exemptions); an installed LaunchAgent matching neither is UNDECLARED drift and the check goes red-advisory. Founded 2026-08-15: the operator's Login Items pane showed 'DomusAgentHost ×4' + bare bash/python3/node/cloudflared rows and no estate surface could answer what they were — the diagnosis (BTM names legacy rows by executable basename, groups adhoc-signed binaries under 'Unknown Developer'; every row mapped to a legitimate owner) had to be hand-derived via sfltool dumpbtm, which works unprivileged. Read-only by contract — the Rule-55 plist hard-block hook is the authority; this sensor classifies and reports, never mutates. macOS-only signal; fails OPEN off-darwin. Set 0 to silence."

  LIMEN_LAUNCHAGENT_HEAL:
    default: "0"               # OFF — the effector. The single durable grant to auto-restore down critical organs.
    env: LIMEN_LAUNCHAGENT_HEAL
    self_update: none
    owner: tabularius
    note: "The effector for the launch-agent liveness invariant (scripts/launch-agent-liveness.py --apply, sensor section 0g4, gated by when_env). When 1, the beat re-bootstraps + kickstarts any critical organ in spec/critical-launch-agents.json that is down — restoring a plist from ~/Library/LaunchAgents.disabled/ if a quiesce quarantined it. This is the SINGLE durable human grant that closes the sensor-without-effector defect: arm once and the daemon keeps the mint / tunnel / credential organ alive across quiesce + reboot forever, without a per-incident approval. OFF by default because it re-enables persistent launchd services (an authorization, not a default). Owner arms it in the daemon env (~/.limen.env)."

  LIMEN_CLAUDE_LSREGISTER_HEAL:
    default: "0"               # OFF — the effector. Arm once to auto-clear the malformed ClaudeCode.app stub.
    env: LIMEN_CLAUDE_LSREGISTER_HEAL
    self_update: none
    owner: tabularius
    note: "The effector for the recurring macOS Gatekeeper 'ClaudeCode.app is damaged, move it to Trash' dialog (scripts/heal-claude-lsregister.sh, sensed by dialogs-silenced.sh section 4b, beat-wired on the heartbeat hygiene cadence beside heal-claude-update-marker.sh). Dry-run by default (reports the cure, mutates nothing). When 1, the beat unregisters + removes ONLY the exact-malformed-seal ClaudeCode.app stub (codesign 'code has no resources but signature indicates they must be present') under ~/.local/share/claude or ~/.Trash and sweeps reseeded Trash copies, returning LaunchServices registrations to the steady state of ZERO; never touches /Applications, the versions/ dir, or the resolved CLI symlink. macOS-only; fails OPEN off-darwin. Arm once in the daemon env (~/.limen.env) so occurrence #4 self-heals without a per-incident approval. Set 0 to silence."

  LIMEN_CLAUDE_BUNDLE_IDENTITY_HEAL:
    default: "0"               # OFF — the effector. Arm once so a vendor update stops minting a new TCC identity.
    env: LIMEN_CLAUDE_BUNDLE_IDENTITY_HEAL
    self_update: none
    owner: tabularius
    note: "The effector for the recurring per-version TCC prompt burst (#1703; scripts/claude-bundle-identity-heal.py, beat-wired on the heartbeat hygiene cadence beside heal-claude-lsregister.sh). TCC keys a grant on the client PATH for a non-bundled binary and the vendor names each build after its version, so every update mints a client with zero rows and re-asks the whole grant set under an 'app' named e.g. 2.1.233 — 19 identities since 2026-05-19, up to 9 dialogs each. Dry-run by default (reports the cure, mutates nothing). When 1, the beat replaces the LIVE versions/<v> hardlink with a SYMLINK to ClaudeCode.app/Contents/MacOS/claude, whose path never changes; TCC code identity follows a symlink to its target (proven from the live db: Homebrew execs ruby via portable-ruby/current and the client column records the resolved .../4.0.6/bin/ruby), so the grant then survives updates the way a normal app's does. Never a TCC database write. Touches ONLY an entry sharing the bundle executable's inode — by construction the live build, where unlinking one of two names for a file destroys nothing; a stale version is a distinct inode holding rollback bytes and is left alone. Exec-verified with automatic rollback, idempotent, --revert restores the hardlink. macOS-only; fails OPEN off-darwin. Residual: the heal runs AFTER the vendor rematerializes versions/<new>, so a session started in that gap can still draw one prompt — one, not nine. Upstream fix is anthropics/claude-code#86706. Arm once in ~/.limen.env. Set 0 to silence."

  LIMEN_HOOK_DRIFT_HEAL:
    default: "0"               # OFF — the effector. Arm once to auto-reinstall a drifted trust hook.
    env: LIMEN_HOOK_DRIFT_HEAL
    self_update: none
    owner: tabularius
    note: "The effector for the recurring Claude Code prompt-flood caused by a drifted PreToolUse trust hook (scripts/heal-hook-drift.sh, sensed by dialogs-silenced.sh class 1b, beat-wired on the heartbeat hygiene cadence beside heal-claude-lsregister.sh). The live ~/.claude/hooks/{allow-trusted-cd-git,insights-capture}.sh must match the repo canonical scripts/hooks/ or the compound-cd guard + destructive-ask rules re-prompt every fleet job. Dry-run by default. When 1, the beat reinstalls (install -m 755) any live hook whose sha256 differs from the LIVE-checkout (LIMEN_ROOT) canonical; it only touches the two hook files it owns, never ~/.claude/settings.json (that stays a human lever). Canonical source is the live checkout, never a WIP worktree. Arm once in ~/.limen.env. Set 0 to silence."

  LIMEN_HOOK_WIRING_HEAL:
    default: "0"               # OFF — and unlike its siblings this one is NEVER beat-wired.
    env: LIMEN_HOOK_WIRING_HEAL
    self_update: none
    owner: anthony
    note: "The effector for the UNWIRED trust hook (scripts/heal-hook-wiring.py, sensed by dialogs-silenced.sh class 1d). Sibling of LIMEN_HOOK_DRIFT_HEAL, which keeps the hook FILE in parity; this one asserts the WIRING — the hooks.PreToolUse group, the five permissions.ask fail-safe rules, and permissions.autoMode.allow (leading with the literal \"$defaults\", else the built-in classifier rules are replaced wholesale) — in the CARTRIDGE SOURCE (domus-genoma private_dot_claude/settings.json.tmpl), then chezmoi apply. Never the rendered ~/.claude/settings.json: that file is owner=cartridge/mechanism=template per config-ownership.json, so a hand edit is discarded by the next apply (Rule #6). Dry-run by default; backs up the source and prints the full diff before writing; idempotent. defaultMode is deliberately left at 'auto' — bypassPermissions does not close the distance to the ideal, it deletes the instrument. CRITICAL DIFFERENCE FROM ITS SIBLINGS: owner is anthony, not tabularius, and this MUST NOT be beat-wired or added to sensors.yaml. The auto-mode classifier blocks an agent from widening its own permission gate — verified 2026-07-31 that the block is on the ACT not the path, covering the chezmoi source and even a read-only dry-run — and an auto-armed valve here would let the system widen its own gate unattended, which is precisely what that guardrail exists to prevent. Arm by hand, once, then set back to 0. Tracked as IF-NO-MODAL and lever L-AGENT-BASH-PROMPT (#183)."

  LIMEN_HOOK_WIRING_TARGET:
    default: "~/.claude/settings.json"
    env: LIMEN_HOOK_WIRING_TARGET
    self_update: none
    owner: tabularius
    note: "TEST SEAM ONLY — the deployed-settings path scripts/heal-hook-wiring.py checks when deciding whether the wiring actually reached the target. Exists because the effector's 'clean' verdict requires BOTH a correct cartridge source AND a target that reflects it (the false-green defect, 2026-07-31: a run wrote the source, died at deploy with no TTY, and the next run reported clean while the live gate was still unwired). scripts/tests/heal-hook-wiring.test.sh pins this to a fixture for EVERY case — unpinned, the suite reads the operator's real ~/.claude/settings.json and its verdict depends on whether that host happens to be wired, which is a hermeticity leak, not a test. Never set on a real host."

  LIMEN_CASK_DUPLICATE_HEAL:
    default: "0"               # OFF — the effector. Arm once to auto-uninstall a duplicate claude-code cask.
    env: LIMEN_CASK_DUPLICATE_HEAL
    self_update: none
    owner: tabularius
    note: "The effector for the recurring Gatekeeper 'claude is an app downloaded from the Internet' dialog (scripts/heal-claude-cask.sh, sensed by dialogs-silenced.sh class 4, beat-wired on the heartbeat hygiene cadence). A duplicate Homebrew *cask* install of claude-code is re-quarantined on every brew upgrade (casks stamp com.apple.quarantine), creating an independent rotating Gatekeeper principal beside the sanctioned native updater-managed install. Dry-run by default. When 1, the beat runs 'brew uninstall --cask claude-code' ONLY when the cask is present and verifies the native ~/.local/bin/claude (the one sanctioned install) survives; it never touches the native install. macOS-only; fails OPEN off-darwin or without brew. Arm once in ~/.limen.env. Set 0 to silence."

