    self_update: none
    owner: continuity
    note: "Arms scripts/cloud-routine-ingest.py --apply. The default dry-run validates and classifies CloudRoutineReceiptV1 deliveries without emitting work; 1 permits only novel new_work dispositions to enter TABVLARIVS as idempotent upsert tickets."
  LIMEN_ROUTINE_FRESHNESS:
    default: "1"               # ON — audit cloud-routine delivery freshness each beat
    env: LIMEN_ROUTINE_FRESHNESS
    self_update: none
    owner: continuity
    note: "Beat gate for the cloud-routine delivery freshness audit (scripts/routine-freshness-audit.py --throttle 21600) run by metabolize.sh step 0e. Closes the firing!=delivering gap (atom-backlog-triage 25-day silence precedent): probes rolling-issue comment timestamps via gh for the 13 routines in cloud-routines.json; any routine silent beyond 2x its max_silent_days gets a needs_human atom hung in the permanent queue. Self-throttled to ~6h. Fail-open, never fatal. 1=enabled; 0=skip."
  LIMEN_ROUTINE_FRESHNESS_THROTTLE:
    default: 21600
    env: LIMEN_ROUTINE_FRESHNESS_THROTTLE
    self_update: none
    owner: continuity
    note: "Throttle window in seconds for the cloud-routine delivery freshness audit. Skip the run if logs/routine-freshness.json is younger than this. Default 21600 (6h) so the organ does not flood the GitHub API each beat. Override with 0 (or pass --force) to force a run."
  LIMEN_ARCA:
    default: "1"               # ON — seal the private estate every beat
    env: LIMEN_ARCA
    self_update: none
    owner: limen-daemon
    note: "Beat gate for ARCA (scripts/arca.sh backup, step 5c): every ~/Workspace/_*-private store, AES-256-encrypted with a key that lives only in the macOS Keychain, roundtrip-verified, pushed as ciphertext to the CURRENT generation repo — organvm/arca, then organvm/arca-g2, then organvm/arca-g3 (POTESTAS 0.3, #2089). 1=seal each beat (no-op in seconds when unchanged); 0=off. Fails soft (locked Keychain / offline). Vaults are shallow-cloned (depth 1); when the pack outgrows ARCA_MAX_MB (default 512), `rotate` cuts an orphan-root generation so the new vault never inherits prior growth and the old repo stays byte-identical as a cold archive. The local vault manifest owns `_generation.current/repo`, so the fleet follows each rotation with zero env changes. Script-level knobs are ARCA_WORKSPACE / ARCA_REPO / ARCA_VAULT_DIR / ARCA_KEY_SERVICE / ARCA_MAX_MB / ARCA_CLONE_URL_BASE."
  LIMEN_LESSON_HARVEST_BACKLOG:
    default: "1"               # ON — surface the unprocessed-session count each day (sensor 0z0a)
    env: LIMEN_LESSON_HARVEST_BACKLOG
    self_update: none
    owner: censor
    note: "Gate for the lesson-harvest-backlog beat sensor (institutio/governance/sensors.yaml section 0z0a). scripts/lesson-harvest.py --check prints per-vendor unprocessed/processed counts against the censor/lesson-harvest.jsonl cursor — count-only, PII-clean, read-only over session stores. The drain is the /lesson-harvest skill (model-in-the-loop), which routes lessons to existing termini only. 0 disables."
  LIMEN_BEAT_LESSON_HARVEST:
    default: "24"
    env: LIMEN_BEAT_LESSON_HARVEST
    self_update: none
    owner: censor
    note: "Beat-modulo cadence for the lesson-harvest-backlog sensor (0z0a). Default 24 — the backlog is a slow-moving pressure gauge; once a day keeps it visible without a per-beat directory walk."
  LIMEN_LESSON_HARVEST_TIMEOUT:
    default: "120"
    env: LIMEN_LESSON_HARVEST_TIMEOUT
    self_update: none
    owner: censor
    note: "Timeout (seconds) for the lesson-harvest-backlog sensor step. The check is a metadata-only walk of the session stores plus one cursor read; 120s is generous headroom."
  LIMEN_LESSON_HARVEST_CURSOR:
    default: ""
    env: LIMEN_LESSON_HARVEST_CURSOR
    self_update: none
    owner: censor
    note: "Override path for the lesson-harvest cursor ledger (default censor/lesson-harvest.jsonl under LIMEN_ROOT). Used by tests to point at a sandbox cursor; empty = default."
  LIMEN_ARCA_FRESHNESS:
    default: "1"               # ON — assert the vault is actually ADVANCING (sensor 5c1)
    env: LIMEN_ARCA_FRESHNESS
    self_update: none
    owner: continuity
    note: "Gate for the arca-freshness beat sensor (institutio/governance/sensors.yaml section 5c1), the observability sibling of LIMEN_ARCA. The 5c rung is `arca.sh backup || echo` — fail-open by design, which makes a permanently dead vault look identical to a momentarily locked one. Measured 2026-08-07: no backup for 8 days, every beat green, because the vault repo had outgrown its own git clone. This asserts the OUTCOME (recent off-machine push + a resolvable local vault) rather than the mechanism, so it survives any later vault reshaping; 'cannot determine' counts as a finding. Read-only, advisory. 0 disables."
  LIMEN_BEAT_ARCA_FRESHNESS:
    default: "6"
    env: LIMEN_BEAT_ARCA_FRESHNESS
    self_update: none
    owner: continuity
    note: "Beat-modulo cadence for the arca-freshness sensor (5c1). Default 6 — a backup that has stopped is a slow-moving fact, so checking every 6th beat surfaces it well inside the 2-day staleness threshold without spending a `gh repo view` call every beat."
  LIMEN_ARCA_FRESHNESS_TIMEOUT:
    default: "90"
    env: LIMEN_ARCA_FRESHNESS_TIMEOUT
    self_update: none
    owner: continuity
    note: "Timeout in seconds for the arca-freshness sensor (5c1). Bounds the single `gh repo view` call; on expiry the predicate reports UNDETERMINED, which is a finding rather than a pass."

  # --- POTESTAS exchange guard (organvm/limen#2088) -----------------------------
  LIMEN_EXCHANGE_GUARD_WINDOW_MIN:
    default: "15"
    env: LIMEN_EXCHANGE_GUARD_WINDOW_MIN
    self_update: none
    owner: governance
    note: "Minutes either side of a CONNECTED call within which a money transfer is flagged by scripts/exchange-guard.py. Default 15 — wide enough to catch a transfer decided during a call and executed just after it ends, narrow enough that a same-afternoon-but-unrelated transfer does not register. Widening it does not make the guard stricter, it makes it noisier: at a large enough window every transfer falls inside some call and the signal is gone. Validated against ground truth at 15: 3/3 known in-call transfers flagged, 0 of 383 2024-era transfers flagged (no connected calls were logged that year, so the negative is real rather than vacuous)."
  LIMEN_EXCHANGE_GUARD:
    default: "1"
    env: LIMEN_EXCHANGE_GUARD
    self_update: none
    owner: governance
    note: "Gate for the exchange detector beat sensor. Evaluates whether payments occurred inside a call window."
  LIMEN_BEAT_EXCHANGE_GUARD:
    default: "24"
    env: LIMEN_BEAT_EXCHANGE_GUARD
    self_update: none
    owner: governance
    note: "Cadence for the exchange guard beat sensor."
  LIMEN_EXCHANGE_GUARD_TIMEOUT:
    default: "300"
    env: LIMEN_EXCHANGE_GUARD_TIMEOUT
    self_update: none
    owner: governance
    note: "Timeout in seconds for the exchange guard beat sensor."
