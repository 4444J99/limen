    owner: integrity
    note: "Create-once, mode-600 redacted identity and unrelated App Management bundle-grant baseline for tcc-identity-audit. Production uses the Domus-owned default; isolated tests may override it. The writer refuses to replace an existing cutover anchor."
  LIMEN_TCC_HOST_STATUS_JSON:
    default: ""
    env: LIMEN_TCC_HOST_STATUS_JSON
    self_update: none
    owner: integrity
    note: "Test-only stable-host status fixture. Production leaves it empty and invokes the installed native host's Security-backed status interface."
  LIMEN_TCC_LSREGISTER_DUMP:
