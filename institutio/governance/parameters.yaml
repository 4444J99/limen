    owner: tabularius
    note: "Override for the launchctl gui/<uid> domain target used by scripts/launch-agent-liveness.py. Empty (the default) uses the current uid (os.getuid()). Set only in tests; never on the live host."

  LIMEN_CREDS_HYDRATE:
    default: "1"               # ON — hydrate fleet creds from 1Password each beat (sensor 0a)
    env: LIMEN_CREDS_HYDRATE
    self_update: none
    owner: tabularius
    note: "Gate for the creds-hydrate beat sensor (institutio/governance/sensors.yaml section 0a): refresh ~/.limen.env from the op:// source of truth so a one-time login never repeats, then --verify each materialized cred against its service. Read by the beat-sensors runner via the SENSORS registry (was previously only an undeclared shell hardcode; declared here when the hand-wired blocks were derived away). 0 disables the hydration pass."
  LIMEN_CREDS_PROVISION:
    default: "1"               # ON — CLAVIS provisioning predicate each beat (sensor 0a1)
    env: LIMEN_CREDS_PROVISION
    self_update: none
    owner: tabularius
    note: "Gate for the CLAVIS creds-provision beat sensor (institutio/governance/sensors.yaml section 0a1): `creds-provision check` verifies every REQUIRED op-sourced secret in creds-hydrate DEFAULT_MAP resolves to an SA-readable vault (institutio/governance/credentials.yaml). The provisioning-side sibling of LIMEN_CREDS_HYDRATE: hydrate --verify catches a dead materialized value, this catches the upstream cause (a secret in a vault the service account cannot read). Read-only, advisory. 0 disables the pass."
  LIMEN_CREDS_POLICY:
    default: "institutio/governance/credentials.yaml"
    env: LIMEN_CREDS_POLICY
    self_update: none
    owner: tabularius
    note: "Path override for the CLAVIS credential-provisioning policy registry (scripts/creds-provision.py load_policy). Default is the in-repo credentials.yaml; overridden in tests to a nonexistent path to exercise the fail-open-to-defaults branch. Not a secret; declares the automation-vault name + service-account identity the provisioner enforces."
  LIMEN_BEAT_DERIVE:
    default: "1"               # ON — beat DERIVES its sensor loop from sensors.yaml; 0 = skip the sensor pass (escape hatch)
    env: LIMEN_BEAT_DERIVE
    self_update: none
    owner: governance
    note: "The continuous metabolize sensor loop is registry-derived and default-on after #935; the deleted hand-wired blocks are not a fallback, so 0 skips that pass as an escape hatch. The same generic runner now owns scheduled heartbeat cadence, timeout, conditional argv, voice stamps, Omega eligibility, and armed-valve metadata from sensors.yaml. The heartbeat's scheduled lane is live-wired too (heartbeat-loop.sh fallback 1, held equal to this default by test_derive_fallback_matches_panel_default): the post-#921 integration drain was released by the 2026-07-13 dry + live-parity canary receipts (PR #1013 body)."

  LIMEN_PAUSED_SENSING:
    default: "1"               # ON — a paused beat still runs read-only monitoring; 0 = the old blind pause (escape hatch)
    env: LIMEN_PAUSED_SENSING
    self_update: none
    owner: governance
    note: "A pause withdraws the fleet's authority to ACT; it was never a decision to stop LOOKING. Before this, heartbeat-loop.sh's `paused` branch `continue`d ~80 lines above the monitoring block, so arming any marker silently switched off drift monitors, the scheduled sensor pass, and the inbox sweep. Measured cost: an agent-armed marker on 2026-07-27 (no authorization, no provenance, no TTL, gitignored) blinded the fleet for four days — the live checkout drifted to 27 commits behind origin/main while check-live-checkout.py sat at exit 1 with nothing asking it, and the mail sweep that would have reported an already-answered thread never ran, which is how a redundant reply reached a live recruiter on 2026-07-31. The 2026-07-21 hoist fixed this exact shape one split down (observe), which is why it read as already-fixed. run_monitoring() is called from both the paused branch and the live body; the paused call is additionally gated on net_up() because every sensor in it talks to a remote. Set 0 only to restore the old blind-pause behaviour."

  LIMEN_PAUSED_SYNC:
    default: "1"               # ON — a paused beat still re-converges its checkout to the release; 0 = freeze code for this pause
    env: LIMEN_PAUSED_SYNC
    self_update: none
    owner: governance
    note: "The companion to LIMEN_PAUSED_SENSING, one category over: a pause withdraws the authority to act ON THE WORLD (dispatch, spend, send, merge), not the machine's ability to keep its own body coherent. sync-release.sh — the rung that fast-forwards the live checkout to origin/main — sat below the paused `continue`, which created a deadlock that ate its own tail: the 2026-07-21 maintenance blocker's resume_predicate requires 'live root exact origin/main and clean', and the ONLY rung producing that state ran solely when NOT paused, so the halt could never self-clear. Measured 2026-07-31: a hand-run sync reached exact-origin at 12:04 and twenty-five minutes later check-live-checkout.py was back at exit 1, naming sync-release.sh as its owner. Safe by that script's own contract — fast-forward ONLY (never force/reset/merge-commit), fails open always, never exits or re-execs the daemon, and untracked runtime state (including the governor gate holding the pause) is untouched because a ff only advances committed history. A paused fleet on stale code is strictly worse: that is the state which ran a broken mail organ 27 commits behind for four days. Set 0 when a pause was armed BECAUSE trunk is bad and code must be frozen for its duration."

  LIMEN_SENSOR_CANARY:
    default: "1"
    env: LIMEN_SENSOR_CANARY
    self_update: none
    owner: tabularius
    note: "Gate for the sensor-canary rung (sensors.yaml 0g5): derives 'merged but never observed live' from the voice stamps the scheduled runner writes (logs/.voice/<id>), so the canary ritual is mechanized instead of operator memory. NEVER-RAN / STALE on a live-lane (heartbeat-source) sensor exits 1 (advisory in the beat); a metabolize-only scheduled sensor is owner-routed, never red — a lever-parked organ must not read as a failure every beat. Set 0 to silence."

  LIMEN_BEAT_SENSOR_CANARY:
    default: 8
    env: LIMEN_BEAT_SENSOR_CANARY
    self_update: none
    owner: tabularius
    note: "Cadence (every N beats) of the sensor-canary rung in the heartbeat's scheduled derive lane — matches the gitvs precedent for a cheap audit pass. The generic scheduled runner resolves this override; heartbeat-loop.sh contains no sensor-specific cadence constant."

  LIMEN_RECLASSIFY:
    default: "1"
    env: LIMEN_RECLASSIFY
    self_update: none
    owner: tabularius
    note: "Gate for the needs_human-truth rung (sensors.yaml 0g6): scripts/reclassify-needs-human.py separates his real atoms from mislabeled fleet work on cadence. DRY by default — five visible buckets (KEEP/CHRONIC/FLIP/STALE/REVIEW) written to docs/RECLASSIFY-PROPOSAL.md, zero board writes. The flip/park effector is the separate safety valve LIMEN_RECLASSIFY_APPLY. Set 0 to silence."

  LIMEN_BEAT_RECLASSIFY:
    default: 12
    env: LIMEN_BEAT_RECLASSIFY
    self_update: none
    owner: tabularius
    note: "Cadence (every N beats) of the needs_human reclassify rung in the heartbeat's scheduled derive lane. The generic scheduled runner resolves this override; heartbeat-loop.sh contains no sensor-specific cadence constant."

  LIMEN_RECLASSIFY_TIMEOUT:
    default: 60
    env: LIMEN_RECLASSIFY_TIMEOUT
    self_update: none
    owner: tabularius
    note: "Per-pass wall-clock bound (seconds) for the needs_human reclassify rung — one board read plus a proposal-doc write; 60s is generous headroom."

  LIMEN_RECLASSIFY_APPLY:
    default: "1"
    env: LIMEN_RECLASSIFY_APPLY
    self_update: none
    owner: tabularius
    note: "Arms the needs_human reclassify effector: 0 reports the buckets only; 1 (default) flips FLIP tasks needs_human->open and parks CHRONIC tasks needs_human->failed_blocked each cadence (status-only + provenance labels, idempotent, reversible; KEEP/STALE/REVIEW never auto-touched). Shipped dark 07-14; armed 2026-07-15 by the operator-approved whole-machine heal plan (P1.4). Set 0 to disarm."

  LIMEN_PROMPT_ATOM_CONTROL:
    default: "1"
    env: LIMEN_PROMPT_ATOM_CONTROL
    self_update: none
    owner: tabularius
    note: "ARMED 2026-07-15 (PR fix/agy-steps-schema-v2). agy steps schema admitted 3 vendor-drift columns; 567 unsupported-columns units resolved; canary: unbounded pass 219.9s exit-0, bounded pass 198.9s exit-0, --check-cursor PASS. Deep predicate: python3 scripts/prompt-atom-ledger.py --check --require-scope all. Cheap coherence probe: python3 scripts/prompt-atom-ledger.py --check-cursor."

  LIMEN_BEAT_PROMPT_ATOMS:
    default: 4
    env: LIMEN_BEAT_PROMPT_ATOMS
    self_update: none
    owner: tabularius
    note: "Heartbeat cadence for incremental prompt-atom reconciliation after LIMEN_PROMPT_ATOM_CONTROL is explicitly activated. This bounds local scan frequency without capping, sampling, or dropping semantic atoms."

  LIMEN_PROMPT_ATOM_DAYS:
    default: 2
    env: LIMEN_PROMPT_ATOM_DAYS
    self_update: none
    owner: tabularius
    note: "Recent-source discovery horizon for ordinary prompt-atom heartbeat drains. Once an all-history cursor exists, prior atoms remain preserved and only changed/new sources are rescanned."

  LIMEN_PROMPT_ATOM_TIMEOUT:
    default: 300
    env: LIMEN_PROMPT_ATOM_TIMEOUT
    self_update: none
    owner: tabularius
    note: "Process-group timeout for one incremental prompt-atom heartbeat drain. A timeout preserves append-only journals and fails open at the beat. Raised 180->300 at 2026-07-14 activation: the measured bounded pass (169.6s) sat just under 180 while the all-history custody model re-stats the whole estate each pass."

  LIMEN_PROMPT_ATOM_MAX_FILES:
    default: 80
    env: LIMEN_PROMPT_ATOM_MAX_FILES
    self_update: none
    owner: tabularius
    note: "Maximum changed source work units drained per heartbeat. This is a lifecycle/resource bound only: pending work stays explicit in the cursor and no occurrence or atom inside a processed unit is sampled or truncated. Zero is rejected unless a deliberate quiet-window command also passes --unbounded."

  LIMEN_PROMPT_CLASSIFIER_CMD:
    default: ""
    env: LIMEN_PROMPT_CLASSIFIER_CMD
    self_update: none
    owner: tabularius
    note: "Optional opaque JSONL classifier command for prompt atoms. Limen passes provider-neutral occurrence IDs plus exact source segments over stdin and accepts grounded atom rows over stdout. Keep provider/model/catalog IDs and command snapshots out of code and receipts; an absent, invalid, or timed-out command leaves explicit structural fallback atoms."

  LIMEN_MAIN_GREEN_CHECK:
    default: "1"               # ON — detect a RED main trunk each beat (§0g3)
    env: LIMEN_MAIN_GREEN_CHECK
    self_update: none
    owner: tabularius
    note: "Beat gate for the trunk-green sensor (scripts/check-main-green.py) run each beat by metabolize.sh section 0g3. Closes the 2026-07-10 gap where main's REQUIRED pr-gate silently went red (non-hermetic tests) and no sensor detected it. pr-gate runs on pull_request only; ci.yml runs the same suite on push:[main], so the latest completed CI run on main is the trunk-health proxy. On RED the sensor exits non-zero so the beat surfaces it. Throttled gh (LIMEN_MAIN_GREEN_THROTTLE) + fail-open offline. Set 0 to silence."

  LIMEN_REVIEW_HARVEST:
    default: "1"               # ON — surface merged-past agent review findings in the beat log (§0g3a), never in chat
    env: LIMEN_REVIEW_HARVEST
    self_update: none
    owner: tabularius
    note: "Beat gate for the review-harvest sensor (scripts/check-review-harvest.py) run each beat by metabolize.sh section 0g3a. Closes the gap between two organs that both look at review traffic and neither asks this: check-review-engine.py counts distinct reviewer LOGINS and never reads what they said, and preflight-thread-state.py gates an outbound COMMENT rather than a merge. Measured 2026-08-07: 17 unresolved agent findings across 10 merged PRs, every one of which check-review-engine called green. Resolution state is read from GitHub's own reviewThreads (isResolved/isOutdated) — no local ledger, so a human clears a finding from the UI and it stays cleared; outdated threads decay on their own. ADVISORY and strictly downstream of the merge: merge-policy.sh counts only REQUIRED checks on purpose (2026-07-24 insights lineage) and bot reviews are slower than the merge, so this never votes on one. Offline/unreadable is a SKIP at exit 0 that SAYS skip — 'I read nothing' must never print as 'I found nothing'. Set 0 to silence."

  LIMEN_MAIN_GREEN_APPLY:
    default: "0"               # OFF (DARK) — detection-only until armed; then auto-emits one heal task
    env: LIMEN_MAIN_GREEN_APPLY
    self_update: none
    owner: tabularius
    note: "Effector arm for the trunk-green sensor (observable-before-autonomous, the LIMEN_CENSOR_APPLY pattern). When 0 (default) a RED main is only detected + surfaced in the beat log. When 1, check-main-green.py also emits ONE idempotent SYMPTOM-scoped HEAL-mainred-organvm-limen task (id scoped to the symptom, not the head SHA — the SHA lives in the title/context) via the daemon's queue-lock (the safe shared-append path self-heal.py uses) so every lane AND every successive red commit converges on a single canonical heal task instead of duplicating (the #869-vs-#871 gap, limen#895); a recurrence after a prior heal re-opens the same ticket. Arm after watching the detection log prove out."

  LIMEN_NPM_AUDIT_AUTOFIX:
    default: "1"               # ON — detect npm-audit high/critical each beat (§0g3b)
    env: LIMEN_NPM_AUDIT_AUTOFIX
    self_update: none
    owner: tabularius
    note: "Beat gate for the npm-audit-autofix sensor (scripts/npm-audit-autofix.py) run each beat by metabolize.sh section 0g3b. Closes the 2026-07-22 gap: ci.yml runs `npm audit --audit-level=high` as a hard-fail step in web/app + web/worker, so a newly-published high/critical TRANSITIVE advisory deterministically reds under the frozen lockfile and jams the whole PR queue — a class neither Renovate (bumps) nor Dependabot (security-only) fixes, because the only non-breaking fix is an npm `overrides` pin. On a present advisory the sensor exits non-zero so the beat surfaces it. Fail-open when npm is absent/offline. Set 0 to silence."
  LIMEN_NPM_AUDIT_AUTOFIX_APPLY:
    default: "0"               # OFF (DARK) — detection-only until armed; then opens an overrides fix PR
    env: LIMEN_NPM_AUDIT_AUTOFIX_APPLY
    self_update: none
    owner: tabularius
    note: "Effector arm for the npm-audit-autofix sensor (observable-before-autonomous, the LIMEN_MAIN_GREEN_APPLY pattern). When 0 (default) a high/critical npm advisory is only detected + printed. When 1, npm-audit-autofix.py resolves the minimal leaf `overrides` pin(s) (looping to catch unmasked advisories), regenerates the lockfile, verifies 0 high/critical, and opens a fix PR via the ship-docs worktree recipe — gated by merge-policy.sh (web/app is a deploy trigger → HOLD until CI green; a pin that breaks the build reds only the fix PR, never the queue). Idempotent on the advisory-set signature. Arm after watching the detection log prove out."
  LIMEN_NPM_AUDIT_DIRS:
    default: ""
    env: LIMEN_NPM_AUDIT_DIRS
    self_update: none
    owner: tabularius
    note: "Test/override hook for npm-audit-autofix.py: colon-separated npm project dirs (relative-to-root or absolute) to audit instead of the derived web/* subdirs holding a package-lock.json. Empty (default) → derive. Used only by the hermetic test and ad-hoc fixture runs; never set in production."
  LIMEN_PIP_AUDIT_AUTOFIX:
    default: "1"               # ON — detect Python advisories each beat (the pip tier, sibling of npm-audit-autofix)
    env: LIMEN_PIP_AUDIT_AUTOFIX
    self_update: none
    owner: tabularius
    note: "Beat gate for the pip-audit-autofix sensor (scripts/pip-audit-autofix.py) run each beat by metabolize.sh. Closes the 2026-07-22 Python blind spot: ci.yml audited npm but nothing ran pip-audit, so limen's own core (cli/, web/api/, mcp/) had UNSCANNED dependency advisories (the first run found 5 in mcp: cryptography/mcp/starlette). Audits each component's pinned lockfile via `pip-audit --no-deps` (uv components exported first); on a present advisory the sensor exits non-zero so the beat surfaces it. Tier-2 (no published fix) defers to Dependabot, already guarded. Fail-open when pip-audit is absent/offline. Set 0 to silence."
  LIMEN_PIP_AUDIT_AUTOFIX_APPLY:
    default: "0"               # OFF (DARK) — detection-only until armed; then opens a verify-gated forward-pin PR
    env: LIMEN_PIP_AUDIT_AUTOFIX_APPLY
    self_update: none
    owner: tabularius
    note: "Effector arm for pip-audit-autofix (observable-before-autonomous, the LIMEN_MAIN_GREEN_APPLY pattern, read internally). When 0 (default) a Python advisory is only detected + printed. When 1, pip-audit-autofix.py applies the minimal forward pin (uv components → `uv lock --upgrade-package`; plain requirements → rewrite the pin), RE-AUDITS to verify the advisory measurably cleared (verify-gated, like estate-audit-heal — never ships a pin it did not watch work), and opens a fix PR gated by merge-policy.sh. Residual advisories (a pyproject cap holds the bump back) reclassify Tier-2 → Dependabot. Idempotent on the advisory-set signature. Arm after watching the detection log prove out."
  LIMEN_PIP_AUDIT_DIRS:
    default: ""
    env: LIMEN_PIP_AUDIT_DIRS
    self_update: none
    owner: tabularius
    note: "Test/override hook for pip-audit-autofix.py: colon-separated Python component dirs (relative-to-root or absolute) holding a requirements.txt or uv.lock, audited instead of the derived cli/web-api/mcp set. Empty (default) → derive. Used only by the hermetic test and ad-hoc fixture runs; never set in production."

  LIMEN_ESTATE_AUDIT_HEAL:
    default: "1"               # ON — detect other-repo audit-CI reds on the slow heartbeat cadence
    env: LIMEN_ESTATE_AUDIT_HEAL
    self_update: none
    owner: gitvs
    note: "Beat gate for the estate-audit-heal sensor (scripts/estate-audit-heal.py). The estate-wide v2 of npm-audit-autofix: heals the OTHER organvm repos whose CI runs npm/pnpm audit (npm-audit-autofix covers limen itself). Verify-gated: applies overrides, re-audits, keeps only pins whose advisory measurably cleared (Tier-1); framework-major-held residue is deferred to Dependabot (Tier-2). Detection-only until armed. Set 0 to silence."
  LIMEN_ESTATE_AUDIT_HEAL_APPLY:
    default: "0"               # OFF (DARK) — detection-only until armed; then opens cross-repo fix PRs (NO merge)
    env: LIMEN_ESTATE_AUDIT_HEAL_APPLY
    self_update: none
    owner: gitvs
    note: "Effector arm for estate-audit-heal (observable-before-autonomous, the LIMEN_MAIN_GREEN_APPLY pattern, read internally). When 0 (default) other-repo advisories are only detected + printed. When 1, the healer clones each repo (capped by LIMEN_ESTATE_AUDIT_MAX), applies verify-gated Tier-1 overrides, and opens a fix PR in that repo — never auto-merged (mass cross-repo merges are a human-gated lever; the repo's own CI + owner adjudicate). Arm after watching the detection log prove out."
  LIMEN_BEAT_ESTATE_AUDIT:
    default: 24
    env: LIMEN_BEAT_ESTATE_AUDIT
    self_update: none
    owner: gitvs
    note: "Cadence (every N heartbeat beats) of the estate-audit-heal sensor. Deliberately SLOW — the pass clones + installs multiple repos, so it is a rotating daily-class job, not an every-beat check (contrast the local npm-audit-autofix sensor, which is fast + every-beat for limen itself)."
  LIMEN_ESTATE_AUDIT_TIMEOUT:
    default: 1200
    env: LIMEN_ESTATE_AUDIT_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Per-run timeout (seconds) for the estate-audit-heal sensor; generous because it clones + runs full npm/pnpm installs across up to LIMEN_ESTATE_AUDIT_MAX repos. The runner kills the group on overrun and the beat continues fail-open."
  LIMEN_ESTATE_AUDIT_MAX:
    default: 5
    env: LIMEN_ESTATE_AUDIT_MAX
    self_update: none
    owner: gitvs
    note: "Per-run repo cap for estate-audit-heal — a first arming can't fan out uncontrolled across the estate. Repos rotate across runs; blocking-audit repos are healed first. Raise once the detection log + first PRs prove out."
  LIMEN_ESTATE_AUDIT_OWNER:
    default: "organvm"
    env: LIMEN_ESTATE_AUDIT_OWNER
    self_update: none
    owner: gitvs
    note: "GitHub owner/org whose audit-CI repos estate-audit-heal enumerates via `gh search code`. Default organvm (the canonical org). Override for a different owner scope."
  LIMEN_ESTATE_AUDIT_REPOS:
    default: ""
    env: LIMEN_ESTATE_AUDIT_REPOS
    self_update: none
    owner: gitvs
    note: "Test/override hook for estate-audit-heal: colon-separated full repo names (owner/repo) to process instead of the derived `gh search code` discovery. Empty (default) → discover. Used by the hermetic test and bounded armed rehearsals (e.g. cap=1 against one repo); never set in production."
  LIMEN_ESTATE_AUDIT_POSTURE:
    default: "1"               # ON — the single rollup: one line for the whole estate dependency-audit posture
    env: LIMEN_ESTATE_AUDIT_POSTURE
    self_update: none
    owner: gitvs
    note: "Beat gate for the estate-audit-posture rollup (scripts/estate-audit-posture.py). Composes the three ownership organs into ONE view + ONE exit code: RED iff a Tier-2 owner (Dependabot security-updates) is OFF somewhere — the only way an advisory rots UNOWNED. The Tier-1 organs' latest verdicts fold in as telemetry (read from their stamps, never re-run here). Read-only; no arm. Set 0 to silence."
  LIMEN_BEAT_ESTATE_AUDIT_POSTURE:
    default: 12
    env: LIMEN_BEAT_ESTATE_AUDIT_POSTURE
    self_update: none
    owner: gitvs
    note: "Cadence (every N heartbeat beats) of the estate-audit-posture rollup. Light — one API-only Tier-2 check plus two stamp reads (it never re-runs the heavy estate-audit-heal clone pass) — so twice-daily is honest without redundant fan-out."
  LIMEN_ESTATE_AUDIT_POSTURE_TIMEOUT:
    default: 480
    env: LIMEN_ESTATE_AUDIT_POSTURE_TIMEOUT
    self_update: none
    owner: gitvs
    note: "Per-run timeout (seconds) for the estate-audit-posture rollup; margin over the inner dependabot-security-guard live check. The runner kills the group on overrun and the beat continues fail-open."

  LIMEN_MAIN_GREEN_THROTTLE:
    default: "1800"            # seconds between live gh queries; cached verdict surfaces every beat
    env: LIMEN_MAIN_GREEN_THROTTLE
    self_update: none
    owner: tabularius
    note: "Throttle window (seconds) for check-main-green.py's `gh run list` call. Within the window the cached verdict (logs/main-green.json) is reused so a RED trunk still surfaces every beat without re-querying GitHub each tick. Also settable via --throttle. Default 1800 (30 min)."

  LIMEN_CI_JAM_RERUN:
    default: "1"               # ARMED (organ-tended precedent): jam recovery reruns fire by default
    env: LIMEN_CI_JAM_RERUN
    self_update: none
    owner: tabularius
    note: "Recovery valve for the CI-jam class (2026-07-17 billing outage: every job dies in 3-4 s with zero steps — the runner never started). When a RED main classifies as ci-jam-billing/ci-jam-infra, check-main-green.py attempts one bounded `gh run rerun --failed` per jammed run (main + fresh jammed PR heads) per beat with per-run exponential backoff, so the first beat after the outage ends re-greens CI with zero hands and merge-drain lands the green PRs. 0 = classify + notify only, never rerun."
  LIMEN_CI_JAM_BACKOFF_S:
    default: "1800"            # base backoff between rerun attempts on one run id (~one per beat)
    env: LIMEN_CI_JAM_BACKOFF_S
    self_update: none
    owner: tabularius
    note: "Base of the per-run exponential rerun backoff in check-main-green.py's jam recovery: attempt N waits min(BACKOFF_S * 2^(N-1), BACKOFF_MAX_S) after attempt N-1. Deliberately no hard attempt cap — recovery must still fire if the outage ends days later; the growing delay keeps API spam logarithmic while it persists."
  LIMEN_CI_JAM_BACKOFF_MAX_S:
    default: "14400"           # backoff ceiling (4 h): worst-case recovery lag after a long outage
    env: LIMEN_CI_JAM_BACKOFF_MAX_S
    self_update: none
    owner: tabularius
    note: "Ceiling of the jam-recovery rerun backoff. 4 h bounds the worst-case lag between billing being restored and the rerun that re-greens CI, at ~6 attempts/day/run during a persistent outage."
  LIMEN_CI_JAM_RERUN_CAP:
    default: "6"               # max distinct run ids rerun per beat (the trunk run + jammed PR heads)
    env: LIMEN_CI_JAM_RERUN_CAP
    self_update: none
    owner: tabularius
    note: "Per-beat bound on how many distinct jammed runs check-main-green.py will attempt to rerun (the red main run first, then fresh jammed PR-head runs from the wedge scan). Keeps a fleet-wide jam from turning one beat into an API storm; the rotating freshness window covers the rest over subsequent beats."

  LIMEN_MAIN_GREEN_WORKFLOW:
    default: "ci.yml"          # the workflow that runs on push:[main] and mirrors pr-gate's suite
    env: LIMEN_MAIN_GREEN_WORKFLOW
    self_update: none
    owner: tabularius
    note: "Which workflow check-main-green.py reads as the main-trunk-health proxy. Default ci.yml (runs the same pytest as pr-gate, on push:[main]); pr-gate.yml itself runs on pull_request only so it never runs on main."

  LIMEN_MAIN_GREEN_REPO:
    default: "organvm/limen"   # the repo whose main trunk is watched
    env: LIMEN_MAIN_GREEN_REPO
    self_update: none
    owner: tabularius
    note: "Repo (owner/name) whose main-branch CI check-main-green.py watches and, when armed, emits the HEAL-mainred task for. Default organvm/limen. Derived so the sensor survives relocation."
  LIMEN_MAIN_GREEN_WEDGE_K:
    default: 5                 # >= K fresh PRs sharing one failing required check = queue-wedge blast radius
    env: LIMEN_MAIN_GREEN_WEDGE_K
    self_update: none
    owner: tabularius
    note: "Blast-radius threshold (integrated from PR #882): the minimum number of FRESH open PRs that must share a single failing REQUIRED check before check-main-green reports a queue wedge — quantifying the RED alarm's urgency and catching a wedge that persists even when trunk ci.yml is green (a required check diverging from ci.yml)."
  LIMEN_MAIN_GREEN_FRESH_HOURS:
    default: 36                # only PRs updated within this window count toward the wedge (excludes chronic backlog)
    env: LIMEN_MAIN_GREEN_FRESH_HOURS
    self_update: none
    owner: tabularius
    note: "Freshness window (h) for the wedge blast-radius scan: a pile of stale fleet PRs each failing pr-gate on its own stale base is chronic backlog, not an acute trunk break — only recently-updated PRs count toward wedged_prs."

  LIMEN_CONTINUITY_CHECK:
    default: "1"               # ON — detect silent dispatch lanes while queue + budget exist each beat
    env: LIMEN_CONTINUITY_CHECK
    self_update: none
    owner: continuity
    note: "Beat gate for the dispatch-continuity check (scripts/dispatch-continuity-check.py) run each beat by metabolize.sh section 0h (Jul 3–5 starvation precedent). Classifies each known lane as flowing / idle-ok / starved / unknown every beat. Two consecutive starved readings hang an idempotent ASK-lane-starved-<lane> needs_human atom. Fail-open — missing data yields 'unknown', never an alarm. Set 0 to silence."

  LIMEN_CONTINUITY_WINDOW_H:
    default: "24"              # hours of dispatch silence before a lane is considered potentially starved
    env: LIMEN_CONTINUITY_WINDOW_H
    self_update: none
    owner: continuity
    note: "Starvation window in hours for dispatch-continuity-check.py. A lane silent for longer than this value while holding open targeted tasks and a healthy budget is classified as 'starved'. Two consecutive starved beats hang a needs_human atom. Default 24h; lower for tighter detection, raise for noisy queues."

  LIMEN_ASK_GATE:
    default: "1"               # ON — report-only intake audit (observable-before-autonomous; keeper-seam enforcement arms later)
    env: LIMEN_ASK_GATE
    self_update: none
    owner: tabularius
    note: "Beat gate for the intake ask audit (scripts/ask-gate.py --audit --since 7) run each beat by metabolize.sh section 0i (RETRO-0708-ASK-GATE; retro gap model + evolution 3). Encodes the measured drift predictors STRUCTURALLY: a task converges iff it names one executable done-predicate, is a single bounded objective (no (1)..(n) bundles), and is owned (repo + agent); narrative-success vocabulary and ungated armed-behavior deliverables surface as ADVISE findings. Verdicts: PASS / SPLIT (decompose into predicate-shaped children; --task-file offers the skeleton) / ADVISE. Report-only in the beat for now — the LIMEN_CENSOR_APPLY observable-before-autonomous pattern; the enforcement seam is ask-gate --task-file --check on every keeper ticket, to be armed once logs/ask-gate.json proves the predicate. Set 0 to silence."

  LIMEN_OMEGA:
    default: "1"               # ON — compute the autonomic fixed-point verdict each beat
    env: LIMEN_OMEGA
    self_update: none
    owner: tabularius
    note: "Beat gate for the omega fixed-point predicate (scripts/omega.sh --offline --quiet) run each beat by metabolize.sh section 0i. omega.sh is the CONJUNCTION of every gate's --check (enactment-audit, armed-valve-audit, ship-gate, heal-convergence, ask-gate, handoff-relay, no-tasks-on-me, credential-wall): the retro (06-24→07-08) defined 'omega' — runs nights unattended, products reachable, healing converges, nothing hangs on the session — but no script asserted the WHOLE. A rung it cannot verify here is SKIP, never a silent PASS (the MONETA curl-000 lesson); rungs are tagged det (repo-deterministic) or live (host/network); --offline runs det only, --full adds verify-whole.sh for authoritative main-green. Exit 0 ⟺ zero FAIL. Stamps logs/omega.json (verdict + PASS/FAIL/SKIP) for session-orient section_omega. verify-whole.sh runs the deterministic stub test (scripts/tests/omega.test.sh); the live fixed-point verdict stays beat-side. Set 0 to silence."

  LIMEN_CENSOR_ISSUES_APPLY:
    default: "0"               # SAFE CODE DEFAULT — dry-run; ships observable-before-autonomous (the LIMEN_CENSOR_APPLY constitutional pattern). NO fleet_runtime yet: arming is deliberately a human act.
    env: LIMEN_CENSOR_ISSUES_APPLY
    self_update: none
    owner: censor
    note: "Arms scripts/sync-censor-issues.py — the censor→GitHub mirror that makes the system's own findings part of the public graph. When 1, every live `warning` residual in logs/censor-residual.json gets exactly one open `censor`-labelled issue (marker `<!-- censor:<id> -->`), auto-closed with a citation when the lineage clears; a HUMAN close is a veto, respected forever; creations capped per pass (--cap, default 8); stamps logs/censor-issues.json. Wired in heartbeat-loop.sh (C_CENSOR lane, after insight-route) and metabolize.sh 5b — both dry-run until armed, so the plan is observable in the beat log first. WHEN ARMING: set 1 in the daemon env AND add fleet_runtime: \"1\" here in the same change, so enactment-audit.py locks it live (the #576 dark-switch lesson — never a note that claims what no rung checks)."

  LIMEN_INSIGHT_ROUTE_APPLY:
    default: "0"               # SAFE CODE DEFAULT — a bare manual run is a dry-run; the FLEET arms it (see note)
    env: LIMEN_INSIGHT_ROUTE_APPLY
    fleet_runtime: "1"         # ENACTMENT CONTRACT — the LIVE fleet MUST resolve this to 1 (heartbeat-loop.sh wires it); enactment-audit.py fails if the beat diverges, so the route organ can never silently go dark again (it shipped as an orphan once — tests+gate, no caller, #596)
    self_update: none
    owner: insight-route
    note: "Arms scripts/insight-route.py — the insights→owners route organ that closes the insight-cadence loop. When 1, the latest report per cadence tier routes each insight to its durable owner: anthony → his-hand-levers.json (+ issue sync), org/repo → a board task via the TABVLARIVS keeper (submit_task_upsert when LIMEN_TICKETS_PRODUCE=1; board-echo insights sourced from tasks.yaml are skipped — the failed task IS the record), organ → logs/<organ>-residual.json. Default 0 keeps an ad-hoc run observe-only, but the LIVE FLEET ARMS IT: scripts/heartbeat-loop.sh exports LIMEN_INSIGHT_ROUTE_APPLY=1 (overridable to 0 in ~/.limen.env), and metabolize.sh section 5b runs it right after insight-cadence."

  LIMEN_INSIGHT_ROUTE_MAX:
    default: "5"
    env: LIMEN_INSIGHT_ROUTE_MAX
    self_update: none
    owner: insight-route
    note: "Per-pass cap on NEW board tasks created by insight-route.py. Overflow is counted in the summary line and self-corrects next beat (the insight persists in the latest report until routed). Bounds a first arming or an insight burst so the route organ can never flood the board in one pass — the same board-hygiene reflex as the sync 8/beat cap."

  # --- DEMAND-SURFACE ORGANS: keep the front door reachable + launch posts homed ---
  # (scripts/link-health.py + scripts/launch-organ.py). A 404 on a public identity surface is silent
  # demand-loss; a launch with no home is a one-off. Both are REPEATABLE processes, not chores — the
  # link organ probes every beat like creds-hydrate --verify, the launch organ homes every product ship.
  LIMEN_LINK_HEALTH:
    default: "1"               # ON — probe public surfaces for dead links each beat (throttled ~6h)
    env: LIMEN_LINK_HEALTH
    self_update: none
    owner: link-health
    note: "Beat gate for the link-health organ (scripts/link-health.py --verify). 1=probe the tracked identity/demand surfaces for 404s each beat, self-throttled to ~6h so it never floods the network; 0=off. Fail-open, never fatal — a dead link surfaces in the beat log the same way a dead credential does. See link-surfaces.json."
  LIMEN_LINK_HEAL:
    default: "1"               # ON — when a dead link has a verified-live remap, open a reviewable fix-PR
    env: LIMEN_LINK_HEAL
    self_update: none
    owner: link-health
    note: "Beat gate for the link-health organ's SELF-HEAL (scripts/link-health.py --heal --apply). 1=when a dead link has a verified-live replacement, auto-open a reversible fix-PR at the source; 0=detect only. Boundary: heal OPENS a PR, never MERGES — publishing the fix into a live identity surface stays the human's hand / merge-policy (the same stage-vs-send boundary the launch organ draws). Idempotent + self-limiting: the fix-PR branch embeds a hash of the exact fix-set, so a standing dead link is PR'd once and never re-nagged. Fail-open, never fatal."
  LIMEN_LINK_SURFACES:
    default: "$LIMEN_ROOT/link-surfaces.json"
    env: LIMEN_LINK_SURFACES
    self_update: none
    owner: link-health
    note: "Path to the declarative registry of public surfaces + host remap rules the link-health organ checks. Add a surface or a known-good remap = one entry there, never a code change. Publishes public URLs only — never a private URL or token."
  LIMEN_LAUNCHES:
    default: "$LIMEN_ROOT/organs/launch/launches.json"
    env: LIMEN_LAUNCHES
    self_update: none
    owner: launch
    note: "Path to the launch organ's product registry (scripts/launch-organ.py). Add a product = one entry; channel-native drafts stage under organs/launch/staged/<product>/<channel>.md and the organ NEVER sends — publishing stays the human's hand."
  LIMEN_BEAT_GOVERNANCE:
    default: "8"               # every 8 beats
    env: LIMEN_BEAT_GOVERNANCE
    self_update: none
    owner: governance
    note: "Beat cadence for the governance organ (scripts/governance-organ.py): run the cursus-honorum seed validator + governance standing report every N beats. Read-only, lockless, fail-open."
  LIMEN_GOVERNANCE:
    default: "1"               # ON — run the governance organ each due beat
    env: LIMEN_GOVERNANCE
    self_update: none
    owner: governance
    note: "Beat gate for the governance organ. 1=validate every seed.yaml in the estate + stamp the governance voice each due beat; 0=off. Never gates the beat."
  LIMEN_BEAT_FINANCIAL:
    default: "8"               # every 8 beats
    env: LIMEN_BEAT_FINANCIAL
    self_update: none
    owner: financial
    note: "Beat cadence for the financial organ (scripts/financial-organ.py): run the financial-office consolidator and maturity advance every N beats. Idempotent and fail-open."
  LIMEN_FINANCIAL:
    default: "1"               # ON — run the financial organ each due beat
    env: LIMEN_FINANCIAL
    self_update: none
    owner: financial
    note: "Beat gate for the financial organ. 1=refresh balance/cashflow/status and advance maturity when criteria are met; 0=off. Never gates the beat."
  LIMEN_BEAT_PUBPOLICY:
    default: "8"               # every 8 beats
    env: LIMEN_BEAT_PUBPOLICY
    self_update: none
    owner: pubpolicy
    note: "Beat cadence for the publication-policy organ (scripts/publication-policy.py --verify): re-prove the content-disposition engine stays sound (redactor owner-scoped, matrix + classifier intact) every N beats. Read-only self-test, stamps logs/publication-policy-state.json."
  LIMEN_PUBPOLICY:
    default: "1"               # ON — verify the disposition engine each due beat
    env: LIMEN_PUBPOLICY
    self_update: none
    owner: pubpolicy
    note: "Beat gate for the publication-policy organ (the ONE content-disposition decision: repo visibility x content class -> disposition). 1=self-verify each due beat; 0=off. Fail-open, never gates the beat. See organs/governance/PUBLICATION-POLICY.md."
  LIMEN_OWNER_IDENTITY:
    default: ""                # unset — the redactor uses its built-in owner instance
    env: LIMEN_OWNER_IDENTITY
