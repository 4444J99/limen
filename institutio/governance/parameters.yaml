    note: "Per-run timeout (seconds) for the claude-identity-bundle beat step. The work is a stat, a small write, and one hardlink, so 60 is generous; the runner kills the command group on overrun and continues fail-open."

  # --- dialogs-silenced sensor (0g8b): the agent-curable dialog estate, self-healed + verified on the beat ---
  LIMEN_DIALOGS_SILENCED:
    default: "1"               # ON — the sensor gate; each cadence tick runs the heal pass + --agent-curable-only verify.
    env: LIMEN_DIALOGS_SILENCED
    self_update: none
    owner: tabularius
    note: "Gate for the dialogs-silenced sensor (sensors.yaml 0g8b) in the heartbeat scheduled derive lane. When 1, each cadence tick runs the three agent-curable dialog effectors (heal-hook-drift / heal-claude-cask / heal-claude-lsregister, each armed individually via its own LIMEN_*_HEAL deliverable valve) then verifies with 'dialogs-silenced.sh --agent-curable-only'. This ONE registry-derived sensor replaced three hand-wired hygiene hooks in heartbeat-loop.sh (adding a new dialog effector is now one sensors.yaml step). Set 0 to silence the whole pass. The human-gated dialog classes (settings.json self-mod, firewall sudo) stay levers, not sensor steps."
