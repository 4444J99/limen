    owner: integrity
    note: "codesign --verify on the heartbeat; includes the fixed Domus host and alerts on signature drift without pinning rotating vendor executables."
  LIMEN_AGENT_HOST_BIN:
    default: "~/Applications/DomusAgentHost.app/Contents/MacOS/DomusAgentHost"
    env: LIMEN_AGENT_HOST_BIN
    self_update: none
    owner: integrity
    note: "Explicit stable-host executable override for local Limen dispatch. The Darwin lane expands user-relative paths and fails closed unless status --json proves the fixed bundle, stable path, signature, and signing requirement."
  LIMEN_AGENT_RUNTIME_ROOT:
    default: "$LIMEN_ROOT/.agent-runtime"
