# VIGILIA — THE PARAMETER PANEL (the spine; the "100x").
#
# Mandate: every name, path, threshold, and secret-REFERENCE the body uses is ONE
# declared parameter here — with a default, an env override, and (where it makes
# sense) a self-update rule. No hardcodes. This is enforced by a CI gate (build
# order #3), the same way the nomenclator gate already fails the build on a bad name.
#
# This file is a SEED, not the finished panel. The excavation found ~70 LIMEN_* vars
# scattered across 5 env files + 7 YAML + 3 JSON + 3 py-defaults. Folding all of them
# in here — and pointing the code at this panel — is its own focused PR.
#
# param schema:
#   <KEY>:
#     default:     the reversible default
#     env:         the env var that overrides it (usually the key itself)
#     self_update: none | <rule>   # how/whether the body may re-tune it
#     owner:       which organ owns it (see registry/organs.yaml)
#     note:        optional

schema_version: 0.1

parameters:

  # --- autonomy governor: stale-pause-marker auto-clear -------------------------
  LIMEN_AUTONOMY_MARKER_AUTOCLEAR:
    default: 1
    env: LIMEN_AUTONOMY_MARKER_AUTOCLEAR
    self_update: none
    owner: vigilia
    note: "When 1 (default), autonomy-governor.current_mode() auto-clears an AUTONOMY_PAUSED 'integration drain' marker once its owner: branch has a MERGED PR (fail-closed via gh). Prevents the 2026-07-10 21h respawn-spin freeze (owner codex/dynamic-routing-closeout-20260710, PR #921 merged, marker never cleaned up). 0 = never auto-clear (a marker outlives its owner PR)."
  LIMEN_AUTONOMY_WINDOW_RESTORE:
    default: "1"
    env: LIMEN_AUTONOMY_WINDOW_RESTORE
    self_update: none
    owner: vigilia
    note: "Auto-restore switch for finite maintenance windows: when a window's declared resume predicate passes (recorded at logs/autonomy-maintenance-resume.json), the governor flips the policy observe->dispatch with a receipt (logs/autonomy-policy-restore.json) instead of waiting on a manual policy edit. 0 restores the old manual-restore contract. Founded on the 2026-07-21->08-06 incident: all resume clauses passing since 08-05 while the estate sat at observe with zero dispatch — satisfying the predicate cleared the blocker but nothing rewrote mode. Indefinite observe (no window), `restore: manual` windows, and the pause marker are never overridden."
  LIMEN_AUTONOMY_CLAUSE_RECHECK_SECS:
    default: 300
    env: LIMEN_AUTONOMY_CLAUSE_RECHECK_SECS
    self_update: none
    owner: vigilia
    note: "Throttle window for an EXPIRED maintenance window's resume-predicate clauses — at most one full clause evaluation per this many seconds. current_mode() is the chokepoint both the heartbeat and every dispatch admission read, so it runs many times a minute, and the clauses are real work (a git fetch-state read, a bash plist render, a host-pressure probe). Unthrottled, a status query becomes sustained load on a 16GB host that already logs jetsam kills. Same bound, same reason, as LIMEN_AUTONOMY_MARKER_RECHECK_SECS."
  LIMEN_AUTONOMY_MARKER_RECHECK_SECS:
    default: 120
    env: LIMEN_AUTONOMY_MARKER_RECHECK_SECS
    self_update: none
    owner: vigilia
    note: "Throttle window for the marker auto-clear gh check — at most one `gh pr list` per this many seconds while a pause marker is present, so rapid current_mode() callers (dispatch admission) don't hammer GitHub."
  LIMEN_AUTONOMY_MARKER_AUTOMERGE:
    default: "1"
    env: LIMEN_AUTONOMY_MARKER_AUTOMERGE
    self_update: none
    owner: vigilia
    note: "When 1 (default), the governor COMPLETES a PR-owned pause release instead of merely checking it: a marker whose owner:/pr: names one identifiable PR, whose release_predicate declares the merge, and whose prohibitions do NOT mention merge gets merge-policy.sh run on that PR and, on CLEARED (exit 0), a head-pinned squash merge — so a pause can never deadly-embrace the paused beat that would have merged its own release (the 2026-07-15 endless-watcher incident: sessions babysat the pause-owner PR by hand because merge-drain lives inside the paused heartbeat). Operator pauses (merge in prohibitions, or owner_surface:-only identity) are structurally ineligible and never touched. 0 = check-only (pre-2026-07-15 behavior). Follows the LIMEN_AUTONOMY_MARKER_AUTOCLEAR / LIMEN_MERGE_DRAIN default-on precedent; the five-clause discriminator is the safety, and its worst failure mode is staying paused."
  LIMEN_HEARTBEAT_PAUSED_SECONDS:
    default: 300
    env: LIMEN_HEARTBEAT_PAUSED_SECONDS
    self_update: none
    owner: vigilia
    note: "Low-frequency sleep cadence while the autonomy governor is paused. The singleton stays alive and writes one byte-stable paused receipt instead of exiting into a launchd KeepAlive respawn loop."

  # --- treaty leads: battle spawn bounds (scripts/lead-spawn.py) ---------------
  LIMEN_LEAD_BATTLE_RUNWAY:
    default: "8h"
    env: LIMEN_LEAD_BATTLE_RUNWAY
    self_update: none
    owner: vigilia
    note: "Default runway a domain lead grants a spawned battle worktree when the spawn does not request one. Always clamped to the lead's remaining runway (authority attenuates downward; contract law: recheck_remaining_runway_before_each_packet)."
  LIMEN_LEAD_MAX_BATTLES:
    default: 3
    env: LIMEN_LEAD_MAX_BATTLES
    self_update: none
    owner: vigilia
    note: "Max live battle worktrees per domain lead on one workstream handle. The proliferation bound that keeps a lead from re-creating the 2026-07 FleetView sprawl; a spawn past the cap is refused with the exact live-battle list."

  # --- the institution names ITSELF as the first parameter ---------------------
  INSTITVTIO_NOMEN:
    default: "VIGILIA"          # provisional codename — NOT ratified
    env: INSTITVTIO_NOMEN
    self_update: "ratified once, via INDEX·NOMINVM"
    owner: index-nominum
    note: "Even the name is a parameter. Do not treat VIGILIA as final."

  INSTITVTIO_HOME:
    default: "limen/institutio"  # provisional; may extract to its own repo
    env: INSTITVTIO_HOME
    self_update: none
    owner: the-seat
    note: "Repo home is a decision, not a constant. Extracting later is a clean git subtree."

  LIMEN_ASYNC_MAX:
    default: "hw.ncpu — derived by the legacy manual async engine"
    env: LIMEN_ASYNC_MAX
    self_update: none
    owner: dispatch
    note: "Host-sized concurrency ceiling for explicitly invoked legacy async dispatch workers. The canonical heartbeat does not consume this knob; campaign capacity comes from live keeper capabilities and packet authority."
  LIMEN_ASYNC_LOCAL_PER_LANE:
    default: "$LIMEN_LOCAL_LIMIT"
    env: LIMEN_ASYNC_LOCAL_PER_LANE
    self_update: none
    owner: dispatch
    note: "Per-lane launch room for local async workers. Remote lanes such as Jules use live provider runway and --per-lane; this knob prevents a remote burst command from becoming 100 local OpenCode/Agy processes."
  LIMEN_REMOTE_BASE_REF:
    default: "HEAD"
    env: LIMEN_REMOTE_BASE_REF
    self_update: none
    owner: dispatch
    note: "Public target ref resolved through the remote GitHub owner to an exact pushed SHA before deterministic off-box verification."
  LIMEN_GITHUB_ACTIONS_CONTROL_REF:
    default: "<live remote default branch>"
    env: LIMEN_GITHUB_ACTIONS_CONTROL_REF
    self_update: none
    owner: dispatch
    note: "Optional explicit short branch/tag name. When unset, discovery uses the live remote default branch. HEAD, raw SHAs, pull refs, unprotected branches, ambiguous branch/tag names, and unsafe ref syntax fail closed. The branch/tag and its exact re-resolved SHA are packet- and receipt-bound."
  LIMEN_REMOTE_RECEIPT_ROOT:
    default: "$LIMEN_ROOT/logs/remote-execution"
    env: LIMEN_REMOTE_RECEIPT_ROOT
    self_update: none
    owner: dispatch
    note: "Local content-addressed observation store for public GitHub Actions run IDs, URLs, exact SHAs, predicate digests, and durable receipt identities. Raw provider output and credentials are excluded."
  LIMEN_FACTS_APPLY:
    default: 0
    env: LIMEN_FACTS_APPLY
    self_update: none
    owner: identity
    note: "Arms identity.py `need` to APPEND a pending row to personal-facts.yaml (and file an L-FACT lever) for an un-homed personal-fact class. Dry-run (0) by default — surfaces the pending row without writing. The write path is single-writer/scrubbed: class-NAME only, never a value."
  LIMEN_IDENTITY_VERIFY:
    default: 1
    env: LIMEN_IDENTITY_VERIFY
    self_update: none
    owner: identity
    note: "Toggles the beat's personal-fact presence check (identity.py verify, sensor 0a2 in sensors.yaml). 1=on: a blank applicable&required atom surfaces in the beat log, never chat. Sibling of LIMEN_CREDS_HYDRATE — creds rotate, identity atoms don't."
  LIMEN_DISPATCH_ASYNC:
    default: 0
    env: LIMEN_DISPATCH_ASYNC
    self_update: none
    owner: dispatch
    note: "Legacy manual dispatcher selector retained for compatibility. The canonical heartbeat ignores it and invokes only the keeper-backed campaign supervisor; 0 prevents old callers from silently treating async dispatch as the enacted daemon mode."
  LIMEN_PROVIDER_FAILURE_WINDOW_SECONDS:
    default: 86400
    env: LIMEN_PROVIDER_FAILURE_WINDOW_SECONDS
    self_update: none
    owner: dispatch
    note: "Sliding evidence window for runtime provider/model terminal outcomes. The append-only ledger stores metadata and receipt references only."
  LIMEN_PROVIDER_COOLDOWN_SECONDS:
    default: 3600
    env: LIMEN_PROVIDER_COOLDOWN_SECONDS
    self_update: none
    owner: dispatch
    note: "Cooldown after the configured terminal-attempt threshold. A cooled model returns only after this interval and a successful tool-using smoke."
  LIMEN_PROVIDER_TERMINAL_ATTEMPTS:
    default: 2
    env: LIMEN_PROVIDER_TERMINAL_ATTEMPTS
    self_update: none
    owner: dispatch
    note: "Terminal outcomes inside the failure window required to cool an exact runtime model, or the provider for auth/rate-limit classes."
  LIMEN_PROVIDER_SAME_MODEL_RETRIES:
    default: 1
    env: LIMEN_PROVIDER_SAME_MODEL_RETRIES
    self_update: none
    owner: dispatch
    note: "Maximum bounded same-model retries for stream, transport, timeout, and no-output outcomes."
  LIMEN_PROVIDER_SMOKE_TIMEOUT_SECONDS:
    default: 120
    env: LIMEN_PROVIDER_SMOKE_TIMEOUT_SECONDS
    self_update: none
    owner: dispatch
    note: "Maximum runtime for the repository-read plus harmless-tool-call smoke required after cooldown."
  LIMEN_PROVIDER_OUTCOME_LEDGER:
    default: "$LIMEN_ROOT/logs/provider-outcomes.jsonl"
    env: LIMEN_PROVIDER_OUTCOME_LEDGER
    self_update: none
    owner: dispatch
    note: "Append-only local projection of provider/model outcome metadata. Prompts, responses, and credentials are forbidden."

  LIMEN_PROBE_ATTEMPTS:
    default: "40 for the API runtime; 80 for the Worker runtime"
    env: LIMEN_PROBE_ATTEMPTS
    self_update: none
    owner: dispatch
    note: "Maximum readiness attempts for either local runtime probe. Tests lower this value to exercise the terminal-failure cleanup path without a long wait."
  LIMEN_PROBE_RETRY_DELAY:
    default: 0.25
    env: LIMEN_PROBE_RETRY_DELAY
    self_update: none
    owner: dispatch
    note: "Seconds between local runtime readiness attempts."
  LIMEN_PROBE_TERM_GRACE:
    default: 2
    env: LIMEN_PROBE_TERM_GRACE
    self_update: none
    owner: dispatch
    note: "Seconds allowed for a directly owned probe server to exit after TERM before its isolated process group receives KILL."
  LIMEN_PROBE_CAPABILITY_SECRET:
    default: "probe-capability-secret-at-least-24-chars"
    env: LIMEN_PROBE_CAPABILITY_SECRET
    self_update: none
    owner: dispatch
    note: "Disposable local-only HMAC secret used by the Worker runtime probe to mint executor capabilities. It is written only to the private temporary probe environment and is never a production credential."

  LIMEN_LOCAL_FLOOR:
    default: 0
    env: LIMEN_LOCAL_FLOOR
    self_update: none
    owner: dispatch
    note: "MANVMISSIO local-floor arm switch — DARK by default (operator rule 2026-07-09: nothing switches over until the math maths). Arm to 1 only when the parity gate (organvm/manumissio) passes each floor class at threshold."

  LIMEN_LOCAL_FLOOR_CLASSES:
    default: "scan,verify,link-check,classify,summarize"
    env: LIMEN_LOCAL_FLOOR_CLASSES
    self_update: "per-class: add only on parity-gate pass; ledger waste_classes auto-rolls a class back at runtime"
    owner: dispatch
    note: "Job classes the unmetered ollama floor may absorb (capacity.local_floor_classes). Reserved opus/fable classes are excluded in code regardless of this list."

  # --- VITALS: the missing executive's thresholds (build order #1) --------------
  # These are the published 'reaction function' the heartbeat will enact. Seeds —
  # tune against _diagnostics FIND-005 ('treat 16GB as a budget, not a floor').
  VITALS_PRESSURE_GAUGE:
    default: "kern.memorystatus_vm_pressure_level"
    env: LIMEN_VITALS_GAUGE
    self_update: none
    owner: vitals
    note: "The kernel's own jetsam signal — correct gauge; free-pages stays ~0 even when healthy."
  VITALS_PRESSURE_WARN:
    default: 2                  # macOS gauge: 1=normal, 2=warn, 4=critical
    env: LIMEN_VITALS_WARN
    self_update: none
    owner: vitals
    note: "At >=warn (2), report pressure while the keeper-backed campaign supervisor retains provider admission. A 16GB host lives at warn under normal load; the old skip-at-warn idle beat starved the fleet for a night (2026-07-08: 273 skipped beats, budget unused)."
  VITALS_PRESSURE_CRITICAL:
    default: 4
    env: LIMEN_VITALS_CRIT
    self_update: none
    owner: vitals
    note: "At >=critical (4): block new local checkout work and shed running discretionary load (e.g. ollama) before jetsam escalates; off-box provider lanes remain eligible."
  VITALS_HEAVY_SURFACE_LIMIT:
    default: 1
    env: LIMEN_VITALS_HEAVY_LIMIT
    self_update: none
    owner: vitals
    note: "FIND-005: one heavy AI surface at a time on a 16GB host."
  LIMEN_HOST_ADMISSION_ROOT:
    default: "auto"
    env: LIMEN_HOST_ADMISSION_ROOT
    self_update: none
    owner: vitals
    note: "Machine-wide, per-UID lease state. 'auto' derives a private directory under the host temp root so leases are shared by every Limen worktree but never promoted to backed-up governance output."
  LIMEN_HOST_ADMISSION_LEASE_SECONDS:
    default: 900
    env: LIMEN_HOST_ADMISSION_LEASE_SECONDS
    self_update: none
    owner: vitals
    note: "Finite lease TTL for execution and heavy-surface admission. Bounded entrypoints refresh live leases; dead PID, PID-start mismatch, and TTL cleanup never signal or restart peers."
  LIMEN_HOST_ADMISSION_OWNER:
    default: ""
    env: LIMEN_HOST_ADMISSION_OWNER
    self_update: none
    owner: vitals
    note: "Optional stable caller label for the public host-admission CLI. Blank derives a private label from the parent process-start identity; the persisted label never contains a checkout path."
  LIMEN_IMMUTABLE_ADMISSION_ENTRYPOINT:
    default: "$HOME/.local/share/limen/current/source/scripts/hooks/codex-host-admission.py"
    env: LIMEN_IMMUTABLE_ADMISSION_ENTRYPOINT
    self_update: none
    owner: vitals
    note: "Installed immutable host-admission policy entrypoint. The project runner delegates to this path so a checkout cannot replace the policy that judges it; an explicit override exists for bounded compatibility tests and clean runtime activation probes."
  LIMEN_CODEX_PRETOOL_DENIAL_SUPPORTED:
    default: "auto"
    env: LIMEN_CODEX_PRETOOL_DENIAL_SUPPORTED
    self_update: none
    owner: vitals
    note: "Compatibility probe override for Codex action admission. Auto observes the installed client's stable-hooks capability; true enables structured PreToolUse denial, while false never serializes conversation roots or creates a global session-start lease."
  LIMEN_HOST_ADMISSION_PROBE_TIMEOUT:
    default: 5
    env: LIMEN_HOST_ADMISSION_PROBE_TIMEOUT
    self_update: none
    owner: vitals
    note: "Hard timeout in seconds for the two-interval iostat pressure observation used only when deciding whether to admit new heavy work."
  LIMEN_HOST_ADMISSION_BACKBLAZE_CPU_PERCENT:
    default: 50
    env: LIMEN_HOST_ADMISSION_BACKBLAZE_CPU_PERCENT
    self_update: none
    owner: vitals
    note: "Deny a new heavy lease when aggregate Backblaze client CPU is strictly above this percentage. Existing work is not killed or restarted."
  LIMEN_HOST_ADMISSION_BACKBLAZE_RSS_BYTES:
    default: 1073741824
    env: LIMEN_HOST_ADMISSION_BACKBLAZE_RSS_BYTES
    self_update: none
    owner: vitals
    note: "Deny a new heavy lease when aggregate Backblaze client RSS is strictly above one GiB."
  LIMEN_HOST_ADMISSION_SWAP_FRACTION:
    default: 0.25
    env: LIMEN_HOST_ADMISSION_SWAP_FRACTION
    self_update: none
    owner: vitals
    note: "Deny a new heavy lease when live swap use is strictly above this fraction of physical RAM."
  LIMEN_HOST_ADMISSION_SWAP_GROWTH_BYTES_PER_MINUTE:
    default: 536870912
    env: LIMEN_HOST_ADMISSION_SWAP_GROWTH_BYTES_PER_MINUTE
    self_update: none
    owner: vitals
    note: "Deny a new heavy lease when two bounded observations prove swap is growing strictly faster than 512 MiB per minute."
  LIMEN_HOST_ADMISSION_DISK_MIB_PER_SECOND:
    default: 100
    env: LIMEN_HOST_ADMISSION_DISK_MIB_PER_SECOND
    self_update: none
    owner: vitals
    note: "Deny a new heavy lease only when both post-baseline iostat samples are strictly above this aggregate MiB/s threshold."
  VITALS_SHED_OLLAMA:
    default: "1"
    env: LIMEN_VITALS_SHED_OLLAMA
    self_update: none
    owner: vitals
    note: "Kill switch for the critical-pressure ollama shed. 1=shed loaded models at >=critical; 0=record only."
  VITALS_LOAD_WARN_PER_CORE:
    default: 1.5
    env: LIMEN_VITALS_LOAD_WARN
    self_update: none
    owner: vitals
    note: "Second VITALS axis (2026-07-15 host-thrash incident: Backblaze crawl + concurrent full pytest suites pinned CPU while the memory gauge alone couldn't see the storm coming). 1-min load average per core >= this: THROTTLE. Deliberately loose so memory stays the primary gauge and load only catches CPU-only storms — the 2026-07-08 starved-fleet night (273 skipped beats) is the precedent against tight thresholds."
  VITALS_LOAD_CRIT_PER_CORE:
    default: 3.0
    env: LIMEN_VITALS_LOAD_CRIT
    self_update: none
    owner: vitals
    note: "1-min load average per core >= this: SHED — block new local checkout work; off-box provider lanes remain eligible. Combined with the memory axis by max severity (either gauge can throttle/shed; neither can mask the other)."
  VITALS_SWAP_WARN_RATIO:
    default: 0.75
    env: LIMEN_VITALS_SWAP_WARN
    self_update: none
    owner: vitals
    note: "Third VITALS axis (2026-07-16 host-thrash incident: swap 17.3/18 GiB, 94 MB free RAM, while the jetsam gauge reported only 'warn' for hours). Swap USED >= this ratio x physical RAM: THROTTLE. Cold swap stock with a modest swap estate stays ok — the ratio is against RAM, not the swap file."
  VITALS_SWAP_TOTAL_CRIT_RATIO:
    default: 1.0
    env: LIMEN_VITALS_SWAP_CRIT
    self_update: none
    owner: vitals
    note: "Swap TOTAL allocated >= this ratio x physical RAM: SHED. macOS grows the swap estate on demand, so the estate reaching RAM size is the OS's own overcommit declaration (18 GiB > 16 GiB during the 2026-07-16 thrash; the healthy same-day baseline 12 GiB < 16 stays green)."
  VITALS_WARN_SUSTAIN_BEATS:
    default: 3
    env: LIMEN_VITALS_WARN_SUSTAIN
    self_update: none
    owner: vitals
    note: "A combined-axis 'warn' that persists this many consecutive gate beats escalates to SHED — 2026-07-16 sat at warn for hours while swap filled; sustained warn IS critical. Streak persists in logs/vigilia/vitals-streak.json, counts only on the gate path (beat_gate(shed=True)) at most once per 60 s, resets on ok. 0 disables the escalation."
  VITALS_SAMPLE_SECONDS:
    default: 300
    env: LIMEN_VITALS_SAMPLE_SECONDS
    self_update: none
    owner: vitals
    note: "Declared cadence of the heartbeat's independent fast wave. It refreshes VIGILIA sampled_at, phase-sensitive diurnal checks, and organ-health even while the main beat is inside a slow bounded rung."
  LIMEN_WAKE_STATE:
    default: "FullWake"
    env: LIMEN_WAKE_STATE
    self_update: none
    owner: vitals
    note: "Observed wake state attached to each explicit VIGILIA sample. Sleep, DarkWake, and MaintenanceDarkWake samples cannot page; FullWake time is the staleness denominator."
  LIMEN_VITALS_SAMPLE_TIMEOUT:
    default: 30
    env: LIMEN_VITALS_SAMPLE_TIMEOUT
    self_update: none
    owner: vitals
    note: "Seconds allowed for the lightweight VIGILIA host sample inside one fast wave. This stays far below the declared sample cadence so a wedged probe cannot consume the next sample slot."
  VITALS_SAMPLE_GRACE_SECONDS:
    default: 5
    env: LIMEN_VITALS_SAMPLE_GRACE_SECONDS
    self_update: none
    owner: vitals
    note: "Bounded sampler/write grace at a VITALS sample cadence boundary. The stale watcher and fast-wave scheduler include LIMEN_VITALS_SAMPLE_TIMEOUT plus this allowance, so a healthy slow sample cannot be reported stale while its atomic seat replacement is still pending."
  LIMEN_HOST_PRESSURE_WATCHDOG_TIMEOUT:
    default: 30
    env: LIMEN_HOST_PRESSURE_WATCHDOG_TIMEOUT
    self_update: none
    owner: vitals
    note: "Seconds allowed for one independent stale-sample watchdog evaluation. The watchdog is a sibling of the sampler, so this bound cannot delay the declared VITALS sample cadence."
  LIMEN_FAST_WAVE_SENSOR_TIMEOUT:
    default: 260
    env: LIMEN_FAST_WAVE_SENSOR_TIMEOUT
    self_update: none
    owner: diurnal
    note: "Seconds allowed for phase-sensitive scheduled sensors in the independent fast-wave auxiliary tier. The tier is single-flight and concurrent with organ-health, so this bound can never postpone the dedicated VITALS sample clock."
  LIMEN_ORGAN_HEALTH_TIMEOUT:
    default: 120
    env: LIMEN_ORGAN_HEALTH_TIMEOUT
    self_update: none
    owner: governance
    note: "Seconds allowed for the fresh organ-health receipt in one fast wave. A timeout is recorded in the atomic fast-wave log and never delays the next declared sample cadence."
  VITALS_STALE_BEATS:
    default: 3
    env: LIMEN_VITALS_STALE_BEATS
    self_update: none
    owner: vitals
    note: "host-pressure-stale threshold: sampled_at in logs/vigilia/status.json is stale after this many declared VITALS_SAMPLE_SECONDS cadences, plus VITALS_SAMPLE_GRACE_SECONDS for the producer write. completed_at measures the slower full autonomic beat and never substitutes for a fresh host sample."
  LIMEN_HOST_PRESSURE_STALE:
    default: "1"
    env: LIMEN_HOST_PRESSURE_STALE
    self_update: none
    owner: vitals
    note: "Gate for the host-pressure-stale beat sensor (institutio/governance/sensors.yaml section 0o): scripts/host-pressure-stale.py fails when sampled_at misses VITALS_STALE_BEATS declared sample cadences while LIMEN_VIGILIA=1. Watches the watcher; a silent gauge also fires one onset-deduped notification (scripts/_notify.py, IF-HOST-PRESSURE form 4). Read by the beat-sensors runner via the SENSORS registry. 0 disables the pass."
  LIMEN_RUNTIME_LAG:
    default: "1"
    env: LIMEN_RUNTIME_LAG
    self_update: none
    owner: substrate
    note: "Gate for the runtime-lag beat sensor (institutio/governance/sensors.yaml section 0o3): scripts/check-runtime-lag.py fails when the scheduled runtime install (~/.local/share/limen/current, receipt schema domus-limen-runtime-receipt.v1) is more than LIMEN_RUNTIME_LAG_MAX_COMMITS behind the default branch. The canary (0g5) proves a lane is alive; this proves the live lane is running CURRENT CODE — a stale install passes its canary while executing week-old code. Silent on any host with no install (CI, containers). Sensing only: the rotator is domus-owned. Read by the beat-sensors runner via the SENSORS registry. 0 disables the pass."
  LIMEN_RUNTIME_LAG_MAX_COMMITS:
    default: "25"
    env: LIMEN_RUNTIME_LAG_MAX_COMMITS
    self_update: none
    owner: substrate
    note: "Commits behind the default branch before scripts/check-runtime-lag.py calls the scheduled runtime STALE. 25 is roughly half a day at this repo's merge cadence — low enough that a host-global fix cannot sit unshipped for days (the arc that produced this sensor measured 88), high enough that ordinary merge churn does not flap the rung."
  LIMEN_OPPORTUNITY_STALE:
    default: "1"
    env: LIMEN_OPPORTUNITY_STALE
    self_update: none
    owner: mail
    note: "Gate for the opportunity-status-stale beat sensor (institutio/governance/sensors.yaml section 0o2): scripts/state-freshness.py fails (advisory) when logs/opportunity-status.json hasn't been refreshed within ~13h (~2 windows of the 12-beat opportunity-pipeline). Sibling of host-pressure-stale — watches the inbound-lead monitor's WRITER so the 2026-07-21 18h-blind freeze (WS0) can't recur unseen; a frozen writer also fires one onset-deduped notification (scripts/_notify.py). Read by the beat-sensors runner via the SENSORS registry. 0 disables the pass."
  VITALS_RSS_CEILING_MB:
    default: 1024
    env: LIMEN_VITALS_RSS_CEILING_MB
    self_update: none
    owner: substrate
    note: "host-relief per-agent RSS ceiling: a running com.limen.* launchd agent over this is a relief candidate (kickstart -k restart) when the VITALS gate says shed. 2026-07-16 precedent: com.limen.overnight-watch at 3.1 GiB restarted to ~105 MB."
  VITALS_ROOT_HOG_MB:
    default: 4096
    env: LIMEN_VITALS_ROOT_HOG_MB
    self_update: none
    owner: substrate
    note: "host-relief escalation threshold for root-owned processes the fleet cannot touch: over this RSS while the gate is not ok, one onset-deduped notification carries the pre-formed `sudo kill <pid>` one-liner (2026-07-16: bztransmit -updatebackupstats at 8.6 GiB). Observation + escalation only — host-relief never signals foreign processes itself."
  LIMEN_HOST_RELIEF:
    default: "1"
    env: LIMEN_HOST_RELIEF
    self_update: none
    owner: substrate
    note: "Gate for the host-relief beat sensor (institutio/governance/sensors.yaml section 0q): the SHED effector census — bloated com.limen agents, root hogs, onset notifications. 0 disables the pass (IF-HOST-PRESSURE form 4)."
  LIMEN_HOST_RELIEF_APPLY:
    default: "1"
    env: LIMEN_HOST_RELIEF_APPLY
    self_update: none
    owner: substrate
    note: "Arms the host-relief effector: 1 (default — operator directive 2026-07-16: the machine relieves what it owns, never a hand chore) appends --apply so over-ceiling com.limen agents are actually kickstarted when the gate says shed. 0 reverts the rung to report-only. Foreign/root processes are never touched at any setting — only escalated."
  LIMEN_BEAT_HOST_RELIEF:
    default: 1
    env: LIMEN_BEAT_HOST_RELIEF
    self_update: none
    owner: substrate
    note: "Cadence (every N beats) of the host-relief sensor. Default every beat: the census is one ps + one launchctl list, and pressure is a per-beat condition."
  LIMEN_HOST_RELIEF_TIMEOUT:
    default: 60
    env: LIMEN_HOST_RELIEF_TIMEOUT
    self_update: none
    owner: substrate
    note: "Per-run timeout (seconds) resolved by the generic sensor runner for host-relief. The runner kills the command group on overrun and the beat continues fail-open."
  LIMEN_NOTIFY:
    default: "1"
    env: LIMEN_NOTIFY
    self_update: none
    owner: vitals
    note: "Kill switch for the scripts/_notify.py escalation path (macOS display notification, onset-deduped via logs/vigilia/relief-state.json). 0 keeps the dedup bookkeeping but never calls osascript — also how hermetic tests stay silent."
  LIMEN_CONDUCTING_REFRESH_TIMEOUT:
    default: 60
    env: LIMEN_CONDUCTING_REFRESH_TIMEOUT
    self_update: none
    owner: vitals
    note: "Finite subprocess deadline in seconds for conducting-report.py to refresh keeper-owned handoff admission before pairing it with current usage telemetry. Timeout withholds the daily delivery and records a bounded public-safe finish receipt."
  LIMEN_WATCH_RSS_MB:
    default: 512
    env: LIMEN_WATCH_RSS_MB
    self_update: none
    owner: substrate
    note: "overnight-watch.py --watch self-bound: peak RSS above this exits clean after receipts (launchd/StartInterval respawns fresh at ~100 MB). Issue #1148: one tick accumulated 3.1 GiB. 0 disables."
  LIMEN_WATCH_WALL_S:
    default: 240
    env: LIMEN_WATCH_WALL_S
    self_update: none
    owner: substrate
    note: "overnight-watch.py per-tick wall-clock bound (SIGALRM, exit 0 fail-open): a one-shot receipt tick that runs longer than this is wedged, not working — 2026-07-16: one tick ran 51 minutes under an I/O storm. 0 disables."

  # --- CONTINUITY: make hand-recovery automatic (build order #1) ----------------
  CONTINUITY_MIN_SUMMARY_CHARS:
    default: 400
    env: LIMEN_CONTINUITY_MIN_SUMMARY
    self_update: none
    owner: continuity
    note: "A handoff summary shorter than this is degenerate (this session got 200). Trigger transcript reconstruction."
  CONTINUITY_TRANSCRIPT_GLOB:
    # "auto" = derive from limen.harness_paths. A hard-coded ~/.claude literal silently matched
    # zero files once the harness relocated its tree to <repo>/.agent-runtime/claude, and the
    # organ kept reporting ok. Set an explicit glob only to pin a non-standard layout.
    default: "auto"
    env: LIMEN_CONTINUITY_TRANSCRIPTS
    self_update: none
    owner: continuity

  # --- HARNESS ROOT: declare the external dependency the fleet reads from --------
  # The Claude harness keeps its session tree (transcripts, plan files, job scratch) outside the
  # workspace, and it moved once already: ~/.claude -> <repo>/.agent-runtime/claude. That location
  # was hard-coded in ten places, so the move blinded every consumer at once with nothing going
  # red. Declared here, resolved in limen.harness_paths, sensed by scripts/harness-root-probe.py.
  LIMEN_CLAUDE_HARNESS_ROOT:
    default: ""
    env: LIMEN_CLAUDE_HARNESS_ROOT
    self_update: none
    owner: continuity
    note: "Operator override for the harness runtime root. Empty (default) = resolve automatically: env -> <repo>/.agent-runtime/claude -> the shared checkout's copy when running in a worktree -> ~/.claude. Set only to pin a non-standard layout."

  LIMEN_HARNESS_ROOT_PROBE:
    default: "1"
    env: LIMEN_HARNESS_ROOT_PROBE
    self_update: none
    owner: continuity
    note: "ARMED 2026-07-30. Gates the harness-root-probe sensor: asserts the resolved root still holds transcripts (empty-while-a-sibling-is-full = the harness relocated) and scans for the three structural plan-mode fault signatures. Probe: python3 scripts/harness-root-probe.py."

  LIMEN_BEAT_HARNESS_PROBE:
    default: 6
    env: LIMEN_BEAT_HARNESS_PROBE
    self_update: none
    owner: continuity
    note: "Heartbeat cadence for the harness-root probe. A relocation is rare but total, so a slow cadence is enough; the cost is a bounded transcript scan."

  LIMEN_HARNESS_PROBE_TIMEOUT:
    default: 120
    env: LIMEN_HARNESS_PROBE_TIMEOUT
    self_update: none
    owner: continuity
    note: "Wall-clock ceiling for the harness-root probe. The corpus is ~200MB; the scan is bounded by LIMEN_HARNESS_PROBE_DAYS and LIMEN_HARNESS_PROBE_MAX_FILES so it never walks all of it."

  LIMEN_HARNESS_PROBE_DAYS:
    default: 7
    env: LIMEN_HARNESS_PROBE_DAYS
    self_update: none
    owner: continuity
    note: "Age bound for the harness-root probe's transcript scan. Bounds cost on a 16GB host; the fault signatures are recent-session properties, so a week is ample."

  LIMEN_HARNESS_PROBE_MAX_FILES:
    default: 60
    env: LIMEN_HARNESS_PROBE_MAX_FILES
    self_update: none
    owner: continuity
    note: "File-count bound for the harness-root probe, newest first. Caps peak RSS on the beta machine's logged-jetsam host."

  # --- INTEGRITY: keep updates enabled beneath the stable responsibility host ----
  INTEGRITY_AUTOUPDATER:
    default: "enabled"
    env: LIMEN_INTEGRITY_AUTOUPDATER
    self_update: none
    owner: integrity
    note: "Managed-tool updates stay enabled. Version-path churn is contained by DomusAgentHost.app; DISABLE_AUTOUPDATER, DISABLE_UPDATES, and HOMEBREW_NO_AUTO_UPDATE are drift, never remediation."
  INTEGRITY_VERIFY_TARGETS:
    default:
      - "~/Applications/DomusAgentHost.app"
      - "/Applications/Claude.app"
      - "~/.local/bin/claude"
    env: LIMEN_INTEGRITY_TARGETS
