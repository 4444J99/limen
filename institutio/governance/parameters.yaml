    owner: gitvs
    note: "Second half of the DOUBLE-DARK gate on apply-visibility.py's PUBLISH direction (a private→public flip exposes full git history — irreversible). Even at 1 a publish still requires a released L-PORTAL-PUBLISH-* lever naming the repo AND a green fresh publish-sweep receipt. The protective DEMOTE direction (leak-posture auto-guard, reversible) ignores this gate and runs under --apply alone."
  LIMEN_VISIBILITY_MAX:
    default: 10
    env: LIMEN_VISIBILITY_MAX
