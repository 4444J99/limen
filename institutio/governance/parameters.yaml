    note: "Manifest-path override for scripts/launch-agent-liveness.py (the invariant of critical launchd agents). Empty (the default) uses spec/critical-launch-agents.json under LIMEN_ROOT. Set only in tests to point at a fabricated manifest; also settable via the --agents-file flag."

