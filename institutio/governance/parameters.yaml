  LIMEN_ESTATE_MAX_ROOTS:
    default: 1400
    env: LIMEN_ESTATE_MAX_ROOTS
    self_update: none
    owner: continuity
    note: "Maximum local Git roots estate-closeout-audit.py records during whole-estate discovery before marking the inventory bounded."
  LIMEN_ESTATE_LOCAL_DETAIL_LIMIT:
    default: 900
    env: LIMEN_ESTATE_LOCAL_DETAIL_LIMIT
    self_update: none
    owner: continuity
    note: "Maximum discovered local Git roots estate-closeout-audit.py probes in detail for dirty, branch, upstream, PR, and deletion eligibility."
  LIMEN_ESTATE_LOCAL_PR_PROBE_LIMIT:
    default: 120
    env: LIMEN_ESTATE_LOCAL_PR_PROBE_LIMIT
    self_update: none
    owner: continuity
    note: "Maximum local roots estate-closeout-audit.py probes through GitHub PR lookup while classifying local custody."
  LIMEN_ESTATE_PR_LIMIT:
    default: 1000
    env: LIMEN_ESTATE_PR_LIMIT
    self_update: none
    owner: continuity
    note: "Maximum open GitHub PRs estate-closeout-audit.py collects across owned estate organizations before declaring remote PR classification bounded."
  LIMEN_ESTATE_PR_CLASSIFY_LIMIT:
    default: 120
    env: LIMEN_ESTATE_PR_CLASSIFY_LIMIT
    self_update: none
    owner: continuity
    note: "Maximum open GitHub PRs estate-closeout-audit.py deep-classifies for mergeability, CI, conflict, and owner-gate state."
  LIMEN_PROFILE_REPO:
    default: "$LIMEN_WORKSPACE_ROOT/organvm/4444J99"
    env: LIMEN_PROFILE_REPO
    self_update: none
    owner: continuity
    note: "Local profile/front-door repository used by always-working public-face checks."
  LIMEN_VISIBLE_PROFILE_REPO:
    default: "4444J99/4444J99"
    env: LIMEN_VISIBLE_PROFILE_REPO
    self_update: none
    owner: continuity
    note: "Canonical GitHub profile repository queried for public profile proof before trusting local copies."
  LIMEN_CHECK_GITHUB_PROFILE:
    default: "1"
    env: LIMEN_CHECK_GITHUB_PROFILE
    self_update: none
    owner: continuity
    note: "Gate for live GitHub profile verification in always-working. 1 checks remote source of truth; 0 disables only for offline predicates."
  LIMEN_CORPORA_HOST:
    default: "0"
    env: LIMEN_CORPORA_HOST
    self_update: none
    owner: governance
    note: "Forces check-corpora's disk checks (B/C/E) to bind strictly even when no declared corpus store is visible. The stores are local-only by design, so a CI runner's missing-store state is a host fact, not drift — auto-detection (any store present ⇒ strict) covers the operator host; this knob covers a host that SHOULD have the stores but has lost them."
  LIMEN_LIFE_HOST:
    default: "0"
    env: LIMEN_LIFE_HOST
    self_update: none
    owner: governance
    note: "Forces check-biography's store-parity check (E) to bind strictly even when ~/Workspace is not visible. The _life-private store is local-only and mode 700 by design, so a CI runner's missing-store state is a host fact, not drift — auto-detection (estate root present ⇒ strict) covers the operator host; this knob covers a host that SHOULD hold the store but has lost it. Sibling of LIMEN_CORPORA_HOST, same CUSTODY reasoning."
  LIMEN_PEOPLE_HOST:
    default: "0"
    env: LIMEN_PEOPLE_HOST
    self_update: none
    owner: consulting
    note: "Forces constellation Rule #6 (overlay parity) to treat a missing private overlay as a violation rather than an unverifiable skip. Rule #6 used to return [] unconditionally when the overlay was absent, so the suite passed BECAUSE the store was missing — 15 people indexed publicly with zero private backing, every dossier lane failing, all green. Auto-detection (estate root present ⇒ provable absence) covers the operator host; this knob covers a host that should hold it."
  LIMEN_CORPVS_ROOT:
    default: "$LIMEN_WORKSPACE_ROOT/organvm-corpvs-testamentvm"
    env: LIMEN_CORPVS_ROOT
    self_update: none
    owner: continuity
    note: "Local corpus/metrics repository used by always-working to compare public profile claims with system proof."
  LIMEN_MAIL_STORY_LOG:
    default: "$LIMEN_ROOT/logs/mail-story-ledger.json"
    env: LIMEN_MAIL_STORY_LOG
    self_update: none
    owner: continuity
    note: "Private/generated mail-story JSON index used to prove mailbox work from atoms and receipts without sending mail."
  LIMEN_CONTRIBUTION_BALANCE_LOGIN:
    default: "4444J99"
    env: LIMEN_CONTRIBUTION_BALANCE_LOGIN
    self_update: none
    owner: continuity
    note: "GitHub login used by contribution-balance gates to keep public activity from becoming commit-only churn."
  LIMEN_CONTRIBUTION_BALANCE_PUBLIC_ROOT:
    default: "~/Workspace/limen"
    env: LIMEN_CONTRIBUTION_BALANCE_PUBLIC_ROOT
    self_update: none
    owner: continuity
    note: "Stable operator-facing Limen root used in public contribution-balance receipts, so CI checkout paths do not leak into durable owner packets."
  LIMEN_ARCHIVE4T_ROOT:
    default: "/Volumes/Archive4T"
    env: LIMEN_ARCHIVE4T_ROOT
    self_update: none
    owner: continuity
    note: "External archive SSD root used for durable custody receipts and run-and-gun substrate checks."
  LIMEN_OPENCODE_DB:
