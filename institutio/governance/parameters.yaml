    env: LIMEN_ORIENT_TASKS
    self_update: none
    owner: continuity
    note: "Optional session-orientation verifier snapshot for tasks.yaml. Blank means the live board is read; predicates set this only to prove generator idempotence against a stable input while dispatch may be moving the live board."
  LIMEN_ORIENT_GIT_SECTION:
    default: ""
    env: LIMEN_ORIENT_GIT_SECTION
    self_update: none
    owner: continuity
    note: "Optional pinned Git summary line for the session-orientation verifier. Blank means read live git state; predicates set this only to avoid confusing live dirty-state changes with generator non-determinism."
  LIMEN_SESSION_CLOSEOUT:
    default: "0"
    env: LIMEN_SESSION_CLOSEOUT
    self_update: none
    owner: censor
    note: "OBSERVE gate for the closeout-reconciliation organ (scripts/reconcile-closeouts.py). When 1, the beat sensor and closeout-fast run --check (probe every claimed-done outcome vs GitHub/board ground truth) and surface findings; default 0 ships the organ dark (classifier self-test only). Observing is decoupled from failing: closeout-fast hard-fails on a finding only when LIMEN_SESSION_CLOSEOUT_ENFORCE=1, so the beat can observe-live before the board's known false-closeouts clear."
  LIMEN_SESSION_CLOSEOUT_ENFORCE:
    default: "0"
    env: LIMEN_SESSION_CLOSEOUT_ENFORCE
    self_update: none
    owner: censor
    note: "ENFORCE gate for the closeout-reconciliation organ. Only meaningful when LIMEN_SESSION_CLOSEOUT=1 (observe). When 1, a --check finding (DONE_UNVERIFIED / PR_MISSING) hard-fails closeout-fast.sh; default 0 keeps --check advisory (findings print, closeout still passes). This is the deliberate second flip AFTER the board's outstanding false-closeouts are cleared — never arm it while known findings exist."
  LIMEN_ORIENT_NO_WRITE:
    default: "0"
    env: LIMEN_ORIENT_NO_WRITE
    self_update: none
    owner: continuity
    note: "When 1, session-orient.py prints the digest without refreshing logs/session-orientation.md. Used by idempotence predicates; normal hooks leave it unset."
  LIMEN_ORIENT_FETCH:
    default: "1"
    env: LIMEN_ORIENT_FETCH
    self_update: none
    owner: continuity
    note: "When 1 (default), session-orient.py refreshes origin with a hard-bounded 3s fetch before deriving ahead/behind, so the Git line reports a fresh comparison rather than one against whatever origin/main happened to sit on disk — the mechanism behind two sessions running gates against a 19-commits-behind checkout. Set 0 (or LIMEN_OFFLINE) to skip the network entirely; the section then labels itself 'refs STALE' rather than silently reading like parity. The label, not the fetch, is the invariant: a stale read that announces itself is safe."
  LIMEN_INSIGHT_CADENCE_VERIFY_ROOT:
    default: ""
    env: LIMEN_INSIGHT_CADENCE_VERIFY_ROOT
    self_update: none
    owner: continuity
    note: "Optional retained sandbox root for done-insight-cadence.sh verification. Blank means create a private temporary proof root and retain it for inspection instead of deleting it."
  LIMEN_CURRENT_SESSION_FANOUT_REPO:
    default: "organvm/limen"
    env: LIMEN_CURRENT_SESSION_FANOUT_REPO
    self_update: none
    owner: continuity
    note: "Owner/repo used when current-session fanout seeds queue tasks; normally derived from the checkout remote."
  LIMEN_STORAGE_ROOTS:
    default: "$LIMEN_ROOT"
    env: LIMEN_STORAGE_ROOTS
    self_update: none
    owner: continuity
    note: "Comma-separated roots for bounded substrate storage discovery. Missing roots are recorded as blockers; no root is mounted or mutated."
  LIMEN_REPO_ROOTS:
    default: "$LIMEN_ROOT"
    env: LIMEN_REPO_ROOTS
    self_update: none
    owner: continuity
    note: "Comma-separated local roots scanned for git repository surfaces by repo-surface ledger. Read-only discovery only."
  LIMEN_WORKSPACE_ROOT:
    default: "$HOME/Workspace"
    env: LIMEN_WORKSPACE_ROOT
    self_update: none
    owner: continuity
    note: "Optional local workspace root scanned for repo/product surfaces by repo-surface ledger. Read-only discovery only."
  LIMEN_WORKTREES:
    default: "/Volumes/Scratch/limen-worktrees if mounted and writable, otherwise $LIMEN_WORKDIR/.limen-worktrees"
    env: LIMEN_WORKTREES
    self_update: none
    owner: continuity
    note: "Dispatch isolation root for generated lane checkouts. Heartbeat and launchd derive this onto the external Scratch SSD when available so completed/generated worktrees do not creep on the local system disk."
  LIMEN_WORKTREE_ROOT:
    default: "$LIMEN_WORKTREES"
    env: LIMEN_WORKTREE_ROOT
    self_update: none
    owner: continuity
    note: "Worktree root used by reclaim and repo-surface discovery. Defaults to the dispatch isolation root so lifecycle cleanup watches the same generated checkout surface it creates."
  LIMEN_WORKTREE_DEBT_TIMEOUT:
    default: 120
    env: LIMEN_WORKTREE_DEBT_TIMEOUT
    self_update: none
    owner: continuity
    note: "Timeout in seconds for the lifecycle-pressure worktree-debt scan. On timeout, hooks fail open with an explicit pressure receipt instead of crashing closeout."
  LIMEN_SESSION_LIFECYCLE_TIMEOUT:
    default: 45
    env: LIMEN_SESSION_LIFECYCLE_TIMEOUT
    self_update: none
    owner: continuity
    note: "Legacy standalone lifecycle-pressure wrapper ceiling. Project SessionEnd no longer invokes that wrapper; the heartbeat consumer owns deferred refresh timing."
  LIMEN_SESSION_WORKTREE_DEBT_TIMEOUT:
    default: 30
    env: LIMEN_SESSION_WORKTREE_DEBT_TIMEOUT
    self_update: none
    owner: continuity
    note: "Narrow worktree-debt subprocess timeout propagated by the heartbeat lifecycle-pressure consumer and retained by the legacy standalone wrapper."
  LIMEN_SESSION_END_BREADCRUMBS:
    default: "${XDG_STATE_HOME:-$HOME/.local/state}/limen/session-end-breadcrumbs.jsonl"
    env: LIMEN_SESSION_END_BREADCRUMBS
    self_update: none
    owner: continuity
    note: "One host-stable, private JSONL queue shared by project and installed global Claude SessionEnd producers across runtime upgrades. It must not live under a versioned runtime or checkout; cursor and consumer receipts remain in the live Limen logs directory."
  LIMEN_SESSION_END_CONSUMER_TIMEOUT:
    default: 90
    env: LIMEN_SESSION_END_CONSUMER_TIMEOUT
    self_update: none
    owner: continuity
    note: "Outer heartbeat process timeout in seconds for one bounded SessionEnd breadcrumb drain. Timeout is fail-open; per-session receipts retain finite retry state for the next beat."
  LIMEN_SESSION_END_CONSUMER_BATCH:
    default: 8
    env: LIMEN_SESSION_END_CONSUMER_BATCH
    self_update: none
    owner: continuity
    note: "Maximum session receipts selected by one heartbeat breadcrumb drain before later receipts roll to a future beat."
  LIMEN_SESSION_END_CONSUMER_RUNWAY:
    default: 60
    env: LIMEN_SESSION_END_CONSUMER_RUNWAY
    self_update: none
    owner: continuity
    note: "Internal monotonic-time runway in seconds for one breadcrumb drain; no new slow consumer begins after this deadline."
  LIMEN_LIFECYCLE_SIZE_SCAN_MAX_ROOTS:
    default: 50
    env: LIMEN_LIFECYCLE_SIZE_SCAN_MAX_ROOTS
    self_update: none
    owner: continuity
    note: "Maximum immediate worktree/private-corpus roots measured per lifecycle-pressure refresh. Larger denominators remain visible as partial size scans."
  LIMEN_CLOSEOUT_RUN_LIFECYCLE_TESTS:
    default: "0"
    env: LIMEN_CLOSEOUT_RUN_LIFECYCLE_TESTS
    self_update: none
    owner: continuity
    note: "Opt-in switch for running the slower lifecycle pytest tranche during closeout-fast. Default closeout stays interactive and uses smoke predicates."
  LIMEN_CLOSEOUT_LIFECYCLE_TEST_TIMEOUT:
    default: 90
    env: LIMEN_CLOSEOUT_LIFECYCLE_TEST_TIMEOUT
    self_update: none
    owner: continuity
    note: "Timeout in seconds for the opt-in lifecycle pytest tranche in closeout-fast."
  LIMEN_CLOSEOUT_QUEUE_LOCK_TIMEOUT:
    default: 30
    env: LIMEN_CLOSEOUT_QUEUE_LOCK_TIMEOUT
    self_update: none
    owner: continuity
    note: "Seconds closeout-fast waits for the shared queue lock while it validates tasks.yaml and live-root-gate against a stable board snapshot."
  LIMEN_STREAMS_MAX_PARALLEL:
    default: ""
    env: LIMEN_STREAMS_MAX_PARALLEL
    self_update: none
    owner: continuity
    note: "Caps how many READY session streams scripts/open-streams.sh opens at once. Empty means derive the bound from physical RAM (reserve for OS/browser/daemon, then a per-stream budget) rather than hardcode a number — this estate runs on a 16GB machine with logged jetsam kills, and an interactive agent session killed mid-flight loses its context silently. Streams over the bound are always NAMED with their exact command, never dropped quietly."
  LIMEN_STREAMS_TMUX_SESSION:
    default: "limen-streams"
    env: LIMEN_STREAMS_TMUX_SESSION
    self_update: none
    owner: continuity
    note: "tmux session name scripts/open-streams.sh opens stream windows into (one window per stream, named by stream id). tmux rather than background jobs because `limen workstream --agent ...` ends in exec and an interactive agent needs a controlling TTY; the window name is also how a re-run detects an already-open stream."
  LIMEN_VENDOR_INSIGHTS_DIR:
    default: "logs/vendor-insights"
    env: LIMEN_VENDOR_INSIGHTS_DIR
    self_update: none
    owner: continuity
    note: "Working-data root for scripts/vendor-insights.py (the mechanical half of /vendor-insights): per-vendor session index, skill-written facets/narrative, and rendered report HTML. Relative default resolves under LIMEN_ROOT; the whole tree is gitignored because it narrates personal usage (same placement doctrine as the built-in /insights artifact under .agent-runtime/). Override to point a test or a scratch run somewhere else."
  LIMEN_VERIFY_LOCK_FILE:
    default: "${TMPDIR:-/tmp}/limen-verify-whole.lock"
    env: LIMEN_VERIFY_LOCK_FILE
    self_update: none
    owner: continuity
    note: "Machine-wide lock file serializing verify-whole.sh runs so parallel sessions queue instead of stampeding the host with concurrent npm installs, workerd boots, and production builds."
  LIMEN_VERIFY_JOBS:
    default: 4
    env: LIMEN_VERIFY_JOBS
    self_update: none
    owner: continuity
    note: "Maximum independent predicates in each verify.py scoped wave (1–32). The runtime default is the smaller of 4 and the detected CPU count; gates marked serialize:true remain ordered regardless of this value."
  LIMEN_VERIFY_GATE_OUTPUT_BYTES:
    default: 1048576
    env: LIMEN_VERIFY_GATE_OUTPUT_BYTES
    self_update: none
    owner: continuity
    note: "Maximum combined stdout/stderr retained for one scoped gate (1024–16777216 bytes). Exceeding the cap terminates the gate's complete process group and fails the predicate before a wave can exhaust disk or memory."
  LIMEN_VERIFY_GATE_TIMEOUT_SECONDS:
    default: 300
    env: LIMEN_VERIFY_GATE_TIMEOUT_SECONDS
    self_update: none
    owner: continuity
    note: "Per-gate wall-clock deadline for scoped verification (0.1–1800 seconds). All commands in a per-file gate share this one deadline; expiry terminates the complete process group and fails closed."
  LIMEN_VERIFY_NO_DEPLOY_ESCALATION:
    default: "0"
    env: LIMEN_VERIFY_NO_DEPLOY_ESCALATION
    self_update: none
    owner: continuity
    note: "Suppresses verify.py --changed's deploy-trigger whole-matrix escalation while keeping the run scoped (pr-gate's pull_request lane sets 1): merge-policy.sh already refuses a website-sensitive merge until the full CI matrix is green, so pre-running the matrix on every PR commit was pure duplication. Default 0 preserves escalation for local and push --require-base runs."
  LIMEN_VERIFY_NO_LOCK:
    default: "0"
    env: LIMEN_VERIFY_NO_LOCK
    self_update: none
    owner: continuity
    note: "Opt-out of the verify-whole.sh machine-wide lock for single-purpose runners (CI), where serialization is already guaranteed by the runner itself."
  LIMEN_VERIFY_REQUIRE_BASE:
    default: "0"
    env: LIMEN_VERIFY_REQUIRE_BASE
    self_update: none
    owner: continuity
    note: "CI fail-closed switch for verify.py --changed (issue #1048): when 1, an unresolvable merge-base or an empty changed set is a hard error instead of the silent local-modifications fallback — a required check must never green by verifying nothing — and a deploy-trigger diff escalates to the whole matrix unless LIMEN_VERIFY_NO_DEPLOY_ESCALATION=1."
  LIMEN_VERIFY_WHOLE_CMD:
    default: "scripts/verify-whole.sh"
    env: LIMEN_VERIFY_WHOLE_CMD
    self_update: none
    owner: continuity
    note: "Escalation target verify.py --changed exec's when a --require-base run touches deploy-trigger paths. Default is the real whole matrix; the hardening test points it at a marker script to assert escalation without paying the matrix."
  LIMEN_PRGATE_SCOPED:
    default: "1"
    env: LIMEN_PRGATE_SCOPED
    self_update: none
    owner: continuity
    note: "pr-gate.yml job switch (issue #1048): 1 (default) runs the registry-scoped resolver step (verify.py --changed --require-base --skip-ci-covered); 0 is the escape hatch back to the full literal matrix, preserved in-workflow for rollback via a one-line PR."
  LIMEN_PUSH_GUARD:
    default: "on"
    env: LIMEN_PUSH_GUARD
    self_update: none
    owner: continuity
    note: "Legacy source-classification guard retained for compatibility. Default-branch safety no longer depends on it: capture preserves the actual remote default through a stable off-branch custody ref, continuation publishes it through a preservation PR, and neither path pushes the default branch even when this diagnostic source filter is off."
  LIMEN_CAPTURE_GIT_TIMEOUT:
    default: 60
    env: LIMEN_CAPTURE_GIT_TIMEOUT
    self_update: none
    owner: continuity
    note: "Absolute wall-clock bound in seconds for each capture.sh remote Git operation. timeout or gtimeout is preferred; the portable alarm fallback preserves the same finite bound when coreutils is absent."
  LIMEN_RECLAIM:
    default: "1"
    env: LIMEN_RECLAIM
    self_update: none
    owner: continuity
    note: "Master live-enable switch for the heartbeat worktree reaper. Worktree admission requires the registered live value 1; disabling reclaim blocks new local worktree creation while remote lanes continue."
  LIMEN_RECLAIM_MAX:
    default: 50
    env: LIMEN_RECLAIM_MAX
    self_update: none
    owner: continuity
    note: "Maximum accepted worktree roots physically removed per reclaim-worktrees apply run. Additional eligible roots are durably listed in deferred_over_cap; a nonempty deferred list blocks new local worktree creation until the next drain."
  LIMEN_BEAT_DRAIN:
    default: 3
    env: LIMEN_BEAT_DRAIN
    self_update: none
    owner: continuity
    note: "Heartbeat voice cadence, in beats, for drain and its worktree-reclaim pass. Combined with LIMEN_LOOP_MAX and LIMEN_RECLAIM_TIMEOUT to derive the worst-case durable reaper receipt freshness window."
  LIMEN_LOOP_MAX:
    default: 1800
    env: LIMEN_LOOP_MAX
    self_update: none
    owner: continuity
    note: "Maximum heartbeat-loop backoff in seconds. Worktree admission uses this live scheduler bound with LIMEN_BEAT_DRAIN and LIMEN_RECLAIM_TIMEOUT; it is not a worktree-count cap."
  LIMEN_RECLAIM_GENERATED:
    default: "0"
    env: LIMEN_RECLAIM_GENERATED
    self_update: none
    owner: continuity
    note: "Whether generated checkout payload reclaim is explicitly enabled. Default OFF: generated projections and caches must first be classified by their owning recipe."
  LIMEN_RECLAIM_GENERATED_MAX:
    default: 80
    env: LIMEN_RECLAIM_GENERATED_MAX
    self_update: none
    owner: continuity
    note: "Maximum generated payload paths reclaimed per reclaim-worktrees run."
  LIMEN_RECLAIM_GENERATED_TIMEOUT:
    default: 120
    env: LIMEN_RECLAIM_GENERATED_TIMEOUT
    self_update: none
    owner: continuity
    note: "Heartbeat timeout in seconds for generated-only reclaim."
  LIMEN_RECLAIM_GENERATED_STATE_LIMIT:
    default: 500
    env: LIMEN_RECLAIM_GENERATED_STATE_LIMIT
    self_update: none
    owner: continuity
    note: "Maximum git roots scanned by reclaim-generated-state.py per run when cleaning ignored generated dependency/build/cache directories."
  LIMEN_RECLAIM_GENERATED_STATE_TIMEOUT:
    default: 180
    env: LIMEN_RECLAIM_GENERATED_STATE_TIMEOUT
    self_update: none
    owner: continuity
    note: "Per-root timeout in seconds for reclaim-generated-state.py git/size checks."
  LIMEN_RECLAIM_TIMEOUT:
    default: 300
    env: LIMEN_RECLAIM_TIMEOUT
    self_update: none
    owner: continuity
    note: "Heartbeat timeout in seconds for the broader reclaim-worktrees pass."
  LIMEN_RECLAIM_STANDING_ACCEPTANCE:
    default: "1"
    env: LIMEN_RECLAIM_STANDING_ACCEPTANCE
    self_update: none
    owner: continuity
    note: "Honor the covenant standing grant (2026-07-09): clean+merged+idle worktree roots are pre-accepted for removal without a per-root ledger event. Set 0 to restore per-root human acceptance for that class (docs/removal-acceptance-covenant.md)."
  LIMEN_RECLAIM_PUSHED_OK:
    default: "1"
    env: LIMEN_RECLAIM_PUSHED_OK
    self_update: none
    owner: continuity
    note: "Pushed-reap policy — DEFAULT ON. A clean, inactive worktree whose exact HEAD is reachable from a remote ref is disposable local cache: removing it loses zero work while the branch and PR lifecycle continue on the remote owner. Set 0 only for a bounded diagnostic hold. Dirty, unpushed, process-owned, or explicitly locked roots remain fail-closed."
  LIMEN_RECLAIM_ORPHANS:
    default: "0"
    env: LIMEN_RECLAIM_ORPHANS
    self_update: none
    owner: continuity
    note: "Dead-gitdir orphan quarantine is DEFAULT OFF. When explicitly armed, a checkout under a THROWAWAY root whose `.git` pointer targets a missing superproject gitdir is preserved by same-volume MOVE into LIMEN_ORPHAN_QUARANTINE, never deleted. The owner must review the current census and arm this reversible lane per bounded run; deletion of quarantined material remains a separate custody-gated action."
  LIMEN_ORPHAN_QUARANTINE:
    default: ""
    env: LIMEN_ORPHAN_QUARANTINE
    self_update: none
    owner: continuity
    note: "Off-worktree MOVE target for orphans preserved by the LIMEN_RECLAIM_ORPHANS sweep — a quarantine, not a delete. Empty (default) derives a `_limen-orphan-quarantine` sibling of the worktree root. The target must be outside every worktree scan root and on the SAME filesystem so abandonment is one atomic rename; cross-volume copy fallback is denied."
  LIMEN_ABANDONMENT_QUARANTINE:
    default: ""
    env: LIMEN_ABANDONMENT_QUARANTINE
    self_update: none
    owner: continuity
    note: "Optional same-filesystem off-scan quarantine root used by limen.worktree_abandonment.v1 for standalone clones, residue, and ignored generated payloads. Empty derives an owner-root-aware sibling. Cross-device targets, nested destinations, symlinks, and collisions fail closed."
  LIMEN_WORKTREE_ABANDONMENT_RECEIPTS:
    default: "$LIMEN_ROOT/logs/worktree-abandonment"
    env: LIMEN_WORKTREE_ABANDONMENT_RECEIPTS
    self_update: none
    owner: continuity
    note: "Private typed receipt root for planned, verified, applying, completed, and crashed limen.worktree_abandonment.v1 actions. Receipts record recoverability and exact failure phase; they do not authorize an action by themselves."
  LIMEN_CLONE_REAP_STANDING_ACCEPTANCE:
    default: "1"
    env: LIMEN_CLONE_REAP_STANDING_ACCEPTANCE
    self_update: none
    owner: continuity
    note: "Round-two covenant standing grant (2026-07-09): a local clone whose loss-free verdict is 'pushed-mirror' (classify() proves every local byte is on the live remote, re-cloneable, nothing unpushed/untracked — adversarially audited against 14 data-loss paths) is pre-accepted for reap without a per-clone ledger event. Matches the worktree sibling (LIMEN_RECLAIM_STANDING_ACCEPTANCE). Set 0 to restore the docs/clone-reap-acceptance.jsonl per-clone gate."
  LIMEN_REAP_CLONES_APPLY:
    default: "1"
    env: LIMEN_REAP_CLONES_APPLY
    self_update: none
    owner: continuity
    note: "Beat-wire clone-reap in --apply mode (2026-07-09): the hygiene voice runs scripts/reap-clones.py so the reclaim engine is ALIVE, not a script that never ran. Reclaim intensity follows the live resource envelope plus idle age and the loss-free pushed-mirror gate; no fixed free-space target controls it. Set 0 to run it in dry-run/report mode only."
  LIMEN_REAP_CLONES_TIMEOUT:
    default: "300"
    env: LIMEN_REAP_CLONES_TIMEOUT
    self_update: none
    owner: continuity
    note: "Seconds budget for the beat-wired clone-reap voice (scripts/reap-clones.py) before the hygiene voice times it out. Bounded + fail-open like the sibling reclaim timeouts."
  LIMEN_DISK_PRESSURE_PATH:
    default: "$LIMEN_ROOT"
    env: LIMEN_DISK_PRESSURE_PATH
    self_update: none
    owner: continuity
    note: "Filesystem path used by async dispatch to measure local free space before launching more work."
  LIMEN_RESOURCE_UPDATER_CLAIM_BYTES:
    default: "0"
    env: LIMEN_RESOURCE_UPDATER_CLAIM_BYTES
    self_update: none
    owner: continuity
    note: "Live updater staging claim in bytes consumed by the dynamic resource-envelope evaluator. Zero means the source-native updater reports no current claim, not a storage floor."
  LIMEN_RESOURCE_APFS_CHURN_BYTES:
    default: "0"
    env: LIMEN_RESOURCE_APFS_CHURN_BYTES
    self_update: none
    owner: continuity
    note: "Observed APFS churn/rollback claim in bytes supplied to the dynamic resource-envelope evaluator."
  LIMEN_RESOURCE_TELEMETRY_ERROR_BYTES:
    default: "0"
    env: LIMEN_RESOURCE_TELEMETRY_ERROR_BYTES
    self_update: none
    owner: continuity
    note: "Current measurement-error allowance in bytes supplied by telemetry; it is an observation, never a fixed disk authority."
  LIMEN_RESOURCE_TASK_GRAPH:
    default: ""
    env: LIMEN_RESOURCE_TASK_GRAPH
    self_update: none
    owner: continuity
    note: "Required bounded limen.resource_task_graph.v1 file for local work admission. Empty fails closed; every storage gate evaluates peak concurrent claims across this exact selected graph. Callers with an explicitly empty graph may pass an empty claim tuple directly for observation-only evaluation."
  LIMEN_RESOURCE_TASK_GRAPH_RUN_ID:
    default: ""
    env: LIMEN_RESOURCE_TASK_GRAPH_RUN_ID
    self_update: none
    owner: continuity
    note: "Broker run identity bound into the generated resource graph. Admission rejects a graph whose embedded run does not match this value."
  LIMEN_RESOURCE_TASK_GRAPH_SHA256:
    default: ""
    env: LIMEN_RESOURCE_TASK_GRAPH_SHA256
    self_update: none
    owner: continuity
    note: "RFC 8785 digest emitted with the broker-bound resource graph receipt for exact-file evidence and handoff verification."
  LIMEN_DISK_PRESSURE_VALUE_ONLY:
    default: "1"
    env: LIMEN_DISK_PRESSURE_VALUE_ONLY
    self_update: none
    owner: continuity
    note: "When true, disk pressure gates async dispatch toward value-first continuations instead of broad local checkout churn."
  LIMEN_LOW_BURN_VALUE_FIRST:
    default: "1"
    env: LIMEN_LOW_BURN_VALUE_FIRST
    self_update: none
    owner: continuity
    note: "When true, async dispatch chooses prompt/revenue/value-first work under pressure instead of generic queue draining."
  LIMEN_VALUE_GATE:
    default: "1"
    env: LIMEN_VALUE_GATE
    self_update: none
    owner: limen-daemon
    note: "When enabled, serial, parallel, and async dispatch reserve only value-tier, lifecycle, blocker-clearing, or explicit owner work from the candidate set."
  LIMEN_VALUE_GATE_STRICT:
    default: "0"
    env: LIMEN_VALUE_GATE_STRICT
    self_update: none
    owner: limen-daemon
    note: "When true, dispatch applies the value gate even if the value-repo list is empty, so empty configuration fails closed instead of draining generic queue work."
  LIMEN_REPO_SCAN_DEPTH:
    default: 4
    env: LIMEN_REPO_SCAN_DEPTH
    self_update: none
    owner: continuity
    note: "Maximum directory depth for repo-surface ledger discovery."
  LIMEN_PROMPT_SOURCES:
    default: ""
    env: LIMEN_PROMPT_SOURCES
    self_update: none
    owner: continuity
    note: "Optional prompt source roots for product-ledger lifecycle counting. Empty means use bounded local defaults."
  LIMEN_ARCHIVE_TARGETS:
    default: ""
    env: LIMEN_ARCHIVE_TARGETS
    self_update: none
    owner: continuity
    note: "Optional archive target list for substrate/product ledger classification. Read-only; no archive mutation."
  LIMEN_AGY_ARCHIVE_ROOT:
    default: "$LIMEN_ROOT/.limen-private/agy-scratch-preserve"
    env: LIMEN_AGY_ARCHIVE_ROOT
    self_update: none
    owner: continuity
    note: "Private preservation root for Antigravity scratch deltas before any safe-reap decision. Ignored locally; public receipts carry redacted aggregate proof only."
  LIMEN_WORKSPACE_UNIT_TIMEOUT_SEC:
    default: 600                # seconds: per-entry rsync cap so one big repo copy never wedges the beat
    env: LIMEN_WORKSPACE_UNIT_TIMEOUT_SEC
    self_update: none
    owner: continuity
    note: "Hard timeout (s) for one top-level ~/Workspace entry's additive rsync inside preserve_workspace() (library-preserve.py), so a slow multi-GB repo copy never wedges the C_BACKUP beat."
  LIMEN_CLOUD_STORAGE:
    default: 1
    env: LIMEN_CLOUD_STORAGE
    self_update: none
    owner: horrevm
    note: "Master on/off for the HORREVM storage-rails doctor sensor (cloud-storage-doctor in sensors.yaml). Ships LIVE (1): pure read-only sensor — no mutation, no send, no spend — so it runs unbidden per the aliveness law. Verifies actual state vs institutio/governance/storage-roles.yaml declarations (the 2026-06-15 endgame roles, finally executable)."
  LIMEN_BEAT_CLOUD_STORAGE:
    default: 24
    env: LIMEN_BEAT_CLOUD_STORAGE
    self_update: none
    owner: horrevm
    note: "Cadence (every N beats) of the HORREVM storage-rails doctor declared in sensors.yaml. The generic scheduled runner resolves this override; the beat sources contain no sensor-specific constant."
  LIMEN_CLOUD_STORAGE_TIMEOUT:
    default: 180
    env: LIMEN_CLOUD_STORAGE_TIMEOUT
    self_update: none
    owner: horrevm
    note: "Per-run timeout (seconds) resolved by the generic sensor runner for the HORREVM doctor. Internal probe budgets (brctl 20s, fileproviderctl 30s, du 45s, pluginkit/ps 15s, tmutil 20s) sum under this bound; overrun is killed and the beat continues fail-open."
  LIMEN_HORREVM:
    default: 1
    env: LIMEN_HORREVM
    self_update: none
    owner: horrevm
    note: "Master on/off for the HORREVM custody sensor (horrevm-custody in sensors.yaml) — the strategic-use half: arca-sealed ciphertext to Drive/Dropbox via headless rclone. Ships LIVE (1) but DARK: with no rclone.conf it prints PARKED on L-CLOUD-EGRESS-CONSENT and exits 0; real egress additionally requires LIMEN_HORREVM_APPLY=1."
  LIMEN_BEAT_HORREVM:
    default: 4
    env: LIMEN_BEAT_HORREVM
    self_update: none
    owner: horrevm
    note: "Cadence (every N beats) of the HORREVM custody sensor. Probes are cheap every run; actual pushes self-throttle to >=20h inside the script, so a 4-beat cadence costs probes only."
  LIMEN_HORREVM_TIMEOUT:
    default: 240
    env: LIMEN_HORREVM_TIMEOUT
    self_update: none
    owner: horrevm
    note: "Per-run timeout (seconds) for the HORREVM custody sensor. May truncate the FIRST bulk push; rclone copy is incremental per file, so successive beats converge fail-open."
  LIMEN_HORREVM_APPLY:
    default: 0
    env: LIMEN_HORREVM_APPLY
    self_update: none
    owner: horrevm
    note: "The egress safety valve (armed_valve_type: safety in sensors.yaml): 0 = dry-run (prints the exact copy plan, writes nothing remote), 1 = real rclone copy of the approved ciphertext payload set. Armed ONLY by the operator via L-CLOUD-EGRESS-CONSENT (issue #1109) — persistence-arming env writes are classifier-gated, so the lever hands him the one-liner."
  LIMEN_HORREVM_MAX_AGE_DAYS:
    default: 7
    env: LIMEN_HORREVM_MAX_AGE_DAYS
    self_update: none
    owner: horrevm
    note: "Freshness bound for `horrevm-custody.py --status`: once armed, a rail whose last verified push is older than this many days exits 1 (advisory escalation in the beat). PARKED/dry-run states always exit 0."
  LIMEN_HORREVM_DRIVE_BUDGET_GB:
    default: 5
    env: LIMEN_HORREVM_DRIVE_BUDGET_GB
    self_update: none
    owner: horrevm
