    env: LIMEN_MEMORY_DIR
    self_update: none
    owner: evocator
    note: "Per-session memory dir the organ verifies (read-only) for each truth's file + MEMORY.md index line."

  # --- SEED of the existing scattered surface (illustrative; not exhaustive) -----
  # The real work: migrate ALL of these from heartbeat-loop.sh / tasks.yaml / *.json
  # into this panel, then point the code here. (~70 total — see registry residual.)
  LIMEN_ROOT:
    default: "~/Workspace/limen"
    env: LIMEN_ROOT
    self_update: none
    owner: limen-daemon
  LIMEN_LIVE_ROOT:
    default: "~/Workspace/limen"
    env: LIMEN_LIVE_ROOT
    self_update: none
    owner: limen-daemon
    note: "Live checkout that launchd is expected to run. dispatch-health.py compares this root to the verified conductor worktree before campaign-heartbeat receipts are trusted."
  LIMEN_ALLOW_LIVE_COMMIT:
    default: "0"
    env: LIMEN_ALLOW_LIVE_COMMIT
    self_update: none
    owner: limen-daemon
    note: "Break-glass for scripts/hooks/worktree-commit-guard.sh: 1 disables the PreToolUse deny of git commit in the live checkout on main. Mirrors the LIMEN_ALLOW_OPUS_FANOUT escape-hatch precedent; leave 0 — the deny is the charter's no-direct-main-commit rule made mechanical."
  LIMEN_ALLOW_PR_POLL:
    default: "0"
    env: LIMEN_ALLOW_PR_POLL
    self_update: none
    owner: limen-daemon
    note: "Break-glass for scripts/hooks/no-hand-poll-guard.sh: 1 disables the PreToolUse deny of hand-rolled PR/CI poll loops (loop + gh state probe + sleep in one command). Mirrors LIMEN_ALLOW_LIVE_COMMIT; leave 0 — the deny is the charter's sanctioned-waiter rule (scripts/await-pr.sh; 2026-07-15 endless-watcher incident) made mechanical, for every lane whose hooks run the guard."
  LIMEN_OUTBOUND_REGISTRY:
    default: "institutio/governance/outbound-effectors.yaml"
    env: LIMEN_OUTBOUND_REGISTRY
    self_update: none
    owner: limen-daemon
    note: "Override for the OUTBOUND-EFFECTORS registry path read by scripts/hooks/outbound-preflight-guard.py and scripts/preflight-receipt.py. Exists so scripts/tests/outbound-preflight-guard.test.sh can run its deny matrix against a hermetic fixture registry (predicates `true`/`false`, temp receipts dir) with no network and no real mailbox — the LIMEN_LIVE_ROOT precedent from worktree-commit-guard.test.sh. Never set in production."
  LIMEN_ALLOW_UNVERIFIED_OUTBOUND:
    default: "0"
    env: LIMEN_ALLOW_UNVERIFIED_OUTBOUND
    self_update: none
    owner: limen-daemon
    note: "Break-glass for scripts/hooks/outbound-preflight-guard.py: 1 disables the PreToolUse deny of an outward-facing action (email send, public GitHub comment) that carries no fresh proof-of-observation receipt. Leave 0. The deny exists because 10 PROSE rules were written for the act-on-an-artifact-instead-of-reality class between 2026-03 and 2026-07 and all 10 recurred (100% failure rate); on 2026-07-31 it produced the first completed outward escape — a redundant reply to a live recruiter whose thread the operator had already answered. Registry: institutio/governance/outbound-effectors.yaml."
  LIMEN_ALLOW_FULL_PYTEST:
    default: "0"
    env: LIMEN_ALLOW_FULL_PYTEST
    self_update: none
    owner: verify
    note: "Break-glass for scripts/hooks/pytest-scope-guard.sh AND the pytest-scope audit in scripts/claude-workflow-guard.py: 1 disables the PreToolUse deny of full-suite pytest outside verify.py and waives the SessionEnd violation. Mirrors LIMEN_ALLOW_LIVE_COMMIT; leave 0 — the deny is the charter's scoped-verification rule made mechanical (2026-07-15 host-thrash incident)."
  LIMEN_INSIGHTS_ARCHIVE:
    default: "~/Workspace/organvm/claude-runtime-state/usage-data/snapshots"
    env: LIMEN_INSIGHTS_ARCHIVE
    self_update: none
    owner: censor
    note: "Archived /insights snapshot directory scanned by insight-cadence.py's suggestion-coverage gatherer: every snapshot must appear in a `reports` list in censor/insights-suggestions.jsonl or it is surfaced as an unaudited report each due tier. Fails open when absent (CI / other hosts)."
  LIMEN_HEARTBEAT_PLIST:
    default: "~/Library/LaunchAgents/com.limen.heartbeat.plist"
    env: LIMEN_HEARTBEAT_PLIST
    self_update: none
    owner: limen-daemon
    note: "LaunchAgent plist inspected by dispatch-health.py. Probe-only; changing it does not reload launchd or mutate the daemon."
  LIMEN_HEARTBEAT_LABEL:
    default: "com.limen.heartbeat"
    env: LIMEN_HEARTBEAT_LABEL
    self_update: none
    owner: limen-daemon
    note: "launchctl service label. Read by dispatch-health.py to compare loaded heartbeat env with the plist, and — since the loop-body self-load rung — by heartbeat-loop.sh to kickstart the daemon when its own script has changed under it. NO LONGER PROBE-ONLY: that rung is the first launchd WRITE keyed on this label, so a wrong value here now restarts the wrong service rather than merely misreporting one. It fires only with logs/.loop-update-pending present and only when `launchctl list` actually knows the label, so an unmanaged or misnamed label is a no-op with a log line, never a blind kickstart."
  LIMEN_CAMPAIGN_WAKE_TIMEOUT:
    default: 300
    env: LIMEN_CAMPAIGN_WAKE_TIMEOUT
    self_update: none
    owner: limen-daemon
    note: "Seconds allowed for one canonical campaign-supervisor evaluation from the heartbeat. Public configuration is bounded to 300..7200 so the relay always retains its fixed terminal-receipt margin. The legacy loop adds a fixed 30-second outer ceiling for capsule discovery and remote-default preflight, fails closed without timeout(1), and never falls back to direct provider launch."
  LIMEN_RELEASE_BRANCH:
    default: "main"
    env: LIMEN_RELEASE_BRANCH
    self_update: none
    owner: limen-daemon
    note: "Release branch that sync-release.sh and live-root-gate.py compare the live daemon checkout against. sync-release resolves origin's actual default independently: an override may select convergence evidence but can never reclassify, commit, or push the actual default branch as parked work."
  LIMEN_SYNC_RECEIPT_GLOBS:
    default: "tasks.yaml docs/worktree-preservation-receipts.json docs/pr-receipts.json docs/*-receipts.json docs/*-receipt.json"
    env: LIMEN_SYNC_RECEIPT_GLOBS
    self_update: none
    owner: limen-daemon
    note: "Space-separated globs of REGENERABLE daemon receipt files. sync-release.sh re-converges a diverged live checkout when its unique local commits touch ONLY these (loss-free — the beat rewrites them), instead of failing open forever and pinning the daemon to stale code. Genuinely-unique history still fails open to hand-reconcile."
  LIMEN_SYNC_RELEASE_SCRIPT:
    default: null              # unset in every runtime path; the tests resolve scripts/sync-release.sh
    env: LIMEN_SYNC_RELEASE_SCRIPT
    self_update: none
    owner: limen-daemon
    note: "TEST-ONLY: which sync-release.sh the drive tests execute (scripts/tests/sync-release.test.sh and cli/tests/test_session_contention.py's end-to-end section). Unset everywhere at runtime — the daemon always runs $LIMEN_ROOT/scripts/sync-release.sh — and it exists solely so the A/B that PROVES a regression test can be one command: extract the parent commit's script, point this at it, and require a FAIL. Declared here rather than renamed outside the LIMEN_* namespace because a knob that steers which code a gate exercises is exactly what the panel is for; a name chosen to dodge the ratchet would make it invisible on the one surface that enumerates such knobs. Used 2026-08-09 to prove the held-branch detach fallback: the baseline reproduced the live beat's own refusal line verbatim."
  LIMEN_DISPATCH_CEILING:
    default: null              # currently in heartbeat-loop.sh
    env: LIMEN_DISPATCH_CEILING
    self_update: "may lower under VITALS pressure"
    owner: arms-agents
    note: "First cross-organ link: VITALS pressure should drive this ceiling down."
  LIMEN_DISPATCH_LANES:
    default: "auto"
    env: LIMEN_DISPATCH_LANES
    self_update: none
    owner: arms-agents
    note: "Legacy manual dispatcher and backlog-planner selector. `auto` derives reachable registered lanes from the capacity registry; the canonical campaign supervisor ignores this knob and discovers keeper capabilities live."
  LIMEN_PR_CONTEXT_TIMEOUT:
    default: 20
    env: LIMEN_PR_CONTEXT_TIMEOUT
    self_update: none
    owner: arms-agents
    note: "Seconds allowed for fail-open GitHub PR context lookup before local isolated dispatch falls back to default-branch worktree creation."
  LIMEN_JULES_BATCH_FILL:
    default: "1"
    env: LIMEN_JULES_BATCH_FILL
    self_update: none
    owner: arms-agents
    note: "When 1, route.py treats healthy Jules as a normal repo-capable remote batch lane so its daily run budget is actively filled instead of waiting only for slow/fallback work."
  LIMEN_REMOTE_BATCH_BIAS:
    default: "0"
    env: LIMEN_REMOTE_BATCH_BIAS
    self_update: none
    owner: arms-agents
    note: "When 1, historical route ledger bias may down-weight remote batch-fill lanes. Default 0 preserves explicit daily utilization targets for lanes such as Jules."
  LIMEN_CROSS_VENDOR_INGEST:
    default: "1"
    env: LIMEN_CROSS_VENDOR_INGEST
    self_update: none
    owner: censor
    note: "Beat gate for the insight-cross-vendor sensor (sensors.yaml 0z0): refreshes the 7 per-vendor friction packets (logs/insight-cross-vendor/) that insight-cadence's cross-vendor source reads. Arms the estate-wide-friction-beat-sensor proposal (censor/whole-estate-insights-proposals.json); before this the ingest ran only by hand and packets went stale. Read-only over vendor stores; counts/patterns only. Set 0 to silence."
  LIMEN_BEAT_CROSS_VENDOR:
    default: 24
    env: LIMEN_BEAT_CROSS_VENDOR
    self_update: none
    owner: censor
    note: "Cadence (every N beats) of the insight-cross-vendor sensor — a daily-ish refresh matches the insights-report tempo the packets feed; the scan walks large vendor session stores (codex logs sqlite is GiB-scale), so it stays off the hot path."
  LIMEN_CROSS_VENDOR_TIMEOUT:
    default: 900
    env: LIMEN_CROSS_VENDOR_TIMEOUT
    self_update: none
    owner: censor
    note: "Per-run timeout (seconds) for the insight-cross-vendor sensor: eleven adapters over multi-GiB sqlite/jsonl stores with a 30-day window, PLUS the index --all and --health steps added 2026-08-06 (three ordered steps share this envelope). 900 covers the observed manual-run envelope with headroom; if the rung SIGKILLs (124), shrink --window-days rather than growing this. The runner kills the command group on overrun and the beat continues fail-open."
  LIMEN_RESERVED_TIER:
    default: "1"
    env: LIMEN_RESERVED_TIER
    self_update: none
    owner: censor
    note: "Gate for the reserved-tier-audit sensor (scripts/check-reserved-tier.py): does any lane run a reserved tier without a covering acceptance receipt. Armed by default because the rule it enforces (docs/fable-allotment.md) is already estate-wide in prose and was enforced Claude-lane-only in code — the sensor's severity is advisory, so arming it surfaces the backlog without blocking a beat."
  LIMEN_BEAT_RESERVED_TIER:
    default: 24
    env: LIMEN_BEAT_RESERVED_TIER
    self_update: none
    owner: censor
    note: "Beat cadence (hours) for reserved-tier-audit. Matched to LIMEN_BEAT_CROSS_VENDOR because this sensor reads the indexes that one refreshes — auditing more often than the input changes would burn the host for identical verdicts."
  LIMEN_RESERVED_TIER_TIMEOUT:
    default: 60
    env: LIMEN_RESERVED_TIER_TIMEOUT
    self_update: none
    owner: censor
    note: "Per-run timeout (seconds) for reserved-tier-audit. It reads already-materialized JSON indexes and never opens a vendor store, so 60 is generous; an overrun means the index tree grew pathological, not that the audit is slow."
  LIMEN_RESERVED_TIERS:
    default: "claude-fable-5"
    env: LIMEN_RESERVED_TIERS
    self_update: none
    owner: censor
    note: "Comma-separated model identities that require a written acceptance receipt before a run starts. Fable is the only reserved tier today (docs/fable-allotment.md); this is a list rather than a constant so a future reserved tier is one parameter edit, not a code change."
  LIMEN_RESERVED_TIER_COVER_DAYS:
    default: 7
    env: LIMEN_RESERVED_TIER_COVER_DAYS
    self_update: none
    owner: censor
    note: "How many days an acceptance receipt covers runs that START after it. 7 matches the ISO-week the Fable allotment ledger is reckoned in — a cover window wider than the ledger's period would let one receipt authorize two weeks of spend."
  LIMEN_FABLE_RECEIPTS_DIR:
    default: ""
    env: LIMEN_FABLE_RECEIPTS_DIR
    self_update: none
    owner: censor
    note: "Optional override for the Fable acceptance-receipt directory read by check-reserved-tier.py. Blank means logs/fable-acceptance/ (where fable-allotment.py accept writes). Set only by tests, which must never read the host's real receipts."
  LIMEN_CROSS_VENDOR_MAX_PACKET_AGE_DAYS:
    default: 3
    env: LIMEN_CROSS_VENDOR_MAX_PACKET_AGE_DAYS
    self_update: none
    owner: censor
    note: "Health check packet_stale: a vendor packet whose run_at_iso is older than this many days flags its lane (the frozen-packets incident — every packet sat at 2026-07-22 for two weeks before anything noticed). Read by scripts/insight-cross-vendor-ingest.py --health."
  LIMEN_CROSS_VENDOR_RESET_DROP_PCT:
    default: 50
    env: LIMEN_CROSS_VENDOR_RESET_DROP_PCT
    self_update: none
    owner: censor
    note: "Health check store_reset: flag a lane whose sessions_seen fell by at least this percent vs the recent ring-buffer max (state/health-state.json). The opencode wipe (store reset ~2026-08-03 to a single 1-second session) was only discovered by a manual sweep."
  LIMEN_CROSS_VENDOR_RESET_MIN_BASE:
    default: 20
    env: LIMEN_CROSS_VENDOR_RESET_MIN_BASE
    self_update: none
    owner: censor
    note: "Health check store_reset noise floor: the drop check only arms when the recent max sessions_seen is at least this — a 3-session lane halving is noise, a 40-session lane halving is a reset."
  LIMEN_CROSS_VENDOR_MIN_HORIZON_DAYS:
    default: 14
    env: LIMEN_CROSS_VENDOR_MIN_HORIZON_DAYS
    self_update: none
    owner: censor
    note: "Health check retention_horizon: flag a non-empty lane whose oldest locally-surviving record (packet oldest_record_iso) is younger than this many days — the store prunes faster than review happens (antigravity blobs prune at ~10d; 59% of one 30-day window was already structural-only before anything measured it)."
  LIMEN_VENDOR_CAPSULE_CHURN_MAX:
    default: 3
    env: LIMEN_VENDOR_CAPSULE_CHURN_MAX
    self_update: none
    owner: censor
    note: "Health check capsule_churn: flag a lane whose index meta.capsule_churn.mean_files_per_session exceeds this — resume-fragmentation (codex live mean 4.38, max 35 rollout files for one logical session) makes transcripts expensive to reassemble and signals sessions dying/resuming pathologically."
  LIMEN_VENDOR_NARRATIVE_MAX_LAG_DAYS:
    default: 7
    env: LIMEN_VENDOR_NARRATIVE_MAX_LAG_DAYS
    self_update: none
    owner: censor
    note: "Health check index_ahead_of_narrative: flag a lane whose index.json is newer than its narrative.json by more than this many days (or never narrated) — the lane is being measured on the beat but never read, which is how a 25-hour autonomous mission and a 21-day-dark dispatch estate went unreviewed."

  LIMEN_JULES_QUOTA:
    default: "1"
    env: LIMEN_JULES_QUOTA
    self_update: none
    owner: arms-agents
    note: "Beat gate for the jules-quota sensor (sensors.yaml jules-quota): daily used-vs-target gauge plus orphaned-completion and recovery-state session counts."
  LIMEN_JULES_QUOTA_ALARM_HOUR:
    default: 18
    env: LIMEN_JULES_QUOTA_ALARM_HOUR
    self_update: none
    owner: arms-agents
    note: "UTC hour after which under-target Jules usage turns the jules-quota sensor advisory-red (the day is running out; the vendor quota expires unused at reset)."
  LIMEN_JULES_DAILY_TASKS:
    default: ""
    env: LIMEN_JULES_DAILY_TASKS
    self_update: none
    owner: arms-agents
    note: "Daily Jules task target override. Unset derives from capacity.DEFAULT_DAILY_TASK_TARGETS (vendor quota 100/day; operator mandate is full daily consumption)."
  LIMEN_JULES_FLYWHEEL:
    default: "1"
    env: LIMEN_JULES_FLYWHEEL
    self_update: none
    owner: arms-agents
    note: "Beat gate for the jules-flywheel sensor: THE acceptance predicate of the jules-flywheel program (issue #1874) — exit 0 ⟺ quota consumed AND landing rate holds AND jules PR debt non-increasing; exit 1 names the failing clause and its owning effector."
  LIMEN_FLYWHEEL_LAND_FLOOR:
    default: 0.30
    env: LIMEN_FLYWHEEL_LAND_FLOOR
    self_update: none
    owner: arms-agents
    note: "Landed/dispatched floor the flywheel's landing clause demands over the throughput window — mirrors LIMEN_THROUGHPUT_FLOOR_RATE, and the clause is skipped below the governor's bootstrap_min so the flywheel never alarms on the ramp the governor deliberately allows."
  LIMEN_JULES_PR_DEBT_SNAPSHOT:
    default: ""
    env: LIMEN_JULES_PR_DEBT_SNAPSHOT
    self_update: none
    owner: arms-agents
    note: "Override path for the flywheel's jules open-PR-count snapshot (default logs/jules-pr-debt-snapshot.json at LIMEN_ROOT) — the non-increasing-debt clause compares against it."
  LIMEN_JULES_ADOPTIONS:
    default: ""
    env: LIMEN_JULES_ADOPTIONS
    self_update: none
    owner: arms-agents
    note: "Override path for the Jules orphan-adoption ledger (default docs/jules-orphan-adoptions.jsonl at LIMEN_ROOT): sessions landed out-of-band that the drain/quota sensor must not re-alarm as orphans."
  LIMEN_JULES_SUPPLY:
    default: "1"
    env: LIMEN_JULES_SUPPLY
    self_update: none
    owner: arms-agents
    note: "Beat gate for the jules-supply sensor (sensors.yaml jules-supply): dispatchable-supply-vs-floor gauge; the armed valve LIMEN_JULES_SUPPLY_APPLY owns minting."
  LIMEN_OWNER_ROUTE_DRAIN:
    default: "1"
    env: LIMEN_OWNER_ROUTE_DRAIN
    self_update: none
    owner: arms-agents
    note: "Drain-rung gate for owner-route-drain.py (the 308-blocked-jules-PR debt organ, GITVS-UNCAPPED-PR-DEBT-0715). Classification always runs when gated on; mutations need the separate apply valve."
  LIMEN_OWNER_ROUTE_DRAIN_APPLY:
    default: "0"
    env: LIMEN_OWNER_ROUTE_DRAIN_APPLY
    self_update: none
    owner: arms-agents
    note: "Armed valve for owner-route-drain mutations (merge/supersede/close). Default 0: classification + receipts only, until a dry-run day's verdict distribution has been reviewed. A pause marker forces classification-only even when armed."
  LIMEN_OWNER_ROUTE_LIMIT:
    default: 15
    env: LIMEN_OWNER_ROUTE_LIMIT
    self_update: none
    owner: arms-agents
    note: "Verdicts per owner-route-drain run (rotating cursor over the jules PR cohort)."
  LIMEN_OWNER_ROUTE_MERGE_LIMIT:
    default: 5
    env: LIMEN_OWNER_ROUTE_MERGE_LIMIT
    self_update: none
    owner: arms-agents
    note: "Merges per owner-route-drain run — each one still individually gated on merge-policy.sh exit 0 with the exact head pinned."
  LIMEN_OWNER_ROUTE_MAX_AGE_DAYS:
    default: 45
    env: LIMEN_OWNER_ROUTE_MAX_AGE_DAYS
    self_update: none
    owner: arms-agents
    note: "Age horizon past which a red-CI jules PR with no surviving value claim is closed (with the reason as a comment) instead of routed to heal."
  LIMEN_JULES_PR_AUTHOR:
    default: "app/google-labs-jules"
    env: LIMEN_JULES_PR_AUTHOR
    self_update: none
    owner: arms-agents
    note: "GitHub author identity of vendor-authored jules PRs, used by owner-route-drain's cohort enumeration."
  LIMEN_JULES_LAND_LIMIT:
    default: 5
    env: LIMEN_JULES_LAND_LIMIT
    self_update: none
    owner: arms-agents
    note: "jules-land landings per drain beat (raised 3->5 for the 100/day throughput program: ~96 drain runs/day x 5 = 480/day landing headroom)."
  LIMEN_MERGE_SCAN:
    default: 50
    env: LIMEN_MERGE_SCAN
    self_update: none
    owner: arms-agents
    note: "merge-drain rotating assessment window per run (raised 30->50 so the jules cohort gets a same-day revisit at 100/day dispatch)."
  LIMEN_LANE_THROUGHPUT:
    default: "1"
    env: LIMEN_LANE_THROUGHPUT
    self_update: none
    owner: arms-agents
    note: "Beat gate for the lane-throughput sensor (sensors.yaml lane-throughput): per-lane throughput-governor gauge; advisory-red on a clamp sustained across 2+ days."
  LIMEN_BEAT_FRESHNESS:
    default: "1"
    env: LIMEN_BEAT_FRESHNESS
    self_update: none
    owner: substrate
    note: "Beat gate for the beat-freshness sensor (sensors.yaml beat-freshness): the resident heartbeat daemon must postdate its own loop body on disk; a stale daemon executes dead code until kickstarted (the 2026-08-06 flywheel keyturn lesson)."
  LIMEN_BEAT_FRESHNESS_CADENCE:
    default: 4
    env: LIMEN_BEAT_FRESHNESS_CADENCE
    self_update: none
    owner: substrate
    note: "Run the beat-freshness check every Nth sensor pass — a staleness alarm needs no per-beat cadence."
  LIMEN_BEAT_FRESHNESS_TIMEOUT:
    default: 60
    env: LIMEN_BEAT_FRESHNESS_TIMEOUT
    self_update: none
    owner: substrate
    note: "Timeout for one check-beat-freshness run (a pgrep + ps + stat)."
  LIMEN_LIVE_CHECKOUT_CURRENCY:
    default: "1"
    env: LIMEN_LIVE_CHECKOUT_CURRENCY
    self_update: none
    owner: substrate
    note: "Beat gate for the live-checkout-currency sensor (sensors.yaml live-checkout-currency): the tree the beat EXECUTES must be origin/main, and — new on 2026-08-07 — the answer must persist as an offline receipt. beat-freshness's sibling one layer out (daemon vs its loop body; this one, code on disk vs the remote). Set 0 only on a host with no live checkout, where the probe already self-reports unverifiable-here."
  LIMEN_LIVE_CHECKOUT_CADENCE:
    default: 4
    env: LIMEN_LIVE_CHECKOUT_CADENCE
    self_update: none
    owner: substrate
    note: "Run the live-checkout currency probe every Nth sensor pass. It costs one network `git ls-remote`, so it is not a per-beat rung; the receipt it writes is what point-of-use consumers read, and they read it every time."
  LIMEN_LIVE_CHECKOUT_TIMEOUT:
    default: 90
    env: LIMEN_LIVE_CHECKOUT_TIMEOUT
    self_update: none
    owner: substrate
    note: "Timeout for one check-live-checkout run. Larger than beat-freshness's because this one talks to origin; on timeout the probe simply does not refresh its receipt, which ages out and degrades consumers toward the warning — the correct direction."
  LIMEN_LIVE_CHECKOUT_RECEIPT:
    default: ""
    env: LIMEN_LIVE_CHECKOUT_RECEIPT
    self_update: none
    owner: substrate
    note: "Override path for the offline live-checkout currency receipt (default logs/live-checkout-currency.json at LIMEN_ROOT). Consumed by the Fable meter's provenance dimension (model_selection.balance_verdict) to answer 'was the deployed tree current when this beat-written artifact was produced?' without a network call. Tests point it at a fixture; production never sets it."
  LIMEN_LANE_THROUGHPUT_HISTORY:
    default: ""
    env: LIMEN_LANE_THROUGHPUT_HISTORY
    self_update: none
    owner: arms-agents
    note: "Override path for the lane-throughput history ledger (default logs/lane-throughput.jsonl at LIMEN_ROOT) the sustained-clamp check reads."
  LIMEN_THROUGHPUT_GOVERNOR:
    default: "1"
    env: LIMEN_THROUGHPUT_GOVERNOR
    self_update: none
    owner: arms-agents
    note: "Kill-switch for the throughput governor (capacity.lane_throughput_cap enforced in dispatch._remaining_budget). 0 disables the landed-evidence clamp entirely; the per-agent budget caps still bind."
  LIMEN_THROUGHPUT_WINDOW_DAYS:
    default: 3
    env: LIMEN_THROUGHPUT_WINDOW_DAYS
    self_update: none
    owner: arms-agents
    note: "Trailing window (days) over dispatch_log receipts for the throughput governor's dispatched/landed counts."
  LIMEN_THROUGHPUT_BOOTSTRAP:
    default: 25
    env: LIMEN_THROUGHPUT_BOOTSTRAP
    self_update: none
    owner: arms-agents
    note: "Cold-start daily allowance while a lane has too few window dispatches to judge a landing rate. Never 0 — a zero here would recreate the self-sealing starvation deadlock the admission bootstrap removed."
  LIMEN_THROUGHPUT_BOOTSTRAP_MIN:
    default: 20
    env: LIMEN_THROUGHPUT_BOOTSTRAP_MIN
    self_update: none
    owner: arms-agents
    note: "Minimum window dispatches before the governor judges landed rate; below it the lane stays in the bootstrap allowance."
  LIMEN_THROUGHPUT_FLOOR_RATE:
    default: 0.30
    env: LIMEN_THROUGHPUT_FLOOR_RATE
    self_update: none
    owner: arms-agents
    note: "Landed/dispatched floor at which a lane earns its full daily target. Below it the lane is clamped to ramp_mult x landed (never under the bootstrap allowance) with a receipt in logs/throughput-governor.jsonl."
  LIMEN_THROUGHPUT_RAMP_MULT:
    default: 3
    env: LIMEN_THROUGHPUT_RAMP_MULT
    self_update: none
    owner: arms-agents
    note: "Throttled-mode multiplier: cap = max(bootstrap, ramp_mult x landed_in_window), capped at the daily target — landing more work opens more dispatch."
  LIMEN_WORK_LOAN_BACKFILL:
    default: "1"
    env: LIMEN_WORK_LOAN_BACKFILL
    self_update: none
    owner: arms-agents
