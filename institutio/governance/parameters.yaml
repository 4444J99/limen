    self_update: none
    owner: continuity
    note: "Per-root directory visit cap for external/archive session inventory roots."
  LIMEN_CURRENT_SESSION:
    default: ""
    env: LIMEN_CURRENT_SESSION
    self_update: none
    owner: continuity
    note: "Optional native session locator for agent-neutral current-session fanout. Blank means discover the newest supported Codex, Claude, Copilot, Agy, or OpenCode session."
  LIMEN_SESSION_SOURCE_AGENT:
    default: "auto"
    env: LIMEN_SESSION_SOURCE_AGENT
    self_update: none
    owner: continuity
    note: "Native session corpus to inspect for current-session fanout. Auto derives the newest healthy supported source without replacing its agent identity."
  LIMEN_MIN_PLANNERS:
    default: 10
    env: LIMEN_MIN_PLANNERS
    self_update: none
    owner: continuity
    note: "Minimum capability-selected planner packets emitted by current-session fanout before executor routing. This supersedes the Codex-specific planner knob."
  LIMEN_PLANNER_LANES:
    default: "auto"
    env: LIMEN_PLANNER_LANES
    self_update: none
    owner: continuity
