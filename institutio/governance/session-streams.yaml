# STREAMS — the declared work-domain registry (VIGILIA's fourth axis beside GATES, SENSORS, PARAMETERS)
#
# WHY THIS EXISTS
#   A session stream is one work DOMAIN: an umbrella worktree an operator opens and interacts with,
#   which spawns bounded children under its own lineage (`limen conduct split`, never a nested
#   worktree — see the note on containment below).
#
#   The defect this closes: the arc's dependency graph and its "open these today" answer lived as
#   PROSE in docs/plans/2026-07-29-session-stream-cartridges.md. Prose decays the moment a branch
#   merges, and a human then re-derives it by hand every session. Here the graph is declared data and
#   the ready-set is DERIVED:
#
#       python3 scripts/check-session-streams.py --ready
#
#   prints, per openable domain, the exact `workstream` command. The question "which streams do I
#   open?" is a command's output, not a table somebody maintains.
#
#   And ACTING on that answer is one command too — the printer alone still left the operator reading
#   blocks and retyping them into terminal tabs, which is the same hand-loop one level up:
#
#       scripts/open-streams.sh              # open every ready domain, each in its own tmux window
#       scripts/open-streams.sh --dry-run    # show exactly what would open, touch nothing
#
#   It consumes `--ready --json` (each row carries the resolved argv, from the SAME builder the text
#   view renders), bounds concurrency against this machine's real memory, and names every stream it
#   defers. Re-running opens only what is not already open.
#
# THE ENGINE IS NOT NEW (IF-LEARNING-ENGINE, subject/cartridge contract)
#   `limen workstream <repo> <slug>` (-> scripts/start-worktree-session.sh) is the estate's only
#   worktree-creating CLI verb and the single owner of lane creation. A stream is a SUBJECT loaded
#   into that engine — a row here, never a second launcher. Adding a domain = adding ONE row.
#
# CONTAINMENT IS BY LINEAGE, NOT BY DIRECTORY
#   Children are reserved with `limen conduct split <parent_run> --packet` and bounded by
#   FanoutBoundsV1{max_children, max_depth}. A child worktree is NEVER nested inside its parent's
#   directory: worktree_roots.iter_worktree_targets() sweeps ROOTS, so a nested child is invisible to
#   the SPRAWL-RECLAIM organ and leaks (the ~50GB blind spot, docs/PARALLEL-CELLS.md).
#
# HOW A DOMAIN SETTLES (the state is derived; this is the ONLY way to write it)
#   Put an anchored trailer at column 0 of the merge commit message:
#
#       Settles: <stream-id>[, <stream-id>…]
#
#   and make that commit change something outside this registry and docs/{plans,continuations}/ —
#   bookkeeping records an outcome, it cannot produce one. There is no `settled:` field, and a
#   passing mention of an id does NOT settle it: the rule used to be an unanchored
#   `git log --grep=<id>`, which settled `s10-axis-coverage` off a docs commit whose entire subject
#   was that s10 owns work a plan should not do. `settled_by:` is a bounded, checked backfill for
#   the two domains that settled before this convention existed — not a second path.
#
# FIELDS
#   id                 stable slug; also the worktree slug and the docs/continuations/<id>/ key
#   family             which registry this row PROJECTS. `domain` rows are DERIVED from the
#                      workstream channel roster (cli/src/limen/workstream.py meta lanes +
#                      organ-ladder.json pillars) — the operator's LIFE/WORK DOMAINS
#                      (2026-07-30: email/comms=correspondence, finance=financial, job
#                      applications=representation), the streams he actually opens — by
#                      derive-domain-streams.py, held in parity by check N; they carry
#                      `open_rank` (launch order — the RAM-bounded launcher opens the first N).
#                      `constellation` rows are DERIVED from
#                      organs/consulting/constellation/registry.yaml — the collaborator
#                      person-streams, the consulting DOMAIN's interior — by derive-streams.py,
#                      held in parity by check M (hand-editing either family is drift).
#                      `governance` rows are hand-authored estate work. Operator-facing views
#                      list domain first; the launcher's default family is domain.
#   title              one line, human-facing
#   branch_prefix      from the CLAUDE.md branch-cadence table (feat|fix|heal|chore|docs|refactor)
#   intent             the --prompt-file payload; must exist (check A)
#   requires           stream ids that must be SETTLED first; [] means openable now
#   unblocks           inverse of requires; held mutually consistent + acyclic (check B)
#   job_class          feeds tier derivation. NEVER a model or a vendor: the capsule contract
#                      declares `lane_selection: derive_from_live_capabilities` and "never pin a
#                      future provider or model". Classes that claim reserved-Opus standing are
#                      validated against model_selection._CLAUDE_OPUS_CLASSES_DEFAULT (check G) —
#                      derived from the tier authority, never a second copy of the ladder.
#   predicate          the executable that decides this stream's DONE
#   predicate_status   existing     — the predicate exists today and must resolve
#                      to_be_built  — this stream BUILDS its own predicate; it must NOT exist yet,
#                                     and the stream may not be `settled` while it is missing.
#                                     Flipping this field without shipping the file is caught both
#                                     ways (check C) — the anti-fake rung.
#   runway             finite workstream runway handed to --runway (15m..30d)
#   owner_of_record    the git-tracked surface that owns this domain's result
#   max_children       IF-AMALGAMATION bound on the umbrella's fan-out
#   predicate_command  OPTIONAL: the argv actually RUN to prove this domain done — distinct from
#                      `predicate`, which is only the FILE whose existence check C validates. A file
#                      existing proves nothing about the work.
#                      `null` is an HONEST value meaning "not provable yet", and most rows are null
#                      on purpose: 7 of 11 share a `predicate` with another row
#                      (check-convergence.py -> s3/s6/s7, check-atom-homing.py -> s1/s2,
#                      no-tasks-on-me.sh -> s4/s5), and a shared probe green says "some axis is
#                      healthy", never "THIS domain is done". Check J refuses a duplicate outright.
#                      Constrained STATICALLY by check I: argv[0] must be a runner
#                      (python3 | bash | scripts/run-pytest-hermetic.sh) and no --apply/--live/
#                      --write/--force/--execute token may appear anywhere. That guard is why
#                      s8's `predicate` (scripts/repo-genesis.py, which MINTS A REAL GITHUB REPO
#                      when told to act) can never become a settlement probe with real arguments.
#   settled_by         OPTIONAL, migration-only: the SHA that settled this domain BEFORE the
#                      `Settles:` convention existed. Check H proves it is a real commit reachable
#                      from origin/main that changed paths outside this registry, and bounds how
#                      many rows may carry one. A new domain never gets this — it claims its own.
#   note               the measured defect this domain closes — never a wish
#
# Provenance: the nine domains and their measured ground truth come from
# docs/plans/2026-07-29-session-stream-cartridges.md, itself instantiating the a->w roadmap approved
# 2026-07-26 (zero phases of which landed; the session stopped on a spend limit).

