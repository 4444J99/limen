# STREAMS — the declared work-domain registry (VIGILIA's fourth axis beside GATES, SENSORS, PARAMETERS)
#
# WHY THIS EXISTS
#   A session stream is one work DOMAIN: an umbrella worktree an operator opens and interacts with,
#   which spawns bounded children under its own lineage (`limen conduct split`, never a nested
#   worktree — see the note on containment below).
#
#   The defect this closes: the arc's dependency graph and its "open these today" answer lived as
#   PROSE in docs/plans/2026-07-29-session-stream-cartridges.md. Prose decays the moment a branch
#   merges, and a human then re-derives it by hand every session. Here the graph is declared data and
#   the ready-set is DERIVED:
#
#       python3 scripts/check-session-streams.py --ready
#
#   prints, per openable domain, the exact `workstream` command. The question "which streams do I
#   open?" is a command's output, not a table somebody maintains.
#
#   And ACTING on that answer is one command too — the printer alone still left the operator reading
#   blocks and retyping them into terminal tabs, which is the same hand-loop one level up:
#
#       scripts/open-streams.sh              # open every ready domain, each in its own tmux window
#       scripts/open-streams.sh --dry-run    # show exactly what would open, touch nothing
#
#   It consumes `--ready --json` (each row carries the resolved argv, from the SAME builder the text
#   view renders), bounds concurrency against this machine's real memory, and names every stream it
#   defers. Re-running opens only what is not already open.
#
# THE ENGINE IS NOT NEW (IF-LEARNING-ENGINE, subject/cartridge contract)
#   `limen workstream <repo> <slug>` (-> scripts/start-worktree-session.sh) is the estate's only
#   worktree-creating CLI verb and the single owner of lane creation. A stream is a SUBJECT loaded
#   into that engine — a row here, never a second launcher. Adding a domain = adding ONE row.
#
# CONTAINMENT IS BY LINEAGE, NOT BY DIRECTORY
#   Children are reserved with `limen conduct split <parent_run> --packet` and bounded by
#   FanoutBoundsV1{max_children, max_depth}. A child worktree is NEVER nested inside its parent's
#   directory: worktree_roots.iter_worktree_targets() sweeps ROOTS, so a nested child is invisible to
#   the SPRAWL-RECLAIM organ and leaks (the ~50GB blind spot, docs/PARALLEL-CELLS.md).
#
# HOW A DOMAIN SETTLES (the state is derived; this is the ONLY way to write it)
#   Put an anchored trailer at column 0 of the merge commit message:
#
#       Settles: <stream-id>[, <stream-id>…]
#
#   and make that commit change something outside this registry and docs/{plans,continuations}/ —
#   bookkeeping records an outcome, it cannot produce one. There is no `settled:` field, and a
#   passing mention of an id does NOT settle it: the rule used to be an unanchored
#   `git log --grep=<id>`, which settled `s10-axis-coverage` off a docs commit whose entire subject
#   was that s10 owns work a plan should not do. `settled_by:` is a bounded, checked backfill for
#   the two domains that settled before this convention existed — not a second path.
#
# FIELDS
#   id                 stable slug; also the worktree slug and the docs/continuations/<id>/ key
#   title              one line, human-facing
#   branch_prefix      from the CLAUDE.md branch-cadence table (feat|fix|heal|chore|docs|refactor)
#   intent             the --prompt-file payload; must exist (check A)
#   requires           stream ids that must be SETTLED first; [] means openable now
#   unblocks           inverse of requires; held mutually consistent + acyclic (check B)
#   job_class          feeds tier derivation. NEVER a model or a vendor: the capsule contract
#                      declares `lane_selection: derive_from_live_capabilities` and "never pin a
#                      future provider or model". Classes that claim reserved-Opus standing are
#                      validated against model_selection._CLAUDE_OPUS_CLASSES_DEFAULT (check G) —
#                      derived from the tier authority, never a second copy of the ladder.
#   predicate          the executable that decides this stream's DONE
#   predicate_status   existing     — the predicate exists today and must resolve
#                      to_be_built  — this stream BUILDS its own predicate; it must NOT exist yet,
#                                     and the stream may not be `settled` while it is missing.
#                                     Flipping this field without shipping the file is caught both
#                                     ways (check C) — the anti-fake rung.
#   runway             finite workstream runway handed to --runway (15m..30d)
#   owner_of_record    the git-tracked surface that owns this domain's result
#   max_children       IF-AMALGAMATION bound on the umbrella's fan-out
#   predicate_command  OPTIONAL: the argv actually RUN to prove this domain done — distinct from
#                      `predicate`, which is only the FILE whose existence check C validates. A file
#                      existing proves nothing about the work.
#                      `null` is an HONEST value meaning "not provable yet", and most rows are null
#                      on purpose: 7 of 11 share a `predicate` with another row
#                      (check-convergence.py -> s3/s6/s7, check-atom-homing.py -> s1/s2,
#                      no-tasks-on-me.sh -> s4/s5), and a shared probe green says "some axis is
#                      healthy", never "THIS domain is done". Check J refuses a duplicate outright.
#                      Constrained STATICALLY by check I: argv[0] must be a runner
#                      (python3 | bash | scripts/run-pytest-hermetic.sh) and no --apply/--live/
#                      --write/--force/--execute token may appear anywhere. That guard is why
#                      s8's `predicate` (scripts/repo-genesis.py, which MINTS A REAL GITHUB REPO
#                      when told to act) can never become a settlement probe with real arguments.
#   settled_by         OPTIONAL, migration-only: the SHA that settled this domain BEFORE the
#                      `Settles:` convention existed. Check H proves it is a real commit reachable
#                      from origin/main that changed paths outside this registry, and bounds how
#                      many rows may carry one. A new domain never gets this — it claims its own.
#   note               the measured defect this domain closes — never a wish
#
# Provenance: the nine domains and their measured ground truth come from
# docs/plans/2026-07-29-session-stream-cartridges.md, itself instantiating the a->w roadmap approved
# 2026-07-26 (zero phases of which landed; the session stopped on a spend limit).

schema_version: 0.1

streams:

  # ── open now: no unmet precondition ──────────────────────────────────────────
  s0-corpus-custody:
    title: "Corpus custody — teach the registry where the store actually lives"
    branch_prefix: heal
    intent: docs/continuations/s0-corpus-custody/intent.md
    requires: []
    # DIRECT edges only — `unblocks` is the exact inverse of the other row's `requires` (check B).
    # s0 gates the four DISTILLATION domains directly, not through s1: the spine (s1) shipped
    # deliberately store-free (#1608, "runs in CI where the corpus can never exist"), but you
    # cannot distill atoms whose statement text you cannot read.
    unblocks:
      - s2-public-distillation
      - s3-governance-case-law
      - s4-operator-routing
      - s5-commercial-offerings
    job_class: governance
    predicate: scripts/check-corpora.py
    # Stream-distinguishing on purpose: check-corpora.py green means "the corpus axis is healthy",
    # not "s0 is done". This asserts s0's THREE mission items specifically — the custody record in
    # custody.yaml, the UNACCOUNTED-fails rule in check-corpora.py, and the documented reclaim verb.
    # Store-free, so it holds in CI where the archived corpus is absent.
    predicate_command: bash scripts/run-pytest-hermetic.sh cli/tests/test_stream_s0_custody.py -q
    predicate_status: existing
    runway: 8h
    owner_of_record: institutio/governance/corpora.yaml
    max_children: 4
    note: >-
      corpora.yaml declares the conversations-private store at ~/Workspace/_conversations-private;
      that path does not resolve. The store was evacuated 2026-07-27 by the laptop-evacuation custody
      lane (#1604). The evacuation is correct; check-corpora.py never asserted a root RESOLVES, so
      the registry is green over a store nobody can open.

  s6-registry-correction:
    title: "Registry correction — make convergence.yaml describe the code it names"
    branch_prefix: heal
    intent: docs/continuations/s6-registry-correction/intent.md
    requires: []
    unblocks: [s7-smallest-lifts]
    job_class: canon
    predicate: scripts/check-convergence.py
    predicate_status: existing
    runway: 8h
    owner_of_record: institutio/governance/convergence.yaml
    max_children: 4
    note: >-
      Four of twelve capability rows were measured false on 2026-07-26 (worker-toolkit names no seam
      though organvm/payrail exists; data-export claims near-identical copies that share zero
      function names; text-quality-scoring names a frontmatter validator as a quality scorer;
      learning-engine.md claims a mirror-drift control that does not exist). Declared data that
      misdescribes ground truth routes work at the wrong target.

  s9-lane-tier-pin:
    title: "Lane tier pin — stop launched lanes inheriting a prohibited tier"
    branch_prefix: heal
    # Settled before the `Settles:` convention existed. 7ba07525 is #1619, whose diff is the fix
    # itself (cli/src/limen/workstream_contract.py, cli.py, tests) — check H proves it is reachable
    # from origin/main and changed paths outside this registry.
    settled_by: 7ba07525
    intent: docs/continuations/s9-lane-tier-pin/intent.md
    requires: []
    unblocks: []
    job_class: kernel
    predicate: cli/tests/test_workstream_contract.py
    # Dispatched through the hermetic runner, the estate convention for a test-as-gate: it scrubs
    # LIMEN_*/GIT_CONFIG_* first. A bare `pytest` here fails with `ModuleNotFoundError: No module
    # named 'limen'`, which would resolve to NOT PROVEN — correct, but for the wrong reason.
    predicate_command: bash scripts/run-pytest-hermetic.sh cli/tests/test_workstream_contract.py -q
    predicate_status: existing
    runway: 8h
    owner_of_record: cli/src/limen/workstream_contract.py
    max_children: 2
    note: >-
      Measured 2026-07-29 while building this registry: the capsule's non-Codex branch execs the lane
      binary with no --model, and start-worktree-session.sh gates --model behind the Codex triple. So
      a claude umbrella inherits ~/.claude/settings.json's interactive default — currently
      claude-fable-5[1m] — and docs/fable-allotment.md declares Fable PLAN-ONLY with building on it
      prohibited. Its own domain because workstream_contract.py models primary_launch as strictly
      Codex and is SHA-bound over nine modules on both build and re-entry.

  s10-axis-coverage:
    title: "Axis coverage — make \"every axis is green\" one command, not a hand-loop"
    branch_prefix: feat
    intent: docs/continuations/s10-axis-coverage/intent.md
    requires: []
    unblocks: []
    job_class: governance
    predicate: scripts/check-gates.py
    predicate_status: existing
    runway: 8h
    owner_of_record: institutio/governance/gates.yaml
    max_children: 2
    note: >-
      Measured 2026-07-29 on 6bac5cad: 27 scripts/check-*.py on disk, 19 registered in gates.yaml,
      9 in sensors.yaml (4 in both) — 3 wired nowhere. verify-whole.sh invokes 4 of the 27
      literally; pr-gate.yml's LIMEN_PRGATE_SCOPED=0 full-literal-matrix lists 7, omitting corpora,
      convergence, atom-homing, custody, ideal-forms and session-streams. check-gates.py check F
      covers only verify-whole.sh's file_set derivation, not its check invocations, and no axis
      predicate appears in sensors.yaml so omega.sh misses them too. Each axis prevents drift in
      its own domain while the SET of axes drifts unchecked — the CORPORA founding defect (two
      consumers, two wrong copies of one list) one level up. Also folds in the axis->ideal
      coupling: CUSTODY (#1615) and STREAMS (#1612) each shipped a registry, predicate and gate
      row with no IF-* entry, the same gap IF-ATOM-HOMING had at the 6th axis.

  # ── settled: the spine landed as #1608 while this registry was being authored ──
  s1-homing-spine:
    title: "The homing spine — declared data before any homing"
    branch_prefix: feat
    # Settled before the `Settles:` convention existed. Under the OLD unanchored rule this row read
    # settled only because the registry's own bookkeeping commit b5d7909f said "record
    # s1-homing-spine settled by #1608" — the real work commit never names the id. 9a319395 IS that
    # real work (institutio/governance/atom-homing.yaml, atom-census.yaml, the residue baseline).
    settled_by: 9a319395
    intent: docs/continuations/s1-homing-spine/intent.md
    # NOT [s0]: the spine was authored store-free on purpose, so it never needed the corpus.
    # Measured by its own landing — #1608 shipped with the store cold-archived off this host.
    requires: []
    unblocks:
      - s2-public-distillation
      - s3-governance-case-law
      - s4-operator-routing
      - s5-commercial-offerings
    job_class: kernel
    predicate: scripts/check-atom-homing.py
    predicate_status: existing
    runway: 1d
    owner_of_record: institutio/governance/atom-homing.yaml
    max_children: 6
    note: >-
      SETTLED by #1608 (9a319395), landed 2026-07-29 by a parallel session while this registry was
      being authored — measured by check C of this very registry, which refused the row that still
      claimed the predicate was to-be-built. What shipped is exactly this domain's ask: atom-homing.yaml
      (one row per kind), the statement-free atom-census.yaml, the residue baseline, and
      check-atom-homing.py checks A-G — including D, the executable form of `redacted:false ⇒ never
      leaves its store`. The DECLARATION is done; all 4,099 atoms remain residual, which is the work
      of s2..s5 and is why they gate on s0 rather than on this row.

  # ── blocked on s1 — the seven kinds, one domain per destination ───────────────
  s2-public-distillation:
