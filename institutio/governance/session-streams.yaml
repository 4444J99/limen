      Codex and is SHA-bound over nine modules on both build and re-entry.

  # ── settled: the spine landed as #1608 while this registry was being authored ──
  s1-homing-spine:
    title: "The homing spine — declared data before any homing"
    branch_prefix: feat
    intent: docs/continuations/s1-homing-spine/intent.md
    # NOT [s0]: the spine was authored store-free on purpose, so it never needed the corpus.
    # Measured by its own landing — #1608 shipped with the store cold-archived off this host.
    requires: []
    unblocks:
      - s2-public-distillation
      - s3-governance-case-law
      - s4-operator-routing
      - s5-commercial-offerings
    job_class: kernel
    predicate: scripts/check-atom-homing.py
    predicate_status: existing
    runway: 1d
    owner_of_record: institutio/governance/atom-homing.yaml
    max_children: 6
    note: >-
      SETTLED by #1608 (9a319395), landed 2026-07-29 by a parallel session while this registry was
      being authored — measured by check C of this very registry, which refused the row that still
      claimed the predicate was to-be-built. What shipped is exactly this domain's ask: atom-homing.yaml
      (one row per kind), the statement-free atom-census.yaml, the residue baseline, and
      check-atom-homing.py checks A-G — including D, the executable form of `redacted:false ⇒ never
