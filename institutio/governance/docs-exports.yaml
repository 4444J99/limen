# DOCS-EXPORTS — the export program: every limen doc whose SUBJECT another repo owns.
#
# Docs belong with their subject. docs-manifest.yaml governs the docs/ TOP-LEVEL surface;
# this registry governs the cross-repo program at any depth, including subdirectories.
# Derived 2026-07-30 by a 65-agent subject-ownership audit over all 355 files in docs/
# (each classification adversarially verified by an independent skeptic; 48 of 213 calls
# were overturned in verification). 140 entries came back STAY and carry no row here.
#
# Row contract: `path` (repo-relative) -> `target` ('<org>/<repo>:<path>/' or DELETE),
# `tranche` (execution order), `leak_risk`, `patch` (limen consumers that pin the exact path
# and must be repointed IN THE SAME COMMIT as the move -- empty list = a free move).
# Shipping an export DELETES its row: deleting the row IS the receipt, and this file only
# ever shrinks toward zero. Receipts: docs/receipts/docs-estate-exports-*.jsonl.
# Predicate: scripts/check-docs-exports.py (gate `check-docs-exports`) — holds every row to the
# tree, so a shipped export cannot leave a phantom row and a retired row cannot claim a move
# that never happened. `--work` prints the remaining rows by tranche (the work-list view).
#
# Tranches: T1 free personal moves - T2 personal, needs a consumer patch - T3 free estate
# moves - T4 product-repo moves (positioning needs a generator refactor, not a git mv) -
# T5 estate moves needing real patches - T6 deletes.
#
# HOLD -- personal-material tranches (T1/T2) are NOT agent-executable: relocating health,
# identity, and personal-financial material between repos is the operator's decision, and
# the destination below is a recommendation, not an authorization. Rows stay filed either way.
#
# NOTE ON HISTORY: removing a file from HEAD does not purge it from limen's git history.
# These rows stop future exposure; a history rewrite is a separate, human-gated decision.

