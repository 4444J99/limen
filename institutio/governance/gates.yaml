    scoped: false
    owner: lifecycle
    note: "Outward-action deny matrix (hermetic fixture): no send/comment without a fresh, target-bound proof-of-observation receipt. Negative cases are the deliverable — a guard with only happy-path tests is the 'HARD BLOCK' hook that blocks nothing. Landed after the 2026-07-31 duplicate-recruiter-reply escape, instance 33 of the act-on-an-artifact class. Second rung added 2026-07-31: the github.comment predicate's own exit contract, where the load-bearing row is that SKIP (77) still DENIES — a predicate that returns 0 when it could not look is the advisory hook all over again. This row was `scoped: false` with no ci_job and named by verify-whole.sh nowhere, so it ran NOWHERE from the day it landed until check-runner-coverage class F found it hours later; the wiring and the predicate that forbids its recurrence landed together."
  pytest-scope-guard-test:
    command: "bash scripts/tests/pytest-scope-guard.test.sh"
    paths: ["scripts/hooks/pytest-scope-guard.sh", "scripts/tests/pytest-scope-guard.test.sh"]
