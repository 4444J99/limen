# GATES — the verification-gate registry (the parameter-panel pattern, one domain over).
#
# One declaration per gate: what runs, which paths implicate it, how expensive it is,
# whether it must serialize machine-wide. Consumers DERIVE from this file instead of
# hardcoding their own copies: scripts/verify.py (selection + execution — PR2),
# scripts/merge-policy.sh (deploy regex — PR3), scripts/verify-whole.sh (file lists — PR4),
# CLAUDE.md (points here — PR4). scripts/check-gates.py is the drift predicate; the
# `ratchets:` block below arms each consumers-derive check as that consumer converts.
#
# Deliberate non-consumers: .github/workflows/* (GitHub requires job definitions in-tree —
# the registry only CHECKS them, never generates), scripts/closeout-fast.sh (a receipt-flow,
# not a gate list), and verify-whole.sh's LIMEN_VERIFY_LIVE tail (env-gated live probes that
# need tokens/URLs — they live only in verify-whole.sh by design).
#
# Path semantics: GitHub Actions path-filter globs (`**` crosses slashes, `*` does not),
# so deploy_triggers can be set-compared byte-for-byte against deploy*.yml `on.push.paths`.
#
# Field defaults: tier: cheap · serialize: false · scoped: true. `owner` and `note` are
# required on every gate (parameters.yaml discipline). `ci_job` is set only where the CI
# mirror is GUARANTEED per-change (the job runs whenever the gate's paths change); gates
# whose CI coverage is incidental carry none — that absence is information, not an omission.

schema_version: 0.1

# Consumers-derive ratchets — armed per-PR as each consumer converts (check-gates.py
# enforces the armed ones; unarmed ones are recorded intent, like the check-params baseline).
ratchets:
  verify_scoped_wrapper: true    # ARMED (PR2): verify-scoped.sh is a thin exec of verify.py --changed
  merge_policy_derives: true     # ARMED (PR3): merge-policy.sh has no literal deploy regex
  verify_whole_derives: true     # ARMED (PR4): verify-whole.sh has no literal py_compile/bash -n lists
  claude_md_pointer: true        # ARMED (PR4): CLAUDE.md carries the pointer, not the path lists

# The instruction-surface byte budget (G1, 2026-08-06). Codex read AGENTS.md truncated at byte
# 32,768 of 44,253 — its default project_doc_max_bytes cut the file at ~line 499/731, dropping
# the Session Rituals and every Agent-Specific Note INCLUDING ITS OWN. A consumer's cap, not the
# file, decided what got read, and nothing measured it. Enforced by check S in
# scripts/check-agent-docs.py: S1 budget = min consumer default cap; S2 every surface fits the
# ceiling (shrink-only ratchet); S3 dead headroom between measured size and ceiling stays within
# slack, so the ceiling follows the file down; S4 the debt line exists exactly while a surface
# exceeds the budget, and must be removed the moment it fits (paying the debt retires the line).
instruction_surfaces:
  budget_bytes: 32768        # min consumer default cap (codex project_doc_max_bytes default)
  ceiling_bytes: 33792       # measured 32,740 B (2026-08-06, debt paid: Claude note + ritual prose stratified) + slack; shrink-only
  slack_bytes: 2048          # max dead headroom (S3) — re-measure and lower ceiling when exceeded
  surfaces:
    - AGENTS.md
  consumers:
    - name: codex
      default_bytes: 32768   # truncates SILENTLY at this cap when unconfigured
      host_bytes: 65536      # raised host-side via domus-genoma modify_ config template (2026-08-06)
    - name: claude
      default_bytes: null    # loads the whole file; no byte cap
    - name: gemini
      default_bytes: null
    - name: copilot
      default_bytes: null

# 1:1 mirror of deploy*.yml `on.push.paths` — check-gates.py enforces exact set equality.
# A merge to main touching one of these IS a live deploy. Deploy sensitivity is a property
# of PATHS, not gates: a docs PR touching firebase.json is website-sensitive even though it
# implicates only cheap gates. tasks.yaml is deliberately NOT a trigger (the board fast
# lane): the Worker serves the board live at runtime, and deploy.yml's hourly cron rebakes
# the static dashboard.json when inputs changed — a board publish is data, not a deploy.
#
# `build_source` is what the deploy job actually builds and uploads. Check J holds every
# trigger path to it: a path inside build_source needs no defence, the trigger's own workflow
# file is self-evident, and ANYTHING ELSE must carry a note saying how it reaches the deployed
# artifact.
#
# That rule exists because `cli/**` sat in the api trigger from the original buildout commit
# (26b811e7) and misclassified every cli PR as WEBSITE-SENSITIVE. Check C could never catch it:
# it compares the registry to the workflow, and the WORKFLOW was the thing that was wrong. So
# parity preserved the defect faithfully for months. A note beginning UNJUSTIFIED records a
# path that cannot defend itself — check J reports those and does not fail on them, the same
# baseline shape the rest of this estate uses. Two of them are not the same finding as none.
#
# `arming` is the OTHER half of the same question. Check J asks whether a path reaches the
# built artifact; arming asks whether the job can ship that artifact AT ALL. A rail whose
# every effect-bearing step is conditioned on a secret that does not exist deploys nothing —
# it runs, prints a skip notice, and goes green. Classification is `path matches AND rail is
# armed`, because the guardrail's real question was never "does this glob match" but "will
# merging change what is served". Absent an `arming` block a trigger is ARMED: the default
# must over-protect. Dormancy is declared here and PROVEN by check-gates K — never inferred
# at merge time, so the merge decision stays deterministic and offline.
deploy_triggers:
  dashboard:
    workflow: .github/workflows/deploy.yml
    build_source: web/app          # npm ci && npm run build, working-directory: web/app
    paths:
      - "web/app/**"
      - path: "scripts/assemble-dashboard-data.py"
        note: "runs as a step inside the deploy job (deploy.yml) to bake the static data"
      - path: "firebase.json"
        note: "configures the hosting artifact the job publishes"
      - ".github/workflows/deploy.yml"
  api:
    workflow: .github/workflows/deploy-api.yml
    build_source: web/api          # gcloud run deploy --source web/api
    arming:
      state: dormant
      secret: GCP_SA_KEY           # allow-secret: the NAME of the secret, never a value
      var: GCP_SA_KEY_SET          # job env: ${{ secrets.GCP_SA_KEY != '' }}
      ungated_steps:
        - step: actions/checkout@v7
          note: "checks the repo out onto the runner; nothing leaves the job"
      note: >-
        The Cloud Run rail is dormant: GCP_SA_KEY exists nowhere, so EVERY effect-bearing
        step is skipped and the run reports success having deployed nothing. Observed, not
        assumed — run 31061094764 printed `GCP_SA_KEY_SET: false` from the runner's own env
        and took the "Note skipped API deploy" branch; today's other seven main runs are the
        same. This matches the charter: the live runtime API is the Cloudflare Worker.
        Check K PROVES the shape offline (every step above is gated on `var`, so no secret
        ⇒ no effect) and corroborates the STATE from the latest run's step conclusions.
        Consequence: web/api/** and cli/** stop being website-sensitive, because merging
        them cannot reach a live surface. Landing GCP_SA_KEY arms the rail — flip `state`
        to `armed` in the same change, and check K fails the PR if you forget.
    paths:
      - "web/api/**"
      - path: "cli/**"
        note: >-
          UNJUSTIFIED — recorded, not defended. Nothing under cli/ can reach the deployed
          artifact: the job runs `gcloud run deploy --source web/api`, web/api/Dockerfile
          COPYs exactly requirements.txt + main.py + limen_intake.py + limen_work_loan.py,
          and web/api/main.py imports only stdlib, PyPI, and its two siblings. It rode in
          with the original buildout (26b811e7) and misclassifies every cli PR as
          website-sensitive, making it wait on a full green rollup for a deploy that cannot
          happen. Removal must leave BOTH this file and deploy-api.yml at once (check C is
          set-equality), and pushing .github/workflows/** needs a `workflow`-scoped
          credential this fleet does not hold — the push is rejected by GitHub, not skipped.
          One `gh auth refresh -h github.com -s workflow` unblocks the one-line follow-up.
      - path: "scripts/preflight-cloud-run.sh"
        note: "runs as a step inside the deploy job (deploy-api.yml) before the Cloud Run push"
      - ".github/workflows/deploy-api.yml"
  runtime_worker:
    workflow: .github/workflows/deploy-worker.yml
    paths: []                      # workflow_dispatch only — merging never deploys the Worker
  danse:
    workflow: .github/workflows/deploy-danse.yml
    build_source: apps/danse       # wrangler pages deploy apps/danse
    paths:
      - "apps/danse/**"
      - ".github/workflows/deploy-danse.yml"

# Derived file sets — what verify-whole.sh's hardcoded py_compile and bash -n argv lines
# become (PR4). PR1 transcribes today's curated lists EXACTLY; widening py-syntax to all of
# scripts/*.py is a deliberate later ratchet-tighten, pre-flighted before landing. Every
# exclude entry must carry a note or check-gates.py fails it.
file_sets:
  py-syntax:
    include:
      - "web/api/main.py"
      - "cli/src/limen/*.py"
      - "scripts/*.py"
    exclude: []
  bash-syntax:
    include:
      - "scripts/*.sh"
      - "scripts/tests/*.sh"
      - "scripts/hooks/*.sh"
    exclude: []

gates:
  # ── the always-on floor ─────────────────────────────────────────────────────
  syntax-changed:
    kind: per_file
    per_file:
      ".py": "python3 -m py_compile {file}"
      ".sh": "bash -n {file}"
    paths: ["**"]
    owner: verify
    note: "Syntax on exactly the files touched — the floor under every push; the resolver's built-in."
  diff-hygiene:
    command: "git diff --check"
    paths: ["**"]
    owner: verify
    note: "Whitespace/conflict-marker hygiene; closes every run, scoped and whole."

  # ── whole-matrix file-set syntax (derived from file_sets above in PR4) ──────
  py-syntax-set:
    kind: file_set
    file_set: py-syntax
    command_template: "python3 -m py_compile {files}"
    scoped: false
    ci_job: "pr-gate.yml:pr-gate"
    owner: verify
    note: "Whole-matrix compile of the registered Python estate (pr-gate compiles the package subset of it on every PR)."
  bash-syntax-set:
    kind: file_set
    file_set: bash-syntax
    command_template: "bash -n {files}"
    scoped: false
    owner: verify
    note: "Whole-matrix syntax pass over the operational shell fleet."
  plist-lint:
    command: "plutil -lint container/launchd/com.user.netmeter.plist container/launchd/com.limen.overnight-watch.plist"
    paths: ["container/launchd/**"]
    scoped: false
    owner: verify
    note: "macOS-only; the whole matrix guards it behind `command -v plutil`."

  # ── organ record validators (no guaranteed CI mirror: organs/** is outside ci.yml filters) ──
  cvrsvs-seed:
    command: "python3 organs/governance/validate-seed.py --strict-graph --quiet"
    paths: ["organs/governance/**"]
    scoped: false
    owner: governance
    note: "Validates the external cvrsvs-honorvm seed when present; verify-whole passes the resolved seed path and no-ops if absent."
  consulting-records:
    command: "python3 organs/consulting/validate-consulting.py --fleet --quiet"
    paths: ["organs/consulting/**"]
    scoped: false
    owner: consulting
    note: "Sovereign Systems engagement records stay schema-clean."
  constellation-registry:
    command: "python3 organs/consulting/constellation/validate-constellation.py --quiet"
    paths: ["organs/consulting/constellation/**", "institutio/github/access.yaml"]
    owner: consulting
    note: "The constellation register's Rules #1-7 (completeness, name discipline, PII lint, cross-refs, single-org, overlay parity, access cross-check) run per-diff — previously reachable only via constellation-done.sh. access.yaml implicates it because Rule #7 cross-checks every grant against the granted person's registered project rows."
  biography-registry:
    command: "python3 scripts/check-biography.py --quiet"
    paths: ["institutio/governance/biography.yaml", "scripts/check-biography.py", "scripts/derive-epochs.py", "scripts/corpus_resolve.py"]
    owner: governance
    note: "BIOGRAPHY registry drift — schema, provenance legality (`inferred` is not a provenance), derived rows naming declared epoch_signals, and the rule a deriver may never write a meaning. Store parity only where absence is provable (LIMEN_LIFE_HOST); a CI runner with no ~/Workspace reports unverifiable, never drift. `corpus_resolve.py` is in paths because check F and the deriver both import it: renaming a resolver function crashes this gate, and without that path a scoped run went green while the gate was broken."
  artist-records:
    command: "python3 organs/artist/validate-artist.py --fleet --quiet"
    paths: ["organs/artist/**"]
    scoped: false
    owner: artist
    note: "A-MAVS-OLEVM chamber governance records stay schema-clean."
  social-records:
    command: "python3 organs/social/validate-social.py --fleet --quiet"
    paths: ["organs/social/**"]
    scoped: false
    owner: social
    note: "Koinonia relationship-posture briefs stay schema-clean."

  # ── apps (the work itself, not the fleet that keeps it) ─────────────────────
  danse-invariants:
    command: "python3 scripts/check-danse.py"
    paths: ["apps/danse/**", "scripts/check-danse.py"]
    owner: artist
    note: "The arithmetic invariants under the generative engine — the 2017 score partitions the frame, the clock is a pure f(seed, t) that returns to flat, every passage partitions its own time and never recurs, entropy lives in exactly one file, the corpus is deliverable at every shipped tier, and sound/rng.py matches engine/rng.js value for value. Python + node, ~0.2s, no GPU: deliberately the half of danse's verification ANY machine and any agent can run (the other half, apps/danse/render/browser.py --verify, asserts Apple Metal and so can never be a gate). Registered because it was unreachable: before this entry `verify.py --explain apps/danse/engine/clock.js` selected only syntax-changed and diff-hygiene, so an agent could rewrite the engine, run the repo's own push gate, get exit 0, and ship a broken piece. No ci_job — apps/** is outside ci.yml's path filters, which makes the always-on registry-driven pr-gate this gate's only CI mirror. The count is floored and split: 39 portable invariants plus a declared 3 that need a local grain bank, because this gate's first CI run reported 39 where the artist's machine reported 42 — a total that silently shrinks by environment is the one number an agent must not trust, so an absent group is now named in the output rather than subtracted in silence."

  # ── predicate regression tests (scoped where verify-scoped.sh runs them today) ──
  merge-policy-test:
    command: "bash scripts/tests/merge-policy.test.sh"
    paths: ["scripts/merge-policy.sh", "scripts/tests/merge-policy.test.sh", "institutio/governance/gates.yaml"]
    owner: merge-policy
    note: "Verdict-matrix regression for the self-merge predicate; gates.yaml is implicated because deploy_triggers feed the verdict (PR3)."
  merge-queue-contract-test:
    command: "env GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_EDITOR=true GIT_SEQUENCE_EDITOR=true VISUAL=true EDITOR=true python3 scripts/tests/merge-queue-contract.test.py && bash scripts/run-pytest-hermetic.sh cli/tests/test_pr_scan.py cli/tests/test_merge_drain.py cli/tests/test_self_heal.py cli/tests/test_tabularius.py -q"
    paths: [".github/workflows/pr-gate.yml", ".github/workflows/auto-scale.yml", ".github/workflows/operate.yml", "cli/src/limen/tabularius.py", "cli/tests/test_pr_scan.py", "cli/tests/test_merge_drain.py", "cli/tests/test_self_heal.py", "cli/tests/test_tabularius.py", "scripts/tabularius-organ.py", "scripts/setup-rulesets.py", "scripts/_pr_scan.py", "scripts/merge-policy.sh", "scripts/await-pr.sh", "scripts/merge-drain.py", "scripts/self-heal.py", "scripts/verify.py", "scripts/tests/merge-queue-contract.test.py"]
    owner: merge-policy
    note: "The queue-free proven-at-submission rail stays fail-closed: the no-bypass single-rule ruleset rejects direct main writes (a reintroduced merge_queue rule is a contract violation), board automation publishes through its exact-head PR branch, and no merge effect uses admin or a merge-method fallback. Queue removed 2026-08-06 — its serialized re-validation re-derived local proofs and its evict-to-back failure mode amplified provider incidents."
  direct-main-writer-contract:
    command: "python3 scripts/direct-main-writer-audit.py && PYTHONPATH=cli/src python3 scripts/tests/worktree-pr-receipts.test.py"
    paths: [".github/workflows/**", "scripts/**", "cli/src/**", "mcp/src/**", "web/api/**", "web/worker/src/**", "institutio/governance/direct-main-writers.yaml"]
    ci_job: "pr-gate.yml:pr-gate"
    owner: gitvs
    note: "Every executable Git push, GitHub Contents PUT, and literal default-ref seam is count-bound to a reviewed disposition; the lifecycle publisher additionally proves it refuses the actual default branch before any remote write."
  worktree-preserve-dirty-test:
    command: "bash scripts/run-pytest-hermetic.sh scripts/tests/test_worktree_preserve_dirty.py -q"
    paths: ["scripts/worktree-preserve-dirty.py", "scripts/tests/test_worktree_preserve_dirty.py"]
    owner: continuity
    note: "Dirty-worktree custody stays bounded and loss-averse: binary patches stream under hard per-item and aggregate ceilings, untracked or changing sources fail before durable writes, public evidence is sampled and digested, and unchanged content-addressed receipts are byte-idempotent."
  estate-audit-heal-test:
    command: "python3 scripts/tests/estate-audit-heal.test.py"
    paths: ["scripts/estate-audit-heal.py", "scripts/tests/estate-audit-heal.test.py"]
    owner: estate-audit-heal
    note: "Estate audit clones are invocation-owned disposable caches: failed, detection-only, no-value, and remotely pushed clones return to an absent fixed point, while any commit that fails to push remains locally retained for custody."
  estate-audit-custody-test:
    command: "bash scripts/run-pytest-hermetic.sh cli/tests/test_estate_audit_custody.py -q"
    paths: ["cli/src/limen/estate_audit_custody.py", "cli/tests/test_estate_audit_custody.py", "scripts/estate-audit-custody.py"]
    owner: lifecycle
    note: "Generated estate-audit custody dynamically covers every exact HEAD, preserves non-HEAD working payloads content-addressably, proves fresh Git and payload restoration, rejects drift and ambient Git configuration, and emits only redacted bounded receipts."
  estate-audit-paired-custody-test:
    command: "bash scripts/run-pytest-hermetic.sh cli/tests/test_estate_audit_paired_custody.py -q"
    paths: ["cli/src/limen/estate_audit_custody.py", "cli/src/limen/estate_audit_paired_custody.py", "cli/tests/test_estate_audit_custody.py", "cli/tests/test_estate_audit_paired_custody.py", "scripts/estate-audit-custody.py", "scripts/estate-audit-paired-custody.py", "institutio/governance/estate-audit-custody-targets.json", "docs/storage-evacuation-inventory-20260727.json", "docs/estate-audit-paired-custody.md"]
    owner: lifecycle
    note: "The generated-root denominator is derived from a fresh single-rail check, then the exact plan and working payload manifest are full-restored on two stable-media-bound devices under one heavy lease; stored pair records remain explicitly nonterminal until both bounded copies are reopened, and the terminal projection is path-free."
  sync-release-test:
    command: "bash scripts/tests/sync-release.test.sh"
    paths: ["scripts/sync-release.sh", "scripts/tests/sync-release.test.sh", "institutio/governance/parameters.yaml"]
    owner: continuity
    note: "The live daemon preserves only real topic branches before unpark; a mutable release override cannot reclassify, commit, or push the repository's actual default branch."
  await-pr-test:
    command: "bash scripts/tests/await-pr.test.sh"
    paths: ["scripts/await-pr.sh", "scripts/tests/await-pr.test.sh", "scripts/merge-policy.sh"]
    owner: verify
    note: "The one sanctioned PR-gate waiter stays bounded and loud: CLEARED/FAILED/TIMEOUT/REFUSED-PAUSED verdict matrix, CI-red terminal (never waited out), single-instance lock, pause-marker refusal (2026-07-15 endless-watcher incident)."
  verify-resolver-test:
    command: "bash scripts/tests/verify-resolver.test.sh"
    paths: ["scripts/verify.py", "scripts/tests/verify-resolver.test.sh", "institutio/governance/gates.yaml"]
    owner: verify
    note: "Selection-equivalence fixtures — the resolver must implicate exactly the registered gates."
  verify-parallel-test:
    command: "bash scripts/tests/verify-parallel.test.sh"
    paths: ["scripts/verify.py", "scripts/tests/verify-parallel.test.sh", "institutio/governance/gates.yaml"]
    owner: verify
    note: "Independent scoped predicates overlap within each resource tier; the cheap wave precedes admission-gated heavy work, serialize:true remains ordered, and every gate has bounded time/output plus visible receipts."
  verify-ci-hardening-test:
    command: "bash scripts/tests/verify-ci-hardening.test.sh"
    paths: ["scripts/verify.py", "scripts/tests/verify-ci-hardening.test.sh"]
    owner: verify
    note: "CI fail-closed contract (issue #1048): --require-base hard-fails an unresolvable merge-base or empty diff, PR deploy-trigger diffs escalate to the whole matrix, merge-group integration runs scoped current-base seams, and ci_job-covered gates defer only on the PR path."
  enactment-test:
    command: "bash scripts/tests/enactment-audit.test.sh"
    paths: ["scripts/enactment-audit.py", "scripts/tests/enactment-audit.test.sh"]
    owner: enactment
    note: "Declared-ON fleet flags are actually wired live, not just merged."
  enactment-wiring:
    command: "python3 scripts/enactment-audit.py --check --wiring-only"
    paths: ["scripts/enactment-audit.py"]
    scoped: false
    owner: enactment
    note: "The wiring rung (deterministic); the liveness rung reads live-host daemon state in the beat."
  armed-valve-test:
    command: "bash scripts/tests/armed-valve-audit.test.sh"
    paths: ["scripts/armed-valve-audit.py", "scripts/tests/armed-valve-audit.test.sh"]
    scoped: false
    owner: valves
    note: "Parked levers vs silently-off valves."
  armed-valve-contract:
    command: "python3 scripts/armed-valve-audit.py --check --contract --offline --stamp /dev/null"
    paths: ["scripts/armed-valve-audit.py", "spec/armed-valves.json"]
    scoped: false
    owner: valves
    note: "Registry-completeness rung (repo-deterministic); env/url liveness runs in the beat."
  ship-gate-test:
    command: "bash scripts/tests/ship-gate.test.sh"
    paths: ["scripts/ship-gate.py", "scripts/tests/ship-gate.test.sh"]
    scoped: false
    owner: ship-gate
    note: "Product-facing done requires a reachable artifact (fixture rung; live probes in the beat)."
  heal-convergence-test:
    command: "bash scripts/tests/heal-convergence.test.sh"
    paths: ["scripts/heal-convergence.py", "scripts/tests/heal-convergence.test.sh"]
