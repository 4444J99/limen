# ROOT-MANIFEST — every sanctioned top-level entry of the limen repo, DECLARED.
#
# The root is a curated surface, not a landing strip (the parameter-panel pattern — GATES/
# SENSORS/PARAMETERS/MAIL-TIERS, one domain over). scripts/check-root-manifest.py holds the
# tracked root (git ls-tree HEAD) to this registry: an undeclared entry is a red check, not a
# memory chore. Adding a root entry = adding ONE row here, with its kind, owner, and why.
#
# `grandfathered` rows are ADMITTED FAT: each carries the target home it will be rehomed to
# (or DELETE, with the receipt authority in its why). Rehoming PRs delete the row together
# with the entry — deleting the row IS the receipt — and this block only ever shrinks toward
# zero. Untracked root noise (caches, .venv, nested repos) is outside the gate: git ls-tree
# judges committed truth only; untracked bloat is owned by the board (e.g. issue #1260).

