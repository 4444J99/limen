# SCHEDULES registry — every scheduler plane the operator runs, its allotment, and the jobs declared
# against it, as DECLARED DATA (the parameter-panel pattern: GATES / SENSORS / PARAMETERS / DIURNAL,
# one domain over).
#
# Why: scheduled work now runs on at least eight planes — GitHub Actions cron (4444J99/ops, limen's
# own workflows, ops-witness), the Cloudflare scheduler ops operates, the limen local heartbeat,
# claude.ai cloud scheduled tasks, ChatGPT scheduled tasks, Grok automations, Gemini scheduled
# actions, and Jules — and no single surface said what each plane is ALLOTTED, what is SCHEDULED
# against it, where each job's receipts LAND, or whether the allotment was CONSUMED. "Nothing left
# on the floor" was unmeasurable. Measured 2026-10-23: all 13 contracted claude.ai routines were
# disabled (7 auto-off after ACCESS_DENIED since 2026-09-05, 6 bulk-disabled 2026-10-17T00:13Z)
# while cloud-routines.json still declared them enabled, and nothing in the estate could tell.
#
# What this registry is NOT: a scheduler. Per ops/OPERATIONS.md, 4444J99/ops owns shared
# schedule/admission policy and limen owns evidence aggregation. Rows here for planes another
# repository operates (ops, ops-witness, the Cloudflare scheduler) are PROJECTIONS with a
# `source_of_truth` pointer; scripts/check-schedules.py verifies them against the sibling clone
# when one is present and reports `unverifiable here, not drift` when it is not (the
# biography-registry precedent). Planes limen itself declares (its workflows, its beat sensors,
# its cloud-routines manifest) are DERIVED by the gate from their existing source files — never
# duplicated here — via `jobs_source`.
#
# Consumers:
#   scripts/check-schedules.py        pr-gate parity/drift predicate (gates.yaml: check-schedules)
#   scripts/schedule-utilization.py   beat sensor: allotment vs declared vs observed, per plane
#                                     (sensors.yaml: schedule-utilization; receipt logs/schedule-utilization.json)
#   institutio/governance/schedule-stagger-baseline.txt   shrink-only ratchet of known stagger violations
#
# plane schema:
#   provider        vendor/carrier name
#   surface         how jobs are configured: cron | launchd | ui | ui+api | api
#   owner           registry owner id (who fixes the plane's rows)
#   effector        the organ or human action that fixes a red verdict (named by the sensor)
#   allotment:
#     runs          runs per window, or null when the vendor publishes none
#     window        calendar-day | rolling-24h | per-hour | active-tasks | per-beat
#     concurrency   max simultaneous runs, or null
#     source        where the number comes from (vendor doc URL, repo path, or 'unpublished')
#     entitlement   verified | unverified | unpublished — a published plan limit is not an account balance
#   fill_policy     declared | floor | idle-by-design
#   floor           for fill_policy floor: the minimum runs (or active jobs) per window the operator wants
#   jobs_source     null, or {kind: workflows|sensors|cloud-routines, locator} — rows derived by the gate
#                   from limen's own files; or {kind: census, locator, carrier: gh-workflow|launchd,
#                   scope: residual|all, visibility?: private|public} — rows derived AT READ TIME from the
#                   git-ignored census receipt (logs/schedule-census.json, scripts/schedule-census.py).
#                   `residual` = every carrier declaration in a repository no specific plane covers
#                   (authority.owner_repo, a repository-shaped evidence locator, the workflows plane's own
#                   repository); residual gh-workflow planes partition that remainder by visibility, exactly.
#                   These rows exist only in memory and under logs/ — see the redaction convention below.
#   declared_off    (workflows planes) list of {file, since, reason}: workflow files the operator has switched
#                   off ON PURPOSE. The sensor reads GitHub's live state; a workflow that is disabled live but
#                   not declared here is `undeclared-off` (red — an off-switch nobody owns), and one declared
#                   here but active live is `declared-off-but-active` (red — the declaration rotted). A `file`
#                   that no longer exists is a rotted row (check A).
#                   (census planes) list of {match: {archived?: bool, state?: [disabled_manually|
#                   disabled_inactivity|disabled_fork]}, ceiling?: {<state>: int}, since, reason}: off-switches
#                   owned by FACT, never by name. Every off-state row the receipt holds must be matched by one
#                   rule (else `undeclared-off`); a live row whose Actions state the census could not read is
#                   `unverified` — neither on nor off, advisory only. A `ceiling` caps how many rows a rule may
#                   own per state — above it is `undeclared-growth` (a new off-switch nobody owns), below it is
#                   "lower to N" when the receipt is complete and the plane has no partial or unverified rows
#                   (an undercount is never a floor: the ratchet only falls).
#   ceilings        (census planes) {active?, on-the-hour?, shared-minute?: int ≥ 0} over the plane's ENABLED
#                   rows (live `active` state, non-archived). Above a ceiling = red (`undeclared-growth` for
#                   active, `stagger-regressed` for the other two); below = the sensor's exit 3 "lower to N".
#                   `active` may be raised deliberately; on-the-hour and shared-minute may only fall (check J —
#                   the fleet's share of the ops house rule, ratcheted like schedule-stagger-baseline.txt).
#                   shared-minute is counted per repository (two repositories firing at :17 is no collision).
#   authority       (projected planes) {owner_repo, upstream_state: proposed|synced, note}: which repository
#                   owns these rows and whether that owner has adopted this projection. `proposed` means limen
#                   holds a verified mirror the owner has not yet ratified; the sibling-parity check keeps it
#                   honest either way, and the field exists so the mirror can never silently become authority.
#   evidence        {kind, locator, note}: what the utilization sensor reads. kind ∈
#                   gh-actions-runs | bookend-tsv | witness-audit | voice-stamps | claude-snapshot |
#                   board-dispatch-receipts | issue-comments | census-receipt | launchctl | none
#                   census-receipt: job-matched — an enabled residual workflow is observed when the receipt's
#                   scheduled-run summary shows it succeeded within 2× its interval + 1.5d of generated_at;
#                   partial rows count toward neither side; an ambiguous display-name join is unmeasured per
#                   job. No receipt on this host = unmeasured `not_this_host` (never red, never stale: CI and
#                   worktrees are not where the census runs); a receipt older than
#                   LIMEN_SCHEDULE_CENSUS_MAX_AGE_DAYS, incomplete, or of another schema = stale readback.
#                   launchctl: one read-only `launchctl list`; observed = declared Labels loaded with last
#                   exit status 0; no launchctl binary = `not_this_host`.
#   declared_on     ISO date the plane entered this registry; a plane with evidence kind `none` reads as a
#                   stale readback once LIMEN_SCHEDULE_READBACK_MAX_AGE_DAYS have passed since this date
#   enabled         false = plane declared but deliberately not audited (reason in note)
#
# Redaction convention for census-derived planes (normative; scripts/check-schedules.py check H):
#   R1  No committed line names a repository that is not already a disclosed projection token (a plane's
#       authority.owner_repo, or a declared job id on a plane that carries `authority`). Fleet membership is
#       a FACT SELECTOR (carrier, scope, visibility, archived, live state) resolved at read time against the
#       git-ignored receipt; derived ids fleet/<owner>/<repo>/<stem> exist only in memory and in the
#       git-ignored ledgers under logs/.
#   R2  Sensor and gate output for census planes is counts-only (per plane, per cron slot) — never ids.
#   R3  If a committed line ever MUST point at one private repository (none today), it uses
#       ref:h16:<16 hex of HMAC-SHA256(key, "owner/name")> with the key hydrated by creds-hydrate (file
#       sink, 0600); plain sha256 is forbidden (private names are guessable). Key absent = unmeasured.
#   R4  An authored per-repository reason (none today) lives in private custody, never in this file;
#       absent = unverifiable, never empty.
#
# job schema (declared rows only — derived planes carry none):
#   id              <plane-short>/<job>, unique
#   plane           a key of `planes`
#   cron            5-field cron string, or a list of them (one job, several fire times)
#   tz              IANA zone the cron is written in (UTC for GitHub/Cloudflare; vendor UIs use local)
#   delivery        {kind, locator}: where a run's receipt lands
#   class           report | keepalive | witness | dispatch | landing | ingest | unknown
#   allotment       optional per-job cap (e.g. Cloudflare maxInvocationsPerDay)
#   source_of_truth repo:path that actually configures the job
#   enabled         true/false as configured at the source
#   note            free text

schema_version: 0.1

# The ops house rule: never schedule a GitHub cron on the hour, and no two workflows in one repo
# share a minute. Applies to planes with provider github; violations that predate this registry
# live in schedule-stagger-baseline.txt and the gate only ever lets that file shrink.
house_offsets: [11, 17, 23, 36, 49]

planes:

  github-actions-limen:
    provider: github
    surface: cron
    owner: fleet
    effector: "the workflow's owner — fix or disable the workflow; keepalive-style re-enable belongs to ops"
    allotment: {runs: null, window: calendar-day, concurrency: null, source: "Actions minutes are a cost, not a run cap", entitlement: unpublished}
    fill_policy: declared
    floor: null
    jobs_source: {kind: workflows, locator: .github/workflows}
    declared_off:
      - {file: auto-scale.yml, since: "2026-08-25 (per the 2026-10-23 inventory read of workflow state)", reason: "disabled_manually; reason unrecorded in this repo — declared here so the off-state is owned, not silent (fleet)"}
      - {file: conductor-report.yml, since: "2026-08-25 (per the 2026-10-23 inventory read of workflow state)", reason: "disabled_manually; reason unrecorded — declared so the off-state is owned (fleet)"}
      - {file: deploy-danse.yml, since: "unknown (read 2026-10-23)", reason: "disabled_manually; canonical Danse deploy rail parked — declared so the off-state is owned (danse)"}
      - {file: deploy.yml, since: "unknown (read 2026-10-23)", reason: "disabled_manually; dashboard deploy rail parked (Cloudflare Pages via deploy.yml) — declared so the off-state is owned (fleet)"}
    evidence: {kind: gh-actions-runs, locator: "4444J99/limen", note: "successful scheduled-event runs today per ACTIVE cron workflow, via gh run list; live workflow state is read and reconciled against declared_off"}
    declared_on: 2026-10-23
    enabled: true

  github-actions-ops:
    authority: {owner_repo: "4444J99/ops", upstream_state: proposed, note: "limen holds a sibling-parity-verified mirror of rows that 4444J99/ops configures; the owner has not adopted this registry. A mirror is evidence aggregation (OPERATIONS.md), never a second scheduler: nothing here can start, retry or deploy a run."}
    provider: github
    surface: cron
    owner: governance
    effector: "4444J99/ops keepalive.yml re-enables auto-disabled workflows; a missing bookend is ops#6's incident class"
    allotment: {runs: null, window: calendar-day, concurrency: null, source: "4444J99/ops README (plane i)", entitlement: unpublished}
    fill_policy: declared
    floor: null
    jobs_source: null
    evidence: {kind: bookend-tsv, locator: "4444J99/ops:bookends", note: "start/end pairs in bookends/<day>.tsv; read from the sibling clone when present, else gh api contents"}
    declared_on: 2026-10-23
    enabled: true

  github-actions-ops-witness:
    authority: {owner_repo: "4444J99/ops-witness", upstream_state: proposed, note: "limen holds a sibling-parity-verified mirror of rows that 4444J99/ops-witness configures; the owner has not adopted this registry. A mirror is evidence aggregation (OPERATIONS.md), never a second scheduler: nothing here can start, retry or deploy a run."}
    provider: github
    surface: cron
    owner: governance
    effector: "4444J99/ops-witness keepalive.yml; witness gaps are reported, never retried"
    allotment: {runs: null, window: calendar-day, concurrency: null, source: "4444J99/ops-witness README", entitlement: unpublished}
    fill_policy: declared
    floor: null
    jobs_source: null
    evidence: {kind: gh-actions-runs, locator: "4444J99/ops-witness", note: "scheduled-event runs today per workflow"}
    declared_on: 2026-10-23
    enabled: true

  cloudflare-ops-scheduler:
    authority: {owner_repo: "4444J99/ops", upstream_state: proposed, note: "limen holds a sibling-parity-verified mirror of rows that 4444J99/ops configures; the owner has not adopted this registry. A mirror is evidence aggregation (OPERATIONS.md), never a second scheduler: nothing here can start, retry or deploy a run."}
    provider: cloudflare
    surface: cron
    owner: governance
    effector: "4444J99/ops cloudflare/ owner release path (ops#6); limen never deploys or retries product work"
    allotment: {runs: 2000, window: calendar-day, concurrency: 4, source: "4444J99/ops:cloudflare/IMPLEMENTATION.md — 2,000/day fleet attempt allowance, at most four runs in flight", entitlement: verified}
    fill_policy: declared
    floor: null
    jobs_source: null
    evidence: {kind: witness-audit, locator: "4444J99/ops-witness:audit", note: "newest audit/*-witness.md, last-7-day bookend pairing per target (weekly; stale beyond 8 days)"}
    declared_on: 2026-10-23
    enabled: true

  # ── the undeclared fleet: every Actions cron the 2026-10-23 universe census found outside the planes above ──
  # Census 2026-10-23T23:53Z over 267 repositories (267 scanned, 1 partial, 0 unreachable): 217 cron workflows
  # fleet-wide, 206 of them in 73 repositories outside every specific plane (164 active-or-unknown in the 67
  # repositories the census lists as registry gaps), 118 live-active — 82 of those the two org templates
  # (49 stale.yml, 33 codeql.yml) stacked on Monday 06:00 and 09:00 UTC — and 112 of 182 observed workflows
  # failing their last scheduled run (82 in private repositories after 2026-10-08: consistent with, not
  # proven by, L-GITHUB-ACTIONS-BILLING). Nothing declared them; nothing measured them. These three planes own that
  # remainder by FACT (visibility, archived, live state) so that no repository is named here (R1), and the
  # ceilings pin the 2026-10-23 counts so growth is red and shrinkage is a number to lower.

  github-actions-fleet-private:
    provider: github
    surface: cron
    owner: fleet
    effector: "refused runs → L-GITHUB-ACTIONS-BILLING (human; the private/public split is consistent with, not proof of, the billing cause); otherwise the owning repository fixes, retires or disables the workflow as a receipt-backed reap (mass template retirement → L-FLEET-TEMPLATE-RETIRE); agents never re-enable a schedule or write to a member repository"
    allotment: {runs: null, window: calendar-day, concurrency: null, source: "GitHub Actions minutes for private repositories draw the 4444J99 account's included minutes and spending limit — a cost pool, not a run cap", entitlement: unpublished}
    fill_policy: declared
    floor: null
    # RESIDUAL by construction: every gh-workflow cron in a PRIVATE census repository that no specific plane covers.
    jobs_source: {kind: census, locator: logs/schedule-census.json, carrier: gh-workflow, scope: residual, visibility: private}
    declared_off:
      - {match: {archived: true}, since: "per repository archive (archived_at is not in the receipt)", reason: "GitHub runs no schedule in an archived repository; archiving IS the owned off-switch. Census 2026-10-23T23:53Z: 10 repositories, 66 cron workflows (41 active-state, 20 disabled_manually, 5 state unknown)"}
      - {match: {archived: false, state: [disabled_manually, disabled_inactivity]}, ceiling: {disabled_manually: 17, disabled_inactivity: 1}, since: "census 2026-10-23T23:53Z", reason: "pre-registry live-repository off-switches, owned as a count; each leaves by reap (on.schedule removed in-tree) or owner re-enable, and the ceiling is lowered with it"}
    # census 2026-10-23T23:53Z; live, non-archived, residual; shared-minute per repository; on-the-hour / shared-minute never rise (check J)
    ceilings: {active: 77, on-the-hour: 67, shared-minute: 62}
    evidence: {kind: census-receipt, locator: logs/schedule-census.json, note: "job-matched against the receipt's scheduled-run summary (see the evidence-kind doc above). 2026-10-23: 77 declared, 6 observed — the private half is dark"}
    declared_on: 2026-10-24
    enabled: true

  github-actions-fleet-public:
    provider: github
    surface: cron
    owner: fleet
    effector: "the owning repository fixes, retires or disables the workflow (receipt-backed reap); template retirement → L-FLEET-TEMPLATE-RETIRE; agents never re-enable a schedule or write to a member repository"
    allotment: {runs: null, window: calendar-day, concurrency: null, source: "GitHub Actions minutes are free for public repositories on standard runners — no run cap published", entitlement: unpublished}
    fill_policy: declared
    floor: null
    jobs_source: {kind: census, locator: logs/schedule-census.json, carrier: gh-workflow, scope: residual, visibility: public}
    declared_off:
      - {match: {archived: true}, since: "per repository archive (archived_at is not in the receipt)", reason: "GitHub runs no schedule in an archived repository; archiving IS the owned off-switch. Census 2026-10-23T23:53Z: no archived public residual repository yet — the rule exists so the first one is owned, not undeclared"}
      - {match: {archived: false, state: [disabled_manually, disabled_inactivity]}, ceiling: {disabled_manually: 4, disabled_inactivity: 0}, since: "census 2026-10-23T23:53Z", reason: "pre-registry live-repository off-switches, owned as a count; shrinks by reap or owner re-enable"}
    # census 2026-10-23T23:53Z; same semantics as github-actions-fleet-private
    ceilings: {active: 41, on-the-hour: 40, shared-minute: 35}
    evidence: {kind: census-receipt, locator: logs/schedule-census.json, note: "same reader and rules as github-actions-fleet-private. 2026-10-23: 41 declared, 39 observed — the public control for the private plane's refusals"}
    declared_on: 2026-10-24
    enabled: true

  launchd-host:
    provider: apple
    surface: launchd
    owner: fleet
    effector: "the operator loads a plist on the host it was written for, or the owning repository removes it from git (receipt-backed reap); agents never bootstrap a LaunchAgent"
    allotment: {runs: null, window: calendar-day, concurrency: null, source: "launchd publishes no run cap; StartInterval / StartCalendarInterval fires are the declared work", entitlement: unpublished}
    fill_policy: declared
    floor: null
    # one job per distinct plist Label (fallback: the file stem), deduplicated across repositories. Census 2026-10-23T23:53Z:
    # 19 plists → 15 distinct FILE STEMS — that receipt predates Label capture, so 15 is a stem count; the next census records
    # Labels (Label == stem for limen's own three plists), and the ceiling is re-pinned if the count moves. limen-beat's own
    # heartbeat stays on limen-beat.
    jobs_source: {kind: census, locator: logs/schedule-census.json, carrier: launchd, scope: all}
    ceilings: {active: 15}
    evidence: {kind: launchctl, locator: "launchctl list", note: "one read-only `launchctl list`: observed = declared Labels loaded with last exit status 0; no launchctl binary (Linux, CI) or no receipt = unmeasured not_this_host"}
    declared_on: 2026-10-24
    enabled: true

  limen-beat:
    provider: limen
    surface: launchd
    owner: tabularius
    effector: "scripts/heartbeat-loop.sh (launchd com.limen.heartbeat); a never-stamped cadence sensor is beat-sensors.py --canary's finding"
    allotment: {runs: null, window: per-beat, concurrency: 1, source: "institutio/governance/sensors.yaml cadence blocks (BEATS between due-checks; worst-case wall-clock = cadence × LIMEN_LOOP_MAX, 1,800s default, so cadence 48 = daily); per-lane dispatch caps derive from cli/src/limen/capacity.py, never pinned here", entitlement: verified}
    fill_policy: declared
    floor: null
    jobs_source: {kind: sensors, locator: institutio/governance/sensors.yaml}
    evidence: {kind: voice-stamps, locator: logs/.voice, note: "one stamp per visited cadence sensor; absent directory = unmeasured (CI, worktree)"}
    declared_on: 2026-10-23
    enabled: true

  claude-cloud:
    provider: anthropic
    surface: ui+api
    owner: governance
    effector: "the operator re-enables at claude.ai/code/routines (spends subscription usage — human atom); delivery gaps are routine-freshness-audit's; cloud-routines.json is the contract"
    allotment: {runs: 100, window: per-hour, concurrency: null, source: "https://code.claude.com/docs/en/routines — 100 scheduled runs/hour/account, min interval 1h, draws down subscription usage; no daily cap stated", entitlement: verified}
    fill_policy: floor
    floor: 13
    jobs_source: {kind: cloud-routines, locator: cloud-routines.json}
    evidence: {kind: claude-snapshot, locator: "docs/receipts/claude-triggers-snapshot-*.json", note: "list_triggers is in-session-only (RemoteTrigger), so an interactive session exports a dated snapshot receipt; the sensor reads the newest and reports its age; beyond LIMEN_SCHEDULE_SNAPSHOT_MAX_AGE_DAYS the plane is unmeasured"}
    declared_on: 2026-10-23
    enabled: true

  chatgpt-scheduled-tasks:
    provider: openai
    surface: ui
    owner: governance
    effector: "the operator edits tasks in the ChatGPT app (UI-only, no API); receipts land on 4444J99/limen#2680 per the 2026-09-20 configuration"
    allotment: {runs: 15, window: active-tasks, concurrency: null, source: "secondary reporting Sept 2026 (help-center page not retrievable): Pro = 15 active tasks; paused tasks do not count", entitlement: unverified}
    fill_policy: declared
    floor: null
    jobs_source: null
    evidence: {kind: issue-comments, locator: "4444J99/limen#2680", note: "any comment today = delivered; native telemetry goes to a private destination, so this undercounts"}
    declared_on: 2026-10-23
    enabled: true

  grok-automations:
    provider: xai
    surface: ui
    owner: governance
    effector: "the operator declares each automation here with a delivery locator (e.g. a Gmail label or a GitHub issue) — until then the plane is unmeasured by construction"
    allotment: {runs: null, window: active-tasks, concurrency: null, source: "unpublished — no xAI document found 2026-10-23; usage draws from a weekly compute pool", entitlement: unpublished}
    fill_policy: declared
    floor: null
    jobs_source: null
    evidence: {kind: none, locator: null, note: "no receipt path exists anywhere in the estate; ~/.grokbot residue only (docs/plans/2026-10-17-unify-contain-agent-surfaces-v2.md)"}
    declared_on: 2026-10-23
    enabled: true

  gemini-scheduled-actions:
    provider: google
    surface: ui
    owner: governance
    effector: "the operator declares each scheduled action here with a delivery locator; L-FLEET-CAPACITY (dead Gemini API key, limen#265) blocks any API-side evidence"
    allotment: {runs: 10, window: active-tasks, concurrency: null, source: "secondary reporting of Google's Gemini limits page: 10 active actions at a time (AI Pro / Ultra)", entitlement: unverified}
    fill_policy: declared
    floor: null
    jobs_source: null
    evidence: {kind: none, locator: null, note: "the 2026-09-17 Gemini artifact proposed 08:00/10:30/14:30/19:00 America/New_York windows — proposals, not receipts (limen#2680)"}
    declared_on: 2026-10-23
    enabled: true

  jules:
    provider: google
    surface: ui+api
    owner: arms-agents
    effector: "jules-quota / jules-supply / lane-throughput gauges; dispatch valve L-FLEET-DISPATCH; landing via jules-land + owner-route-drain; REST transport unarmed until LIMEN_ENABLE_JULES_API=1 under limen#2680"
    allotment: {runs: 100, window: rolling-24h, concurrency: 15, source: "https://jules.google/docs/usage-limits — Pro: 100 daily tasks (rolling 24 hours), 15 concurrent; Ultra: 300/60", entitlement: unverified}
    fill_policy: floor
    floor: 25
    jobs_source: null
    evidence: {kind: board-dispatch-receipts, locator: tasks.yaml, note: "dispatch_log rows agent=jules status=dispatched in the last rolling 24h — this broker's launches only, never vendor remaining quota; competing callers (ChatGPT steward routine, Jules native scheduled tasks, CLI/manual, GitHub label webhook) are reconciled by limen#2680, not here"}
    declared_on: 2026-10-23
    enabled: true

  jules-native-scheduled-tasks:
    provider: google
    surface: ui
    owner: governance
    effector: "the operator posts one readback (Jules > Scheduled tab: each task, cadence, time zone, destination) and declares the rows here with a delivery locator; no list/edit API exists (delete + recreate only)"
    allotment:
      runs: null
      window: active-tasks
      concurrency: null
      source: "shares the jules plane's rolling-24h task allotment (https://jules.google/docs/usage-limits); native scheduled tasks are one of its competing callers, reconciled by limen#2680"
      entitlement: unverified
    fill_policy: declared
    floor: null
    jobs_source: null
    evidence:
      kind: none
      locator: null
      note: "the jules plane's board-dispatch-receipts count this broker's launches only and say nothing about which native scheduled tasks exist — that is what the readback (L-SCHED-READBACKS) establishes"
    declared_on: 2026-10-23
    enabled: true

jobs:

  # ── plane (i): 4444J99/ops — source of truth is that repo's workflow files ──────────────────
  - id: ops/org-hygiene-report
    plane: github-actions-ops
    cron: "36 13 * * *"
    tz: UTC
    delivery: {kind: bookend-tsv, locator: "4444J99/ops:bookends/<day>.tsv"}
    class: report
    source_of_truth: "4444J99/ops:.github/workflows/org-hygiene-report.yml"
    declared_on: 2026-10-23
    enabled: true
    note: "daily org hygiene report; the only job that writes ops bookends today"
  - id: ops/keepalive
    plane: github-actions-ops
    cron: "23 5 * * 1"
    tz: UTC
    delivery: {kind: commit, locator: "4444J99/ops:.keepalive"}
    class: keepalive
    source_of_truth: "4444J99/ops:.github/workflows/keepalive.yml"
    declared_on: 2026-10-23
    enabled: true
    note: "dead-man's-switch reset: touches .keepalive and re-enables inactivity-disabled workflows"

  # ── the witness: 4444J99/ops-witness ───────────────────────────────────────────────────────
  - id: ops-witness/weekly-witness
    plane: github-actions-ops-witness
    cron: "49 12 * * 0"
