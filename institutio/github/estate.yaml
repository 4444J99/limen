# ── SAUCE VERDICTS (Phase 4, custody v4.0.0 — a derivation law, never a second hand list) ───
# Every repo carries exactly one sauce verdict, DERIVED from adjudicated registry data:
#   PRIVATE — census-private (the core stays dark). Enforced by class G + the publish
#             triple-gate (double-dark env + released lever + fresh publish-sweep receipt).
#   SPLIT   — a registered form/operation pair held history-disjoint by check-split-hygiene
#             P1–P5. Adjudicated NOT-split 2026-07-30: vox ═ vox--publica (P1 clean —
#             independent siblings; P3 manifest and P5 pairing never claimed).
#   GUARD   — public with crown-jewel patterns registered in moat-guard.json; moat-audit
#             (beat-wired, fail-closed) greps every reachable blob.
#   CLEAN   — public, not GUARD, not a SPLIT twin: the published form IS the product.
# Platform law the verdicts respect: GitHub cannot disable forking of a public repo —
# visibility and the split protocol are the only sauce levers.
sauce_policy:
  provenance: "Phase 4 2026-07-30 — verdicts derive from class + moat-guard rows + split registrations (the never-a-second-list law)"
  derivation: {private_classes: [vault_private, operation_private, private_unreviewed, conductor], guard_registry: moat-guard.json, split_predicate: scripts/check-split-hygiene.py}
  owner: gitvs
  note: "Enforcement is the composition of shipped predicates: class G + publish triple-gate (PRIVATE), moat-audit (GUARD), check-split-hygiene (SPLIT). Coverage expansion = adding moat-guard rows or split registrations — never editing this block."

# ── AUDIENCE (2026-07-30, decision 4 — the middle tier the estate enforced without naming) ───
# Every surface faces the world, an invited collaborator, or nobody. The estate already ENFORCED
# the middle tier in one place — moat-audit's "a partner's eyes make the tree exposed", which
# applies a zero-Actions-secrets rule to granted repos that world-public repos never face — but
# had no word for it, so `operation_private` covers both a zero-collaborator engine repo and a
# partner's shared lane with the same value.
#
# DERIVED, never stored. A third copy of a fact `classes[].visibility` and access.yaml already
# carry would rot on contact (this very file proves the failure mode: sauce_policy.private_classes
# lists `conductor`, whose class visibility is `public`). So:
#     world  = the class says public          "me and the world"
#     collab = private AND >=1 access.yaml grant row     "me and collab"
#     self   = private, nobody invited        the engine-room default
#
# `audience:` appears on a repo_overrides row ONLY as declared INTENT where intent and derivation
# disagree — the same shape as the `publish_candidate:` flag beside it. It is not a column on the
# classes and not a row on all 144 overrides.
#
# PRECEDENCE, once: observed GitHub state > per-repo judgment row > constellation-register hint.
# The register SUGGESTS a lane and never decides. That restraint is load-bearing: a wrong stream
# row is regenerable prose, but a wrong audience row is access posture — drop a project from the
# register, the derived `collab` vanishes, the repo derives `self`, and a deliberate grant reads as
# "undeclared exposure" whose machine-runnable direction (L-PARTNER-GRANTS) is REMOVAL. An
# editorial edit to a people file must never stage revocation of a partner's access to their work.
#
# `world` is "public, SOLO" — so public+granted is a FOURTH state the enum cannot express. It is
# an owed decision, never drift, and never a demand to flip a traction repo private.
audience_policy:
  provenance: "2026-07-30 decision 4 (PORTVS/ASTRA plan, PR #1682) — the content half is publication-policy.py's 3-column matrix"
  derivation: {public_class: world, private_with_grant: collab, private_no_grant: self, source_of_grants: access.yaml}
  declared_key: "repo_overrides.<repo>.audience — intent only, where it disagrees with the derivation"
  precedence: [observed_github_state, per_repo_judgment_row, constellation_register_hint]
  owner: gitvs
  predicate: scripts/check-audience.py
  note: "Coverage expansion = declaring intent on the rows that need it or landing an access.yaml grant — never editing this block."

# ── POSITIONING ESTATE CLASSIFICATION (PSP-P02-W02 preflight) ───────────────────────────────
# This is deliberately a policy, not a second public repository inventory. The verifier reads the
# live owner/org census and returns only aggregate public-safe counts; private repository names and
# metadata remain in GitHub and the arca-sealed private overlay. Rule order is the primary-class
# precedence, so every live record has one, and only one, role.
positioning_estate_classification:
  schema_version: limen.positioning_estate_classification.v1
  owner: positioning-program
  census_receipt: docs/receipts/psp-p02-w01-estate-census-preflight-20260810.json
  expected_denominator: {repositories: 314, public: 235, private: 79, organizations: 10}
  primary_classes: [infrastructure, proof, experiments, products, archives, private_operations, partner_work]
  primary_order:
    - {class: partner_work, when: {audience: collab}}
    - {class: archives, when: {archived: true}}
    - {class: infrastructure, when: {governance_classes: [conductor]}}
    - {class: proof, when: {governance_classes: [portal_public]}}
    - {class: products, when: {product_ledger: true}}
    - {class: private_operations, when: {visibility: private}}
    - {class: experiments, when: {fallback: true}}
  maturity:
    active_within_days: 90
    maintained_within_days: 365
    values: [active, maintained, dormant, archived, unvalidated]
  visibility_dispositions: [public_evidence, public_partner, private_internal, private_partner]
  public_relevance:
    infrastructure: technical_diligence
    proof: front_door_proof
    experiments: public_reference
    products: product_diligence
    archives: historical_reference
    private_operations: private_only
    partner_work: partner_scoped
  uncertainty_queue:
    owner: PSP-P02-W02
    records: opaque live-census identifiers only; public reports aggregate by missing evidence
    evidence_needed:
      role: repository purpose or product-ledger decision
      maturity: a usable pushed_at timestamp or explicit archive decision
      public_relevance: partner/collaboration disposition or public proof selection
  predicate: python3 scripts/estate-classification.py --verify --base codex/psp-p02-w01-estate-census-preflight
  rollback: Restore the preceding policy only with a newer live census receipt; do not publish a private record while rolling back.
  note: "The public registry carries rules and aggregates only. A live verifier may inspect private metadata, but rejects any private repository name newly added to the reviewed public diff."

# ── LICENSE POSTURE (Phase 4 — the doctrine gap the 2026-07-29 excavation named, now owned) ─
license_policy:
  provenance: "Phase 4 2026-07-30 — first written license doctrine for the estate"
  default: all-rights-reserved
  by_surface:
    shelf_public: "no LICENSE by default — the published FORM, all rights reserved; a per-repo grant is a judgment-row fact"
    portal_public: "permissive only where the README already claims it (a-i-chat--exporter ships MIT — grandfathered); new grants are per-repo judgment rows"
    engine_room: "no LICENSE — the machine is not offered"
    partner_estate: "per-venture decision at the partner table, never a default"
  owner: gitvs
  note: "License governs reuse rights, not the fork button (allow_forking binds private repos only). Changing a repo's license = a judgment row + a LICENSE commit in that repo — never a blanket sweep."

# ── per-repo-CLASS governance posture ────────────────────────────────────────────────────────
# The desired-state of the `repo` / `branch_protection` types, bucketed by owner/repo glob. `required_checks`
# names real .github/workflows job ids (the parity predicate asserts each names a real job — a dead
# reference is a red check, not a silent typo). First-match-wins; put the most specific class first.
classes:
  conductor:
    match: ["organvm/limen"]
    visibility: public                     # 2026-07-22 owner decision: conductor stays public (free-tier CI dependency; resolves the observed-public drift); supersedes the 2026-07-16 private flip
    branch_protection: required
    required_checks: ["pr-gate", "python", "web", "worker"]
    app_installed: required
    secret_hygiene: enforced
    stale_branch_grace_min: 60             # reuses the reap-branches grace default
    archive_policy: never
    seo: {description: required, topics_min: 5, homepage: required, readme: portal}
    owner: gitvs
    note: "The live daemon body: strictest posture. required_checks mirror the ci.yml / pr-gate.yml job ids."
  contrib_fork:
    match: ["**"]
    match_facts: {fork: true}
    visibility: any                        # forks mirror upstream; G-exempt
    branch_protection: exempt
    required_checks: []
    app_installed: optional
    secret_hygiene: enforced
    stale_branch_grace_min: null
    archive_policy: reap_after_stale
    owner: gitvs
    note: "Contribution/symbiote staging forks (contrib--*). No SEO demand — the lure is the upstream PR, not the fork."
  frozen:
    match: ["**"]
    match_facts: {archived: true}
    visibility: any                        # live-archived repos keep whatever visibility they froze with; G-exempt
    branch_protection: exempt
    required_checks: []
    app_installed: optional
    secret_hygiene: enforced
    stale_branch_grace_min: null
    archive_policy: frozen
    owner: gitvs
    note: "GitHub-archived (fact-matched, not name-matched). Read-only; a leaked secret is STILL a red predicate."
  vault_private:
    match: []                              # membership ONLY via repo_overrides — never name-guessable
    visibility: private
    branch_protection: exempt
    required_checks: []                    # private-repo Actions are billed; CI posture is per-repo judgment
    app_installed: optional
    secret_hygiene: enforced
    stale_branch_grace_min: null
    archive_policy: never
    publish_eligible: never
    owner: gitvs
    note: "Actual private data (vaults, matters, people, raw session corpora). Never publishes; never a form twin."
  operation_private:
    match: []                              # membership ONLY via repo_overrides
    visibility: private
    branch_protection: required
    required_checks: []                    # private-repo Actions are billed; CI posture is per-repo judgment
    app_installed: required
    secret_hygiene: enforced
    stale_branch_grace_min: 1440
    archive_policy: never
    publish_eligible: form_twin
    owner: gitvs
    note: "Secret sauce — the OPERATION half of publish-the-form. A public FORM twin may exist (split: rows); the operation itself stays the moat."
  portal_public:
    match: ["4444J99/**"]                  # the profile repo + personal surface; organvm portal repos join via repo_overrides
    visibility: public
    branch_protection: required
    required_checks: ["pr-gate"]
    app_installed: required
    secret_hygiene: enforced
    stale_branch_grace_min: 1440
    archive_policy: never
    seo: {description: required, topics_min: 5, homepage: required, readme: portal}
    owner: gitvs
    note: "The SEO lure tier (value repos ∪ positioning-seeded ∪ star leaders): full portal-v1 README standard + rich metadata; every repo an inbound edge."
  private_unreviewed:
    match: ["**"]
    match_facts: {private: true}
    visibility: private                    # safe holding posture — matches current state, ZERO flip demand
    branch_protection: exempt
    required_checks: []
    app_installed: optional
    secret_hygiene: enforced
    stale_branch_grace_min: null
    archive_policy: never
    owner: gitvs
    note: "Private repos pending publication judgment — the safe default (a private repo never flips by omission). The doctor cites the count as owed judgment; classify proposals + override rows migrate repos to vault_private / operation_private / the publish wave."
  shelf_public:
    match: ["organvm-*/**", "meta-organvm/**"]
    visibility: public
    branch_protection: exempt
    required_checks: []
    app_installed: optional
    secret_hygiene: enforced
    stale_branch_grace_min: 1440
    archive_policy: reap_after_stale
    seo: {description: required, topics_min: 0, homepage: optional, readme: minimal}
    owner: gitvs
    note: "Shelf-org default (custody v4.0.0 Phase 2): the advertised shelves carry the PUBLIC form; private shelf residents carry explicit judgment rows, which outrank this glob. Placement itself is class P (shelf_assignments) — this class carries only posture. App optional until L-LIMENBOT-INSTALL expands installs."
  governed_public:
    match: ["organvm/**"]
    visibility: public
    branch_protection: required
    required_checks: ["pr-gate"]           # the always-on floor; empty-CI repos are exempt (setup-rulesets detects)
    app_installed: required
    secret_hygiene: enforced
    stale_branch_grace_min: 1440
    archive_policy: reap_after_stale
    seo: {description: required, topics_min: 3, homepage: optional, readme: minimal}
    owner: gitvs
    note: "The public long-tail floor: App installed; branch protected on CI, not on human review (blanket review is lever #257). Private repos no longer fall here — overrides + fact classes above outrank this glob (the class-G latent-flip bug is defused by data, not code)."
  archived:
    match: ["**"]                          # catch-all floor
    visibility: any
    branch_protection: exempt
    required_checks: []
    app_installed: optional
    secret_hygiene: enforced
    stale_branch_grace_min: null
    archive_policy: frozen
    owner: gitvs
    note: "Read-only tail: no protection expected, but a leaked secret is STILL a red predicate."

