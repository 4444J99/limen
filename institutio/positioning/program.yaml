phases:
  - id: PSP-P00
    title: Program control plane
    outcome: One validated source graph projects a complete, non-duplicative, cross-agent issue system.
    depends_on: []
    exit_gate: All P00 leaves close and remote parity reports zero missing, duplicate, or orphan markers.
    work:
      - id: PSP-P00-W01
        title: Commit the canonical alpha-to-omega program manifest
        outcome: Strategy, phases, dependencies, gates, targets, predicates, and return paths have one tracked owner.
        target_repo: organvm/limen
        target_paths: [institutio/positioning/program.yaml]
        capabilities: [architecture, documentation]
        reasoning: deep
        effect: write
        depends_on: []
        external_dependencies: []
        human_gates: []
        deliverables: [Validated program manifest with stable IDs and no private source paths]
        acceptance: python3 scripts/positioning-program.py --check
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P00-W01
        rollback: Revert the program PR; existing issues remain inert and recoverable by their stable markers.
        return_evidence: [Merged commit and validator output]
      - id: PSP-P00-W02
        title: Build structural validation and dependency-cycle detection
        outcome: Malformed fields, unknown references, duplicate IDs, cycles, and unsafe model pinning fail closed.
        target_repo: organvm/limen
        target_paths: [scripts/positioning-program.py, cli/tests/test_positioning_program.py]
        capabilities: [python, testing]
        reasoning: routine
        effect: write
        depends_on: [PSP-P00-W01]
        external_dependencies: []
        human_gates: []
        deliverables: [Validator, focused unit tests]
        acceptance: pytest -q cli/tests/test_positioning_program.py
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P00-W02
        rollback: Revert validator and tests together; keep the manifest untouched.
        return_evidence: [Exact test receipt]
      - id: PSP-P00-W03
        title: Build idempotent GitHub milestone, label, and issue projection
        outcome: Root, phase, and leaf issues are recoverable from stable markers and never duplicate on rerun.
        target_repo: organvm/limen
        target_paths: [scripts/positioning-program.py, institutio/positioning/github-map.json]
        capabilities: [python, github_write]
        reasoning: deep
        effect: external
        depends_on: [PSP-P00-W02]
        external_dependencies: []
        human_gates: []
        deliverables: [Dry-run plan, apply mode, deterministic issue map, remote verifier]
        acceptance: python3 scripts/positioning-program.py --verify-remote
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P00-W03
        rollback: Stop projection; labels, milestone, and open issues are non-destructive and remain traceable by marker.
        return_evidence: [Remote parity JSON and GitHub URLs]
      - id: PSP-P00-W04
        title: Publish cross-agent work-packet and relay contracts
        outcome: A cold agent can resume a leaf without transcript inheritance or authority confusion.
        target_repo: organvm/limen
        target_paths: [docs/positioning/program/AGENT-RUNBOOK.md, docs/positioning/program/WORK-PACKET-TEMPLATE.md, docs/positioning/program/RELAY-TEMPLATE.md]
        capabilities: [documentation, conduct_protocol]
        reasoning: deep
        effect: write
        depends_on: [PSP-P00-W01]
        external_dependencies: []
        human_gates: []
        deliverables: [Agent runbook, packet template, relay template]
        acceptance: python3 scripts/positioning-program.py --check
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P00-W04
        rollback: Revert templates; issue bodies retain the complete execution contract.
        return_evidence: [Reviewed documentation commit]
      - id: PSP-P00-W05
        title: Expose ready-work and model-assigned packet seeds
        outcome: Any healthy lane can discover unblocked work and create a live WorkPacketV1 without a model-name table.
        target_repo: organvm/limen
        target_paths: [scripts/positioning-program.py]
        capabilities: [python, conduct_protocol]
        reasoning: deep
        effect: write
        depends_on: [PSP-P00-W02]
        external_dependencies: []
        human_gates: []
        deliverables: [Ready-work JSON, single-leaf packet seed, tests for dependency filtering]
        acceptance: python3 scripts/positioning-program.py --ready --json
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P00-W05
        rollback: Remove seed output; agents may still work directly from issue bodies after live claims.
        return_evidence: [Sample seed validated against the current conduct schema boundary]
      - id: PSP-P00-W06
        title: Prove issue-map parity and zero orphan program work
        outcome: Every manifest object has exactly one issue and every marked issue has exactly one manifest owner.
        target_repo: organvm/limen
        target_paths: [scripts/positioning-program.py, docs/positioning/program/ISSUE-INDEX.md]
        capabilities: [github_read, verification]
        reasoning: routine
        effect: read
        depends_on: [PSP-P00-W03, PSP-P00-W05]
        external_dependencies: []
        human_gates: []
        deliverables: [Rendered index, remote parity receipt]
        acceptance: python3 scripts/positioning-program.py --verify-remote
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P00-W06
        rollback: No mutation; repair the manifest or projection and rerun.
        return_evidence: [Counts and exact orphan or duplicate set]
      - id: PSP-P00-W07
        title: Connect ready leaves to the authenticated conduct broker
        outcome: A program leaf can be claimed by any registered native lane with bounded authority and a durable receipt.
        target_repo: organvm/limen
        target_paths: [scripts/positioning-program.py, cli/src/limen/conduct]
        capabilities: [conduct, python, integration_testing]
        reasoning: deep
        effect: write
        depends_on: [PSP-P00-W05, PSP-P00-W06]
        external_dependencies: []
        human_gates: []
        deliverables: [Issue-to-WorkPacketV1 adapter, dry-run, canary receipt]
        acceptance: A registered non-Codex canary claims one no-op/read leaf and reports a schema-valid receipt.
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P00-W07
        rollback: Disable the adapter; the manifest and GitHub graph remain usable manually.
        return_evidence: [Native lane identity, run ID, lease receipt, and no-op predicate]

  - id: PSP-P01
    title: Foundation repair and upstream integration
    outcome: Existing truth and custody foundations merge on green CI and become the program's baseline.
    depends_on: [PSP-P00]
    exit_gate: PRs 2136 and 2141 have terminal owners; canonical sources are reconciled and baseline receipts are frozen.
    work:
      - id: PSP-P01-W01
        title: Fix the wall-clock-dependent throughput-governor test
        outcome: The test evaluates its fixture time rather than the host wall clock while production semantics remain unchanged.
        target_repo: organvm/limen
        target_paths: [cli/src/limen/dispatch.py, cli/tests/test_throughput_governor.py]
        capabilities: [python, diagnosis, testing]
        reasoning: routine
        effect: write
        depends_on: [PSP-P00-W06]
        external_dependencies: []
        human_gates: []
        deliverables: [Narrow time-injection or time-freeze fix, regression test]
        acceptance: pytest -q cli/tests/test_throughput_governor.py::test_remaining_budget_untouched_when_earned
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P01-W01
        rollback: Revert the narrow testability seam; do not alter throughput policy to satisfy the fixture.
        return_evidence: [Focused test and scoped verification receipt]
      - id: PSP-P01-W02
        title: Land the positioning truth-reconciliation foundation
        outcome: PR 2136 merges with claims, authorship, proof, estate, URL, and IA documents intact.
        target_repo: organvm/limen
        target_paths: [docs/positioning, link-surfaces.json, scripts]
        capabilities: [github_review, ci, documentation]
        reasoning: deep
        effect: external
        depends_on: [PSP-P01-W01]
        external_dependencies: [PR-2136]
        human_gates: []
        deliverables: [Green exact-head checks, resolved reviews, merged PR receipt]
        acceptance: gh pr view 2136 --repo organvm/limen --json state --jq '.state == "MERGED"'
        predicate: python3 scripts/positioning-program.py --verify-work PSP-P01-W02
        rollback: Revert only through a reviewed correction PR; preserve the claims ledger as the audit trail.
        return_evidence: [Merge commit, exact-head CI, review-thread count]
      - id: PSP-P01-W03
        title: Land encrypted custody for private evidence artifacts
        outcome: PR 2141 merges and private research/evidence can be preserved without public-path leakage.
        target_repo: organvm/limen
        target_paths: [private-vault, docs, scripts]
        capabilities: [github_review, security, ci]
        reasoning: deep
        effect: external
        depends_on: [PSP-P01-W01]
        external_dependencies: [PR-2141]
        human_gates: []
        deliverables: [Green exact-head checks, security review, merged PR receipt]
        acceptance: gh pr view 2141 --repo organvm/limen --json state --jq '.state == "MERGED"'
