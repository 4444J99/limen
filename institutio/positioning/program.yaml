schema_version: limen.positioning_program.v1
program:
  id: PSP-ROOT
  title: Production-Systems Positioning — Alpha to Omega
  repository: organvm/limen
  outcome: >-
    An evidence-backed production-systems identity, proof-led public front door, qualified inbound
    motion, repeatable delivery practice, and governed operator-handoff loop that any registered
    agent can continue without transcript inheritance.
  terminal_predicate: >-
    python3 scripts/positioning-program.py --omega --require-two-pass
  issue_projection:
    milestone: Production Systems Program — Alpha to Omega
    program_label: program:production-systems
    phase_label: program:phase
    work_label: work-packet
  success_90_day:
    qualified_door_mails: 5
    decision: one paid audit OR five documented no outcomes with reasons and a recorded revision
  critical_path:
    - PSP-P00-W06
    - PSP-P01-W01
    - PSP-P01-W02
    - PSP-P02-W05
    - PSP-P03-W01
    - PSP-P04-W01
    - PSP-P05-W01
    - PSP-P06-W03
    - PSP-P07-W03
    - PSP-P08-W07
    - PSP-P09-W02
    - PSP-P10-W08
    - PSP-P11-W07
    - PSP-P12-W06
    - PSP-P13-W08
    - PSP-P14-W09

execution_contract:
  provider_selection: dynamic_live_capability_discovery
  reasoning_classes:
    routine: Mechanical collection, rendering, straightforward implementation, and QA.
    deep: Architecture, diagnosis, synthesis, economics, or cross-repository work.
    frontier_review: Bounded challenge pass at a high-consequence decision or publication gate.
  default_authority: reversible changes within the named repository and path scope only
  mutation_rule: a GitHub issue is not a lease; claim through the conduct broker before mutation
  public_effect_rule: no send, publish, DNS, spend, merge, signature, or account mutation without explicit authority
  completion_rule: predicate plus durable receipt; prose, a branch, or an unmerged draft is not done

model_assignments:
  schema_version: limen.positioning_model_assignments.v1
  authority: Human model/effort override requested 2026-08-09
  adapter: codex
  catalog_command: codex debug models
  catalog_validated_at: '2026-08-09T16:15:43Z'
  unavailable_action: fail blocked, refresh the live catalog, and obtain a new explicit assignment; never silently substitute
  root:
    slug: gpt-5.6-sol
    effort: ultra
    rationale: Master-plan orchestration across the entire dependency graph and all execution lanes.
  phases:
    PSP-P00: {slug: gpt-5.6-sol, effort: max, rationale: Control-plane architecture and authority integrity.}
    PSP-P01: {slug: gpt-5.6-terra, effort: high, rationale: Bounded foundation repair with known predicates.}
    PSP-P02: {slug: gpt-5.6-sol, effort: max, rationale: 'Estate-wide truth, evidence, and contested-claim adjudication.'}
    PSP-P03: {slug: gpt-5.6-sol, effort: max, rationale: Canonical identity and narrative decision.}
    PSP-P04: {slug: gpt-5.6-sol, effort: max, rationale: 'Offer architecture, economics, and commercial boundaries.'}
    PSP-P05: {slug: gpt-5.6-sol, effort: xhigh, rationale: Cross-source proof synthesis and publication readiness.}
    PSP-P06: {slug: gpt-5.6-sol, effort: xhigh, rationale: Progressive-disclosure experience architecture.}
    PSP-P07: {slug: gpt-5.6-terra, effort: high, rationale: Multi-surface implementation and deployment coordination.}
    PSP-P08: {slug: gpt-5.6-sol, effort: xhigh, rationale: Privacy-sensitive inbound and private lead operations.}
    PSP-P09: {slug: gpt-5.6-terra, effort: high, rationale: Proof-led content production and distribution execution.}
    PSP-P10: {slug: gpt-5.6-sol, effort: xhigh, rationale: 'Qualification, conversion, and demand-experiment judgment.'}
    PSP-P11: {slug: gpt-5.6-sol, effort: max, rationale: Secure delivery operating system and client boundaries.}
    PSP-P12: {slug: gpt-5.6-sol, effort: max, rationale: Commercial validation and outcome-based strategy revision.}
    PSP-P13: {slug: gpt-5.6-sol, effort: max, rationale: 'Product custody, economics, legal structure, and operator handoff.'}
    PSP-P14: {slug: gpt-5.6-sol, effort: ultra, rationale: 'Estate-wide return loop, rollback proof, and Omega convergence.'}
  work_matrix:
    routine:
      read: {slug: gpt-5.4-mini, effort: low, rationale: Simple bounded inspection or evidence collection.}
      write: {slug: gpt-5.6-luna, effort: medium, rationale: Straightforward implementation with a narrow predicate.}
      external: {slug: gpt-5.6-terra, effort: high, rationale: Routine work with an external-effect boundary.}
    deep:
      read: {slug: gpt-5.6-terra, effort: high, rationale: Nontrivial analysis without mutation.}
      write: {slug: gpt-5.6-terra, effort: high, rationale: Substantial architecture or implementation work.}
      external: {slug: gpt-5.6-sol, effort: xhigh, rationale: Complex work that crosses an external-effect boundary.}
    frontier_review:
      read: {slug: gpt-5.6-sol, effort: max, rationale: High-consequence independent review.}
      write: {slug: gpt-5.6-sol, effort: max, rationale: Canonical high-consequence decision and implementation contract.}
      external: {slug: gpt-5.6-sol, effort: max, rationale: High-consequence external action behind explicit authority.}
  sensitive_capabilities: [conduct, conduct_protocol, security, privacy, legal_issue_spotting]
  sensitive_assignment:
    slug: gpt-5.6-sol
    effort: xhigh
    rationale: Security, privacy, legal, or conduct-boundary work receives a stronger execution profile.
  multi_repository_assignment:
    slug: gpt-5.6-sol
    effort: xhigh
    rationale: Cross-repository coordination receives a stronger execution profile.
  object_overrides:
    PSP-P00-W07: {slug: gpt-5.6-sol, effort: max, rationale: Authenticated broker integration is control-plane critical.}
    PSP-P14-W09: {slug: gpt-5.6-sol, effort: ultra, rationale: Final two-pass Omega proof requires full-graph orchestration.}

execution_chunks:
  schema_version: limen.positioning_execution_chunks.v1
  authority: Human logical-chunk execution order requested 2026-08-09
  relay_template: docs/positioning/program/EXECUTION-CHUNKS.md
  chunks:
    - id: PSP-C00
      title: Land the program control plane
      depends_on: []
      phase_ids: [PSP-P00]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: max, rationale: Control-plane landing and broker integration require architectural oversight.}
      objective: Land the existing program PR, close the seven control-plane leaves with receipts, and prove remote parity.
      exit_gate: P00 is closed; model validation, issue parity, ready-work discovery, packet seeding, and broker integration are green.
    - id: PSP-C01
      title: Repair and freeze the foundation
      depends_on: [PSP-C00]
      phase_ids: [PSP-P01]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-terra, effort: high, rationale: Bounded integration and baseline repair have explicit predicates.}
      objective: Land the upstream truth and private-custody foundations, reconcile generators, and freeze the post-merge baseline.
      exit_gate: P01 is closed and PRs 2136 and 2141 have terminal durable owners with a frozen baseline receipt.
    - id: PSP-C02
      title: Establish estate truth and evidence
      depends_on: [PSP-C01]
      phase_ids: [PSP-P02]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: max, rationale: Estate-wide evidence and disputed-claim adjudication are high-consequence decisions.}
      objective: Discover the full owned estate, select flagships, build reproducible evidence packets, and adjudicate contested claims.
      exit_gate: P02 is closed; every selected flagship and material claim has current, reproducible, privacy-reviewed evidence.
    - id: PSP-C03
      title: Ratify identity and commercial offers
      depends_on: [PSP-C02]
      phase_ids: [PSP-P03, PSP-P04]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: max, rationale: Identity, audience, offer, pricing, and boundary decisions form one canonical commercial contract.}
      objective: Ratify the production-systems identity, audience narratives, offer ladder, qualification rules, economics, and commercial templates.
      exit_gate: P03 and P04 are closed; target readers understand the offer and each commercial path has bounded scope and economics.
    - id: PSP-C04
      title: Produce proof and design the experience
      depends_on: [PSP-C03]
      phase_ids: [PSP-P05, PSP-P06]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: xhigh, rationale: Proof synthesis and progressive-disclosure experience design require cross-source judgment.}
      objective: Produce the flagship proof classes and turn them into a tested, accessible progressive-disclosure experience.
      exit_gate: P05 and P06 are closed; public-safe proof exists and the approved experience passes visual, comprehension, accessibility, and performance gates.
    - id: PSP-C05
      title: Build the service-delivery operating system
      depends_on: [PSP-C03]
      phase_ids: [PSP-P11]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: max, rationale: Secure client boundaries and delivery methodology require frontier-level contract judgment.}
      objective: Build and prove the audit, install, retainer, client workspace, QA, handoff, and consent operating system.
      exit_gate: P11 is closed and a synthetic engagement traverses the complete delivery lifecycle under declared security boundaries.
    - id: PSP-C06
      title: Implement and verify public surfaces
      depends_on: [PSP-C04]
      phase_ids: [PSP-P07]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-terra, effort: high, rationale: Multi-surface implementation is substantial but bounded by approved proof and design contracts.}
      objective: Implement the profile, organization map, portfolio, resume, repositories, identity package, domains, and analytics.
      exit_gate: P07 is closed and every tracked public surface is coherent, live, linked, measurable, and rollback-safe.
    - id: PSP-C07
      title: Build private inbound operations
      depends_on: [PSP-C06]
      phase_ids: [PSP-P08]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: xhigh, rationale: Inbound capture combines privacy-sensitive data flows with external account boundaries.}
      objective: Build tagged intake, normalization, scoring, routing, drafting, and the private opportunity ledger with no-send enforced.
      exit_gate: P08 is closed and synthetic client and recruiter leads traverse the complete private funnel while the send valve remains closed.
    - id: PSP-C08
      title: Stage and distribute proof-led content
      depends_on: [PSP-C07]
      phase_ids: [PSP-P09]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-terra, effort: high, rationale: Content derivation is bounded by the claims contract; publication remains human-gated.}
      objective: Build the editorial program, stage the flagship report and derivatives, and record owner-approved distribution outcomes.
      exit_gate: P09 is closed; the proof-led series is staged or owner-published where approved, measured, and connected to qualified capture.
    - id: PSP-C09
      title: Build qualification and conversion before the pilot
      depends_on: [PSP-C05, PSP-C08]
      phase_ids: [PSP-P10]
      exclude_work_ids: [PSP-P10-W08]
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: xhigh, rationale: Conversion architecture and objection instrumentation require integrated commercial judgment.}
      objective: Complete P10-W01 through P10-W07 so client and recruiter conversations, proposals, decisions, and objections are operational before validation.
      exit_gate: P10-W01 through P10-W07 are closed with receipts; only the post-pilot 90-day experiment adjudication remains open in P10.
    - id: PSP-C10
      title: Obtain commercial proof and close the demand experiment
      depends_on: [PSP-C05, PSP-C09]
      phase_ids: [PSP-P12]
      exclude_work_ids: []
      extra_work_ids: [PSP-P10-W08]
      conductor: {slug: gpt-5.6-sol, effort: max, rationale: First commercial proof and strategy adjudication cross human, contract, delivery, and claims boundaries.}
      objective: Recruit and deliver a bounded pilot, gather external proof, refresh claims, and adjudicate the 90-day demand experiment.
      exit_gate: P10 and P12 are closed with either commercial proof or an evidence-backed wedge invalidation and revision receipt.
    - id: PSP-C11
      title: Prove the governed foundry handoff
      depends_on: [PSP-C10]
      phase_ids: [PSP-P13]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: max, rationale: Product economics, legal structures, custody, and operator transfer are high-consequence.}
      objective: Inventory and score the product estate, define operator and transfer contracts, and run one bounded handoff pilot.
      exit_gate: P13 is closed and one product reaches observed operator transfer or an evidence-backed no-go decision.
    - id: PSP-C12
      title: Close the return loops and prove Omega
      depends_on: [PSP-C11]
      phase_ids: [PSP-P14]
      exclude_work_ids: []
      extra_work_ids: []
      conductor: {slug: gpt-5.6-sol, effort: ultra, rationale: Final convergence spans every phase, feedback loop, rollback path, and terminal receipt.}
      objective: Operate measurement and review loops, automate correction and rollback, feed outcomes upstream, and prove two unchanged passes.
      exit_gate: P14 and the root program are closed after two unchanged remote checks satisfy the terminal Omega predicate.

