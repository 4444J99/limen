rubric:
  scale: "0-5 per dimension; weighted_total = sum(score * weight / 5)"
  dimensions:
    distinct_claim_role:
      weight: 15
      five: "Adds a non-overlapping, necessary story role to the selected set."
      zero: "Duplicates a stronger candidate or carries no expert-positioning claim."
    technical_depth:
      weight: 20
      five: "Substantial inspectable architecture, implementation, and verification surfaces."
      zero: "Presentation, specification, or assertion without inspectable implementation depth."
    system_leverage:
      weight: 15
      five: "Coordinates or unlocks multiple downstream workflows, products, or operators."
      zero: "Isolated object with little transfer beyond its own surface."
    reproducible_evidence:
      weight: 20
      five: "Current public exact-head checks plus a live reproducible endpoint or equivalent."
      zero: "No reproducible public anchor."
    current_maturity:
      weight: 10
      five: "Currently operating with bounded status and failure evidence."
      zero: "Archived, stale, or only aspirational."
    public_visibility:
      weight: 10
      five: "Public source and current public proof surface are both reachable."
      zero: "Private-only or unavailable."
    buyer_relevance:
      weight: 10
      five: "Maps directly to a costly, legible buyer problem without invented adoption."
      zero: "No credible buyer or expert-review relevance."

selection_policy:
  minimum_selected: 3
  maximum_selected: 5
  minimum_weighted_total: 80
  minimum_dimension_scores:
    reproducible_evidence: 4
    current_maturity: 3
    public_visibility: 4
  hard_gates:
    - unique_story_role
    - current_public_evidence_anchor
    - no_private_only_dependency
    - not_archived_or_stale
    - bounded_non_circular_claim

reviewer_verdict:
