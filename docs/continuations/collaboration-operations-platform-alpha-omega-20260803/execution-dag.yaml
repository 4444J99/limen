schema_version: limen.collaboration_operations_execution_dag.v1

program:
  id: collaboration-operations-platform-alpha-omega
  owner: organvm/limen
  target_repository: organvm-iii-ergon/collaboration-operations-platform
  target_class: operation_private
  audience: self
  start_state: prepared_not_created
  target_state: omega_fixed_point
  source_origin: human_prompt
  horizon: future
  value_case: >-
    Establish one private, partition-safe system of record and action for every collaboration while
    eliminating fragmented custody, forgotten commitments, untraceable decisions, and cross-client
    disclosure risk.
  root_predicate: ./scripts/omega.sh
  root_receipt: receipts/omega/latest.json

authority:
  allowed_actions:
    - inspect
    - plan
    - create_private_repository
    - create_isolated_worktree
    - edit_scoped_source
    - run_scoped_predicate
    - commit_topic_branch
    - push_topic_branch
    - open_private_pull_request
    - review_private_pull_request
    - merge_green_private_pull_request
    - emit_successor_capsule
  allowed_external_effects:
    - github_private_repo_create
    - git_push_new_private_repo_founding_commit
    - git_push_existing_topic_branch
    - github_private_pull_request_mutation
    - github_private_repository_ruleset_configuration
  retained_gates:
    - destructive_personal_data_action
    - credential_or_secret_movement
    - paid_spend
    - collaborator_invitation_or_transfer
    - public_send_or_release
    - dns_mutation
    - production_deployment
    - live_client_data_or_transcript_import

team:
  root_agent: agy
  provider_selection: live_capability_derived
  max_children: 4
  max_depth: 1
  writer_rule: one_writer_per_worktree
  integration_rule: exact_head_receipts_then_independent_review
  session_rule: human_protected

packet_contract:
  predicate_pattern: ./scripts/gates/packets/<packet-id-lower>.sh
  receipt_pattern: receipts/packets/<packet-id-lower>.json
  retry:
    max_attempts: 2
    transient_only: true
  output_ceiling_bytes: 65536
  required_receipt_fields:
    - run_id
    - lease_id
    - lease_generation
    - executor
    - observed_heads_before
    - observed_heads_after
    - changed_paths
    - predicate
    - checks
    - spend
    - outcome

phases:
  - id: alpha
    symbol: "α"
    title: Authority, intent, and executable definition of done
    depends_on: []
    purpose: Freeze the product boundary and build the predicate spine before implementation.
    exit_predicate: ./scripts/gates/alpha.sh
    packets:
      - id: ALPHA-01
        title: Reconcile authority, evidence, and retained gates
        depends_on: []
        effect: write
        scope: ["Limen authorization receipt", "target founding evidence", "authority matrix"]
        deliverables:
          - Record the discharged private-repository genesis authorization and graph receipt.
          - Re-probe target-repository absence, estate classification, shelf, and access rows.
          - Materialize the root WorkPacketV1 with exact session, head, deadline, spend, and fanout.
        predicate: ./scripts/gates/packets/alpha-01.sh
        receipt_target: receipts/packets/alpha-01.json
        required_capabilities: [inspect, conduct]
      - id: ALPHA-02
        title: Ratify product charter, architecture, ADRs, and threat model
        depends_on: []
        effect: write
        scope: ["docs/product", "docs/architecture", "docs/security", "ADRs"]
        deliverables:
          - Copy the founding plan set into the target repository as immutable lineage.
          - Define personas, journeys, exclusions, partition semantics, and domain vocabulary.
          - Record chosen stack, alternatives rejected, threat actors, assets, and trust boundaries.
        predicate: ./scripts/gates/packets/alpha-02.sh
        receipt_target: receipts/packets/alpha-02.json
        required_capabilities: [inspect, code]
      - id: ALPHA-03
        title: Install the failing phase-gate and Omega skeleton
        depends_on: [ALPHA-01, ALPHA-02]
        effect: write
        scope: ["scripts/gates", "scripts/omega.sh", "receipts/schema"]
        deliverables:
          - Create one executable gate per phase and packet before feature work.
          - Make Omega compose immutable receipts and fail on missing, stale, or wrong-head evidence.
          - Prove a second unchanged run is byte-idempotent.
        predicate: ./scripts/gates/packets/alpha-03.sh
        receipt_target: receipts/packets/alpha-03.json
        required_capabilities: [code, execute]

  - id: beta
    symbol: "β"
    title: Private repository genesis and custody
    depends_on: [alpha]
    purpose: Mint exactly one private repository and establish remote custody and integration rules.
    exit_predicate: ./scripts/gates/beta.sh
    packets:
      - id: BETA-01
        title: Pass the fresh four-gate genesis preflight
        depends_on: [ALPHA-03]
        effect: read
        scope: ["remote absence", "naming canon", "estate class", "founding seed"]
        deliverables:
          - Confirm the repository is absent immediately before creation.
          - Confirm operation_private, audience self, no grants, and the ERGON shelf assignment.
          - Run repo-genesis in dry-run mode against the exact founding evidence.
        predicate: ./scripts/gates/packets/beta-01.sh
        receipt_target: receipts/packets/beta-01.json
        required_capabilities: [inspect, github-api]
      - id: BETA-02
        title: Mint and verify the private founding repository
        depends_on: [BETA-01]
        effect: external
        scope: ["GitHub private repository", "founding commit", "seed documents"]
        deliverables:
          - Run the accepted repo-genesis path once without dry-run.
          - Verify private visibility, default branch, founding commit, seed content, and no grants.
          - Clone into an isolated local worktree without modifying any collaborator repository.
        predicate: ./scripts/gates/packets/beta-02.sh
        receipt_target: receipts/packets/beta-02.json
        required_capabilities: [github-api, execute]
      - id: BETA-03
        title: Establish branch, review, ruleset, and preservation rails
        depends_on: [BETA-02]
        effect: external
        scope: ["repository settings", "branch policy", "CODEOWNERS", "custody receipt"]
        deliverables:
          - Make the founding push the only direct-main exception.
          - Configure no-bypass pull-request integration, merge queue where supported, and secret scanning.
          - Add AGENTS.md, CONTRIBUTING, ownership, security, and exact-head preservation contracts.
        predicate: ./scripts/gates/packets/beta-03.sh
        receipt_target: receipts/packets/beta-03.json
        required_capabilities: [github-api, code]

  - id: gamma
    symbol: "γ"
    title: Monorepo foundation and developer experience
    depends_on: [beta]
    purpose: Create the smallest reproducible skeleton for every declared application and package.
    exit_predicate: ./scripts/gates/gamma.sh
    packets:
      - id: GAMMA-01
        title: Pin runtime, workspace, lockfile, and package boundaries
        depends_on: [BETA-03]
        effect: write
        scope: ["package manager", "TypeScript config", "workspace graph", "tool versions"]
        deliverables:
          - Pin the current supported Node runtime and package manager discovered at execution time.
          - Enable strict TypeScript, reproducible installs, dependency boundaries, and import aliases.
          - Add versioned formatting, linting, and package graph commands.
        predicate: ./scripts/gates/packets/gamma-01.sh
        receipt_target: receipts/packets/gamma-01.json
        required_capabilities: [code, execute]
      - id: GAMMA-02
        title: Scaffold all application and package entrypoints
        depends_on: [GAMMA-01]
        effect: write
        scope: ["apps/*", "packages/*", "shared configuration"]
        deliverables:
          - Scaffold web, API, worker, CLI, and MCP applications with health/version commands.
          - Scaffold every architecture package with explicit public exports and owner docs.
          - Prove no package imports an application or bypasses the domain/policy seams.
        predicate: ./scripts/gates/packets/gamma-02.sh
        receipt_target: receipts/packets/gamma-02.json
        required_capabilities: [code, execute]
      - id: GAMMA-03
        title: Build local orchestration and scoped verification
        depends_on: [GAMMA-02]
        effect: write
        scope: ["Docker Compose", "developer commands", "gate resolver", "CI bootstrap"]
        deliverables:
          - Compose web, API, worker, PostgreSQL, and an S3-compatible local object service.
          - Add deterministic start, stop, reset-synthetic, seed, doctor, and scoped-test commands.
          - Implement changed-path gate resolution and bounded output/timeouts.
        predicate: ./scripts/gates/packets/gamma-03.sh
        receipt_target: receipts/packets/gamma-03.json
        required_capabilities: [code, execute]

  - id: delta
    symbol: "δ"
    title: Contracts and domain model
    depends_on: [gamma]
    purpose: Define the portable language and invariants of the platform before persistence or UI.
    exit_predicate: ./scripts/gates/delta.sh
    packets:
      - id: DELTA-01
        title: Define identifiers, envelopes, classification, and partition contracts
        depends_on: [GAMMA-03]
        effect: write
        scope: ["packages/contracts", "packages/domain primitives"]
        deliverables:
          - Define IDs, timestamps, actor/source references, classifications, and partition scopes.
          - Define command, query, event, problem, page, job, and receipt envelopes.
          - Generate TypeScript from canonical JSON Schemas and reject drift.
        predicate: ./scripts/gates/packets/delta-01.sh
        receipt_target: receipts/packets/delta-01.json
        required_capabilities: [code, execute]
      - id: DELTA-02
        title: Model relationship, engagement, knowledge, and work aggregates
        depends_on: [DELTA-01]
        effect: write
        scope: ["packages/domain aggregates", "state machines", "invariants"]
        deliverables:
          - Implement person, organization, relationship, engagement, project, and matter aggregates.
          - Implement interaction, artifact, note, decision, commitment, task, milestone, and risk.
          - Encode lifecycle transitions as commands with explicit invariant failures.
        predicate: ./scripts/gates/packets/delta-02.sh
        receipt_target: receipts/packets/delta-02.json
        required_capabilities: [code, execute]
      - id: DELTA-03
        title: Define API, event, compatibility, and fixture contracts
        depends_on: [DELTA-01, DELTA-02]
        effect: write
        scope: ["OpenAPI", "event catalog", "contract fixtures", "compatibility policy"]
        deliverables:
          - Define v1 resources and command endpoints without persistence leakage.
          - Define event evolution and backward-compatibility checks.
          - Publish synthetic golden fixtures and consumer contract tests.
        predicate: ./scripts/gates/packets/delta-03.sh
        receipt_target: receipts/packets/delta-03.json
        required_capabilities: [code, execute]

  - id: epsilon
    symbol: "ε"
    title: Persistence, migrations, transactions, and jobs
    depends_on: [delta]
    purpose: Implement durable state while keeping SQL, policy, and domain boundaries explicit.
    exit_predicate: ./scripts/gates/epsilon.sh
    packets:
      - id: EPSILON-01
        title: Design normalized PostgreSQL schema and migration discipline
        depends_on: [DELTA-03]
        effect: write
        scope: ["SQL schema", "numbered migrations", "database roles", "constraints"]
        deliverables:
          - Map all canonical entities to partitioned tables and immutable provenance columns.
          - Create least-privilege owner, migrator, runtime, worker, and read-only roles.
          - Prove clean install and upgrade in ephemeral databases.
        predicate: ./scripts/gates/packets/epsilon-01.sh
        receipt_target: receipts/packets/epsilon-01.json
        required_capabilities: [code, execute]
      - id: EPSILON-02
        title: Implement repositories, unit of work, outbox, and idempotency
        depends_on: [EPSILON-01]
        effect: write
        scope: ["packages/database", "transactions", "outbox", "idempotency keys"]
        deliverables:
          - Implement typed repositories without exposing SQL rows to applications.
          - Commit domain changes, events, audit events, and outbox records atomically.
          - Reject conflicting command replays and return prior receipts for exact duplicates.
        predicate: ./scripts/gates/packets/epsilon-02.sh
        receipt_target: receipts/packets/epsilon-02.json
        required_capabilities: [code, execute]
      - id: EPSILON-03
        title: Implement durable jobs, leases, retries, and synthetic seed lifecycle
        depends_on: [EPSILON-02]
        effect: write
        scope: ["jobs table", "worker leases", "retry policy", "synthetic seeding"]
        deliverables:
          - Claim jobs atomically with finite leases, heartbeats, attempts, and dead letters.
          - Support graceful worker interruption and deterministic retry clocks.
          - Seed and reset only tagged synthetic partitions with custody checks.
        predicate: ./scripts/gates/packets/epsilon-03.sh
        receipt_target: receipts/packets/epsilon-03.json
        required_capabilities: [code, execute]

  - id: zeta
    symbol: "ζ"
    title: Identity, partition authorization, redaction, and audit
    depends_on: [delta, epsilon]
    purpose: Make disclosure safety structural before feature data can be queried.
    exit_predicate: ./scripts/gates/zeta.sh
    packets:
      - id: ZETA-01
        title: Implement identity and session adapter boundaries
        depends_on: [EPSILON-03]
        effect: write
        scope: ["principal model", "OIDC adapter", "sessions", "service identities"]
        deliverables:
          - Define owner, collaborator, service, and agent principals without vendor coupling.
          - Implement secure session rotation, expiry, revocation, and test identities.
          - Keep authentication claims separate from authorization decisions.
        predicate: ./scripts/gates/packets/zeta-01.sh
        receipt_target: receipts/packets/zeta-01.json
        required_capabilities: [code, execute]
      - id: ZETA-02
        title: Implement policy engine and forced row-level security
        depends_on: [ZETA-01]
        effect: write
        scope: ["packages/policy", "PostgreSQL RLS", "capability matrix"]
        deliverables:
          - Define roles, actions, resources, field visibility, and non-transitive grants.
          - Enable and force RLS on every partitioned table with default deny.
          - Generate and execute the principal x partition x role x action matrix.
        predicate: ./scripts/gates/packets/zeta-02.sh
        receipt_target: receipts/packets/zeta-02.json
        required_capabilities: [code, execute, review]
      - id: ZETA-03
        title: Implement redaction and append-only audit receipts
        depends_on: [ZETA-02]
        effect: write
        scope: ["field redaction", "audit chain", "policy receipts", "privacy scanner"]
        deliverables:
          - Apply policy-aware DTO redaction before serialization, logging, indexing, or export.
          - Record actor, decision, reason, request, causation, and resource in append-only audit events.
          - Detect audit tampering and private-field leakage in generated artifacts.
        predicate: ./scripts/gates/packets/zeta-03.sh
        receipt_target: receipts/packets/zeta-03.json
        required_capabilities: [code, execute, review]

  - id: eta
    symbol: "η"
    title: Capture, ingestion, provenance, and object custody
    depends_on: [epsilon, zeta]
    purpose: Accept heterogeneous inputs without sacrificing provenance, safety, or idempotency.
    exit_predicate: ./scripts/gates/eta.sh
    packets:
      - id: ETA-01
        title: Implement source envelopes, cursors, and connector-neutral ingest API
        depends_on: [ZETA-03]
        effect: write
        scope: ["packages/ingest", "source API", "cursor state", "raw envelopes"]
        deliverables:
          - Capture source identity, external id, revision, cursor, checksum, and observed times.
          - Make raw envelopes append-only and replayable.
          - Enforce partition, classification, size, media type, and provenance at admission.
        predicate: ./scripts/gates/packets/eta-01.sh
        receipt_target: receipts/packets/eta-01.json
        required_capabilities: [code, execute]
      - id: ETA-02
        title: Implement normalization, dedupe, linking, and quarantine
        depends_on: [ETA-01]
        effect: write
        scope: ["normalizers", "dedupe", "link proposals", "dead letters"]
        deliverables:
          - Normalize to versioned domain commands with deterministic receipts.
          - Separate exact duplicates, probable matches, and human-review link proposals.
          - Quarantine malformed, hostile, oversized, or unsupported payloads with bounded diagnostics.
        predicate: ./scripts/gates/packets/eta-02.sh
        receipt_target: receipts/packets/eta-02.json
        required_capabilities: [code, execute]
      - id: ETA-03
        title: Implement encrypted content-addressed artifact custody
        depends_on: [ETA-01, ETA-02]
        effect: write
        scope: ["packages/object-store", "uploads", "encryption adapter", "retention metadata"]
        deliverables:
          - Hash, quarantine, scan, encrypt, store, and verify object bytes through adapters.
          - Keep object keys opaque and partition-scoped; never trust filenames for identity.
          - Exercise local filesystem and S3-compatible adapters with synthetic artifacts.
        predicate: ./scripts/gates/packets/eta-03.sh
        receipt_target: receipts/packets/eta-03.json
        required_capabilities: [code, execute, review]

  - id: theta
    symbol: "θ"
    title: Deterministic search and retrieval
    depends_on: [eta]
    purpose: Make every authorized record retrievable with explainable ranking and provenance.
    exit_predicate: ./scripts/gates/theta.sh
    packets:
      - id: THETA-01
        title: Build policy-safe search documents and indexing pipeline
        depends_on: [ETA-03]
        effect: write
        scope: ["packages/search", "index jobs", "search documents", "reindex receipts"]
        deliverables:
          - Project authorized text and facets into partitioned PostgreSQL search documents.
          - Incrementally update indexes from domain events and support idempotent full reindex.
          - Exclude quarantined, revoked, purged, or non-indexable fields.
        predicate: ./scripts/gates/packets/theta-01.sh
        receipt_target: receipts/packets/theta-01.json
        required_capabilities: [code, execute]
      - id: THETA-02
        title: Implement query parsing, filters, ranking, highlights, and saved search
        depends_on: [THETA-01]
        effect: write
        scope: ["search API", "ranking", "filters", "saved views"]
        deliverables:
          - Support exact phrase, prefix, faceted, date, source, person, project, and type filters.
          - Return explainable rank, safe highlights, provenance, and stable cursor pagination.
          - Store saved queries as policy-checked definitions rather than cached private result sets.
        predicate: ./scripts/gates/packets/theta-02.sh
        receipt_target: receipts/packets/theta-02.json
        required_capabilities: [code, execute]
      - id: THETA-03
        title: Add optional semantic retrieval behind a disabled provider-neutral adapter
        depends_on: [THETA-01, THETA-02]
        effect: write
        scope: ["embedding interface", "hybrid rank fusion", "capability valve", "fallback tests"]
        deliverables:
          - Define content-minimizing embedding requests and versioned vector metadata.
          - Keep semantic retrieval off by default and preserve full deterministic functionality without it.
          - Test provider removal, reorder, outage, stale embeddings, and exact-search fallback.
        predicate: ./scripts/gates/packets/theta-03.sh
        receipt_target: receipts/packets/theta-03.json
        required_capabilities: [code, execute, review]

  - id: iota
    symbol: "ι"
    title: Relationship and work operations
    depends_on: [delta, zeta]
    purpose: Turn preserved knowledge into accountable collaboration operations.
    exit_predicate: ./scripts/gates/iota.sh
    packets:
      - id: IOTA-01
        title: Implement people, organizations, relationships, engagements, and timelines
        depends_on: [ZETA-03, DELTA-03]
        effect: write
        scope: ["relationship services", "engagement lifecycle", "timeline projections"]
        deliverables:
          - Create and merge identity records through explicit, reversible proposals.
          - Model relationship and engagement states without leaking across partitions.
          - Project provenance-backed chronological timelines.
        predicate: ./scripts/gates/packets/iota-01.sh
        receipt_target: receipts/packets/iota-01.json
        required_capabilities: [code, execute]
      - id: IOTA-02
        title: Implement commitments, tasks, milestones, waiting, risk, and review queues
        depends_on: [IOTA-01]
        effect: write
        scope: ["workflows package", "task API", "review queues", "state transitions"]
        deliverables:
          - Enforce assignee, due, waiting-on, blocked, complete, cancelled, and reopened semantics.
          - Derive overdue, stale, at-risk, waiting, and next-action views from canonical state.
          - Preserve transition actor, rationale, causation, and audit receipts.
        predicate: ./scripts/gates/packets/iota-02.sh
        receipt_target: receipts/packets/iota-02.json
        required_capabilities: [code, execute]
      - id: IOTA-03
        title: Implement meetings, decisions, notes, and action propagation
        depends_on: [IOTA-01, IOTA-02]
        effect: write
        scope: ["meeting prep", "decision records", "action extraction", "follow-up views"]
        deliverables:
          - Assemble meeting briefs from authorized history and open operational state.
          - Record decisions with alternatives, rationale, participants, evidence, and supersession.
          - Atomically create resulting commitments/tasks and link them to their source decision.
        predicate: ./scripts/gates/packets/iota-03.sh
        receipt_target: receipts/packets/iota-03.json
        required_capabilities: [code, execute]

  - id: kappa
    symbol: "κ"
    title: Owner console and interaction design
    depends_on: [theta, iota]
    purpose: Deliver the complete owner workflow as an accessible responsive web application.
    exit_predicate: ./scripts/gates/kappa.sh
    packets:
      - id: KAPPA-01
        title: Build information architecture, design system, shell, and state patterns
        depends_on: [THETA-03, IOTA-03]
        effect: write
        scope: ["packages/ui", "apps/web shell", "navigation", "responsive states"]
        deliverables:
          - Define tokens, components, layouts, keyboard model, and accessibility baseline.
          - Build partition switcher, global command surface, breadcrumbs, and policy-aware navigation.
          - Implement loading, empty, error, offline, conflict, and permission-denied patterns.
        predicate: ./scripts/gates/packets/kappa-01.sh
        receipt_target: receipts/packets/kappa-01.json
        required_capabilities: [code, execute, review]
      - id: KAPPA-02
        title: Build capture, inbox, classification, and linking experiences
        depends_on: [KAPPA-01]
        effect: write
        scope: ["quick capture", "inbox", "artifact upload", "classification UI"]
        deliverables:
          - Capture note, URL, file, and source reference into an explicit partition.
          - Process inbox records into entities, tasks, decisions, links, archive, or quarantine.
          - Show provenance and policy consequences before every classification or move.
        predicate: ./scripts/gates/packets/kappa-02.sh
        receipt_target: receipts/packets/kappa-02.json
        required_capabilities: [code, execute]
      - id: KAPPA-03
        title: Build search, timelines, reviews, projects, and meeting-prep experiences
        depends_on: [KAPPA-01, KAPPA-02]
        effect: write
        scope: ["search UI", "entity pages", "work review", "meeting prep"]
        deliverables:
          - Implement global/faceted search with explainable results and safe highlights.
          - Implement person, organization, engagement, project, and decision timelines.
          - Implement commitment review, waiting/risk views, dashboards, and meeting briefs.
        predicate: ./scripts/gates/packets/kappa-03.sh
        receipt_target: receipts/packets/kappa-03.json
        required_capabilities: [code, execute, review]

  - id: lambda
    symbol: "λ"
    title: Scoped collaborator portal
    depends_on: [zeta, kappa]
    purpose: Project minimum necessary collaboration views without weakening owner custody.
    exit_predicate: ./scripts/gates/lambda.sh
    packets:
      - id: LAMBDA-01
        title: Define portal capability grants and projection contracts
        depends_on: [ZETA-03, KAPPA-03]
        effect: write
        scope: ["portal policy", "grant lifecycle", "projection DTOs", "invitation valve"]
        deliverables:
          - Define viewer, contributor, and editor capabilities per partition and resource.
          - Keep invitation delivery disabled; implement grant proposals and preview receipts only.
          - Prove links, counts, navigation, and errors reveal no owner-only or foreign-partition state.
        predicate: ./scripts/gates/packets/lambda-01.sh
        receipt_target: receipts/packets/lambda-01.json
        required_capabilities: [code, execute, review]
      - id: LAMBDA-02
        title: Implement portal views, comments, uploads, and scoped work actions
        depends_on: [LAMBDA-01]
        effect: write
        scope: ["collaborator routes", "comment/upload commands", "scoped task actions"]
        deliverables:
          - Render only policy-projected records and explicitly shared artifacts.
          - Support comments, uploads, acknowledgements, and permitted task transitions.
          - Quarantine uploads and audit every collaborator-visible mutation.
        predicate: ./scripts/gates/packets/lambda-02.sh
        receipt_target: receipts/packets/lambda-02.json
        required_capabilities: [code, execute]
      - id: LAMBDA-03
        title: Implement view-as, revocation, expiry, and disclosure regression suite
        depends_on: [LAMBDA-01, LAMBDA-02]
        effect: write
        scope: ["owner preview", "revocation", "grant expiry", "negative E2E tests"]
        deliverables:
          - Let the owner preview exact collaborator visibility without changing identity.
          - Revoke/expire grants immediately across sessions, caches, search, jobs, and downloads.
          - Generate cross-partition disclosure tests for every portal route and tool.
        predicate: ./scripts/gates/packets/lambda-03.sh
        receipt_target: receipts/packets/lambda-03.json
        required_capabilities: [code, execute, review]

  - id: mu
    symbol: "μ"
    title: Connector SDK and source adapters
    depends_on: [eta, zeta]
    purpose: Make source integration repeatable, least-privilege, and safe before credentials exist.
    exit_predicate: ./scripts/gates/mu.sh
    packets:
      - id: MU-01
        title: Build connector manifests, lifecycle, cursors, limits, and contract testkit
        depends_on: [ETA-03, ZETA-03]
        effect: write
        scope: ["packages/connectors", "capability manifests", "connector testkit"]
        deliverables:
          - Declare read/write capabilities, scopes, data classes, rate limits, and cursor semantics.
          - Implement discover, authorize, pull, push, revoke, health, and dry-run interfaces.
          - Require idempotency, bounded retries, redacted diagnostics, and synthetic conformance tests.
        predicate: ./scripts/gates/packets/mu-01.sh
