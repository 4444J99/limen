# repo-predicates — per-repo OVERRIDES for the work-loan backfill's quality bar.
#
# schema: limen.repo_predicates.v1
#
# Membership is REMOTE-FIRST: the estate itself — every non-archived repo GitHub reports
# for the owner accounts (limen.estate; refreshed by scripts/estate-repos-refresh.py into
# the skeleton-thin hot cache at logs/estate-repos.json) — is the permission to
# underwrite. This file is NOT the permission list: it carries only per-repo overrides,
# and an entry here additionally marks the repo as value-tier (the value_case says so).
# When estate evidence is absent (cache stale + refresh failed), only entries here admit —
# absence of evidence narrows the bar to the value tier, never widens it.
#
# Per entry:
#   owner_surface       — the durable owner the loan names (defaults to the repo slug).
#   predicate_template  — the executable done-probe minted when a task carries no PR URL.
#                         Two placeholders: {repo} {task_id}. The default is the board's own
#                         merged-PR-search convention (see the organvm/in-my-head rows on
#                         tasks.yaml): done ⟺ a merged PR referencing the task id exists.
#                         jules-land titles PRs "[limen jules <task-id>]", so the search
#                         matches the receipts the fleet actually produces.
#   exclude             — true bars underwriting for this repo even though it is in the
#                         estate (the one hand-maintained veto; counted, never silent).
#
# scripts/work-loan-backfill.py refuses non-estate/archived/excluded repos with a counted
# reason — never a silent skip.

schema: limen.repo_predicates.v1
default_predicate_template: >-
  test "$(gh pr list --repo {repo} --state merged --search {task_id} --json number --jq length)" != 0
repos:
  organvm/a-i-chat--exporter: {}
  organvm/my-knowledge-base: {}
