limitations:
  - id: no-customer-adoption-proof
    statement: >-
      Owner-environment operation and public runtime reachability do not establish customer
      adoption, revenue, retention, or return on investment.
    assertion_ref: docs/positioning/evidence/assertions/adoption-boundary.json
    assertion_id: limen-adoption-boundary-20260831
  - id: public-projection-is-redacted
    statement: >-
      The public status surface is a dated aggregate projection and cannot reproduce or disprove
      protected private operations.
  - id: runtime-health-is-not-sla
    statement: >-
      A successful endpoint observation does not establish a reliability window, security
      certification, or enterprise service-level objective.
  - id: provider-health-is-live-state
    statement: >-
      Adapter code and lane declarations do not prove every provider is funded, authenticated,
      healthy, or accepting work at a later time.
  - id: no-comparative-benchmark
    statement: >-
      No public independent benchmark establishes cost, throughput, reliability, or quality
      superiority over other orchestration systems.
  - id: license-unresolved
    statement: >-
      No license file is present in the verified tree; publicly inspectable source must not be
      represented as an open-source permission grant.
    assertion_ref: docs/positioning/evidence/assertions/license-status.json
    assertion_id: limen-license-status-20260831
