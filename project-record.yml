project_id: limen
name: Limen
canonical_repository: 4444J99/limen
former_repositories:
  - organvm/limen
repository_role: canonical
documentation_class: A
one_sentence: >-
  Limen coordinates work across AI coding agents so each task has one owner, a bounded budget,
  explicit permissions, and inspectable completion evidence.
problem: >-
  Multi-agent delivery breaks down when assignment, authority, resource conflicts, provider spend,
  verification, and failure state live in separate tools and prose status is mistaken for landed,
  reproducible completion.
intended_users:
  - multi-agent system operators
  - platform and infrastructure engineers
  - AI-assisted software delivery teams
  - technical evaluators
implementation_status: ACTIVE
deployment_status: public
authorship:
  owner: Anthony James Padavano
  role: system architect, project director, and operator
  contributions:
    - system architecture and ideal-form definition
    - authority, evidence, and human-approval doctrine
    - cross-provider orchestration design
    - multi-agent implementation direction and revision
    - verification and acceptance-boundary design
    - operational and public documentation
  collaborators: []
  generated:
    - Implementation, tests, reviews, and documentation produced through multiple disclosed AI-agent lanes under direction and verification.
  inherited: []
  external:
    - Python, FastAPI, Next.js, Cloudflare Workers and Durable Objects, GitHub Actions, and other repository-declared dependencies and services.
