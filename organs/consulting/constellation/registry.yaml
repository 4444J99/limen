          entry point and segment were already chosen in the repo's own README (AI Estate Audit,
          higher education, fixed scope); only PRICE is open, and it does not gate the instrument.
          Audit instrument built 2026-08-12 — estate schema, legibility rubric where every lost
          point names a missing artifact, derived risk register, capped first wave; 66 tests. His
          enterprise-UX vantage is the credibility asset, not delivery capacity. Alpha→omega
          roadmap issued 2026-08-13: 10 phases as GitHub milestones + issues, ladder at
          roadmap/ladder.json; only the commercial-packaging phase waits on L-CONS-PRICE.
