          repo's docs/research/. Alpha→omega roadmap issued 2026-08-13: 11 phases as GitHub
          milestones + issues, ladder at roadmap/ladder.json, consumer-shell phases planned-not-
          started behind L-DSP-TEN-QUESTIONS.
