# Relationship-Posture Brief: Forest
# Koinonia social organ — second engagement
#
# DISCLOSURE: this file is world-readable (organvm/limen publishes). It carries
# posture only — no surname, no handle, no contact data, no third-party company
# or hiring detail. The correspondence archive, channel state, and the referral
# particulars live in the private half at
# ~/Workspace/_people-private/{correspondence,opportunities}/ and are named here
# by lane, never by content.

member:
  name: "Forest"
  identifier: "forest-design-peer"
  context: >
    Personal friend and design-industry peer in New York, met through a shared
    professional context (both parties reference the same recruiter). The tie is
    social first — drinks, comedy shows, art walks — with a professional
    undercurrent that became dominant in mid-2026: both parties are running a
    job search at the same time, and the thread turned into sustained mutual
    mentoring, of which an unprompted referral is one part.
  note: >
    Two-dimensional tie held by one person: a genuine friendship and a
    professional peer channel. The professional dimension is real but
    intermittent; it must not be allowed to convert the friendship into a
    pipeline. Care actions are owed on the friendship's own terms, whether or
    not any referral ever converts.

mandate:
  relationship: "personal friend and design-industry peer"
  why_it_matters: >
    Forest is one of very few ties who reads the industry from the inside and
    volunteers access without being asked — he offered to spend his own standing
    at a company to open a door, before Anthony asked for anything. That is
    peer-level advocacy, not networking. Losing the tie would cost both a
    friendship and the only warm inbound channel into the NYC design market that
    did not arrive through a recruiter or a job board.

standing:
  current: ACTIVE
  warmth: >
    high — contact within the last 24 hours, mutual investment, and an
    unprompted offer of advocacy; low frequency is a rhythm of this tie, not
    a signal of cooling
  history:
    - period: "2026-08 — present"
      state: ACTIVE
      notes: >
        Peak engagement: substantive voice-note exchange in both directions
        plus an unprompted job referral with offered advocacy
    - period: "2026-01 — 2026-07"
      state: WARM
      notes: >
        Episodic bursts roughly every 4-8 weeks — one in-person meet, portfolio
        feedback request, travel and life updates, event shares. Long silences
        between bursts are normal and were never treated as a rupture by either
        party.

standard:
  reciprocity_norm: >
    peer — high mutuality, low frequency. Both parties open threads, both
    apologize for lag, neither keeps score. Latency is expected and forgiven;
    non-response to a substantive message is not.
  expected_cadence: >
    episodic — a burst every 4-8 weeks is the healthy baseline. During an active
    thread (a live referral, a live plan), same-day.
  reply_window: >
    same-day while a thread is live; multi-day latency is acceptable once the
    thread has closed
  boundaries:
    - >
      This channel does not deliver notifications to Forest — he has stated he
      does not receive them and discovers messages late. Nothing time-critical
      may be sent here and left to sit; a delayed reply from him is a channel
      artifact, never a signal about the relationship.
    - >
      Advocacy he offers is spent from his own standing at his own cost. Never
      treat it as a resource to draw on, escalate, or follow up for a second time.
    - >
      Third-party hiring information he shares was shared in confidence. It is
      not repeated, published, or acted on outside the referral itself.
    - >
      Guidance received on this tie is weighed before use, never adopted
      wholesale. Where any of it conflicts with Anthony's own representation
      standard, it is recorded and declined in the private half — not actioned,
      not carried into any application artifact, and not repeated to anyone.
      Declining a piece of advice is not a rebuke of the friend who offered it
      and is never raised as one.
  owed_replies:
    - >
      Three voice notes received 2026-08-02 were unplayed at ingest time and are
      now transcribed in the private archive — read them and reply substantively
    - >
      A same-day commitment was made on 2026-08-02 to review the referred
      company and prepare a pitch; the artifact does not exist yet. Deliver it
      or tell him plainly it slipped
    - >
      A portfolio review he agreed to in 2026-02 was never delivered. Release
      him from it explicitly rather than leaving it as a silent debt on his side
    - >
      He opened the 2026-08 exchange by saying he is going through the same
      thing, then spent the entire thread on Anthony's situation and none of it
      on his own. Ask about his before reporting on the one he opened
    - >
      A direct question asked 2026-07-30 was never answered, and the window it
      referred to closes 2026-08-08. Re-ask it rather than treating silence as
      a decline — this channel loses messages
  care_pattern: >
    Reciprocate advocacy with advocacy, not with gratitude alone — the standing
    repayment for a referral is an equivalent open door, offered unprompted when
    one appears. Ask about his own situation before reporting on the one he
    opened. Keep the social thread (shows, bars, art walks) alive independently
    of any professional thread, so the friendship is never reduced to its
    usefulness.

governance:
  manual_mode: true
  human: "Anthony"
  consent:
    - >
      Forest has NOT been asked whether a posture record may be held about him.
      Until he is, this record stays minimal, holds no contact data, and is
      never published in any form that identifies him
    - >
      Raw correspondence, media, and voice-note transcripts stay in the private
      half and are never committed to a published repository
    - >
      Referral and third-party hiring detail lives in the private opportunity
      lane, not in this record
  requires_human:
    - "Every message on this thread, without exception"
    - "Any use of the referral, including the pitch and any application"
    - "Any contact with the referred company"
    - "Any change to this record's standing or boundaries"
  never_autonomous:
    - "Sending messages, voice notes, replies, or reactions on this thread"
    - "Contacting the referred company or anyone connected to the referral"
    - "Sharing Forest's personal, travel, employment, or location data anywhere"
    - "Publishing his name, handle, or any third-party detail he shared privately"
    - "Following up on advocacy he offered"
  human_gates:
    - "message-send"
    - "referral-use"
    - "third-party-contact"
    - "consent-to-hold-record"
    - "boundary-change"

artifacts:
  next_reviewable_output: >
    relationship-posture brief regenerated by
    organs/social/scripts/relationship-brief.py for review with Anthony,
    paired with the private correspondence digest
  evidence:
    - "member: name, identifier, context, and two-dimensional tie note recorded"
    - "mandate: peer-advocacy relationship and why_it_matters documented"
    - "standing: ACTIVE, manually derived from a dated 83-message export spanning 2026-01-14 to 2026-08-02"
    - "standard: reciprocity norm, episodic cadence, reply window, four boundaries, five owed replies, and care pattern all named"
    - "actions: an item list derived 2026-08-03 from every utterance by the other party, held in the private correspondence lane"
    - "governance: manual_mode=true, 5 human gates, 5 forbidden autonomous acts, consent recorded as NOT YET GIVEN"
    - "source: WhatsApp export ingested 2026-08-03; raw text, media, and transcripts held only in the private correspondence lane"

