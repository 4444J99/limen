[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "limen-mcp"
version = "0.1.0"
description = "Limen Pipeline MCP Server"
requires-python = ">=3.11"
dependencies = [
    "limen>=0.1.0",
    "mcp[fastmcp]",
    "cryptography>=50.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
limen-mcp = "limen_mcp.server:mcp.run"

[tool.uv.sources]
limen = { path = "../cli", editable = true }

[tool.mypy]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
mypy_path = ["src", "../cli/src"]

[[tool.mypy.overrides]]
module = [
  "limen.*",
  "yaml",
  "fastmcp",
  "mcp.*",
  "cryptography.*",
]
ignore_missing_imports = true
