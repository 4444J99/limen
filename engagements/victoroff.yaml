# Victoroff — the engagement this guard was written from.
#
# This file is the guard's REGRESSION TEST. It must exit non-zero. A change that makes
# `engagement-guard.py --config engagements/victoroff.yaml` pass has broken the guard, not
# fixed the engagement.
#
# Deliberately free of personal detail: no message content, no personal history, no third
# parties. The confidential record lives in a separate private repository. What is kept here
# is only the shape of the failure, because the shape is what generalises.

