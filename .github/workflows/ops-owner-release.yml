name: Ops-owned scheduler release carrier

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-owner-release.yml']
  workflow_dispatch:

permissions:
  contents: read

# The called immutable owner performs fresh preflight before any mutation.
# Dormant source is preserved; only verified duplicate authority is removed.
jobs:
  owner:
    uses: 4444J99/ops/.github/workflows/cloudflare-owner-release.yml@ec94e3523403aff0058896419b917e0eee1830de
    with:
      source_sha: ec94e3523403aff0058896419b917e0eee1830de
      apply_source: ec94e3523403aff0058896419b917e0eee1830de
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
