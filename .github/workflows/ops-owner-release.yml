name: Ops-owned scheduler release carrier

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-owner-release.yml']
  workflow_dispatch:

permissions:
  contents: read

# Readback only. The runtime remains on its already verified release; this
# carrier never resets an uncertain run or redeploys from a diagnostics change.
jobs:
  owner:
    uses: 4444J99/ops/.github/workflows/cloudflare-owner-release.yml@ff3c2dd09294493a59b5fc5c60b146e2367a25a0
    with:
      source_sha: ff3c2dd09294493a59b5fc5c60b146e2367a25a0
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
