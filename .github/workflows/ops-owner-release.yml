name: Ops-owned scheduler release carrier

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-owner-release.yml']
  workflow_dispatch:

permissions:
  contents: read

# The called immutable owner performs fresh preflight before any mutation.
# Its shared carrier lock excludes the previous incident writer.
jobs:
  owner:
    uses: 4444J99/ops/.github/workflows/cloudflare-owner-release.yml@c0c017733bc638071c5bf17805c8a7660c3f9b34
    with:
      source_sha: c0c017733bc638071c5bf17805c8a7660c3f9b34
      apply_source: c0c017733bc638071c5bf17805c8a7660c3f9b34
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
