name: Ops-owned scheduler release carrier

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-owner-release.yml']
  workflow_dispatch:

permissions:
  contents: read

# Readback only. The runtime remains on its already verified release; this
# carrier never resets an uncertain run or redeploys from a diagnostics change.
jobs:
  owner:
    uses: 4444J99/ops/.github/workflows/cloudflare-owner-release.yml@062c6adefa5936662f75ea10e1bee060dde70ae1
    with:
      source_sha: 062c6adefa5936662f75ea10e1bee060dde70ae1
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
