name: validate
on:
  push:
    branches: [main]
    paths:
      - "tasks.yaml"
      - "SCHEMA.md"
      - "mcp/src/limen_mcp/server.py"
      - "scripts/validate-task-board.py"
      - ".github/workflows/validate.yaml"
  pull_request:
    paths:
      - "tasks.yaml"
      - "SCHEMA.md"
      - "mcp/src/limen_mcp/server.py"
      - "scripts/validate-task-board.py"
      - ".github/workflows/validate.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install validation dependencies
        run: python -m pip install pyyaml

      # One predicate owns the whole board contract — schema/budget/required fields AND the
      # canonical status vocabulary — because tasks.yaml has two lawful shapes and only the
      # predicate knows which is in front of it. The contract used to live here as an inline
      # heredoc that assumed the full-board shape, so the counts-only public aggregate the
      # keeper publishes failed with "Missing version" and held publication PR #2001 red for
      # weeks. Inline CI logic cannot be run locally, cannot be tested, and drifts; the script
      # is all three. Do not re-inline it.
      - name: Validate the task board (shape-aware)
        run: python3 scripts/validate-task-board.py
