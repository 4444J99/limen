name: Prune legacy Danse snapshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-danse-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danse-production
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_PAGES_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CURRENT_DEPLOYMENT_ID: 1af478e6-6cc8-485f-b3bd-995b9c785da6
      CURRENT_DEPLOYMENT_URL: https://1af478e6.danse.pages.dev
      CURRENT_SOURCE_SHA: 2d7dd6c97ce67c6f083b85505a47497a1a5a9690
      MAX_PRUNE_PASSES: 20

    steps:
      - name: Require the configured Cloudflare deployment credential
        run: test "$CF_PAGES_TOKEN_SET" = "true"

      - name: Guard the current deployment and live source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deployment list \
            --project-name danse \
            --json > "$RUNNER_TEMP/danse-before.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployments = json.loads(
              Path(os.environ["RUNNER_TEMP"], "danse-before.json").read_text()
          )
          if not isinstance(deployments, list):
              raise SystemExit("Unexpected Cloudflare deployment inventory shape")

          current_id = os.environ["CURRENT_DEPLOYMENT_ID"]
          current = next(
              (item for item in deployments if item.get("Id") == current_id),
              None,
          )
          if current is None:
              raise SystemExit("Guarded current deployment is missing")
          if current.get("Environment") != "Production":
              raise SystemExit("Guarded current deployment is not production")
          if current.get("Deployment") != os.environ["CURRENT_DEPLOYMENT_URL"]:
              raise SystemExit("Guarded current deployment URL changed")
          print(f"Guarded current deployment among {len(deployments)} listed items")
          PY
          live_sha="$(
            curl --fail --silent --show-error --max-time 20 \
              https://danse.pages.dev/pages-manifest.json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["source"]["commit"])'
          )"
          test "$live_sha" = "$CURRENT_SOURCE_SHA"

      - name: Delete non-current snapshots in bounded batches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          check_live_source() {
            live_sha="$(
              curl --fail --silent --show-error --max-time 20 \
                https://danse.pages.dev/pages-manifest.json \
                | python3 -c 'import json, sys; print(json.load(sys.stdin)["source"]["commit"])'
            )"
            test "$live_sha" = "$CURRENT_SOURCE_SHA"
          }

          for pass_number in $(seq 1 "$MAX_PRUNE_PASSES"); do
            check_live_source
            npx wrangler@4 pages deployment list \
              --project-name danse \
              --json > "$RUNNER_TEMP/danse-pass.json"

            PASS_NUMBER="$pass_number" python3 - <<'PY'
          import json
          import os
          import uuid
          from pathlib import Path

          deployments = json.loads(
              Path(os.environ["RUNNER_TEMP"], "danse-pass.json").read_text()
          )
          if not isinstance(deployments, list):
              raise SystemExit("Unexpected Cloudflare deployment inventory shape")

          current_id = os.environ["CURRENT_DEPLOYMENT_ID"]
          current = next(
              (item for item in deployments if item.get("Id") == current_id),
              None,
          )
          if current is None:
              raise SystemExit("Guarded current deployment disappeared")
          if current.get("Environment") != "Production":
              raise SystemExit("Guarded current deployment is not production")
          if current.get("Deployment") != os.environ["CURRENT_DEPLOYMENT_URL"]:
              raise SystemExit("Guarded current deployment URL changed")

          targets = sorted(
              str(item.get("Id", ""))
              for item in deployments
              if item.get("Id") != current_id
          )
          if len(targets) > 24:
              raise SystemExit(f"Unexpected batch size: {len(targets)}")
          for deployment_id in targets:
              if str(uuid.UUID(deployment_id)) != deployment_id:
                  raise SystemExit(f"Invalid deployment ID: {deployment_id!r}")

          Path(os.environ["RUNNER_TEMP"], "danse-targets.txt").write_text(
              "".join(f"{deployment_id}\n" for deployment_id in targets)
          )
          print(
              f"Prune pass {os.environ['PASS_NUMBER']}: "
              f"{len(targets)} legacy deployment(s)"
          )
          PY

            if [[ ! -s "$RUNNER_TEMP/danse-targets.txt" ]]; then
              echo "No legacy deployments remain."
              break
            fi

            while IFS= read -r deployment_id; do
              npx wrangler@4 pages deployment delete "$deployment_id" \
                --project-name danse \
                --force
            done < "$RUNNER_TEMP/danse-targets.txt"
          done

      - name: Verify one Cloudflare deployment remains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deployment list \
            --project-name danse \
            --json > "$RUNNER_TEMP/danse-after.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          deployments = json.loads(
              Path(os.environ["RUNNER_TEMP"], "danse-after.json").read_text()
          )
          if not isinstance(deployments, list):
              raise SystemExit("Unexpected Cloudflare deployment inventory shape")

          observed = {str(item.get("Id", "")) for item in deployments}
          expected = {os.environ["CURRENT_DEPLOYMENT_ID"]}
          if observed != expected:
              raise SystemExit(
                  f"Expected only {sorted(expected)}; observed {sorted(observed)}"
              )

          current = deployments[0]
          if current.get("Environment") != "Production":
              raise SystemExit("Remaining deployment is not production")
          if current.get("Deployment") != os.environ["CURRENT_DEPLOYMENT_URL"]:
              raise SystemExit("Remaining deployment URL changed")
          PY
          live_sha="$(
            curl --fail --silent --show-error --max-time 20 \
              https://danse.pages.dev/pages-manifest.json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["source"]["commit"])'
          )"
          test "$live_sha" = "$CURRENT_SOURCE_SHA"
