name: Prune legacy Danse snapshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune-danse-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danse-production
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_PAGES_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_ACCOUNT_ID: e0921b840fd656d8ea46426f1f114c30
      CURRENT_DEPLOYMENT_ID: 1af478e6-6cc8-485f-b3bd-995b9c785da6
      CURRENT_DEPLOYMENT_URL: https://1af478e6.danse.pages.dev
      CURRENT_SOURCE_SHA: 2d7dd6c97ce67c6f083b85505a47497a1a5a9690
      WRANGLER_VERSION: 4.127.1

    steps:
      - name: Require the configured Cloudflare deployment credential
        run: test "$CF_PAGES_TOKEN_SET" = "true"

      - name: Freeze the complete guarded deployment inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import uuid
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          current_id = os.environ["CURRENT_DEPLOYMENT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/pages/projects/danse"
          )

          def get_json(url):
              request = Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"Cloudflare API request failed: {payload.get('errors')}")
              return payload

          project = get_json(base)["result"]
          canonical = project.get("canonical_deployment") or {}
          if canonical.get("id") != current_id:
              raise SystemExit(
                  "Canonical deployment changed; refusing cleanup: "
                  f"{canonical.get('id')!r}"
              )

          deployments = []
          page = 1
          per_page = 100
          declared_total = None
          while True:
              payload = get_json(
                  f"{base}/deployments?"
                  + urlencode({"page": page, "per_page": per_page})
              )
              batch = payload.get("result")
              info = payload.get("result_info") or {}
              if not isinstance(batch, list):
                  raise SystemExit("Unexpected Cloudflare deployment result shape")
              deployments.extend(batch)

              if declared_total is None and info.get("total_count") is not None:
                  declared_total = int(info["total_count"])
              total_pages = info.get("total_pages")
              if total_pages is not None:
                  if page >= int(total_pages):
                      break
              elif len(batch) < per_page:
                  break
              page += 1
              if page > 100:
                  raise SystemExit("Deployment pagination exceeded 100 pages")

          ids = [str(item.get("id", "")) for item in deployments]
          if len(ids) != len(set(ids)):
              raise SystemExit("Cloudflare deployment inventory contains duplicate IDs")
          if declared_total is not None and declared_total != len(ids):
              raise SystemExit(
                  "Incomplete Cloudflare deployment inventory: "
                  f"declared={declared_total} fetched={len(ids)}"
              )

          current = next(
              (item for item in deployments if item.get("id") == current_id),
              None,
          )
          if current is None:
              raise SystemExit("Guarded current deployment is missing")
          if current.get("environment") != "production":
              raise SystemExit("Guarded current deployment is not production")
          if current.get("url") != os.environ["CURRENT_DEPLOYMENT_URL"]:
              raise SystemExit("Guarded current deployment URL changed")

          current_created = datetime.fromisoformat(
              current["created_on"].replace("Z", "+00:00")
          )
          targets = []
          for item in deployments:
              deployment_id = str(item.get("id", ""))
              if deployment_id == current_id:
                  continue
              if str(uuid.UUID(deployment_id)) != deployment_id:
                  raise SystemExit(f"Invalid deployment ID: {deployment_id!r}")
              created = datetime.fromisoformat(
                  item["created_on"].replace("Z", "+00:00")
              )
              if created >= current_created:
                  raise SystemExit(
                      "A non-current deployment is not older than the canonical "
                      f"deployment: {deployment_id}"
                  )
              targets.append(deployment_id)

          targets.sort()
          Path(os.environ["RUNNER_TEMP"], "danse-targets.txt").write_text(
              "".join(f"{deployment_id}\n" for deployment_id in targets)
          )
          Path(os.environ["RUNNER_TEMP"], "danse-frozen-inventory.json").write_text(
              json.dumps(deployments, indent=2, sort_keys=True)
          )
          print(
              f"Frozen {len(deployments)} complete deployment(s); "
              f"{len(targets)} legacy target(s)"
          )
          PY
          live_sha="$(
            curl --fail --silent --show-error --max-time 20 \
              "https://danse.pages.dev/pages-manifest.json?cleanup=$GITHUB_RUN_ID" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["source"]["commit"])'
          )"
          test "$live_sha" = "$CURRENT_SOURCE_SHA"

      - name: Delete only the frozen legacy deployment set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r deployment_id; do
            npx --yes "wrangler@$WRANGLER_VERSION" \
              pages deployment delete "$deployment_id" \
              --project-name danse \
              --force
          done < "$RUNNER_TEMP/danse-targets.txt"

      - name: Verify the complete Cloudflare inventory and live source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          current_id = os.environ["CURRENT_DEPLOYMENT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/pages/projects/danse"
          )

          def get_json(url):
              request = Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get("success") is not True:
                  raise SystemExit(f"Cloudflare API request failed: {payload.get('errors')}")
              return payload

          project = get_json(base)["result"]
          canonical = project.get("canonical_deployment") or {}
          if canonical.get("id") != current_id:
              raise SystemExit(
                  f"Canonical deployment changed: {canonical.get('id')!r}"
              )

          payload = get_json(
              f"{base}/deployments?"
              + urlencode({"page": 1, "per_page": 100})
          )
          deployments = payload.get("result")
          info = payload.get("result_info") or {}
          if not isinstance(deployments, list):
              raise SystemExit("Unexpected Cloudflare deployment result shape")
          observed = {str(item.get("id", "")) for item in deployments}
          expected = {current_id}
          if observed != expected:
              raise SystemExit(
                  f"Expected only {sorted(expected)}; observed {sorted(observed)}"
              )
          if info.get("total_count") is not None and int(info["total_count"]) != 1:
              raise SystemExit(
                  f"Expected total_count=1; observed {info.get('total_count')!r}"
              )
          PY
          live_sha="$(
            curl --fail --silent --show-error --max-time 20 \
              "https://danse.pages.dev/pages-manifest.json?verify=$GITHUB_RUN_ID" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["source"]["commit"])'
          )"
          test "$live_sha" = "$CURRENT_SOURCE_SHA"
