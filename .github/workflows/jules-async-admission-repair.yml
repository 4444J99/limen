name: Jules async admission repair (one-shot)

on:
  push:
    branches: [fix/jules-api-transport-20260921]
    paths:
      - '.github/workflows/jules-async-admission-repair.yml'

permissions:
  contents: write

concurrency:
  group: jules-async-admission-repair
  cancel-in-progress: false

