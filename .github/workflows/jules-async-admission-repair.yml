name: Jules async admission repair one-shot

on:
  push:
    branches:
      - fix/jules-api-transport-20260921
    paths:
      - .github/workflows/jules-async-admission-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/jules-api-transport-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply repair
        run: python scripts/jules-async-admission-repair.py
      - name: Install dependencies
        run: python -m pip install pyyaml -r web/api/requirements.txt -e 'cli[test]'
      - name: Verify focused contracts
        run: |
          set -euo pipefail
          python -m ruff format cli/src/limen/fanout_executor.py cli/src/limen/jules_api.py cli/src/limen/jules_api_adapter.py cli/tests/test_fanout.py cli/tests/test_jules_api_adapter.py
          python -m ruff check cli/src/limen/fanout_executor.py cli/src/limen/jules_api.py cli/src/limen/jules_api_adapter.py cli/tests/test_fanout.py cli/tests/test_jules_api_adapter.py
          python -m ruff format --check cli/src/limen/fanout_executor.py cli/src/limen/jules_api.py cli/src/limen/jules_api_adapter.py cli/tests/test_fanout.py cli/tests/test_jules_api_adapter.py
          python -m unittest discover -s cli/tests -p 'test_jules_api*.py' -v
          bash scripts/run-pytest-hermetic.sh cli/tests/test_fanout.py -q --tb=short
          python scripts/check-params.py
          git diff --check
      - name: Commit verified branch repair
        run: |
          set -euo pipefail
          rm .github/workflows/jules-async-admission-repair.yml
          rm scripts/jules-async-admission-repair.py
          git add -A
          git diff --cached --check
          git config user.name 4444J99
          git config user.email 4444J99@users.noreply.github.com
          git commit -m 'fix(jules): fence asynchronous provider submission'
          git push origin HEAD:fix/jules-api-transport-20260921
