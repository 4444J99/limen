name: Limen Remote Deterministic Worker
run-name: remote:${{ inputs.request_id }}:${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Stable content-addressed Limen attempt ID
        required: true
        type: string
      provider:
        description: Runtime-discovered lane identifier
        required: true
        type: string
      task_id:
        description: Limen task ID
        required: true
        type: string
      target_repo:
        description: GitHub owner/name to verify
        required: true
        type: string
      base_sha:
        description: Exact pushed commit to check out
        required: true
        type: string
      control_repo:
        description: Exact repository owning trusted verifier control code
        required: true
        type: string
      control_ref:
        description: Validated branch or tag used by workflow-dispatch
        required: true
        type: string
      control_ref_kind:
        description: Whether the dispatch ref is a branch or tag
        required: true
        type: string
      control_sha:
        description: Exact control commit containing this workflow and verifier
        required: true
        type: string
      workflow_id:
        description: Exact GitHub workflow database identity
        required: true
        type: string
      workflow_path:
        description: Exact workflow path discovered from GitHub
        required: true
        type: string
      verification_context_digest:
        description: Digest of verifier-child and terminal implementation-parent custody
        required: true
        type: string
      predicate:
        description: Strict verifier command parsed without a shell
        required: true
        type: string
      instruction_digest:
        description: Digest of the redacted instruction retained by the control plane
        required: true
        type: string
      receipt_target:
        description: Exact durable receipt identity
        required: true
        type: string
      custody_mode:
        description: Result custody contract
        required: true
        type: string
      inputs_json:
        description: Redacted content-addressed input references
        required: true
        type: string
      execution_profile_json:
        description: Provider-neutral execution profile
        required: true
        type: string
      packet_digest:
        description: Digest binding every execution input
        required: true
        type: string
      attempt_deadline:
        description: Original keeper attempt deadline, never renewed on recovery
        required: true
        type: string
      verification_deadline:
        description: Original keeper verification reservation deadline
        required: true
        type: string

permissions:
  contents: read

jobs:
  deterministic-compute:
    # The personal controller is public: use GitHub's standard hosted runner and never admit a
    # public target to the operator's self-hosted machine.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIMEN_REQUEST_ID: ${{ inputs.request_id }}
      LIMEN_PROVIDER: ${{ inputs.provider }}
      LIMEN_TASK_ID: ${{ inputs.task_id }}
      LIMEN_TARGET_REPO: ${{ inputs.target_repo }}
      LIMEN_BASE_SHA: ${{ inputs.base_sha }}
      LIMEN_CONTROL_REPO: ${{ inputs.control_repo }}
      LIMEN_CONTROL_REF: ${{ inputs.control_ref }}
      LIMEN_CONTROL_REF_KIND: ${{ inputs.control_ref_kind }}
      LIMEN_CONTROL_SHA: ${{ inputs.control_sha }}
      LIMEN_WORKFLOW_ID: ${{ inputs.workflow_id }}
      LIMEN_WORKFLOW_PATH: ${{ inputs.workflow_path }}
      LIMEN_WORKFLOW_EVENT: workflow_dispatch
      LIMEN_VERIFICATION_CONTEXT_DIGEST: ${{ inputs.verification_context_digest }}
      LIMEN_PREDICATE: ${{ inputs.predicate }}
      LIMEN_INSTRUCTION_DIGEST: ${{ inputs.instruction_digest }}
      LIMEN_RECEIPT_TARGET: ${{ inputs.receipt_target }}
      LIMEN_CUSTODY_MODE: ${{ inputs.custody_mode }}
      LIMEN_INPUTS_JSON: ${{ inputs.inputs_json }}
      LIMEN_EXECUTION_PROFILE_JSON: ${{ inputs.execution_profile_json }}
      LIMEN_PACKET_DIGEST: ${{ inputs.packet_digest }}
      LIMEN_ATTEMPT_DEADLINE: ${{ inputs.attempt_deadline }}
      VERIFICATION_DEADLINE: ${{ inputs.verification_deadline }}
      LIMEN_OBSERVED_CONTROL_REPO: ${{ github.repository }}
      LIMEN_OBSERVED_CONTROL_REF: ${{ github.ref_name }}
      LIMEN_OBSERVED_CONTROL_REF_KIND: ${{ github.ref_type }}
      LIMEN_OBSERVED_WORKFLOW_EVENT: ${{ github.event_name }}
      LIMEN_OBSERVED_WORKFLOW_REF: ${{ github.workflow_ref }}
      LIMEN_OBSERVED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      LIMEN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LIMEN_SANDBOX_IMAGE: python@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
      LIMEN_SANDBOX_SECRET_SENTINEL: host-secret-must-not-cross
    steps:
      - name: Prepare and verify within the original keeper reservation
        shell: python
        run: |
          import json, os, re, signal, subprocess, sys, time
          from datetime import datetime, timezone
          from pathlib import Path

          started = datetime.now(timezone.utc)
          attempt = datetime.fromisoformat(os.environ["LIMEN_ATTEMPT_DEADLINE"].replace("Z", "+00:00"))
          verification = datetime.fromisoformat(os.environ["VERIFICATION_DEADLINE"].replace("Z", "+00:00"))
          if attempt.tzinfo is None or verification.tzinfo is None or verification > attempt:
              raise SystemExit("Invalid original keeper deadlines")
          if verification <= started:
              raise SystemExit("Original keeper verification deadline expired while queued")
          # One absolute and one monotonic bound cover checkout, image preparation and execution.
          # Leave job-ceiling room for cleanup and receipt upload as well.
          wall = time.monotonic() + min(570, (verification - started).total_seconds())
          os.environ["VERIFICATION_STARTED_AT"] = started.isoformat()
          def remaining():
              budget = min(wall - time.monotonic(), (verification - datetime.now(timezone.utc)).total_seconds())
              if budget <= 0:
                  raise TimeoutError("Original verification reservation expired")
              return budget
          def run(argv, cwd=None, cleanup_reserve=0):
              timeout = remaining() - cleanup_reserve
              if timeout <= 0:
                  raise TimeoutError("Insufficient reservation for safe cleanup")
              process = subprocess.Popen(argv, cwd=cwd, stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)
              try:
                  result = process.wait(timeout=timeout)
              except BaseException:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait(timeout=5)
                  raise
              if result:
                  raise RuntimeError("Bounded preparation or verification failed")
          for repo_key, sha_key, directory in (
              ("LIMEN_CONTROL_REPO", "LIMEN_CONTROL_SHA", ".limen-control"),
              ("LIMEN_TARGET_REPO", "LIMEN_BASE_SHA", "target"),
          ):
              repo, sha = os.environ[repo_key], os.environ[sha_key]
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit("Invalid pinned public source")
              Path(directory).mkdir()
              git = ["git", "-c", "core.hooksPath=/dev/null", "-c", "credential.helper="]
              run(git + ["init", "--quiet"], directory)
              run(git + ["fetch", "--quiet", "--depth=1", "https://github.com/" + repo + ".git", sha], directory)
              run(git + ["-c", "advice.detachedHead=false", "checkout", "--quiet", "--detach", "FETCH_HEAD"], directory)
          run(["docker", "version", "--format", "{{.Server.Version}}"])
          run(["docker", "pull", os.environ["LIMEN_SANDBOX_IMAGE"]])
          fields = {
              "request-id": "LIMEN_REQUEST_ID", "provider": "LIMEN_PROVIDER", "task-id": "LIMEN_TASK_ID",
              "repo": "LIMEN_TARGET_REPO", "base-sha": "LIMEN_BASE_SHA", "control-repo": "LIMEN_CONTROL_REPO",
              "control-ref": "LIMEN_CONTROL_REF", "control-ref-kind": "LIMEN_CONTROL_REF_KIND",
              "control-sha": "LIMEN_CONTROL_SHA", "workflow-id": "LIMEN_WORKFLOW_ID",
              "workflow-path": "LIMEN_WORKFLOW_PATH", "workflow-event": "LIMEN_WORKFLOW_EVENT",
              "observed-control-repo": "LIMEN_OBSERVED_CONTROL_REPO", "observed-control-ref": "LIMEN_OBSERVED_CONTROL_REF",
              "observed-control-ref-kind": "LIMEN_OBSERVED_CONTROL_REF_KIND", "observed-workflow-event": "LIMEN_OBSERVED_WORKFLOW_EVENT",
              "observed-workflow-ref": "LIMEN_OBSERVED_WORKFLOW_REF", "observed-workflow-sha": "LIMEN_OBSERVED_WORKFLOW_SHA",
              "verification-context-digest": "LIMEN_VERIFICATION_CONTEXT_DIGEST", "predicate": "LIMEN_PREDICATE",
              "instruction-digest": "LIMEN_INSTRUCTION_DIGEST", "receipt-target": "LIMEN_RECEIPT_TARGET",
              "custody-mode": "LIMEN_CUSTODY_MODE", "inputs-json": "LIMEN_INPUTS_JSON",
              "execution-profile-json": "LIMEN_EXECUTION_PROFILE_JSON", "packet-digest": "LIMEN_PACKET_DIGEST",
              "attempt-deadline": "LIMEN_ATTEMPT_DEADLINE", "verification-deadline": "VERIFICATION_DEADLINE",
              "run-url": "LIMEN_RUN_URL",
          }
          command = [sys.executable, ".limen-control/cli/src/limen/remote_predicate.py"]
          for flag, variable in fields.items():
              command.extend(["--" + flag, os.environ[variable]])
          command.extend(["--cwd", "target", "--control-cwd", ".limen-control", "--output", "receipt.json"])
          owner = os.environ["LIMEN_REQUEST_ID"]
          if not re.fullmatch(r"[0-9a-f]{32}", owner):
              raise SystemExit("Invalid sandbox ownership")
          try:
              run(command, cleanup_reserve=15)
          except Exception as failure:
              # This is failure evidence only, never a substitute for successful attestation.
              if not Path("receipt.json").exists():
                  Path("receipt.json").write_text(json.dumps({
                      "schema_version": "limen.remote-execution.v4", "request_id": owner,
                      "attempt_deadline": os.environ["LIMEN_ATTEMPT_DEADLINE"],
                      "verification_deadline": os.environ["VERIFICATION_DEADLINE"],
                      "predicate_exit_code": 124 if isinstance(failure, (TimeoutError, subprocess.TimeoutExpired)) else 125,
                      "workspace_clean": False, "delta_safe": False,
                      "failure_class": type(failure).__name__,
                  }))
              raise
          finally:
              # Killing docker's client does not kill its daemon-owned container.
              owned = subprocess.run(["docker", "ps", "-aq", "--filter", "label=limen.verification.request=" + owner],
                  capture_output=True, check=True, timeout=5).stdout.decode().split()
              if any(not re.fullmatch(r"[0-9a-f]{12,64}", value) for value in owned):
                  raise SystemExit("Invalid owned container census")
              if owned:
                  subprocess.run(["docker", "rm", "--force", *owned], check=True, timeout=5,
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

      - name: Upload counts-only receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        with:
          name: remote-execution-receipt
          path: receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Reflect attested predicate result
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path

          receipt = json.loads(Path("receipt.json").read_text())
          if (
              int(receipt["predicate_exit_code"]) != 0
              or receipt["workspace_clean"] is not True
              or receipt["delta_safe"] is not True
          ):
              raise SystemExit(1)
