name: Cloud Maintenance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA authorized for this pass
        required: true
        type: string
      mode:
        description: Inspect only or apply keeper transitions
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-maintenance-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIMEN_CONDUCT_URL: ${{ vars.LIMEN_API_URL }}
      LIMEN_CONDUCT_TOKEN: ${{ secrets.LIMEN_API_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main workflow dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Require exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EXPECTED_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Limen runtime
        run: python -m pip install -e cli

      - name: Run bounded maintenance pass
        run: python scripts/cloud-maintenance.py --mode "${{ inputs.mode }}" --expected-sha "${EXPECTED_SHA}" --receipt cloud-maintenance-receipt.json

      - name: Upload counts-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-maintenance-receipt-${{ github.run_id }}
          path: cloud-maintenance-receipt.json
          if-no-files-found: error
          retention-days: 30
