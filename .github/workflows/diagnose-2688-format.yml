name: Diagnose inherited formatting for 2688
on:
  push:
    branches: [fix/2688-inherited-formatting-20260924]
    paths: [.github/workflows/diagnose-2688-format.yml]
permissions:
  contents: read
jobs:
  exact-source-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0a209dc827a0f535fc4de7946bb9b2fd12269806
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Produce AST-identical three-file repair with repository-pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0a209dc827a0f535fc4de7946bb9b2fd12269806
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          root = Path.cwd()
          metadata = tomllib.loads((root / 'cli/pyproject.toml').read_text())
          pins = [s for s in metadata['project']['optional-dependencies']['test'] if s.startswith('ruff==')]
          if len(pins) != 1:
              raise SystemExit('Expected the single repository-owned formatter pin')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--quiet', pins[0]], check=True)
          paths = ['cli/src/limen/repo_lifecycle.py', 'cli/tests/test_heartbeat_supervisor.py', 'cli/tests/test_repo_lifecycle.py']
          original = {p: (root / p).read_bytes() for p in paths}
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for p, data in original.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + p], text=True).strip()
              if actual != blob(data):
                  raise SystemExit('Original blob mismatch: ' + p)
          subprocess.run(['ruff', 'format', *paths], check=True)
          records = []
          for p, before in original.items():
              after = (root / p).read_bytes()
              if ast.dump(ast.parse(before), include_attributes=False) != ast.dump(ast.parse(after), include_attributes=False):
                  raise SystemExit('Formatting changed Python AST: ' + p)
              records.append({'path': p, 'before_blob': blob(before), 'after_blob': blob(after), 'content': after.decode('utf-8'), 'ast_identical': True})
          subprocess.run(['ruff', 'format', '--check', *paths], check=True)
          subprocess.run(['ruff', 'check', *paths], check=True)
          diff = subprocess.check_output(['git', 'diff', '--', *paths], text=True)
          print(diff)
          output = Path(os.environ['RUNNER_TEMP']) / 'format-repair-2688'
          output.mkdir()
          (output / 'repair.json').write_text(json.dumps({'source_sha': '0a209dc827a0f535fc4de7946bb9b2fd12269806', 'formatter': pins[0], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'files': records}, indent=2) + '\n')
          (output / 'repair.patch').write_text(diff)
          print(json.dumps([{k: v for k, v in row.items() if k != 'content'} for row in records], indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: format-repair-2688
          path: ${{ runner.temp }}/format-repair-2688/
          if-no-files-found: error
          retention-days: 1
