name: Temporary pytest first-failure diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'scripts/jules-quota.py'
      - 'scripts/jules-flywheel.py'
      - '.github/workflows/tmp-pytest-first-failure.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml -r web/api/requirements.txt -e 'cli[test]'
      - name: Run isolated ask-gate migration failure
        id: isolated
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -q --tb=short
          cli/tests/test_apply_ask_gate_migration.py::test_concurrent_claim_invalidates_parent_exact_state_and_verification
      - name: Expose only quarantined ticket identities and rejection reasons
        if: steps.isolated.outcome == 'failure'
        run: |
          set -euo pipefail
          find /tmp/pytest-of-runner -type f \( -path '*/rejected/*.json' -o -name '*.reason.txt' \) -print -exec sh -c 'case "$1" in *.reason.txt) cat "$1";; esac' _ {} \; | tail -n 80
          exit 1
