name: Temporary exact lint repair

on:
  push:
    branches:
      - fix/jules-rolling-observation-20260918

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/jules-rolling-observation-20260918
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e "cli[test]"
      - name: Apply and verify Ruff repair
        run: |
          python -m ruff check --fix cli/tests/test_accelerator.py
          python -m ruff check cli/src cli/tests web/api mcp ianva
          python -m ruff format --check cli/src cli/tests web/api mcp ianva
      - name: Verify repaired admission fixtures
        run: |
          scripts/run-pytest-hermetic.sh \
            cli/tests/test_async_dispatch.py::test_inflight_markers_consume_per_lane_limit \
            cli/tests/test_check_main_green.py::test_recurrence_reopens_healed_task \
            cli/tests/test_accelerator.py::test_dispatch_parallel_accel_tail_is_win_class_only \
            -q
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/tmp-ruff-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cli/tests/test_accelerator.py .github/workflows/tmp-ruff-fix.yml
          git commit -m 'test: clean accelerator selection imports'
          git push origin HEAD:fix/jules-rolling-observation-20260918
