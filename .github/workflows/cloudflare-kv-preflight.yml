name: Cloudflare KV recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-kv-preflight.yml'
      - '.github/scripts/cloudflare-kv/**'
  pull_request:
    paths:
      - '.github/workflows/cloudflare-kv-preflight.yml'
      - '.github/scripts/cloudflare-kv/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-kv-incident-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoped release and storage contracts
        run: |
          python3 -m unittest discover -s .github/scripts/cloudflare-kv -p 'test_*.py' -v
          node --test .github/scripts/cloudflare-kv/test_recovery.mjs

  recover:
    needs: validate
    if: github.repository == '4444J99/limen' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy exact live-source repair and consolidate duplicate triggers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_RECOVERY_APPLY: approved-20260923
        run: python3 .github/scripts/cloudflare-kv/release.py
      - name: Read back live topology and account operation observations
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/cloudflare-kv/inventory.py
