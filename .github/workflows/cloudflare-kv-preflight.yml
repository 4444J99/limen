name: Cloudflare KV recovery witness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-kv-preflight.yml'
      - '.github/scripts/cloudflare-kv/**'
  pull_request:
    paths:
      - '.github/workflows/cloudflare-kv-preflight.yml'
      - '.github/scripts/cloudflare-kv/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-kv-incident-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify storage, auth, atomic claims and witness contracts
        run: |
          python3 -m unittest discover -s .github/scripts/cloudflare-kv -p 'test_*.py' -v
          node --test .github/scripts/cloudflare-kv/test_recovery.mjs .github/scripts/cloudflare-kv/test_finishline.mjs .github/scripts/cloudflare-kv/test_subscriber_cache.mjs .github/scripts/cloudflare-kv/test_diagnosis.mjs

  observe:
    needs: validate
    if: github.repository == '4444J99/limen' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve the exact existing failure privately without another replay
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'kv-private-diagnosis')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/cloudflare-kv/private_diagnosis.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'kv-private-diagnosis')
        with:
          name: kv-private-diagnosis
          path: ${{ runner.temp }}/kv-private-diagnosis.cms
          if-no-files-found: error
          retention-days: 1
      - name: Verify real job completion, runtime revision and KV/D1 headroom
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/cloudflare-kv/monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kv-recovery-witness
          path: ${{ runner.temp }}/kv-recovery-witness.json
          if-no-files-found: error
          retention-days: 7
