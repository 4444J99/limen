name: PSP Public Live Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/psp-public-live-diagnostic.yml"

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify token and canonical W01 receipt
        shell: bash
        run: |
          set -euo pipefail
          gh api graphql -f 'query=query{viewer{login}}' >/tmp/viewer.json
          python - <<'PY'
          import json
          print("graphql_viewer_ok", bool(json.load(open("/tmp/viewer.json"))["data"]["viewer"]["login"]))
          PY
          gh api repos/4444J99/limen/issues/comments/5295999920 >/tmp/w01.json
          python - <<'PY'
          import json
          row=json.load(open("/tmp/w01.json"))
          print("canonical_w01_receipt_ok", row.get("id") == 5295999920)
          PY
      - name: Verify every accepted public candidate via REST
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, sys
          snapshot=json.load(open("docs/positioning/foundry/psp-c11/product-candidate-snapshot.json"))
          repos=sorted(r["repository"] for r in snapshot["candidates"] if r.get("visibility")=="public")
          failures=[]
          for repo in repos:
              p=subprocess.run(["gh","api",f"repos/{repo}"],text=True,capture_output=True)
              if p.returncode:
                  failures.append((repo,p.returncode,p.stderr.strip()[:400]))
                  continue
              data=json.loads(p.stdout)
              if data.get("private") is not False or not data.get("default_branch"):
                  failures.append((repo,0,"unexpected visibility/default branch"))
          print("public_candidate_count",len(repos))
          if failures:
              for row in failures:
                  print("REST_FAIL",*row,sep="\t")
              sys.exit(2)
          print("all_public_candidate_rest_ok")
          PY
      - name: Reproduce exact batched GraphQL head query
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, sys
          snapshot=json.load(open("docs/positioning/foundry/psp-c11/product-candidate-snapshot.json"))
          repos=sorted(r["repository"] for r in snapshot["candidates"] if r.get("visibility")=="public")
          selections=[]
          for i,repo in enumerate(repos):
              owner,name=repo.split("/",1)
              selections.append(f'r{i}:repository(owner:{json.dumps(owner)},name:{json.dumps(name)})'+'{isPrivate defaultBranchRef{target{... on Commit{oid}}}}')
          query='query{'+''.join(selections)+'}'
          p=subprocess.run(["gh","api","graphql","-f","query="+query],text=True,capture_output=True)
          print("graphql_returncode",p.returncode)
          if p.stdout:
              try:
                  payload=json.loads(p.stdout)
                  print("graphql_has_data",isinstance(payload.get("data"),dict))
                  errors=payload.get("errors") or []
                  for err in errors[:10]:
                      print("GRAPHQL_ERROR",json.dumps(err,sort_keys=True))
              except Exception as exc:
                  print("graphql_stdout_not_json",type(exc).__name__)
          if p.stderr:
              print("GRAPHQL_STDERR",p.stderr.strip()[:2000])
          if p.returncode:
              sys.exit(p.returncode)
          PY
