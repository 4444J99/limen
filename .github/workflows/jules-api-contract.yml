name: Jules API contract

on:
  pull_request:
    paths:
      - 'cli/src/limen/jules_api.py'
      - 'cli/src/limen/jules_api_adapter.py'
      - 'cli/tests/test_jules_api.py'
      - 'cli/tests/test_jules_api_adapter.py'
      - 'cli/pyproject.toml'
      - 'institutio/governance/parameters.yaml'
      - '.github/workflows/jules-api-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jules-api-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  register-owned-controls:
    if: github.actor == '4444J99' && github.event_name == 'pull_request' && github.event.pull_request.number == 2687 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/jules-api-transport-20260921'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add only the two exercised transport parameters
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('institutio/governance/parameters.yaml')
          old = p.read_text()
          specs = [
            ('LIMEN_ENABLE_JULES_API', '"0"', 'Opt-in REST transport only; does not grant broker admission, bypass deadlines or activate a scheduler. Owner #2680.'),
            ('LIMEN_JULES_API_CONCURRENCY', '1', 'Declared REST adapter lane ceiling, 1 through 15; actual account limits and shared broker reservations take precedence. Owner #2680.')]
          additions = ''
          for key, default, note in specs:
              if f'  {key}:\n' in old:
                  continue
              additions += f'  {key}:\n    default: {default}\n    env: {key}\n    self_update: none\n    owner: vigilia\n    note: "{note}"\n'
          assert old.count('\nparameters:\n') == 1
          if additions:
              p.write_text(old.replace('\nparameters:\n', '\nparameters:\n' + additions, 1))
          PY
          git add -- institutio/governance/parameters.yaml
          if git diff --cached --quiet; then exit 0; fi
          actual=$(git ls-remote --heads origin refs/heads/fix/jules-api-transport-20260921 | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(jules): declare opt-in and lane-concurrency controls'
          git push origin HEAD:refs/heads/fix/jules-api-transport-20260921
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline REST contract
        env:
          PYTHONPATH: cli/src
        run: |
          python -m unittest discover -s cli/tests -p test_jules_api.py -v
          python -m py_compile cli/src/limen/jules_api.py cli/src/limen/jules_api_adapter.py
      - name: Verify installed framework and pinned source formatting
        env:
          LIMEN_ENABLE_JULES_API: '0'
          JULES_API_KEY: ''
        run: |
          python -m pip install -e 'cli[test]'
          python -m ruff check cli/src/limen/jules_api.py cli/src/limen/jules_api_adapter.py cli/tests/test_jules_api.py cli/tests/test_jules_api_adapter.py
          python -m ruff format --check cli/src/limen/jules_api.py cli/src/limen/jules_api_adapter.py cli/tests/test_jules_api.py cli/tests/test_jules_api_adapter.py
          python -m unittest discover -s cli/tests -p 'test_jules_api*.py' -v
          python - <<'PY'
          from importlib.metadata import entry_points
          entries = [e for e in entry_points(group='limen.fanout_execution') if e.name == 'jules-api']
          assert len(entries) == 1
          adapter = entries[0].load()()
          assert adapter.enforces_deadline is False
          assert not adapter.eligible({'execution': {'owner_repository': '4444J99/limen'}})
          PY

  account-readback:
    needs: contract
    if: github.actor == '4444J99' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe actual Jules account (no task creation)
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PYTHONPATH: cli/src
        run: python -m limen.jules_api observe > jules-api-observation.json
      - name: Preserve aggregate readback, including missing-key failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jules-api-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: jules-api-observation.json
          if-no-files-found: warn
          retention-days: 14
