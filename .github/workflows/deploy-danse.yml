name: Deploy canonical Danse

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-danse.yml"
      - "apps/danse/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danse-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_PAGES_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check out the canonical Danse source
        uses: actions/checkout@v5
        with:
          repository: organvm/the-thing-without-a-name
          ref: main
          path: danse-source
          fetch-depth: 0

      - name: Resolve the exact canonical source commit
        id: source
        working-directory: danse-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check whether production already serves this commit
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          live_sha="$(
            curl --fail --silent --show-error --max-time 20 \
              https://danse.pages.dev/pages-manifest.json 2>/dev/null \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("source", {}).get("commit", ""))' \
              2>/dev/null || true
          )"
          if [[ "$EVENT_NAME" == "schedule" && "$live_sha" == "$SOURCE_SHA" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "danse.pages.dev already serves $SOURCE_SHA"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploying canonical source $SOURCE_SHA (live: ${live_sha:-unavailable})"
          fi

      - uses: actions/setup-python@v6
        if: steps.freshness.outputs.deploy == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: danse-source/pyproject.toml

      - name: Install the canonical verification environment
        if: steps.freshness.outputs.deploy == 'true'
        working-directory: danse-source
        run: python3 -m pip install '.[media]'

      - name: Build the allowlisted artwork artifact
        if: steps.freshness.outputs.deploy == 'true'
        working-directory: danse-source
        run: >-
          python3 scripts/build-pages.py
          --output "${RUNNER_TEMP}/danse-pages"
          --source-commit "${{ steps.source.outputs.sha }}"

      - name: Verify the exact artifact and live interface contract
        if: steps.freshness.outputs.deploy == 'true'
        working-directory: danse-source
        env:
          DANSE_PAGES_ARTIFACT: ${{ runner.temp }}/danse-pages
          DANSE_PAGES_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/tests/pages-artifact.test.py

      - name: Require the configured Cloudflare deployment credential
        if: steps.freshness.outputs.deploy == 'true' && env.CF_PAGES_TOKEN_SET != 'true'
        run: exit 1

      - name: Ensure the canonical Cloudflare Pages project exists
        if: steps.freshness.outputs.deploy == 'true'
        run: npx wrangler@4 pages project create danse --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy the exact canonical source as production
        if: steps.freshness.outputs.deploy == 'true'
        run: >-
          npx wrangler@4 pages deploy "${RUNNER_TEMP}/danse-pages"
          --project-name danse
          --branch main
          --commit-hash "${{ steps.source.outputs.sha }}"
          --commit-message "Canonical Danse ${{ steps.source.outputs.sha }}"
          --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Inventory Cloudflare Pages deployments
        if: steps.freshness.outputs.deploy == 'true'
        run: npx wrangler@4 pages deployment list --project-name danse
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
