name: Jules activation reproduction

# Temporary PR-2687 reproduction aid. No provider credentials, task creation,
# deployment, or repository writes. Removed when the activation repair lands.
on:
  pull_request:
    paths:
      - '.github/workflows/jules-reproduction.yml'

permissions:
  contents: read

jobs:
  reproduction:
    if: github.event.pull_request.number == 2687
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download locked public dependencies without executing package code
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest reproduction \
            rfc8785==0.1.4 pytest-xdist==3.8.0 execnet==2.1.2 ruff==0.15.8
          sha256sum reproduction/* > reproduction/SHA256SUMS
          git rev-parse HEAD > reproduction/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jules-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: reproduction/
          retention-days: 1
