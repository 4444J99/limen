name: Jules repair snapshot
on:
  pull_request:
    paths: ['.github/workflows/jules-repair-snapshot.yml']
permissions:
  contents: write
jobs:
  repair-tree:
    if: github.actor == '4444J99' && github.event.pull_request.number == 2687 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Materialize exact source corrections without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          repo = '4444J99/limen'
          blob = 'fca14e03887d13bd559bf1489a7524b1ff215dbc'
          obj = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/git/blobs/{blob}'], timeout=30))
          encoded = base64.b64decode(obj['content'])
          assert hashlib.sha1(f'blob {len(encoded)}\0'.encode() + encoded).hexdigest() == blob
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '54e01f09a8995563aacc6182f79e018b3c390c06b7fa6802f8b00e39b31dd83d'
          rows = json.loads(raw)
          assert len(rows) == 5
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          entries = []
          for row in rows:
              name = row['path']
              path = PurePosixPath(name)
              assert name.startswith('cli/') and not path.is_absolute() and '..' not in path.parts
              target = Path(name)
              assert not target.is_symlink()
              before = target.read_bytes()
              assert hashlib.sha256(before).hexdigest() == row['old'], f'base changed: {name}'
              lines = before.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(row['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              after = ''.join(lines)
              assert hashlib.sha256(after.encode()).hexdigest() == row['new']
              target.write_text(after)
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'content': after})
          subprocess.run(['git', 'add', '--', *[r['path'] for r in rows]], check=True)
          source_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          request = json.dumps({'base_tree': base, 'tree': entries})
          result = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/git/trees', '--input', '-'], input=request, text=True, capture_output=True, timeout=60)
          assert result.returncode == 0, 'source_tree_creation_failed'
          tree = json.loads(result.stdout)['sha']
          assert tree == source_tree
          subprocess.run(['git', 'rm', '--', '.github/workflows/jules-repair-snapshot.yml'], check=True)
          expected = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          receipt = {'parent_sha': parent, 'tree_sha': tree, 'expected_full_tree_sha': expected, 'ref_updated': False, 'provider_mutations': 0}
          Path('repair-tree.json').write_text(json.dumps(receipt, sort_keys=True))
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jules-repair-tree-${{ github.run_id }}
          path: repair-tree.json
          retention-days: 14
