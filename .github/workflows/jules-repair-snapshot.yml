name: Jules repair snapshot
on:
  pull_request:
    paths: ['.github/workflows/jules-repair-snapshot.yml']
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  public-gate-repair:
    if: github.event.pull_request.number == 2687
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed repair bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/4444J99/limen/git/blobs/586d4b2ff532d1eab1c7f8a2f5e6db5a0df02742 > patch-blob.json
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          row=json.loads(Path('patch-blob.json').read_text())
          patch=gzip.decompress(base64.b64decode(row['content']))
          assert hashlib.sha256(patch).hexdigest() == 'cd7a849fb21695c0523c0c131c8591aff82af3ea0502bb252c29e590ed3cdcbd'
          Path('repair.patch').write_bytes(patch)
          PY
          git apply --check repair.patch
          git apply repair.patch
      - run: python -m pip install -e 'cli[test]'
      - name: Verify explicit withdrawal regressions
        run: python -m pytest docs/positioning/foundry/psp-c11/test_technical_readiness.py -q --tb=short
      - name: Execute real public-evidence gate without private credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs/positioning/foundry/psp-c11/verify_technical_readiness.py --audit docs/positioning/foundry/psp-c11/technical-readiness-audit.json --public-live --json
