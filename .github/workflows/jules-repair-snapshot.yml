name: Jules repair snapshot
on:
  pull_request:
    paths: ['.github/workflows/jules-repair-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.number == 2687
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve reachable history and locked worker dependencies
        run: |
          mkdir -p snapshot
          git bundle create snapshot/history.bundle HEAD refs/remotes/origin/main
          npm ci --ignore-scripts --prefix web/worker
          tar -czf snapshot/worker-deps.tar.gz -C web/worker node_modules
          git rev-parse HEAD > snapshot/commit.txt
          sha256sum snapshot/history.bundle snapshot/worker-deps.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: jules-repair-history-${{ github.run_id }}
          path: snapshot/
          retention-days: 3
